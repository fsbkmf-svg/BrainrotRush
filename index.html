      <input class="bet-input" id="minesBet" type="number" value="${m.bet||500}" min="100" step="100" ${m.active?'disabled':''} style="font-size:18px;font-weight:800;text-align:center;">
      <div style="display:flex;gap:10px;margin-bottom:24px;margin-top:16px;">
        <div class="btn btn-ghost btn-sm" style="flex:1;" onclick="setBet('minesBet',100)">100</div>
        <div class="btn btn-ghost btn-sm" style="flex:1;" onclick="setBet('minesBet',500)">500</div>
        <div class="btn btn-ghost btn-sm" style="flex:1;" onclick="setBet('minesBet',1000)">1K</div>
        <div class="btn btn-ghost btn-sm" style="flex:1;" onclick="setBet('minesBet',${Math.floor(state.balance)})">MAX</div>
      </div>
      <div style="font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:16px;">Кол-во мин</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;">
        ${[1,3,5,10,20].map(n=>`<div class="btn ${m.mines===n?'btn-primary':'btn-ghost'}" style="flex:1;padding:10px;" onclick="setMines(${n})">${n}</div>`).join('')}
      </div>
      <div style="margin-top:16px;padding:20px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.05);border-radius:16px;font-size:15px;color:var(--muted);line-height:1.8;font-weight:600;">
        Открыто: <b style="color:#fff;float:right;">${safe}</b><br>
        След. множитель: <b style="color:var(--accent);float:right;">${nm.toFixed(2)}×</b>
      </div>
      ${m.active?`<button class="btn btn-accent btn-lg" style="width:100%;margin-top:24px;" onclick="minesCashout()">Забрать ${coin(18)} ${fmt(cash)}</button>`:`<button class="btn btn-primary btn-lg" style="width:100%;margin-top:24px;" onclick="minesStart()">Начать игру</button>`}
    </div>
  </div>`;
}
function calcMM(rv,mn){let m=1,t=25;for(let i=0;i<rv;i++)m*=(t-i)/(t-mn-i);return m*.97;}
function setMines(n){if(state.mines.active)return;state.mines.mines=n;preserveScroll(() => render(false));}
function minesStart(){
  const m=state.mines;
  const bet=Math.max(100,Math.floor(+$('#minesBet').value||0));
  if(bet>state.balance){toast('Мало монет','err');return;}
  state.balance-=bet;
  pushBalance(-bet);
  m.active=true;m.bet=bet;m.revealed=new Set();m.exploded=false;m.multiplier=1;
  const s=new Set();while(s.size<m.mines)s.add(Math.floor(Math.random()*25));
  m.mineSet=s;render(false);saveLocalState();
}
function minesClick(i){
  const m=state.mines;
  if(!m.active||m.revealed.has(i))return;
  if(m.mineSet.has(i)){
    m.exploded=true;m.active=false;m.multiplier=1;
    state.history.push({type:'mines_lose',bet:m.bet,date:Date.now()});
    toast('💥 Мина!','err');sndLose();haptic('error');render(false);saveLocalState();return;
  }
  m.revealed.add(i);m.multiplier=calcMM(m.revealed.size,m.mines);render(false);saveLocalState();
}
function minesCashout(){
  const m=state.mines;
  if(!m.active||m.revealed.size===0)return;
  const w=Math.floor(m.bet*m.multiplier);
  state.balance+=w;
  pushBalance(w);
  state.history.push({type:'mines_win',bet:m.bet,mult:m.multiplier,win:w,date:Date.now()});
  toast(`Забрано ${coin(16)} ${fmt(w)}`,'ok');sndCash();haptic('success');m.active=false;m.multiplier=1;render(false);saveLocalState();
}

  <div style="background:rgba(15,23,42,.8);border:1px solid rgba(255,255,255,.05);border-radius:24px;padding:24px;margin-bottom:32px;box-shadow:0 10px 30px rgba(0,0,0,.2);">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px">
      <div><div style="font-size:13px;color:var(--muted);font-weight:800;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;">ВЫБРАНО</div><div style="font-size:32px;font-weight:900;color:var(--gold);display:flex;align-items:center;gap:8px;">${coin(24)} ${fmt(tv)}</div></div>

function fuseToggle(u){if(state.fuseSelected.has(u))state.fuseSelected.delete(u);else state.fuseSelected.add(u);preserveScroll(() => render(false));}
function fuseClear(){state.fuseSelected.clear();render(false);}
function fuseDo(){
  const sel=[...state.fuseSelected];if(sel.length<2)return;
  let t=0;sel.forEach(u=>{const inv=state.inventory.find(i=>i.uid===u);if(inv)t+=itemById(inv.itemId).price;});
  const pool=ITEMS.filter(i=>i.price>=t*.5&&i.price<=t*1.5&&!i.id.startsWith('coin_'));
  if(!pool.length){toast('Нет подходящих','err');return;}
  const res=pool[Math.floor(Math.random()*pool.length)];
  state.inventory=state.inventory.filter(i=>!state.fuseSelected.has(i.uid));
  pushInventoryRemove(sel);
  const uid = uuid();
  const now = Date.now();
  state.inventory.push({uid,itemId:res.id,date:now});
  pushInventoryAdd(res.id, uid, now);
  state.history.push({type:'fuse',itemId:res.id,totalValue:t,date:Date.now()});
  state.fuseSelected.clear();
  $('#modal').innerHTML=`<div class="modal-head"><div class="modal-title">Результат фьюза</div><button class="modal-close" onclick="closeModal()">✕</button></div>

      <div style="font-size:28px;font-weight:900;color:var(--gold);display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:24px;text-shadow:0 0 20px rgba(251,191,36,.4);">${coin(28)} ${fmt(res.price)}</div>
      <div style="color:var(--muted);font-size:16px;margin-bottom:32px;font-weight:600;">Вложено: <b style="color:#fff;">${fmt(t)}</b> ${coin(16)}</div>
      <button class="btn btn-accent btn-lg" style="width:100%;" onclick="closeModal();setTab('inventory')">В инвентарь</button>
    </div>`;
  $('#overlay').classList.add('open');render(false);sndWinRarity(res.rarity);haptic('success');saveLocalState();
}

/* UPGRADE */

function cleanUpgradeSelection() {
  state.upgrade.froms = state.upgrade.froms.filter(uid => state.inventory.some(inv => inv.uid === uid));
}

function upgTV(){return state.upgrade.froms.reduce((s,u)=>{const i=state.inventory.find(x=>x.uid===u);return i?s+itemById(i.itemId).price:s;},0);}

function updateUpgBalance(val){
  if(state.upgrade.animating)return;
  state.upgrade.lastResult = null;
  state.upgrade.balanceAmount=Number(val);
  const totalVal=upgTV()+state.upgrade.balanceAmount;
  const targetItem=state.upgrade.target?itemById(state.upgrade.target):null;
  if(targetItem&&targetItem.price<=totalVal){state.upgrade.target=null;preserveScroll(() => render(false));return;}
  const ch=targetItem?calcUC(totalVal,targetItem.price):0;
  const balText=document.getElementById('upgSliderBalanceText');
  if(balText)balText.innerHTML=`${coin(14)} ${fmt(state.upgrade.balanceAmount)}`;
  const totalText=document.getElementById('upgTotalText');
  if(totalText)totalText.innerHTML=`Итого: ${coin(16)} ${fmt(totalVal)}`;
  const pctEl=document.getElementById('upgPctBig');
  if(pctEl)pctEl.textContent=`${ch.toFixed(2)}%`;
  const R=140,C=2*Math.PI*R;
  const winLen=(ch/100)*C;
  const circleEl=document.getElementById('upgDialCircle');
  if(circleEl)circleEl.setAttribute('stroke-dasharray',`${winLen.toFixed(2)} ${C.toFixed(2)}`);
  const slider=document.getElementById('upgSlider');
  if(slider){
    const pct=state.balance>0?(state.upgrade.balanceAmount/state.balance)*100:0;
    slider.style.background=`linear-gradient(to right,var(--accent) ${pct}%,#1e293b ${pct}%)`;
  }
  const tg=document.getElementById('upgTargetGrid');
  if(tg){
    tg.querySelectorAll('.upg-item-card').forEach(card=>{
      const id=card.getAttribute('data-id');
      if(id){
        const item=itemById(id);
        if(item){
          const c=calcUC(totalVal,item.price);
          const cColor=c>60?'var(--green)':c>30?'var(--gold)':'var(--red)';
          const badge=card.querySelector('.upg-item-chance');
          if(badge){badge.textContent=c.toFixed(1)+'%';badge.style.color=cColor;}
        }
      }
    });
  }
}
function calcUC(fromVal,toPrice){
  if(fromVal<=0||toPrice<=0)return 0;
  let c=(fromVal/toPrice)*100;
  return Math.max(0.1,Math.min(95,c));
}

function upgToggle(u){
  try {
    if(state.upgrade.animating)return;
    state.upgrade.lastResult = null;
    const l=state.upgrade.froms;
    const i=l.indexOf(u);
    if(i>=0)l.splice(i,1);
    else{if(l.length>=MAX_UPG){toast(`Максимум ${MAX_UPG} предметов`,'err');return;}l.push(u);}
    state.upgrade.target=null;
    preserveScroll(() => render(false));
  } catch(e) { console.error('upgToggle error', e); }
}
function upgPick(id){
  try {
    if(state.upgrade.animating)return;
    state.upgrade.lastResult = null;
    state.upgrade.target=id;
    preserveScroll(() => render(false));
  } catch(e) { console.error('upgPick error', e); }
}
function upgReset(){if(state.upgrade.animating)return;state.upgrade.lastResult = null;state.upgrade.froms=[];state.upgrade.target=null;state.upgrade.balanceAmount=0;preserveScroll(() => render(false));}
function upgMult(m){
  if(state.upgrade.animating)return;
  state.upgrade.lastResult = null;
  const t=upgTV()+state.upgrade.balanceAmount;if(t<=0)return;
  const el=ITEMS.filter(i=>i.price>t&&!i.id.startsWith('coin_'));
  if(!el.length){toast('Нет подходящих','err');return;}
  const ideal=t*m;
  const sorted=el.sort((a,b)=>Math.abs(a.price-ideal)-Math.abs(b.price-ideal));
  state.upgrade.target=sorted[0].id;preserveScroll(() => render(false));
}
function upgMultPct(pct){
  if(state.upgrade.animating)return;
  state.upgrade.lastResult = null;
  const t=upgTV()+state.upgrade.balanceAmount;if(t<=0)return;
  const el=ITEMS.filter(i=>i.price>t&&!i.id.startsWith('coin_'));
  if(!el.length){toast('Нет подходящих','err');return;}
  const ideal=t/(pct/100);
  const sorted=el.sort((a,b)=>Math.abs(a.price-ideal)-Math.abs(b.price-ideal));
  state.upgrade.target=sorted[0].id;preserveScroll(() => render(false));
}

/* === UPGRADE SPIN === */
function finishUpgradeSpin(payload){
  if(!state.upgrade.animating) return;
  state.upgrade.animating = false;
  if(__upgTimer){clearTimeout(__upgTimer);__upgTimer=null;}
  if(__upgSkipTimeout){clearTimeout(__upgSkipTimeout);__upgSkipTimeout=null;}
  if(__upgTickTimer){clearTimeout(__upgTickTimer);__upgTickTimer=null;}
  const skipBtn = document.getElementById('skipUpgBtn');
  if(skipBtn) skipBtn.remove();
  const n = document.getElementById('upgNeedleRotator');
  if(n){
    n.style.transition = 'none';
    n.style.transform = `rotate(${payload.totalRotation}deg)`;
  }
  const {win, cp, roll, totalRotation, fromItems, toItem, froms, nonce, serverSeed, clientSeed} = payload;
  
  pushInventoryRemove(froms);
  state.inventory = state.inventory.filter(i => !froms.includes(i.uid));
  
  const historyEntry = {
    id: uuid(),
    type: win ? 'upgrade_win' : 'upgrade_lose',
    fromId: fromItems.length ? fromItems[0].id : 'coins',
    toId: toItem.id,
    date: Date.now(),
    pf: { serverSeed, clientSeed, nonce, roll, winChance: cp, win }
  };
  
  if(win){
    const uid = uuid();
    const now = Date.now();
    state.inventory.push({uid, itemId: toItem.id, date: now});
    pushInventoryAdd(toItem.id, uid, now);
    state.history.push(historyEntry);
    if(state.settings.upgradeSound) sndWinRarity(toItem.rarity);
    haptic('success');
  } else {
    state.history.push(historyEntry);
    if(state.settings.upgradeSound) sndLose();
    haptic('error');
  }
  state.upgrade.lastResult = win ? 'win' : 'lose';
  state.upgrade.lastAngle = totalRotation;
  state.upgrade.lastChance = cp;
  state.upgrade.lastRoll = roll;
  state.fairness.lastRoll = roll;
  state.fairness.lastChance = cp;
  state.fairness.lastResult = win ? 'win' : 'lose';
  state.upgrade.froms = [];
  state.upgrade.target = null;
  state.upgrade.balanceAmount = 0;
  render(false);
  renderHeader();
  saveLocalState();
}

function upgDo(){
  if(state.upgrade.animating) return;
  const froms = state.upgrade.froms;
  const balToSpend = state.upgrade.balanceAmount || 0;
  if(!froms.length && balToSpend === 0) return;
  const fromItems = froms.map(u => {
    const i = state.inventory.find(x => x.uid === u);
    return i ? itemById(i.itemId) : null;
  }).filter(Boolean);
  const toItem = itemById(state.upgrade.target);
  if(!toItem || (!fromItems.length && balToSpend === 0)) return;
  if(toItem.id.startsWith('coin_') || fromItems.some(i => i.id.startsWith('coin_'))){toast('Монеты нельзя использовать','err');return;}
  const tv = fromItems.reduce((s,i)=>s+i.price,0) + balToSpend;
  const cp = calcUC(tv, toItem.price);
  const winChance = cp / 100;
  const serverSeed = state.fairness.serverSeed;
  const clientSeed = state.fairness.clientSeed;
  const nonce = state.fairness.nonce;
  const roll = getFairRoll(serverSeed, clientSeed, nonce);
  const win = roll < winChance;
  state.fairness.nonce++;
  if(state.fairness.nonce > 20){ generateNewServerSeed(); }
  
  const winDeg = cp * 3.6;
  let finalDeg;
  
  if (win) {
    finalDeg = winDeg * (0.05 + Math.random() * 0.9);
  } else {
    finalDeg = winDeg + (360 - winDeg) * (0.05 + Math.random() * 0.9);
  }

  const needleEl = document.getElementById('upgNeedleRotator');
  if (!needleEl) return;
  let currentAngle = 0;
  const matrix = window.getComputedStyle(needleEl).transform;
  if (matrix && matrix !== 'none') {
    const m = matrix.match(/matrix\(([^)]+)\)/);
    if (m) {
      const parts = m[1].split(',').map(parseFloat);
      currentAngle = Math.atan2(parts[1], parts[0]) * (180/Math.PI);
      currentAngle = ((currentAngle % 360) + 360) % 360;
    }
  }
  
  const spins = 5 + Math.floor(Math.random()*15); 
  let delta = finalDeg - (currentAngle % 360);
  if (delta < 0) delta += 360;
  const totalRotation = currentAngle + spins * 360 + delta;
  const baseDuration = state.settings.spinType === 'fast' ? 2000 : 4000;
  const duration = baseDuration + Math.random()*3000;
  
  const easings = [
    'cubic-bezier(0.1, 0.88, 0.15, 1)', 
    'cubic-bezier(0.15, 0.9, 0.1, 1)', 
    'cubic-bezier(0.2, 0.95, 0.1, 1)'
  ];
  const chosenEasing = easings[Math.floor(Math.random()*easings.length)];

  state.upgrade.animating = true;
  state.upgrade.lastResult = null;
  state.upgrade.lastChance = cp;
  state.upgrade.lastAngle = totalRotation;
  state.balance -= balToSpend;
  pushBalance(-balToSpend);
  __upgTargetRot = totalRotation;
  renderHeader();
  const btn = document.getElementById('upgDoBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = 'Крутим...'; }
  document.querySelectorAll('.upg-item-card').forEach(el => el.classList.add('disabled'));
  document.querySelectorAll('.btn-ctrl').forEach(el => el.disabled = true);
  const slider = document.getElementById('upgSlider');
  if (slider) slider.disabled = true;
  const pctEl = document.getElementById('upgPctBig');
  if (pctEl) pctEl.textContent = `${cp.toFixed(2)}%`;
  const labelEl = document.getElementById('upgChanceLabel');
  if (labelEl) { labelEl.textContent = 'Крутим...'; labelEl.style.color = 'var(--accent)'; }
  
  if (__upgTickTimer) { clearTimeout(__upgTickTimer); __upgTickTimer = null; }
  if (state.settings.upgradeSound && !isMuted) {
    const startTime = performance.now();
    let lastTickAt = 0;
    const playNextTick = () => {
      if (!state.upgrade.animating) return;
      const elapsed = performance.now() - startTime;
      if (elapsed > duration) return;
      const now = performance.now();
      if (now - lastTickAt > 25) {
        playTone(1100 + Math.random()*80, 'triangle', 0.015, 0.025);
        lastTickAt = now;
      }
      const progress = Math.min(1, elapsed / duration);
      const interval = 35 + Math.pow(progress, 2) * 950;
      __upgTickTimer = setTimeout(playNextTick, interval);
    };
    playNextTick();
  }
  requestAnimationFrame(() => {
    void needleEl.offsetWidth;
    needleEl.style.transition = `transform ${duration}ms ${chosenEasing}`;
    needleEl.style.transform = `rotate(${totalRotation}deg)`;
  });
  if (__upgTimer) clearTimeout(__upgTimer);
  __upgTimer = setTimeout(() => {
    finishUpgradeSpin({win, cp, roll, totalRotation, fromItems, toItem, froms, nonce, serverSeed, clientSeed});
  }, duration + 100);
  if (__upgSkipTimeout) clearTimeout(__upgSkipTimeout);
  __upgSkipTimeout = setTimeout(() => {
    if (!state.upgrade.animating) return;
    if (document.getElementById('skipUpgBtn')) return;
    const centerPanel = document.querySelector('.upg-center-panel');
    if (centerPanel) {
      const skipBtn = document.createElement('button');
      skipBtn.id = 'skipUpgBtn';
      skipBtn.className = 'btn-ctrl';
      skipBtn.style.marginTop = '12px';
      skipBtn.innerHTML = '⏩ Пропустить';
      skipBtn.onclick = () => { finishUpgradeSpin({win, cp, roll, totalRotation, fromItems, toItem, froms, nonce, serverSeed, clientSeed}); };
      centerPanel.appendChild(skipBtn);
    }
  }, 100);
  __upgFinish = () => finishUpgradeSpin({win, cp, roll, totalRotation, fromItems, toItem, froms, nonce, serverSeed, clientSeed});
}

        toast(`Продан ${esc(it.name)} за ${coin(16)} ${fmt(it.price)}`, 'ok');
        preserveScroll(() => render(false));
    });

}
function sellAll(){
  const itemsToSell = state.inventory.map(i => {
      const it = itemById(i.itemId);
      return it ? { uid: i.uid, price: it.price, itemId: it.id } : null;
  }).filter(Boolean);

function getTotalSelectedCount() {
  let total = 0;
  state.deposit.selected.forEach(count => total += count);
  return total;
}

function updateDepositQuantity(id, delta) {
  const current = state.deposit.selected.get(id) || 0;
  const available = 10; 
  
  if (delta > 0) {
    if (getTotalSelectedCount() >= 10) {
      return toast('Максимум 10 предметов за раз', 'err');
    }
    if (current >= available) {
      return toast('Максимум 10 таких предметов', 'err');
    }
  }
  
  const newCount = current + delta;
  if (newCount <= 0) {
    state.deposit.selected.delete(id);
  } else {
    state.deposit.selected.set(id, newCount);
  }
  preserveScroll(() => renderDepositModal());
}

async function submitDeposit() {
  const d = state.deposit;
  const btn = document.getElementById('depSubmitBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'СОЗДАНИЕ...'; }

  let totalAmount = 0;
  const itemsPayload = [];
  
  d.selected.forEach((count, id) => {
    const item = itemById(id);
    if (item) {
      const finalPrice = Math.floor(item.price * 1.3);
      totalAmount += finalPrice * count;
      itemsPayload.push({ itemId: id, name: item.name, price: finalPrice, count: count });
    }
  });

  try {
    const response = await secureFetch(`${SERVER_URL}/api/deposit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        tgId: state.user.id,
        username: state.user.username,
        robloxName: d.robloxUsername,
        items: itemsPayload,
        totalAmount: totalAmount
      })
    });

    if (!response.ok) {
        const errData = await response.json().catch(() => ({}));
        throw new Error(errData.error || 'Сервер вернул ошибку ' + response.status);
    }
    
    const data = await response.json();

    if (state.user) state.user.robloxName = d.robloxUsername;

    d.step = 3;
    renderDepositModal();
    startDepositTimer();
    startStatusPolling(data.requestId, totalAmount); 
    
    haptic('success');

  } catch (error) {
    console.error(error);
    toast(`Ошибка: ${error.message}`, 'err');
    haptic('error');
    if (btn) { btn.disabled = false; btn.textContent = 'СОЗДАТЬ ЗАЯВКУ'; }
  }
}

function startStatusPolling(requestId, finalAmount) {
  if (__depositPollingInterval) clearInterval(__depositPollingInterval);
  
  __depositPollingInterval = setInterval(async () => {
    try {
      const res = await secureFetch(`${SERVER_URL}/api/deposit-status/${requestId}`);
      const data = await res.json();

      if (data.status === 'approved') {
        clearInterval(__depositPollingInterval);
        if (__depositTimerInt) clearInterval(__depositTimerInt);
        
        state.balance += finalAmount;
        state.history.push({ type: 'deposit', amount: finalAmount, date: Date.now() });
        
        saveLocalState(); renderHeader();
        
        sndCash(); haptic('success');
        $('#modal').innerHTML = `
          <div style="text-align:center; padding:40px 20px;">
            <div style="font-size:80px; margin-bottom:20px;">✅</div>
            <h2 style="font-size:28px; font-weight:900; color:#fff; margin-bottom:10px;">Депозит подтвержден!</h2>
            <p style="color:var(--muted); margin-bottom:24px;">Вам начислено ${fmt(finalAmount)} монет.</p>
            <button class="btn btn-primary" style="width:100%;" onclick="closeModal()">Отлично</button>
          </div>
        `;
      } 
      else if (data.status === 'rejected') {
        clearInterval(__depositPollingInterval);
        if (__depositTimerInt) clearInterval(__depositTimerInt);
        
        haptic('error'); sndLose();
        $('#modal').innerHTML = `
          <div style="text-align:center; padding:40px 20px;">
            <div style="font-size:80px; margin-bottom:20px;">❌</div>
            <h2 style="font-size:28px; font-weight:900; color:#fff; margin-bottom:10px;">Заявка отклонена</h2>
            <p style="color:var(--muted); margin-bottom:24px;">Администратор отклонил ваш депозит.</p>
            <button class="btn btn-ghost" style="width:100%;" onclick="closeModal()">Закрыть</button>
          </div>
        `;
      }
    } catch (e) { console.log('Ожидание ответа...'); }
  }, 2000);
}

function startDepositTimer() {
  if (__depositTimerInt) clearInterval(__depositTimerInt);
  const update = () => {
    const el = document.getElementById('depTimer');
    if (!el) return;
    const m = Math.floor(state.deposit.timerLeft / 60);
    const s = state.deposit.timerLeft % 60;
    el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    
    if (state.deposit.timerLeft <= 0) {
      clearInterval(__depositTimerInt);
      el.textContent = '00:00';
      if(__depositPollingInterval) clearInterval(__depositPollingInterval);
      toast('Время на отправку трейда истекло', 'err');
      closeModal();
      return;
    }
    state.deposit.timerLeft--;
  };
  update();
  __depositTimerInt = setInterval(update, 1000);
}

function copyTradeName() {
  navigator.clipboard.writeText(BOT_ROBLOX_NAME).then(() => {
    toast('Ник скопирован!', 'ok');
    haptic('success');
  });
}

function cancelDeposit() {
  if (__depositTimerInt) clearInterval(__depositTimerInt);
  if (__depositPollingInterval) clearInterval(__depositPollingInterval);
  toast('Заявка отменена. Ожидайте, если админ уже принял трейд.', 'warning');
  closeModal();
}

/* === WITHDRAW === */
async function withdrawItem(uid) {
    const invItem = state.inventory.find(i => i.uid === uid);
    if (!invItem) return;
    const item = itemById(invItem.itemId);
    if (!item) return;

    showPrompt('Введите ваш ник в Roblox для вывода:', state.user?.robloxName || '', async (robloxName) => {
        showConfirm(`Вывести «${item.name}» в игру Roblox?\nУчтите, что вывод происходит вручную по расписанию.`, async () => {
            try {
                const response = await secureFetch(`${SERVER_URL}/api/withdraw`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tgId: state.user.id,
                        username: state.user.username,
                        robloxName: robloxName,
                        robloxId: state.user?.robloxId || 'Не указан',
                        items: [{ uid: invItem.uid, name: item.name, price: item.price }]
                    })
                });

                if (!response.ok) throw new Error('Ошибка сервера');

                state.inventory = state.inventory.filter(i => i.uid !== uid);
                await apiSync();
                saveLocalState();
                preserveScroll(() => render(false));
                toast(`Заявка на вывод ${item.name} создана! Ожидайте выдачи в игре.`, 'ok');
                haptic('success');

            } catch (error) {
                console.error(error);
                toast('Ошибка связи с сервером. Проверьте заявку в Discord.', 'err');
            }
        });
    });
}
