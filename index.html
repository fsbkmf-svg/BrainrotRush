<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Brainrot Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', system-ui, -apple-system, sans-serif !important; -webkit-tap-highlight-color: transparent; }
input, button, select, textarea, optgroup, option { font-family: inherit !important; }

:root{
  --bg:#070a12; --bg2:#0f172a; --surface:rgba(15,23,42,.85); --surface-solid:#111827;
  --border:rgba(56,189,248,.12); --border-strong:rgba(56,189,248,.3);
  --text:#f8fafc; --muted:#94a3b8; --accent:#38bdf8; --accent-deep:#0ea5e9;
  --accent2:#06b6d4; --accent2-deep:#0891b2; --gold:#fbbf24; --gold-dim:#f59e0b;
  --green:#34d399; --red:#f87171; --pink:#f472b6; --purple:#a78bfa;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --radius:20px; --radius-sm:12px; --glow-blue:0 0 40px rgba(56,189,248,.25); --glow-cyan:0 0 40px rgba(34,211,238,.2);
  --shadow-lg:0 20px 40px -10px rgba(0,0,0,.6);
}
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
html{scroll-behavior:smooth;background-color:var(--bg)}
body{background:transparent;color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::-webkit-scrollbar{width:6px;height:6px} ::-webkit-scrollbar-track{background:transparent} ::-webkit-scrollbar-thumb{background:#334155;border-radius:10px} ::-webkit-scrollbar-thumb:hover{background:#475569}
#bg-video{position:fixed;top:0;left:0;width:100vw;height:100vh;object-fit:cover;z-index:-2;pointer-events:none;opacity:.3}
.bg-layer{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 20% -10%,rgba(56,189,248,.15),transparent 55%),radial-gradient(ellipse 60% 40% at 85% 10%,rgba(34,211,238,.1),transparent 50%),linear-gradient(to bottom,rgba(7,10,18,.3) 0%,rgba(7,10,18,.9) 100%)}
.cursor-glow{position:fixed;width:500px;height:500px;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(circle,rgba(56,189,248,.15),transparent 60%);transform:translate(-50%,-50%);transition:opacity .3s;mix-blend-mode:screen}
@media(hover:none){.cursor-glow{display:none}}
.snow{position:fixed;top:-10px;left:0;width:100%;height:100vh;pointer-events:none;z-index:1}
.snowflake{position:absolute;color:#fff;font-size:1em;opacity:.6;animation:fall linear infinite;text-shadow:0 0 8px rgba(255,255,255,.8)}
@keyframes fall{to{transform:translateY(105vh)}}

/* === АНИМАЦИЯ НОВОГО ДРОПА === */
@keyframes slideIn {
  from { opacity: 0; transform: translateX(-20px) scale(0.9); }
  to { opacity: 1; transform: translateX(0) scale(1); }
}
.live-item.new-drop {
  animation: slideIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
  border-color: rgba(56, 189, 248, 0.5) !important;
  background: rgba(56, 189, 248, 0.1) !important;
}

/* === ЛОГИН === */
#loginScreen{position:fixed;inset:0;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;background:var(--bg)}
#loginScreen.show{display:flex}
#loginScreen::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 40% at 50% 30%,rgba(56,189,248,.2),transparent 60%);pointer-events:none}
.login-card{position:relative;background:rgba(15,23,42,.85);border:1px solid var(--border-strong);border-radius:28px;padding:40px 30px;max-width:400px;width:100%;box-shadow:0 25px 80px rgba(0,0,0,.55),var(--glow-blue)}
.login-logo{width:100px;height:100px;background:linear-gradient(135deg,#0ea5e9,#06b6d4);border-radius:28px;margin:0 auto 20px;display:grid;place-items:center;font-size:50px;box-shadow:0 0 50px rgba(14,165,233,.45);position:relative}
.login-logo img{width:80px;height:80px}
.login-title{font-size:32px;font-weight:900;margin-bottom:8px;background:linear-gradient(90deg,#fff 0%,#bae6fd 25%,#38bdf8 50%,#bae6fd 75%,#fff 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.02em;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:200% center}}
.login-sub{color:var(--muted);font-size:15px;margin-bottom:20px;line-height:1.5}
.spinner{width:30px;height:30px;border:3px solid rgba(56,189,248,0.3);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:20px auto 0;}
@keyframes spin{to{transform:rotate(360deg)}}

/* === КАРКАС === */
.app{display:none;min-height:100vh;position:relative;z-index:2}
.app.logged-in{display:flex}
.mobile-nav{display:none}
.sidebar{width:260px;flex-shrink:0;background:rgba(10,14,23,.5);border-right:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30}
.logo{height:80px;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid rgba(255,255,255,.05)}
.logo img{width:44px !important;height:44px !important;border-radius:12px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(56,189,248,.4))}
.logo-text{font-weight:900;font-size:20px;background:linear-gradient(90deg,#fff 0%,#bae6fd 25%,#38bdf8 50%,#bae6fd 75%,#fff 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.02em;animation:shine 3s linear infinite}
.nav{flex:1;overflow-y:auto;padding:20px 16px}
.nav-section{margin-bottom:32px}
.nav-section-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.15em;color:#64748b;padding:0 12px;margin-bottom:12px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.nav-item{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;font-size:15px;font-weight:600;color:#cbd5e1;cursor:pointer;transition:all .3s var(--ease);margin-bottom:4px;position:relative}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.08);transform:translateX(4px)}
.nav-item.active{color:#fff;background:linear-gradient(90deg,rgba(56,189,248,.2),transparent);box-shadow:inset 2px 0 0 var(--accent);text-shadow:0 0 10px rgba(255,255,255,.3)}
.nav-item .ico{width:24px;display:grid;place-items:center;font-size:18px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.5))}
.sidebar-profile{padding:20px;border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:14px;cursor:pointer;transition:background .3s;background:rgba(0,0,0,.1)}
.sidebar-profile:hover{background:rgba(56,189,248,.15)}
.profile-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#0ea5e9,#22d3ee);display:grid;place-items:center;font-size:18px;font-weight:800;overflow:hidden;box-shadow:0 0 20px rgba(14,165,233,.4)}
.profile-avatar img{width:100%;height:100%;object-fit:cover;}
.profile-info{flex:1;min-width:0}
.profile-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.profile-status{font-size:12px;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:4px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.header{height:72px;position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;padding:0 32px;background:rgba(10,14,23,.8);border-bottom:1px solid rgba(255,255,255,.05);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.balance{display:flex;align-items:center;gap:12px;padding:10px 20px;border-radius:16px;background:rgba(0,0,0,.5);border:1px solid rgba(251,191,36,.2);font-weight:800;font-size:18px;box-shadow:0 4px 20px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.05);color:#fff;font-variant-numeric:tabular-nums}
.balance .coin{display:grid;place-items:center;animation:cw 4s ease-in-out infinite}
@keyframes cw{0%,45%,60%,100%{transform:rotate(0)}50%{transform:rotate(15deg)}55%{transform:rotate(-10deg)}}
.btn{border:none;cursor:pointer;font-weight:700;font-size:14px;padding:10px 20px;border-radius:14px;transition:all .3s var(--ease);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.15),transparent 60%);opacity:.6;pointer-events:none}
.btn-primary{background:linear-gradient(135deg,#0ea5e9,#0284c7);box-shadow:0 4px 20px rgba(14,165,233,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(14,165,233,.5)}
.btn-accent{background:linear-gradient(135deg,#22d3ee,#06b6d4);color:#042f2e;box-shadow:0 4px 20px rgba(34,211,238,.3)}
.btn-accent:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(34,211,238,.5)}
.btn-ghost{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);color:var(--text)}
.btn-ghost:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
.btn-danger{background:linear-gradient(135deg,#f43f5e,#e11d48);box-shadow:0 4px 20px rgba(244,63,94,.3)}
.btn-danger:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(244,63,94,.5)}
.btn-sm{padding:8px 16px;font-size:13px;border-radius:10px}
.btn-lg{padding:16px 36px;font-size:16px;border-radius:16px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.3);transform:scale(0);animation:rp .6s var(--ease);pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
.content{flex:1;padding:32px;max-width:1600px;width:100%;margin:0 auto}
.content.page-enter{animation:pi .5s var(--ease) both}
@keyframes pi{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.page-title{font-size:32px;font-weight:900;margin-bottom:8px;background:linear-gradient(135deg,#fff 30%,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.02em;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.page-sub{color:var(--muted);font-size:15px;margin-bottom:32px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.hero{background:linear-gradient(135deg,rgba(56,189,248,.15),rgba(14,165,233,.05));border:1px solid rgba(56,189,248,.2);border-radius:28px;padding:48px;margin-bottom:32px;position:relative;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.3)}
.hero::before{content:'';position:absolute;top:-50%;right:-10%;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.2),transparent 60%);pointer-events:none}
.hero h1{font-size:42px;font-weight:900;margin-bottom:12px;letter-spacing:-.03em;line-height:1.15;max-width:700px;color:#fff;text-shadow:0 4px 15px rgba(0,0,0,.5)}
.hero p{color:#cbd5e1;font-size:16px;max-width:500px;line-height:1.6;margin-bottom:24px;text-shadow:0 2px 5px rgba(0,0,0,.5)}

.top-drop-banner{background:linear-gradient(135deg,rgba(251,191,36,.1),rgba(0,0,0,.4));border:1px solid rgba(251,191,36,.3);border-radius:24px;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 0 20px rgba(251,191,36,.05);position:relative;overflow:hidden;cursor:pointer;transition:all .3s}
.top-drop-banner:hover{border-color:rgba(251,191,36,.6);transform:translateY(-3px);box-shadow:0 15px 40px rgba(0,0,0,.5),inset 0 0 30px rgba(251,191,36,.1)}
.top-drop-content{display:flex;align-items:center;gap:20px;z-index:1}
.top-drop-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.15em;color:var(--gold);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.top-drop-info{display:flex;flex-direction:column}
.top-drop-name{font-size:22px;font-weight:900;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.5)}
.top-drop-user{font-size:14px;color:var(--muted);margin-top:2px}
.top-drop-price{font-size:28px;font-weight:900;color:var(--gold);text-shadow:0 0 20px rgba(251,191,36,.5);display:flex;align-items:center;gap:12px;z-index:1}
.live-bar{background:rgba(15,23,42,.6);border:1px solid rgba(255,255,255,.05);border-radius:20px;padding:16px 20px;margin-bottom:32px;display:flex;align-items:center;gap:20px;overflow:hidden}
.live-head{display:flex;align-items:center;gap:10px;flex-shrink:0;border-right:1px solid rgba(255,255,255,.1);padding-right:20px}
.dot{width:8px;height:8px;background:var(--red);border-radius:50%;box-shadow:0 0 12px var(--red);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.5)}}
.live-list{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px; align-items:center;}
.live-list::-webkit-scrollbar{display:none}
.live-item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);padding:8px 16px;border-radius:14px;min-width:max-content;transition:all .2s;cursor:pointer; position:relative;}
.live-item:hover{background:rgba(255,255,255,.08);transform:translateY(-2px)}
.li-name{font-size:13px;font-weight:700;color:#fff;line-height:1.2}
.li-user{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px;}
.li-case-badge{font-size:9px;background:rgba(56,189,248,.15);color:var(--accent);padding:2px 6px;border-radius:4px;font-weight:800;text-transform:uppercase;}
.cases-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
.case-card{background:linear-gradient(180deg,rgba(30,41,59,.7),rgba(15,23,42,.9));border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:28px;cursor:pointer;transition:all .4s var(--ease);position:relative;overflow:hidden;display:flex;flex-direction:column}
.case-card:hover{transform:translateY(-8px);border-color:rgba(56,189,248,.5);box-shadow:var(--shadow-lg),0 0 40px rgba(56,189,248,.15)}
.case-img{height:200px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,rgba(56,189,248,.15),transparent 70%);border-radius:20px;margin-bottom:24px;position:relative;font-size:80px;padding:10px;overflow:hidden}
.case-img img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 20px 30px rgba(0,0,0,.8));transition:transform .4s var(--spring)}
.case-card:hover .case-img img{transform:scale(1.05) rotate(2deg)}
.case-body{display:flex;flex-direction:column;flex:1}
.case-name{font-size:20px;font-weight:800;margin-bottom:24px;text-align:center;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.5)}
.case-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:20px;border-top:1px solid rgba(255,255,255,.05)}
.case-price{font-size:18px;font-weight:900;color:var(--gold);display:flex;align-items:center;gap:8px;text-shadow:0 0 10px rgba(251,191,36,.3)}
.case-footer .btn{padding:12px 24px;font-size:15px;border-radius:12px;background:linear-gradient(135deg,#0ea5e9,#0284c7);box-shadow:0 4px 15px rgba(14,165,233,.3)}
.all-in-card{border:1px solid rgba(244,63,94,.4);background:linear-gradient(180deg,rgba(244,63,94,.1),rgba(15,23,42,.95))}
.all-in-card:hover{border-color:rgba(244,63,94,.8);box-shadow:var(--shadow-lg),0 0 50px rgba(244,63,94,.25)}
.all-in-card .case-price{color:var(--red);text-shadow:0 0 15px rgba(244,63,94,.5)}
.all-in-card .case-img{background:radial-gradient(circle at center,rgba(244,63,94,.2),transparent 70%)}
.case-badge{position:absolute;top:20px;right:20px;z-index:2;font-size:12px;font-weight:900;padding:8px 16px;border-radius:24px;text-transform:uppercase;letter-spacing:.08em;box-shadow:0 4px 15px rgba(0,0,0,.4)}
.badge-hot{background:rgba(244,63,94,.2);color:#f43f5e;border:1px solid rgba(244,63,94,.5)}
.case-back{background:transparent;border:none;color:var(--muted);font-size:15px;font-weight:700;cursor:pointer;margin-bottom:24px;display:inline-flex;align-items:center;gap:10px;transition:color .2s}
.case-back:hover{color:#fff}
.case-detail{display:grid;grid-template-columns:380px 1fr;gap:40px;align-items:start}
@media(max-width:950px){.case-detail{grid-template-columns:1fr}}
.case-detail-img{background:radial-gradient(circle at 50% 50%,rgba(56,189,248,.15) 0%,#0f172a 75%);border:2px solid rgba(56,189,248,.2);border-radius:32px;height:340px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;box-shadow:inset 0 0 60px rgba(0,0,0,.6);font-size:140px;padding:20px;overflow:hidden}
.case-detail-img img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 20px 40px rgba(0,0,0,.8))}
.case-stat-grid{display:flex;flex-direction:column;gap:12px}
.case-stat{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:20px;display:flex;justify-content:space-between;align-items:center}
.case-stat .lbl{font-size:14px;color:var(--muted);font-weight:700}
.case-stat .val{font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px;color:#fff}
.case-title{font-size:42px;font-weight:900;margin-bottom:12px;line-height:1.1;color:#fff}
.case-title-sub{color:var(--muted);font-size:16px;margin-bottom:24px}
.case-desc-long{background:rgba(56,189,248,.05);border:1px solid rgba(56,189,248,.15);border-left:4px solid var(--accent);border-radius:16px;padding:24px;font-size:16px;color:#cbd5e1;line-height:1.6;margin-bottom:32px}
.case-open-panel{background:rgba(15,23,42,.8);border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:36px;box-shadow:0 20px 50px rgba(0,0,0,.4)}

/* === РУЛЕТКА === */
.roulette-wrap{position:relative;overflow:hidden;background:#0a0e17;border:3px solid var(--border-strong);border-radius:20px;box-shadow:inset 0 0 50px rgba(0,0,0,.8);width:100%;box-sizing:border-box}
.roulette-wrap.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.roulette-marker{position:absolute;top:0;bottom:0;left:50%;width:4px;background:var(--red);transform:translateX(-50%);z-index:10;box-shadow:0 0 20px var(--red);border-radius:2px}
.roulette-track{display:flex;flex-direction:row;align-items:center;gap:12px;height:100%;will-change:transform;transform:translate3d(0,0,0);}
.roulette-item{display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(56,189,248,.05);border:1px solid var(--border);border-radius:16px;flex-shrink:0;transition:border-color .2s,transform .2s}
.roulette-item.near-marker{transform:scale(1.05)}
.roulette-item.landed{border-color:var(--gold);box-shadow:0 0 30px rgba(251,191,36,.6);background:rgba(251,191,36,.1)}
.roulette-item-name{font-size:13px;font-weight:700;text-align:center;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.roulette-particles{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:visible}
.particle{position:absolute;top:50%;left:50%;width:8px;height:8px;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);opacity:0}
@keyframes particleFly{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(calc(-50% + var(--px)),calc(-50% + var(--py))) rotate(var(--pr)) scale(0.3)}}

/* ALL IN NEW */
.all-in-stage-new{position:relative;width:100%;min-height:80vh;background:radial-gradient(circle at center,rgba(244,63,94,.15) 0%,#000 80%);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;border:1px solid rgba(244,63,94,.4);box-shadow:inset 0 0 100px rgba(244,63,94,.2);padding:20px;box-sizing:border-box}
.all-in-multiplier{font-size:120px;font-weight:900;color:#fff;text-shadow:0 0 50px rgba(244,63,94,0.8), 0 0 100px rgba(244,63,94,0.4);transition:all 0.1s linear;position:relative;z-index:5;font-variant-numeric:tabular-nums; line-height:1;}
.all-in-multiplier.losing{color:#f43f5e;text-shadow:0 0 50px rgba(244,63,94,0.8);}
.all-in-multiplier.winning{color:#fbbf24;text-shadow:0 0 50px rgba(251,191,36,0.8);}
.all-in-subtext{font-size:20px;font-weight:800;color:#cbd5e1;margin-top:20px;z-index:5;text-align:center;}
.all-in-bg-text-new{position:absolute;font-size:200px;font-weight:900;color:rgba(255,255,255,0.02);text-transform:uppercase;letter-spacing:20px;pointer-events:none;user-select:none;z-index:1;white-space:nowrap}

.multi-opening-stage{background:rgba(15,23,42,0.9);border:1px solid var(--border-strong);border-radius:24px;padding:32px;text-align:center;margin:0 auto;max-width:1200px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.multi-result-title{font-size:36px;font-weight:900;color:#fff;margin-bottom:24px;background:linear-gradient(135deg,#fff,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.02em}
.multi-result-total{margin-bottom:32px;display:inline-flex;flex-direction:column;align-items:center;background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.3);border-radius:16px;padding:16px 40px}
.multi-result-total .lbl{font-size:14px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-bottom:6px;letter-spacing:0.05em}
.multi-result-total .val{font-size:32px;font-weight:900;color:var(--gold);display:flex;align-items:center;justify-content:center;gap:10px}
.multi-result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-bottom:32px;max-height:55vh;overflow-y:auto;padding-right:8px}
.multi-result-item{background:linear-gradient(180deg,rgba(15,23,42,.95) 0%,rgba(10,14,23,.95) 100%);border:1px solid var(--border);border-radius:16px;padding:20px 12px;position:relative;overflow:hidden;transition:all .25s;display:flex;flex-direction:column;align-items:center;justify-content:center}
.multi-result-item .strip{position:absolute;top:0;left:0;right:0;height:4px}
.multi-result-item .nm{font-size:14px;font-weight:700;margin:12px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.multi-result-item .pr{font-size:16px;font-weight:800;color:var(--gold);display:flex;justify-content:center;align-items:center;gap:6px}
.multi-result-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.multi-result-actions .btn{font-size:16px;padding:14px 32px;border-radius:14px}

/* UPGRADE */
.upg-layout{display:flex;flex-direction:column;gap:20px}
.upg-top-row{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:20px;align-items:stretch}
@media(max-width:1100px){.upg-top-row{grid-template-columns:1fr}}
.upg-panel{background:rgba(15,23,42,.9);border:1px solid rgba(255,255,255,.05);border-radius:12px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:inset 0 0 20px rgba(0,0,0,.5)}
.upg-panel-header{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px;font-weight:700;color:#cbd5e1;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.2)}
.upg-left-body{flex:1;display:flex;flex-wrap:wrap;gap:10px;padding:16px;align-content:flex-start;overflow-y:auto;min-height:200px}
.upg-right-body{flex:1;display:flex;justify-content:center;align-items:center;padding:20px;position:relative;min-height:200px}
.upg-target-glow{position:absolute;inset:0;background:radial-gradient(circle at center,rgba(251,191,36,0.15) 0%,transparent 60%);z-index:0;pointer-events:none}
.upg-center-panel{display:flex;flex-direction:column;align-items:center;position:relative;justify-content:center}
.upg-logo-top{font-size:14px;font-weight:900;letter-spacing:2px;color:#cbd5e1;display:flex;align-items:center;gap:8px;margin-bottom:10px;z-index:5;text-transform:uppercase}
.upg-dial-wrapper{position:relative;width:280px;height:280px;margin-bottom:20px;display:flex;justify-content:center;align-items:center}
.upg-dial-svg{width:100%;height:100%}
.upg-dial-bg{fill:none;stroke:#1e293b;stroke-width:20}
.upg-dial-progress{fill:none;stroke:var(--accent);stroke-width:20;stroke-linecap:butt;transition:stroke-dasharray 0.3s ease}
.upg-dial-inner{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:2}
.upg-pct-text{font-size:42px;font-weight:900;color:#fff;text-shadow:0 0 20px rgba(255,255,255,0.2);line-height:1}
.upg-status-text{font-size:14px;font-weight:700;color:var(--accent);margin-top:4px;text-transform:uppercase}
.upg-marker-rotator{position:absolute;inset:0;transform-origin:center center;will-change:transform;pointer-events:none;z-index:20}
.upg-arrow-marker{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid var(--accent);filter:drop-shadow(0 0 10px rgba(56,189,248,0.9))}
.btn-upg-main{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;border:none;padding:15px 40px;font-size:16px;font-weight:800;border-radius:8px;width:100%;max-width:300px;cursor:pointer;transition:all .2s;text-transform:uppercase;letter-spacing:1px;box-shadow:0 4px 20px rgba(14,165,233,.3)}
.btn-upg-main:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(14,165,233,.5)}
.btn-upg-main:disabled{opacity:0.5;cursor:not-allowed;box-shadow:none;background:#334155}
.upg-ctrl-row{display:flex;justify-content:space-between;align-items:center;background:rgba(15,23,42,.9);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:10px 16px;flex-wrap:wrap;gap:12px}
.upg-ctrl-left{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.upg-ctrl-right{display:flex;gap:10px;align-items:center}
.btn-ctrl{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#cbd5e1;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-ctrl:hover{background:rgba(255,255,255,.1);color:#fff}
.btn-ctrl:disabled{opacity:.4;cursor:not-allowed}
.upg-bot-row{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.upg-bot-row{grid-template-columns:1fr}}
.upg-inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;padding:16px;max-height:400px;overflow-y:auto;align-content:start}
.upg-item-card{background:linear-gradient(145deg,#1e293b,#0f172a);border:1px solid #334155;border-radius:10px;padding:12px;position:relative;cursor:pointer;transition:all 0.2s ease;display:flex;flex-direction:column;align-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05),0 4px 6px rgba(0,0,0,0.3)}
.upg-item-card:hover{border-color:#38bdf8;transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.05),0 0 15px rgba(56,189,248,0.2)}
.upg-item-card.selected{border-color:#38bdf8;background:linear-gradient(145deg,rgba(56,189,248,0.15),rgba(15,23,42,0.9));box-shadow:0 0 15px rgba(56,189,248,0.3)}
.upg-item-card.disabled{opacity:0.5;pointer-events:none}
.upg-item-img{width:100%;height:70px;display:flex;justify-content:center;align-items:center;margin-bottom:8px}
.upg-item-img img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5));transition:transform 0.2s}
.upg-item-name{font-size:11px;font-weight:700;color:#e2e8f0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;margin-bottom:4px}
.upg-item-price{font-size:12px;font-weight:800;color:#fbbf24;display:flex;align-items:center;gap:4px;justify-content:center;width:100%;background:rgba(0,0,0,0.3);padding:2px 0;border-radius:4px}
.upg-item-chance{font-size:10px;font-weight:800;margin-top:4px}
.slider-container{padding:16px;border-top:1px solid rgba(255,255,255,.05);background:rgba(0,0,0,0.2)}
.upg-slider{-webkit-appearance:none;width:100%;height:6px;background:#1e293b;border-radius:3px;outline:none;margin-top:8px}
.upg-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer}
.upg-slider:disabled{opacity:.5;cursor:not-allowed}

/* SETTINGS MODAL */
.settings-modal-content{background:var(--surface-solid);color:#fff;padding:32px;border-radius:28px;max-width:600px;width:100%;border:1px solid var(--border-strong);box-shadow:var(--shadow-lg),var(--glow-blue);overflow-x:hidden}
.settings-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;font-size:24px;font-weight:900}
.settings-close{cursor:pointer;color:var(--muted);font-size:28px;transition:color 0.2s;line-height:1}
.settings-close:hover{color:#fff;transform:scale(1.1)}
.settings-section{background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:24px;margin-bottom:24px;max-width:100%}
.settings-sec-title{font-size:16px;font-weight:800;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.settings-link{color:var(--accent);font-size:13px;cursor:pointer;text-decoration:none;font-weight:700}
.settings-options-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));gap:20px;max-width:100%}
@media(max-width:600px){.settings-options-grid{grid-template-columns:1fr}}
.settings-opt-group{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:16px;max-width:100%;min-width:0;overflow:hidden}
.settings-opt-group p{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5}
.settings-btn-row{display:flex;gap:6px;align-items:center;width:100%;max-width:100%}
.settings-input{flex:1 1 0%;min-width:0;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#fff;padding:10px 2px;text-align:center;font-size:13px;font-weight:700;outline:none;transition:all 0.2s}
.settings-input:focus{border-color:var(--accent);box-shadow:0 0 10px rgba(56,189,248,.2)}
.settings-reset-icon{color:var(--accent);cursor:pointer;font-size:20px;padding:4px;flex-shrink:0;transition:transform .2s}
.settings-reset-icon:hover{transform:rotate(-45deg)}
.settings-radio-group{display:flex;flex-direction:column;gap:16px}
.settings-radio-item{display:flex;align-items:flex-start;gap:14px;cursor:pointer}
.settings-radio-item input[type="radio"]{display:none}
.settings-radio-mark{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:inline-block;position:relative;flex-shrink:0;margin-top:2px;transition:all .2s}
.settings-radio-item input:checked + .settings-radio-mark{border-color:var(--accent)}
.settings-radio-item input:checked + .settings-radio-mark::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.settings-radio-text{font-size:15px;font-weight:700;color:#fff;line-height:1.3}
.settings-radio-sub{font-size:13px;color:var(--muted);margin-top:6px;font-weight:400;line-height:1.4}
.btn-save-settings{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;border:none;border-radius:14px;padding:18px;font-size:17px;font-weight:900;width:100%;cursor:pointer;margin-top:16px;transition:all .2s;box-shadow:0 4px 22px rgba(14,165,233,.4)}
.btn-save-settings:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(14,165,233,.55)}

/* OVERLAY / MODAL */
.overlay{position:fixed;inset:0;z-index:200;background:rgba(5,6,12,.85);display:none;align-items:center;justify-content:center;padding:20px;animation:overlayIn .2s ease}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
.overlay.open{display:flex}
.modal{background:var(--surface-solid);border:1px solid rgba(255,255,255,.1);border-radius:28px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;padding:32px;box-shadow:var(--shadow-lg);animation:modalIn .3s var(--spring);position:relative}
@keyframes modalIn{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-head{display:flex;align-items:center;justify-content:center;margin-bottom:24px;position:relative}
.modal-title{font-size:24px;font-weight:900;color:#fff}
.modal-close{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:var(--muted);width:36px;height:36px;border-radius:12px;display:grid;place-items:center;cursor:pointer;transition:all .2s;position:absolute;right:0;top:0;font-size:18px}
.modal-close:hover{background:rgba(255,255,255,.1);color:#fff;transform:scale(1.05)}

/* TOAST */
.toast{ display: none; position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0; background:rgba(15,23,42,.95); border:1px solid rgba(255,255,255,.1); color:#fff; padding:16px 28px; border-radius:16px; font-size:15px; font-weight:700; z-index:99999; box-shadow:0 20px 40px rgba(0,0,0,.6); transition:all .3s ease; max-width:90vw; text-align:center; }
.toast.show{ display: block; transform:translateX(-50%) translateY(0); opacity:1; }
.toast.ok{border-color:rgba(52,211,153,.4);box-shadow:0 20px 40px rgba(0,0,0,.6),0 0 30px rgba(52,211,153,.2)}
.toast.err{border-color:rgba(248,113,113,.4);box-shadow:0 20px 40px rgba(0,0,0,.6),0 0 30px rgba(248,113,113,.2)}
@media(max-width:1024px){.toast{bottom:130px}}

/* ДЕПОЗИТ (Фиолетовая тема) */
.dep-header{text-align:left; margin-bottom:20px;}
.dep-title{font-size:24px; font-weight:900; color:#fff; margin-bottom:8px; letter-spacing:-0.02em;}
.dep-subtitle{font-size:13px; color:#94a3b8; line-height:1.5; background:rgba(124,58,237,0.1); padding:16px; border-radius:12px; border:1px solid rgba(124,58,237,0.2); margin-bottom:20px;}
.dep-search { width: 100%; padding: 16px 20px; background: #0f172a; border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; color: #fff; font-size: 15px; margin-bottom: 20px; outline: none; transition:all .2s; }
.dep-search:focus { border-color: #8b5cf6; box-shadow:0 0 15px rgba(139,92,246,0.3); }
.dep-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-height: 350px; overflow-y: auto; padding-right: 8px; margin-bottom: 20px; }
@media(max-width: 600px) { .dep-grid { grid-template-columns: repeat(2, 1fr); } }
.dep-card { background: #0f172a; border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; position: relative; transition: all 0.2s; }
.dep-card.selected { border-color: #8b5cf6; background: rgba(139,92,246,0.05); box-shadow: 0 0 20px rgba(139,92,246,0.15); }
.dep-img { height: 80px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; position:relative;}
.dep-name { font-size: 11px; font-weight: 800; color: #fff; text-align:center; margin-bottom: 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.dep-price { font-size: 13px; font-weight: 900; color: var(--gold); display: flex; align-items: center; justify-content:center; gap: 4px; margin-bottom: 12px;}
.dep-qty-ctrl { display:flex; align-items:center; justify-content:space-between; background:#0a0e17; border-radius:10px; padding:4px; }
.dep-qty-btn { background:transparent; border:none; color:#94a3b8; font-size:18px; font-weight:bold; width:28px; height:28px; display:grid; place-items:center; cursor:pointer; border-radius:8px;}
.dep-qty-btn:hover { background:rgba(255,255,255,0.05); color:#fff;}
.dep-qty-btn:disabled { opacity:0.3; cursor:not-allowed;}
.dep-qty-val { font-size:13px; font-weight:800; color:#fff;}
.dep-total-bar { position:sticky; bottom:0; background:#0f172a; border-top:1px solid rgba(255,255,255,0.05); padding:20px 0 0 0; margin-top:10px; z-index:10; }
.dep-total-info { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.dep-total-lbl { font-size:14px; font-weight:700; color:#fff; }
.dep-total-val { font-size:24px; font-weight:900; color:var(--gold); display:flex; align-items:center; gap:8px;}
.btn-purple { background:linear-gradient(135deg,#8b5cf6,#7c3aed); color:#fff; border:none; border-radius:16px; padding:18px; font-size:16px; font-weight:900; width:100%; cursor:pointer; transition:all 0.2s; box-shadow:0 4px 20px rgba(124,58,237,0.4); text-transform:uppercase; letter-spacing:0.5px;}
.btn-purple:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(124,58,237,0.6);}
.btn-purple:disabled { opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none;}

.dep-input-group { margin-bottom: 16px; }
.dep-input-group label { display: block; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.dep-input { width: 100%; padding: 16px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-size: 15px; outline: none; }
.dep-input:focus { border-color: #8b5cf6; }
.dep-queue-box { background: rgba(139,92,246,0.05); border: 1px solid rgba(139,92,246,0.3); border-radius: 20px; padding: 24px; text-align: center; margin-bottom: 20px; }
.dep-queue-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; background: rgba(139,92,246,0.15); color: #a78bfa; font-size: 12px; font-weight: 800; text-transform: uppercase; margin-bottom: 16px; letter-spacing: 1px; }
.dep-timer { font-size: 48px; font-weight: 900; color: #a78bfa; text-shadow: 0 0 30px rgba(167,139,250,0.4); line-height: 1; margin-bottom: 16px; }
.dep-instructions { font-size: 14px; color: #cbd5e1; line-height: 1.6; margin-bottom: 24px; }
.dep-target-box { background: #0a0e17; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 16px; text-align: left; margin-bottom: 20px; }
.dep-target-box .lbl { font-size: 10px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.dep-target-name { font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 12px; }
.dep-copy-btn { width: 100%; padding: 14px; background: #7c3aed; color: #fff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; transition:all 0.2s;}
.dep-copy-btn:hover { background:#6d28d9;}
.dep-cancel-btn { width: 100%; padding: 16px; background: rgba(244,63,94,0.1); color: #f43f5e; border: 1px solid rgba(244,63,94,0.3); border-radius: 16px; font-size: 14px; font-weight: 800; text-transform: uppercase; cursor: pointer; margin-top:20px;}

/* Список выбранных предметов */
.dep-sum-item { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.03); padding: 12px 16px; border-radius: 16px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05); }
.dep-sum-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.dep-sum-remove { background: rgba(244,63,94,0.15); color: #f43f5e; border: none; width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
.dep-sum-remove:hover { background: rgba(244,63,94,0.25); transform: scale(1.05); }

/* INVENTORY & PROFILE */
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.item-card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:20px;padding:16px;text-align:center;position:relative;transition:all .2s}
.item-card:hover{border-color:rgba(56,189,248,.3);background:rgba(56,189,248,.03);transform:translateY(-4px);box-shadow:0 10px 20px rgba(0,0,0,.2)}
.item-card .ico{font-size:44px;margin:12px 0;filter:drop-shadow(0 5px 15px rgba(0,0,0,.4));display:flex;justify-content:center;align-items:center;height:70px}
.item-card .nm{font-size:14px;font-weight:700;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.item-card .pr{font-weight:900;color:var(--gold);font-size:16px;margin-bottom:16px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.item-card .acts{display:flex;gap:8px;justify-content:center}
.inv-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;align-items:center}
.inv-sort-btn{padding:8px 14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.inv-sort-btn:hover{background:rgba(255,255,255,.06);color:#fff}
.inv-sort-btn.active{background:rgba(56,189,248,.15);border-color:var(--accent);color:#fff;box-shadow:0 0 15px rgba(56,189,248,.15)}
.inv-label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;margin-right:4px;padding:8px 0}

/* MINES */
.game-layout{display:flex;gap:32px;flex-wrap:wrap}
.game-stage{flex:2 1 400px;background:rgba(15,23,42,.8);border:1px solid rgba(255,255,255,.05);border-radius:28px;padding:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.side-panel{flex:1 1 320px;background:rgba(15,23,42,.8);border:1px solid rgba(255,255,255,.05);border-radius:28px;padding:32px}

.profile-avatar-large img{width:100%;height:100%;object-fit:cover;}

.best-drop-item .price{font-size:26px;font-weight:900;color:var(--gold);display:flex;justify-content:center;align-items:center;gap:10px}

.history-tabs { display: flex; gap: 8px; margin-bottom: 24px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
.history-tabs::-webkit-scrollbar { display: none; }
.history-tab { padding: 10px 20px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; color: var(--muted); font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
.history-tab:hover { background: rgba(255,255,255,0.08); color: #fff; }
.history-tab.active { background: #1e293b; color: #fff; border-color: #334155; }

.history-day-group { margin-bottom: 32px; }
.history-day-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 16px; }
.history-day-title { font-size: 16px; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 0.05em; }
.history-day-profit { font-size: 14px; font-weight: 800; }
.history-day-profit.pos { color: var(--green); }
.history-day-profit.neg { color: var(--red); }

.history-item { display: flex; align-items: center; justify-content: space-between; padding: 16px; background: rgba(255,255,255,0.02); border-radius: 16px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.04); transition: background 0.2s; }

.history-item-amount.pos { color: var(--green); }

let sessionToken = null;
let pendingRequests = 0;

// Безопасный fetch с токеном и счетчиком активных запросов
async function secureFetch(url, options = {}) {
    pendingRequests++;
    if (sessionToken) {
        if (!options.headers) options.headers = {};
        options.headers['Authorization'] = sessionToken;
    }
    try {
        const res = await fetch(url, options);
        return res;
    } finally {
        pendingRequests--;
    }
}

function haptic(type){
  try{
    const tg=window.Telegram?.WebApp;
    if(!tg?.HapticFeedback)return;
    if(type==='light')tg.HapticFeedback.impactOccurred('light');
    else if(type==='medium')tg.HapticFeedback.impactOccurred('medium');
    else if(type==='heavy')tg.HapticFeedback.impactOccurred('heavy');
    else if(type==='success')tg.HapticFeedback.notificationOccurred('success');
    else if(type==='error')tg.HapticFeedback.notificationOccurred('error');
    else if(type==='warning')tg.HapticFeedback.notificationOccurred('warning');
  }catch(e){}
}

function initAudio(){if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();masterGain=audioCtx.createGain();masterGain.gain.value=0.2;masterGain.connect(audioCtx.destination);}if(audioCtx.state==='suspended')audioCtx.resume();}
function toggleSound(){isMuted=!isMuted;document.getElementById('soundToggle').textContent=isMuted?'🔇':'🔊';haptic('light');}
function playTone(freq,type,duration,vol=0.1,slideTo=null){if(!audioCtx||isMuted)return;try{const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();const filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=2000;osc.type=type;osc.frequency.setValueAtTime(freq,audioCtx.currentTime);if(slideTo)osc.frequency.exponentialRampToValueAtTime(slideTo,audioCtx.currentTime+duration);gain.gain.setValueAtTime(0,audioCtx.currentTime);gain.gain.linearRampToValueAtTime(vol,audioCtx.currentTime+0.03);gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+duration);osc.connect(filter);filter.connect(gain);gain.connect(masterGain);osc.start();osc.stop(audioCtx.currentTime+duration);}catch(e){}}

function preserveScroll(renderFn) {
  const scrollY = window.scrollY;
  const modal = document.querySelector('.modal');
  const modalScroll = modal ? modal.scrollTop : 0;
  renderFn();
  window.scrollTo(0, scrollY);
  const newModal = document.querySelector('.modal');
  if (newModal) newModal.scrollTop = modalScroll;
}

async function apiSync() {
  if (!state.user) return;
  if (pendingRequests > 0) return; 
  try {
    const res = await secureFetch(`${SERVER_URL}/api/state/${state.user.id}`);
    if (res.ok) {
      const data = await res.json();
      state.balance = data.balance || 0;
      state.inventory = data.inventory || [];
      saveLocalState();
      updateBalance(state.balance);
      renderHeader();
    }
  } catch(e) { console.log('Ошибка синхронизации', e); }
}

async function apiSellItems(itemsToSell, onSuccess) {
    if (!state.user) return;
    try {
        const res = await secureFetch(`${SERVER_URL}/api/sell`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ items: itemsToSell })
        });
        if (res.ok) {
            const data = await res.json();
            state.balance = data.balance;
            state.inventory = data.inventory;
            updateBalance(state.balance);
            renderHeader();
            saveLocalState();
            if (onSuccess) onSuccess(data);
        } else {
            toast('Ошибка при продаже', 'err');
        }
    } catch(e) { toast('Ошибка сети', 'err'); }
}

async function pushBalance(delta) {
  if (!state.user) return;
  saveLocalState();
  try {
    await secureFetch(`${SERVER_URL}/api/balance`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ delta }),
      keepalive: true
    });
  } catch(e) {}
}

async function pushInventoryAdd(itemId, uid, date) {
  if (!state.user) return null;
  saveLocalState();
  try {
    const res = await secureFetch(`${SERVER_URL}/api/inventory/add`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ itemId, uid, date }),
      keepalive: true
    });
    if (res.ok) {
        const data = await res.json();
        return data.entry;
    }
  } catch(e) {}
  return null;
}

async function pushInventoryRemove(uids) {
  if (!state.user || !uids || !uids.length) return;
  saveLocalState();
  try {
    await secureFetch(`${SERVER_URL}/api/inventory/remove`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ uids }),
      keepalive: true
    });
  } catch(e) {}
}

function sha256(ascii){function rightRotate(v,a){return(v>>>a)|(v<<(32-a));}var mathPow=Math.pow;var maxWord=mathPow(2,32);var lengthProperty='length';var i,j;var result='';var words=[];var asciiBitLength=ascii[lengthProperty]*8;let hash=sha256.h=sha256.h||[];var k=sha256.k=sha256.k||[];var primeCounter=k[lengthProperty];var isComposite={};for(var candidate=2;primeCounter<64;candidate++){if(!isComposite[candidate]){for(i=0;i<313;i+=candidate){isComposite[i]=candidate;}hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0;}}ascii+='\x80';while(ascii[lengthProperty]%64-56)ascii+='\x00';for(i=0;i<ascii[lengthProperty];i++){j=ascii.charCodeAt(i);if(j>>8)return'';words[i>>2]|=j<<((3-i)%4)*8;}words[words[lengthProperty]]=((asciiBitLength/maxWord)|0);words[words[lengthProperty]]=(asciiBitLength);for(j=0;j<words[lengthProperty];){var w=words.slice(j,j+=16);var oldHash=hash.slice(0);for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2];var a=hash[0],e=hash[4];var temp1=hash[7]+(rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rightRotate(w15,7)^rightRotate(w15,18)^(w15>>>3))+w[i-7]+(rightRotate(w2,17)^rightRotate(w2,19)^(w2>>>10)))|0);var temp2=(rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));hash=[(temp1+temp2)|0].concat(hash);hash[4]=(hash[4]+temp1)|0;}for(i=0;i<8;i++)hash[i]=(hash[i]+oldHash[i])|0;}for(i=0;i<8;i++){for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?'0':'')+b.toString(16);}}return result;}
function hmacSha256(key,message){var blockSize=64;if(key.length>blockSize)key=sha256(key);while(key.length<blockSize)key+='\x00';var oKeyPad='',iKeyPad='';for(var i=0;i<blockSize;i++){var keyChar=key.charCodeAt(i);oKeyPad+=String.fromCharCode(keyChar^0x5c);iKeyPad+=String.fromCharCode(keyChar^0x36);}return sha256(oKeyPad+sha256(iKeyPad+message));}
function getFairRoll(serverSeed,clientSeed,nonce){var msg=clientSeed+':'+nonce;var hash=hmacSha256(serverSeed,msg);var intVal=parseInt(hash.substring(0,8),16);return intVal/0xFFFFFFFF;}

let __displayedBalance = 0;

let __balanceAnimId = null;
function updateBalance(newVal){
  __balanceTarget = newVal;
  if(__balanceAnimId) return;
  const step = () => {
    const diff = __balanceTarget - __displayedBalance;
    if(Math.abs(diff) < 0.5){
      __displayedBalance = __balanceTarget;
      const el = $('#balanceEl');
      if(el) el.textContent = fmt(Math.round(__displayedBalance));
      __balanceAnimId = null;
      return;
    }
    __displayedBalance += diff * 0.15;
    const el = $('#balanceEl');
    if(el) el.textContent = fmt(Math.round(__displayedBalance));
    __balanceAnimId = requestAnimationFrame(step);
  };
  __balanceAnimId = requestAnimationFrame(step);
}

  if(__toastRunning || !__toastQueue.length) return;
  __toastRunning = true;

  const e = $('#toast');
  if(!e){ __toastRunning = false; return; }

async function settlePendingCase(){
  const pending=__pendingCase;
  if(!pending||pending.settled)return[];
  pending.settled=true;
  const added=[];
  const today=new Date().toDateString();
  if(state.topDropDayCache.date!==today){state.topDropDayCache={date:today,itemId:'',user:'',price:0};}
  
  for (const r of pending.results) {
    const it=itemById(r.id);if(!it)continue;
    const now=Date.now();
    const invItem={uid:uuid(),itemId:it.id,date:now};
    
    state.inventory.push(invItem);
    state.history.push({type:'case',caseId:pending.case.id,itemId:it.id,date:now});
    added.push(invItem);
    
    await pushInventoryAdd(it.id, invItem.uid, invItem.date); 
    
    try {
      await secureFetch(`${SERVER_URL}/api/drops`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          username: state.user ? state.user.username : 'guest',
          itemName: it.name,
          price: it.price,
          rarity: it.rarity,
          itemId: it.id,
          caseId: pending.case.id,        // ДОБАВЛЕНО
          caseName: pending.case.name     // ДОБАВЛЕНО
        }),
        keepalive: true
      });
    } catch (e) {
      console.error('Ошибка отправки дропа', e);
    }

    if(it.price>(state.topDropDayCache.price||0)){
      state.topDropDayCache={date:today,itemId:it.id,user:state.user?state.user.username:'guest',price:it.price};
    }
  }
  __pendingCase=null;
  saveLocalState();
  return added;
}

  if(__pendingCase)settlePendingCase();
  if(typeof __upgFinish==='function')__upgFinish();
  __caseTimers.forEach(t=>clearTimeout(t));__caseTimers=[];
  __upgTimers.forEach(t=>clearTimeout(t));__upgTimers=[];
  if(__upgTimer)clearTimeout(__upgTimer);
  if(__upgSkipTimeout)clearTimeout(__upgSkipTimeout);
  if(__upgTickTimer)clearTimeout(__upgTickTimer);
  if(__allInTimerInt)clearTimeout(__allInTimerInt);

}

async function initTelegramLogin(){
  const tg = window.Telegram?.WebApp;
  
  if (!tg) {
    showLoginError('Вы открыли игру в обычном браузере. Откройте её через Telegram-бота.');
    return;
  }
  
  tg.expand();
  
  let attempts = 0;
  const maxAttempts = 10; 
  
  const checkInterval = setInterval(async () => {
    attempts++;
    const initData = tg.initData || '';
    
    if (initData.length > 0) {
      clearInterval(checkInterval);
      document.getElementById('loginLoading').style.display = 'block';
      
      try {
        const response = await fetch(`${SERVER_URL}/api/auth/telegram`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: initData })
        });
        
        if (!response.ok) throw new Error('Сервер отклонил авторизацию');
        
        const data = await response.json();
        
        if (data.success && data.user) {
          sessionToken = data.token;
          onTelegramAuth({
            id: data.user.id,
            first_name: data.user.first_name || '',
            last_name: data.user.last_name || '',
            username: data.user.username || ('user' + data.user.id),
            photo_url: data.user.photo_url || null
          });
        } else {
          showLoginError('Ошибка сервера: неверный ответ.');
        }
      } catch (error) {
        console.error(error);
        showLoginError('Ошибка авторизации. Сервер отклонил запрос или недоступен.');
      }
    } 
    
    if (attempts >= maxAttempts) {
      clearInterval(checkInterval);
      showLoginError('Telegram не передал данные. Убедитесь, что вы настроили Web App URL в @BotFather.');

async function onTelegramAuth(user){
  const userData = {
    id: user.id,
    name: user.first_name || 'Игрок',
    username: user.username || '',
    avatar: user.photo_url || null,
    joined: new Date().toLocaleDateString('ru-RU')
  };
  state.user=userData;
  
  loadSavedState();
  await apiSync(); 
  await fetchGlobalDrops(); 

  const nameEl=document.getElementById('profileName');
  const avatarEl=document.getElementById('profileAvatar');
  
  if(nameEl)nameEl.textContent=state.user.name;
  if(avatarEl) {
    if(state.user.avatar) {
      avatarEl.innerHTML = `<img src="${state.user.avatar}" alt="ava">`;
    } else {
      avatarEl.textContent=(state.user.name||'?')[0].toUpperCase();
    }
  }
  
  document.getElementById('loginScreen').classList.remove('show');
  document.getElementById('app').classList.add('logged-in');
  saveLocalState();renderNav();render(true);
  haptic('success');

  setInterval(() => {
    if (state.tab === 'cases') {
      updateLiveDrops();
    }
  }, 3000);

  setInterval(() => {
    apiSync();
  }, 15000);
}

async function updateLiveDrops() {
  try {
    const res = await secureFetch(`${SERVER_URL}/api/drops`);
    if (!res.ok) return;
    const newDrops = await res.json();
    
    let hasNew = false;
    if (state.globalDrops.length > 0 && newDrops.length > 0) {
      if (newDrops[0].date > state.globalDrops[0].date) {
        hasNew = true;
      }
    }
    state.globalDrops = newDrops;
    
    const el = document.getElementById('live-drops-list');
    if (el) {
      el.innerHTML = newDrops.map((d, i) => {
        const it = itemById(d.itemId) || {name: d.itemName, icon:'🎁', price:d.price};
        const isNew = hasNew && i === 0 ? 'new-drop' : '';
        // ДОБАВЛЕНО: Отображение кейса
        return `<div class="live-item ${isNew}" onclick="showProfile('${d.username}','${d.itemId}')">
          ${itemIcon(it,40)}
          <div>
            <div class="li-name">${esc(it.name)}</div>
            <div class="li-user">${esc(d.username)} <span class="li-case-badge">${esc(d.caseName || 'Кейс')}</span></div>
          </div>
        </div>`;
      }).join('') || '<div style="color:var(--muted);font-size:14px;padding:10px 16px">Пока нет дропов сегодня</div>';
    }

    const topDropContainer = document.getElementById('top-drop-container');
    if (topDropContainer) {
      topDropContainer.innerHTML = getTopDropHtml();
    }
  } catch(e) {}
}

function adminSearch() {
    const query = document.getElementById('adminUserSearch').value.trim();
    if (!query) return toast('Введите ID или Username', 'err');
    
    // Так как мы на клиенте, мы можем найти только себя, но мы сделаем вид, что ищем
    if (String(state.user.id) === query || state.user.username === query) {
        state.adminSearchUser = {
            id: state.user.id,
            username: state.user.username,
            name: state.user.name,
            balance: state.balance,
            isBanned: !!state.bannedUsers[state.user.id]
        };
    } else {
        // Заглушка для поиска других юзеров (в реальности должен быть запрос к API)
        state.adminSearchUser = {
            id: query,
            username: 'user_' + query.slice(-4),
            name: 'Найденный Игрок',
            balance: 1500,
            isBanned: !!state.bannedUsers[query]
        };
    }
    render(false);
}

// ADMIN: БАН
function adminToggleBan(userId) {
    if (!userId) return;
    showConfirm(`Вы уверены, что хотите ${state.bannedUsers[userId] ? 'разбанить' : 'забанить'} пользователя ${userId}?`, () => {
        if (state.bannedUsers[userId]) {
            delete state.bannedUsers[userId];
        } else {
            state.bannedUsers[userId] = true;
        }
        localStorage.setItem('bannedUsers', JSON.stringify(state.bannedUsers));
        
        if (state.adminSearchUser && state.adminSearchUser.id === userId) {
            state.adminSearchUser.isBanned = !!state.bannedUsers[userId];
        }
        toast(`Пользователь ${userId} ${state.bannedUsers[userId] ? 'забанен' : 'разбанен'}`, 'ok');
        render(false);
    });
}

function adminGiveCoins(){
  const inp=document.getElementById('adminCoinsInput');const a=Number(inp.value);
  if(!a||a<=0){toast('Введите сумму','err');return;}
  state.balance+=a;saveLocalState();renderHeader();toast(`Выдано ${fmt(a)} монет`,'ok');
  pushBalance(a); 
  inp.value='';render(false);
}
function adminTakeCoins(){
  const inp=document.getElementById('adminCoinsInput');const a=Number(inp.value);
  if(!a||a<=0){toast('Введите сумму','err');return;}
  state.balance=Math.max(0,state.balance-a);saveLocalState();renderHeader();toast(`Списано ${fmt(a)} монет`,'ok');
  pushBalance(-a); 
  inp.value='';render(false);
}
function adminGiveItem(){
  const sel=document.getElementById('adminItemSelect');const id=sel.value;
  if(!id){toast('Выберите предмет','err');return;}
  const uid = uuid();
  const now = Date.now();
  state.inventory.push({uid,itemId:id,date:now});
  pushInventoryAdd(id, uid, now); 
  saveLocalState();toast(`Выдан: ${itemById(id).name}`,'ok');render(false);
}
function adminClearInventory(){
  showConfirm('Очистить весь инвентарь?', () => {
    const uids = state.inventory.map(i=>i.uid);
    state.inventory=[];saveLocalState();toast('Инвентарь очищен','ok');render(false);
    pushInventoryRemove(uids); 
  });
}

/* HISTORY */
function setHistoryFilter(f) {
  state.historyFilter = f;
  preserveScroll(() => render(false));
}

function renderHistory() {
  const filter = state.historyFilter || 'all';
  let list = [...state.history].reverse();
  
  if (filter !== 'all') {
    list = list.filter(h => {
      if (filter === 'deposit') return h.type === 'deposit';
      if (filter === 'withdraw') return h.type === 'sell' || h.type === 'withdraw';
      if (filter === 'case') return h.type === 'case';
      if (filter === 'upgrade') return h.type === 'upgrade_win' || h.type === 'upgrade_lose';
      if (filter === 'fuse') return h.type === 'fuse';
      return true;
    });
  }

  const grouped = {};
  list.forEach(h => {
    const d = new Date(h.date).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
    if (!grouped[d]) grouped[d] = { items: [], profit: 0 };
    grouped[d].items.push(h);
    
    if (h.type === 'case') {
      const it = itemById(h.itemId);
      if (it) grouped[d].profit -= it.price;
    } else if (h.type === 'sell') {
      grouped[d].profit += (h.price || 0);
    } else if (h.type === 'deposit') {
      grouped[d].profit += (h.amount || 0);
    } else if (h.type === 'upgrade_win') {
      const it = itemById(h.toId);
      if (it) grouped[d].profit += it.price;
    } else if (h.type === 'upgrade_lose') {
      const it = itemById(h.fromId);
      if (it) grouped[d].profit -= it.price;
    } else if (h.type === 'mines_win') {
      grouped[d].profit += (h.win || 0);
    } else if (h.type === 'mines_lose') {
      grouped[d].profit -= (h.bet || 0);
    }
  });

  const tabs = [
    { id: 'all', label: 'Все' },
    { id: 'case', label: 'Кейсы' },
    { id: 'upgrade', label: 'Апгрейды' },
    { id: 'fuse', label: 'Фьюз' },
    { id: 'deposit', label: 'Пополнения' },
    { id: 'withdraw', label: 'Выводы' }
  ];

  let html = `<div class="page-title">📜 История</div><div class="page-sub">Все твои действия в одном месте</div>`;
  
  html += `<div class="history-tabs">
    ${tabs.map(t => `<div class="history-tab ${filter === t.id ? 'active' : ''}" onclick="setHistoryFilter('${t.id}')">${t.label}</div>`).join('')}
  </div>`;

  if (Object.keys(grouped).length === 0) {
    html += `<div class="empty-state">📭 История пуста</div>`;
  } else {
    for (const [date, data] of Object.entries(grouped)) {
      const profitClass = data.profit >= 0 ? 'pos' : 'neg';
      const profitSign = data.profit > 0 ? '+' : '';
      html += `<div class="history-day-group">
        <div class="history-day-header">
          <div class="history-day-title">${date === new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) ? 'СЕГОДНЯ' : date}</div>
          <div class="history-day-profit ${profitClass}">${profitSign}${fmt(data.profit)} 🪙</div>
        </div>`;
      
      data.items.forEach(h => {
        let icon = '❓', title = '', sub = '', amountStr = '', amtClass = 'pos';
        
        if (h.type === 'case') {
          const it = itemById(h.itemId);
          const c = CASES.find(x => x.id === h.caseId);
          icon = '📦';
          title = `Открытие кейса «${c ? c.name : 'Неизвестно'}»`;
          sub = it ? it.name : '';
          amountStr = it ? `-${fmt(it.price)}` : '';
          amtClass = 'neg';
        } else if (h.type === 'sell') {
          const it = itemById(h.itemId);
          icon = '💰';
          title = `Продажа предмета`;
          sub = it ? it.name : '';
          amountStr = `+${fmt(h.price)}`;
          amtClass = 'pos';
        } else if (h.type === 'upgrade_win') {
          const toIt = itemById(h.toId);
          icon = '📈';
          title = `Успешный апгрейд`;
          sub = `Выигрыш: ${toIt ? toIt.name : '?'}`;
          amountStr = toIt ? `+${fmt(toIt.price)}` : '';
          amtClass = 'pos';
        } else if (h.type === 'upgrade_lose') {
          const fromIt = itemById(h.fromId);
          icon = '📉';
          title = `Проваленный апгрейд`;
          sub = `Потерян: ${fromIt ? fromIt.name : '?'}`;
          amountStr = fromIt ? `-${fmt(fromIt.price)}` : '';
          amtClass = 'neg';
        } else if (h.type === 'fuse') {
          const it = itemById(h.itemId);
          icon = '✨';
          title = `Фьюз предметов`;
          sub = `Получен: ${it ? it.name : '?'}`;
          amountStr = '';
        } else if (h.type === 'deposit') {
          icon = '📥';
          title = `Пополнение баланса`;
          sub = `Зачислено`;
          amountStr = `+${fmt(h.amount)}`;
          amtClass = 'pos';
        } else if (h.type === 'mines_win') {
          icon = '💎';
          title = `Победа в Минах`;
          sub = `Множитель x${h.mult.toFixed(2)}`;
          amountStr = `+${fmt(h.win)}`;
          amtClass = 'pos';
        } else if (h.type === 'mines_lose') {
          icon = '💣';
          title = `Проигрыш в Минах`;
          sub = `Взрыв`;
          amountStr = `-${fmt(h.bet)}`;
          amtClass = 'neg';
        }

        html += `<div class="history-item">
          <div class="history-item-left">
            <div class="history-item-icon">${icon}</div>
            <div class="history-item-info">
              <div class="history-item-title">${esc(title)}</div>
              <div class="history-item-sub">${esc(sub)}</div>
            </div>
          </div>
          ${amountStr ? `<div class="history-item-amount ${amtClass}">${amountStr} 🪙</div>` : ''}
        </div>`;
      });
      html += `</div>`;
    }
  }

  return html;
}

function render(fresh){
  updateBalance(state.balance);
  const el=$('#content');
  if(!el) return;
  el.classList.remove('page-enter');
  if(fresh){void el.offsetWidth;el.classList.add('page-enter');}
  if(state.openingView){el.innerHTML=state.openingView;saveLocalState();return;}
  if(state.currentCase){el.innerHTML=renderCaseDetail(state.currentCase);saveLocalState();return;}
  try {
    if(state.tab==='cases')el.innerHTML=renderCases();
    else if(state.tab==='mines')el.innerHTML=renderMines();
    else if(state.tab==='fuse')el.innerHTML=renderFuse();
    else if(state.tab==='upgrade')el.innerHTML=renderUpgrade();
    else if(state.tab==='inventory')el.innerHTML=renderInventory();
    else if(state.tab==='history')el.innerHTML=renderHistory();
    else if(state.tab==='profile')el.innerHTML=renderProfile();
    else if(state.tab==='admin')el.innerHTML=isAdmin()?renderAdmin():'<div class="empty-state">Доступ только для админов</div>';
    saveLocalState();
  } catch(e) {
    console.error('Render error:', e);
    el.innerHTML = `<div style="padding:60px;text-align:center;color:var(--red);">
      <div style="font-size:40px;margin-bottom:20px;">⚠️</div>
      <h2 style="font-size:24px;font-weight:900;margin-bottom:10px;">Ошибка отрисовки</h2>
      <p style="color:var(--muted);margin-bottom:20px;">Попробуйте обновить страницу или очистить кэш (F5)</p>
      <button class="btn btn-primary" onclick="localStorage.clear(); location.reload();">Сбросить игру</button>
    </div>`;
  }
}

async function fetchGlobalDrops() {
  try {
    const res = await secureFetch(`${SERVER_URL}/api/drops`);
    if (res.ok) {
      state.globalDrops = await res.json();
    }
  } catch (e) {
    console.log('Не удалось загрузить дропы', e);
  }
}

function getTopDropOfTheDay(){
  const today = new Date().toDateString();
  let best = null;
  state.globalDrops.forEach(d => {
    if (new Date(d.date).toDateString() === today) {
      if (!best || d.price > best.price) best = d;
    }
  });
  if (best) {
    return { item: itemById(best.itemId) || {name: best.itemName, price: best.price, icon:'🎁'}, user: best.username };
  }
  return null; 
}

function rollAllInCase(balance){
  if(balance<10)return ITEMS[0];
  const roll=Math.random();
  let mult=0;
  if(roll<0.55)mult=0.1+Math.random()*0.5;
  else if(roll<0.85)mult=0.7+Math.random()*0.3;
  else if(roll<0.95)mult=1.1+Math.random()*0.9;
  else if(roll<0.99)mult=2.0+Math.random()*3.0;
  else mult=5.0+Math.random()*15.0;
  const targetPrice=balance*mult;
  const nonCoinItems=ITEMS.filter(i=>!i.id.startsWith('coin_'));
  let closest=nonCoinItems[0],minDiff=Infinity;
  nonCoinItems.forEach(item=>{const diff=Math.abs(item.price-targetPrice);if(diff<minDiff){minDiff=diff;closest=item;}});
  return {id:closest.id,c:100};
}

function openCaseNow(){
  if(__pendingCase)return;
  const c=CASES.find(x=>x.id===state.currentCase);if(!c)return;
  if(c.isAllIn){
    if(state.balance<=0){toast('У вас нет монет для ALL IN!','err');haptic('error');return;}
    const cost=state.balance;
    showConfirm(`Вы уверены?\nСтавка: ${fmt(cost)} монет.\nВ случае неудачи потеряете всё.`, () => {
      state.balance=0;renderHeader();
      pushBalance(-cost);
      
      const result=rollAllInCase(cost);
      __pendingCase={case:c,opens:1,results:[result],total:cost,settled:false};
      startRoulette(c, [result], true); 
      render(false);
    });
    return;
  }
  const activePrice = c.isVip && state.vipMode ? c.vipPrice : c.price;
  const activeItems = c.isVip ? (state.vipMode ? c.vipItems : c.normalItems) : c.items;
  if(!activeItems||activeItems.length===0){toast('Кейс пуст','err');return;}
  const total=activePrice*state.caseOpens;
  if(state.balance<total){toast('Недостаточно монет','err');haptic('error');return;}
  const results=[];
  for(let i=0;i<state.caseOpens;i++){
    const t=activeItems.reduce((s,i)=>s+i.c,0);
    let r=Math.random()*t;
    let res=activeItems[activeItems.length-1];
    for(const it of activeItems){r-=it.c;if(r<=0){res=it;break;}}
    if(res) results.push(res);
  }
  if(!results.length){toast('Кейс пуст','err');return;}
  state.balance-=total;
  pushBalance(-total); 
  __pendingCase={case:c,opens:state.caseOpens,results,total,settled:false};
  startRoulette(c,results, false);
  render(false);
}

function startRoulette(c,results, isAllIn){
  const opens=results.length;
  const TRACK_LEN=25,WIN_IDX=20;
  
  let html=`<button class="case-back" onclick="goBackToCase('${c.id}')">← Назад к кейсу</button><div style="display:flex;flex-direction:column;gap:24px;margin-bottom:24px;">`;
  
  results.forEach((win,idx)=>{
    const pool=[];
    if(isAllIn){
      const nci=ITEMS.filter(i=>i.price>1000 && !i.id.startsWith('coin_'));
      for(let i=0;i<TRACK_LEN;i++) pool.push(nci[Math.floor(Math.random()*nci.length)].id);
    } else {
      const activeItems = c.isVip ? (state.vipMode ? c.vipItems : c.normalItems) : c.items;
      activeItems.forEach(i=>{if(itemById(i.id)){for(let k=0;k<Math.max(2,Math.round(i.c*2));k++)pool.push(i.id);}});
    }
    if(!pool.length)pool.push(win.id);
    const ids=[];
    for(let i=0;i<TRACK_LEN;i++)ids.push(i===WIN_IDX?win.id:pool[Math.floor(Math.random()*pool.length)]);
    
    const trackHtml=ids.map(id=>{
      const it=itemById(id);
      
      const iconSize = isAllIn ? 100 : (opens>1 ? 60 : 100);
      const itemStyle = isAllIn 
        ? 'min-width:130px;width:130px;height:130px;padding:10px;gap:8px;' 
        : (opens>1?'min-width:140px;width:140px;height:140px;padding:10px;gap:8px;':'min-width:130px;width:130px;height:130px;padding:10px;gap:8px;');
      
      const nameStyle = isAllIn 
        ? 'font-size:14px;white-space:normal;line-height:1.2;-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;font-weight:900;' 
        : (opens>1?'font-size:14px;white-space:normal;line-height:1.2;-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;':'font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;');
        
      return `<div class="roulette-item" style="${itemStyle}"><div style="display:flex;align-items:center;justify-content:center;flex:1;width:100%;overflow:hidden;">${itemIcon(it,iconSize)}</div><div class="roulette-item-name" style="${nameStyle}">${esc(it.name)}</div></div>`;
    }).join('');
    
    const wrapHeight = isAllIn ? '250px' : (opens>1?'170px':'250px');
    const wrapBorder = isAllIn ? 'border:3px solid var(--red); box-shadow: inset 0 0 50px rgba(244,63,94,0.3);' : '';
    
    html+=`<div class="roulette-wrap" id="rouletteWrap_${idx}" style="height:${wrapHeight};max-width:${isAllIn?'800px':'1000px'};margin:0 auto;width:100%;${wrapBorder}"><div class="roulette-marker" style="${isAllIn?'background:var(--red);width:4px;box-shadow:0 0 20px var(--red);':''}"></div><div class="roulette-particles" id="rouletteParticles_${idx}"></div><div class="roulette-track" id="track_${idx}" style="padding:${opens>1?'15px':'20px'}">${trackHtml}</div></div>`;
  });
  
  html+=`</div><div style="text-align:center;color:${isAllIn?'var(--red)':'var(--muted)'};font-size:${isAllIn?'24px':'16px'};font-weight:900;margin-bottom:16px">${state.settings.spinType==='fast'?'':'Крутим...'}</div><div style="text-align:center"><button class="btn btn-ghost" onclick="skipCaseAnim()">⏩ Пропустить</button></div>`;
  state.openingView=html;
  render(false);
  
  const isSpecialSpin = Math.random() < 0.3; 
  let animTime = state.settings.spinType==='fast' ? 300 : (isAllIn ? 5000 : (isSpecialSpin ? 5500 : 3500));
  let easing = isSpecialSpin ? 'cubic-bezier(0.05, 1, 0.1, 1)' : 'cubic-bezier(0.08,0.85,0.18,1)';
  
  requestAnimationFrame(() => {
    setTimeout(() => {
      results.forEach((win,idx)=>{
        const wrap=document.getElementById(`rouletteWrap_${idx}`);
        const track=document.getElementById(`track_${idx}`);
        if(!wrap||!track)return;
        const items=track.querySelectorAll('.roulette-item');
        const winEl=items[WIN_IDX];
        if(!winEl)return;
        const wc=winEl.offsetLeft+winEl.offsetWidth/2;
        const wrapW=wrap.offsetWidth;
        const offset=wrapW/2-wc;
        void track.offsetWidth;
        
        track.style.willChange = 'transform';
        track.style.transition=`transform ${animTime}ms ${easing}`;
        track.style.transform=`translate3d(${offset}px, 0, 0)`;
        
        setTimeout(() => {
            if(winEl && document.contains(winEl)){
                winEl.classList.add('landed');
                triggerLandingEffects(wrap, itemById(win.id));
            }
        }, animTime);
      });
    }, 50);
  });

  if(state.settings.spinType==='normal'&&!isMuted){
    let t=0;
    if(__caseTickInt) clearInterval(__caseTickInt);
    __caseTickInt=setInterval(()=>{
        sndTick();t++;
        if(t>=Math.min(25, animTime/150)) clearInterval(__caseTickInt);
    },150);
  }
  
  let done=false;
  const finish=async()=>{ 
    if(done)return;done=true;
    if(__caseTickInt)clearInterval(__caseTickInt);
    __caseTimers.forEach(t=>clearTimeout(t));__caseTimers=[];__caseFinish=null;
    const addedItems = await settlePendingCase(); 
    const itemsWon=addedItems.map(invItem=>itemById(invItem.itemId)).filter(Boolean);
    const totalVal=itemsWon.reduce((s,i)=>s+i.price,0);
    const bestItem = itemsWon.length ? itemsWon.reduce((a,b)=>a.price>b.price?a:b) : null;
    
    if(bestItem && (isAllIn || totalVal>=(c.isVip&&state.vipMode?c.vipPrice:c.price)*opens)) sndWinRarity(bestItem.rarity);
    else sndLose();
    haptic(totalVal >= (c.isVip&&state.vipMode?c.vipPrice:c.price)*opens ? 'success' : 'light');
    if(opens===1){
      const invItem=addedItems[0];
      if(!invItem){state.openingView=null;render(true);return;}
      const it=itemById(invItem.itemId);
      if(!it){state.openingView=null;render(true);return;}
      state.openingView=`<button class="case-back" onclick="goBackToCase('${c.id}')">← Назад к кейсу</button><div style="max-width:600px;margin:0 auto;background:rgba(15,23,42,.8);border:1px solid var(--border-strong);border-radius:24px;padding:40px;text-align:center;"><div style="margin-bottom:20px;">${itemIcon(it,120)}</div><div style="font-size:24px;font-weight:900;color:#fff;margin-bottom:12px;">${esc(it.name)}</div><div style="font-size:22px;font-weight:900;color:var(--gold);display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:20px;">${coin(24)} ${fmt(it.price)}</div><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;"><button class="btn btn-danger" onclick="sellResult('${invItem.uid}','${c.id}')">Продать всё</button><button class="btn btn-accent" onclick="goBackToCase('${c.id}')">Ещё раз</button><button class="btn btn-ghost" onclick="goBackInventory()">В инвентарь</button></div></div>`;
    }else{
      const uidsStr=addedItems.map(i=>i.uid).join(',');
      const cardsHtml=addedItems.map(invItem=>{const it=itemById(invItem.itemId);return it?`<div class="multi-result-item"><div class="strip" style="background:#0ea5e9"></div>${itemIcon(it,80)}<div class="nm">${esc(it.name)}</div><div class="pr">${coin(14)} ${fmt(it.price)}</div></div>`:'';}).join('');
      state.openingView=`<button class="case-back" onclick="goBackToCase('${c.id}')">← Назад к кейсу</button><div class="multi-opening-stage"><div class="multi-result-title">Результаты</div><div class="multi-result-total"><div class="lbl">Итого</div><div class="val">${coin(24)} ${fmt(totalVal)}</div></div><div class="multi-result-grid">${cardsHtml}</div><div class="multi-result-actions"><button class="btn btn-danger" onclick="sellMultiResult('${uidsStr}','${c.id}')">Продать всё</button><button class="btn btn-accent" onclick="goBackToCase('${c.id}')">Ещё раз</button><button class="btn btn-ghost" onclick="goBackInventory()">В инвентарь</button></div></div>`;
    }
    render(false);renderHeader();
  };
  __caseFinish=finish;
  __caseTimers.push(setTimeout(finish,animTime+500));
}

function triggerLandingEffects(wrap, item){
  if(!wrap || !document.contains(wrap)) return;
  wrap.classList.add('shake');
  setTimeout(() => wrap.classList.remove('shake'), 500);
  const particles = wrap.querySelector('.roulette-particles');
  if(particles && item){
    const color = RARITY[item.rarity]?.color || '#38bdf8';
    for(let i = 0; i < 36; i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = (Math.PI * 2 * i) / 36 + Math.random() * 0.2;
      const distance = 80 + Math.random() * 180;
      p.style.setProperty('--px', `${Math.cos(angle) * distance}px`);
      p.style.setProperty('--py', `${Math.sin(angle) * distance}px`);
      p.style.setProperty('--pr', `${Math.random() * 720 - 360}deg`);
      p.style.background = color;
      p.style.boxShadow = `0 0 12px ${color}`;
      p.style.animation = `particleFly ${0.7 + Math.random() * 0.7}s cubic-bezier(0.15,0.8,0.3,1) forwards`;
      p.style.animationDelay = `${Math.random() * 0.1}s`;
      particles.appendChild(p);
    }
    setTimeout(() => { if(particles.isConnected) particles.innerHTML = ''; }, 1600);
  }
}

function goBackToCases(){cancelAnimations();state.currentCase=null;state.openingView=null;render(true);window.scrollTo({top:0,behavior:'smooth'});}

function sellResult(uid,caseId){
  const inv=state.inventory.find(i=>i.uid===uid);if(!inv)return;
  const it=itemById(inv.itemId);if(!it)return;
  
  apiSellItems([{ uid: uid, price: it.price }], () => {
      state.history.push({type:'sell',itemId:it.id,price:it.price,date:Date.now()});
      sndCash();toast(`Продан ${esc(it.name)} за ${coin(16)} ${fmt(it.price)}`,'ok');
      haptic('success');
      if(caseId==='all_in')goBackToCases();else goBackToCase(caseId);
  });
}

function sellMultiResult(uidsStr,caseId){
  const uids=uidsStr.split(',');
  const toSell=state.inventory.filter(i=>uids.includes(i.uid)).map(inv => {
      const it = itemById(inv.itemId);
      return it ? { uid: inv.uid, price: it.price, itemId: it.id } : null;
  }).filter(Boolean);

  if (toSell.length === 0) return;

  apiSellItems(toSell, (data) => {
      toSell.forEach(item => state.history.push({type:'sell',itemId:item.itemId,price:item.price,date:Date.now()}));
      sndCash();toast(`Продано за ${coin(16)} ${fmt(data.added)}`,'ok');
      haptic('success');
      goBackToCase(caseId);
  });
}

/* MINES */
function renderMines(){
  const m=state.mines;const cells=[];
  for(let i=0;i<25;i++){
    const rv=m.revealed.has(i),mi=m.mineSet.has(i);
    let cls='mine-cell';

  }
  const safe=[...m.revealed].filter(i=>!m.mineSet.has(i)).length;

  return `<div class="page-title">💣 Мины</div><div class="page-sub">Открывай клетки, не попадись на мину.</div>

    </div>
    <div class="side-panel">
