<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Brainrot Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Manrope', system-ui, -apple-system, sans-serif !important; -webkit-tap-highlight-color: transparent; }
input, button, select, textarea, optgroup, option { font-family: inherit !important; }

:root{
  --bg:#050810; --bg2:#0b1222; --surface:rgba(11,18,34,.88); --surface-solid:#0b1222;
  --border:rgba(88,166,255,.12); --border-strong:rgba(88,166,255,.3);
  --text:#f8fafc; --muted:#94a3b8; --accent:#58a6ff; --accent-deep:#2f81f7;
  --accent2:#06b6d4; --accent2-deep:#0891b2; --gold:#ffc94a; --gold-dim:#f0a920;
  --green:#34d399; --red:#f87171; --pink:#ff6fb5; --purple:#a78bfa;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --radius:20px; --radius-sm:12px; --glow-blue:0 0 40px rgba(88,166,255,.25); --glow-cyan:0 0 40px rgba(34,211,238,.2);
  --shadow-lg:0 20px 40px -10px rgba(0,0,0,.6);
}
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
html{scroll-behavior:smooth;background-color:var(--bg)}
body{background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::-webkit-scrollbar{width:6px;height:6px} ::-webkit-scrollbar-track{background:transparent} ::-webkit-scrollbar-thumb{background:#334155;border-radius:10px} ::-webkit-scrollbar-thumb:hover{background:#475569}

.live-item.new-drop{border-color:rgba(88,166,255,.5)!important;background:rgba(88,166,255,.1)!important}

#loginScreen{position:fixed;inset:0;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;background:var(--bg)}
#loginScreen.show{display:flex}
#loginScreen::before{content:'';position:absolute;inset:0;pointer-events:none}
.login-card{position:relative;background:rgba(15,23,42,.85);border:1px solid var(--border-strong);border-radius:28px;padding:40px 30px;max-width:400px;width:100%;box-shadow:0 25px 80px rgba(0,0,0,.55),var(--glow-blue)}
.login-logo{width:100px;height:100px;background:linear-gradient(135deg,#2f81f7,#58a6ff);border-radius:28px;margin:0 auto 20px;display:grid;place-items:center;font-size:50px;position:relative}
.login-logo img{width:80px;height:80px}
.login-title{font-size:32px;font-weight:900;margin-bottom:8px;color:#fff;letter-spacing:-.02em}
.login-sub{color:var(--muted);font-size:15px;margin-bottom:20px;line-height:1.5}
.spinner{width:30px;height:30px;border:3px solid rgba(88,166,255,0.3);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:20px auto 0;}
@keyframes spin{to{transform:rotate(360deg)}}

.app{display:none;min-height:100vh;position:relative;z-index:2}
.app.logged-in{display:flex}
.mobile-nav{display:none}
.sidebar{width:260px;flex-shrink:0;background:rgba(10,14,23,.5);border-right:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30}
.logo{height:80px;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid rgba(255,255,255,.05)}
.logo img{width:44px !important;height:44px !important;border-radius:12px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(88,166,255,.4))}
.logo-text{font-weight:900;font-size:20px;color:#fff;letter-spacing:-.02em}
.nav{flex:1;overflow-y:auto;padding:20px 16px}
.nav-section{margin-bottom:32px}
.nav-section-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.15em;color:#64748b;padding:0 12px;margin-bottom:12px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.nav-item{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;font-size:15px;font-weight:600;color:#cbd5e1;cursor:pointer;transition:all .3s var(--ease);margin-bottom:4px;position:relative}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.08);transform:translateX(4px)}
.nav-item.active{color:#fff;background:linear-gradient(90deg,rgba(88,166,255,.2),transparent);box-shadow:inset 2px 0 0 var(--accent);text-shadow:0 0 10px rgba(255,255,255,.3)}
.nav-item .ico{width:24px;display:grid;place-items:center;font-size:18px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.5))}
.sidebar-profile{padding:20px;border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:14px;cursor:pointer;transition:background .3s;background:rgba(0,0,0,.1)}
.sidebar-profile:hover{background:rgba(88,166,255,.15)}
.profile-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#0ea5e9,#22d3ee);display:grid;place-items:center;font-size:18px;font-weight:800;overflow:hidden;box-shadow:0 0 20px rgba(14,165,233,.4)}
.profile-avatar img{width:100%;height:100%;object-fit:cover;}
.profile-info{flex:1;min-width:0}
.profile-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.profile-status{font-size:12px;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:4px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.header{height:72px;position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;padding:0 32px;background:rgba(10,14,23,.8);border-bottom:1px solid rgba(255,255,255,.05);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.balance{display:flex;align-items:center;gap:12px;padding:10px 20px;border-radius:16px;background:rgba(0,0,0,.5);border:1px solid rgba(251,191,36,.2);font-weight:800;font-size:18px;box-shadow:0 4px 20px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.05);color:#fff;font-variant-numeric:tabular-nums}
.balance .coin{display:grid;place-items:center}
.btn{border:none;cursor:pointer;font-weight:700;font-size:14px;padding:10px 20px;border-radius:14px;transition:all .3s var(--ease);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.15),transparent 60%);opacity:.6;pointer-events:none}
.btn-primary{background:linear-gradient(135deg,#0ea5e9,#0284c7);box-shadow:0 4px 20px rgba(14,165,233,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(14,165,233,.5)}
.btn-accent{background:linear-gradient(135deg,#22d3ee,#06b6d4);color:#042f2e;box-shadow:0 4px 20px rgba(34,211,238,.3)}
.btn-accent:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(34,211,238,.5)}
.btn-ghost{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);color:var(--text)}
.btn-ghost:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
.btn-danger{background:linear-gradient(135deg,#f43f5e,#e11d48);box-shadow:0 4px 20px rgba(244,63,94,.3)}
.btn-danger:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(244,63,94,.5)}
.btn-sm{padding:8px 16px;font-size:13px;border-radius:10px}
.btn-lg{padding:16px 36px;font-size:16px;border-radius:16px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.content{flex:1;padding:32px;max-width:1600px;width:100%;margin:0 auto}
.content.page-enter{animation:pi .5s var(--ease) both}
@keyframes pi{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.page-title{font-size:32px;font-weight:900;margin-bottom:8px;color:#fff;letter-spacing:-.02em}
.page-sub{color:var(--muted);font-size:15px;margin-bottom:32px}
.hero{background:linear-gradient(135deg,rgba(88,166,255,.15),rgba(14,165,233,.05));border:1px solid rgba(88,166,255,.2);border-radius:28px;padding:48px;margin-bottom:32px;position:relative;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.3)}
.hero h1{font-size:42px;font-weight:900;margin-bottom:12px;letter-spacing:-.03em;line-height:1.15;max-width:700px;color:#fff;text-shadow:0 4px 15px rgba(0,0,0,.5)}
.hero p{color:#cbd5e1;font-size:16px;max-width:500px;line-height:1.6;margin-bottom:24px;text-shadow:0 2px 5px rgba(0,0,0,.5)}

.top-drop-banner{background:linear-gradient(135deg,rgba(251,191,36,.1),rgba(0,0,0,.4));border:1px solid rgba(251,191,36,.3);border-radius:24px;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 0 20px rgba(251,191,36,.05);position:relative;overflow:hidden;cursor:pointer;transition:all .3s}
.top-drop-banner:hover{border-color:rgba(251,191,36,.6);transform:translateY(-3px);box-shadow:0 15px 40px rgba(0,0,0,.5),inset 0 0 30px rgba(251,191,36,.1)}
.top-drop-content{display:flex;align-items:center;gap:20px;z-index:1}
.top-drop-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.15em;color:var(--gold);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.top-drop-info{display:flex;flex-direction:column}
.top-drop-name{font-size:22px;font-weight:900;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.5)}
.top-drop-user{font-size:14px;color:var(--muted);margin-top:2px}
.top-drop-price{font-size:28px;font-weight:900;color:var(--gold);text-shadow:0 0 20px rgba(251,191,36,.5);display:flex;align-items:center;gap:12px;z-index:1}
.live-bar{background:rgba(15,23,42,.6);border:1px solid rgba(255,255,255,.05);border-radius:20px;padding:16px 20px;margin-bottom:32px;display:flex;align-items:center;gap:20px;overflow:hidden}
.live-head{display:flex;align-items:center;gap:10px;flex-shrink:0;border-right:1px solid rgba(255,255,255,.1);padding-right:20px}
.dot{width:8px;height:8px;background:var(--red);border-radius:50%;box-shadow:0 0 12px var(--red);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.5)}}
.live-list{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px; align-items:center;}
.live-list::-webkit-scrollbar{display:none}
.live-item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);padding:8px 16px;border-radius:14px;min-width:max-content;transition:all .2s;cursor:pointer; position:relative;}
.live-item:hover{background:rgba(255,255,255,.08);transform:translateY(-2px)}
.li-name{font-size:13px;font-weight:700;color:#fff;line-height:1.2}
.li-user{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px;}
.li-case-badge{font-size:9px;background:rgba(88,166,255,.15);color:var(--accent);padding:2px 6px;border-radius:4px;font-weight:800;text-transform:uppercase;}
.cases-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
.case-card{background:linear-gradient(180deg,rgba(30,41,59,.7),rgba(15,23,42,.9));border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:28px;cursor:pointer;transition:all .4s var(--ease);position:relative;overflow:hidden;display:flex;flex-direction:column}
.case-card:hover{border-color:rgba(88,166,255,.5);box-shadow:var(--shadow-lg),0 0 40px rgba(88,166,255,.15)}
.case-img{height:200px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,rgba(88,166,255,.15),transparent 70%);border-radius:20px;margin-bottom:24px;position:relative;font-size:80px;padding:10px;overflow:hidden}
.case-img img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 20px 30px rgba(0,0,0,.8));transition:transform .4s var(--spring)}
.case-card:hover .case-img img{transform:scale(1.05) rotate(2deg)}
.case-body{display:flex;flex-direction:column;flex:1}
.case-name{font-size:20px;font-weight:800;margin-bottom:24px;text-align:center;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.5)}
.case-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:20px;border-top:1px solid rgba(255,255,255,.05)}
.case-price{font-size:18px;font-weight:900;color:var(--gold);display:flex;align-items:center;gap:8px;text-shadow:0 0 10px rgba(251,191,36,.3)}
.case-footer .btn{padding:12px 24px;font-size:15px;border-radius:12px;background:linear-gradient(135deg,#0ea5e9,#0284c7);box-shadow:0 4px 15px rgba(14,165,233,.3)}
.all-in-card{border:1px solid rgba(244,63,94,.4);background:linear-gradient(180deg,rgba(244,63,94,.1),rgba(15,23,42,.95))}
.all-in-card:hover{border-color:rgba(244,63,94,.8);box-shadow:var(--shadow-lg),0 0 50px rgba(244,63,94,.25)}
.all-in-card .case-price{color:var(--red);text-shadow:0 0 15px rgba(244,63,94,.5)}
.all-in-card .case-img{background:radial-gradient(circle at center,rgba(244,63,94,.2),transparent 70%)}
.case-badge{position:absolute;top:20px;right:20px;z-index:2;font-size:12px;font-weight:900;padding:8px 16px;border-radius:24px;text-transform:uppercase;letter-spacing:.08em;box-shadow:0 4px 15px rgba(0,0,0,.4)}
.badge-hot{background:rgba(244,63,94,.2);color:#f43f5e;border:1px solid rgba(244,63,94,.5)}
.case-back{background:transparent;border:none;color:var(--muted);font-size:15px;font-weight:700;cursor:pointer;margin-bottom:24px;display:inline-flex;align-items:center;gap:10px;transition:color .2s}
.case-back:hover{color:#fff}
.case-detail{display:grid;grid-template-columns:380px 1fr;gap:40px;align-items:start}
@media(max-width:950px){.case-detail{grid-template-columns:1fr}}
.case-detail-img{background:radial-gradient(circle at 50% 50%,rgba(88,166,255,.15) 0%,#0f172a 75%);border:2px solid rgba(88,166,255,.2);border-radius:32px;height:340px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;box-shadow:inset 0 0 60px rgba(0,0,0,.6);font-size:140px;padding:20px;overflow:hidden}
.case-detail-img img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 20px 40px rgba(0,0,0,.8))}
.case-stat-grid{display:flex;flex-direction:column;gap:12px}
.case-stat{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:20px;display:flex;justify-content:space-between;align-items:center}
.case-stat .lbl{font-size:14px;color:var(--muted);font-weight:700}
.case-stat .val{font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px;color:#fff}
.case-title{font-size:42px;font-weight:900;margin-bottom:12px;line-height:1.1;color:#fff}
.case-title-sub{color:var(--muted);font-size:16px;margin-bottom:24px}
.case-desc-long{background:rgba(88,166,255,.05);border:1px solid rgba(88,166,255,.15);border-left:4px solid var(--accent);border-radius:16px;padding:24px;font-size:16px;color:#cbd5e1;line-height:1.6;margin-bottom:32px}
.case-open-panel{background:rgba(15,23,42,.8);border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:36px;box-shadow:0 20px 50px rgba(0,0,0,.4)}

.roulette-wrap{position:relative;overflow:hidden;background:#0a0e17;border:3px solid var(--border-strong);border-radius:20px;box-shadow:inset 0 0 50px rgba(0,0,0,.8);width:100%;box-sizing:border-box}
.roulette-marker{position:absolute;top:0;bottom:0;left:50%;width:4px;background:var(--red);transform:translateX(-50%);z-index:10;box-shadow:0 0 20px var(--red);border-radius:2px}
.roulette-track{display:flex;flex-direction:row;align-items:center;gap:12px;height:100%;will-change:transform;transform:translate3d(0,0,0);}
.roulette-item{display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(88,166,255,.05);border:1px solid var(--border);border-radius:16px;flex-shrink:0;transition:border-color .2s,transform .2s}
.roulette-item.near-marker{transform:scale(1.05)}
.roulette-item.landed{border-color:var(--gold);box-shadow:0 0 30px rgba(251,191,36,.6);background:rgba(251,191,36,.1)}
.roulette-item.rarity-common{border-color:rgba(148,163,184,.35)}
.roulette-item.rarity-rare{border-color:rgba(88,166,255,.55);box-shadow:inset 0 0 12px rgba(88,166,255,.06)}
.roulette-item.rarity-epic{border-color:rgba(167,139,250,.62);box-shadow:inset 0 0 14px rgba(167,139,250,.08)}
.roulette-item.rarity-legendary{border-color:rgba(251,191,36,.7);box-shadow:inset 0 0 16px rgba(251,191,36,.09)}
.roulette-item.rarity-mythic{border-color:rgba(244,63,94,.72);box-shadow:inset 0 0 18px rgba(244,63,94,.1)}
.roulette-item.rarity-god{border-color:rgba(45,212,191,.82);box-shadow:inset 0 0 20px rgba(45,212,191,.12)}
.case-drop-card{animation:dropCardIn .32s ease both}
@keyframes dropCardIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

.roulette-item-name{font-size:13px;font-weight:700;text-align:center;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}

.all-in-stage-new{position:relative;width:100%;min-height:80vh;background:radial-gradient(circle at center,rgba(244,63,94,.15) 0%,#000 80%);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;border:1px solid rgba(244,63,94,.4);box-shadow:inset 0 0 100px rgba(244,63,94,.2);padding:20px;box-sizing:border-box}
.all-in-multiplier{font-size:120px;font-weight:900;color:#fff;text-shadow:0 0 50px rgba(244,63,94,0.8), 0 0 100px rgba(244,63,94,0.4);transition:all 0.1s linear;position:relative;z-index:5;font-variant-numeric:tabular-nums; line-height:1;}
.all-in-multiplier.losing{color:#f43f5e;text-shadow:0 0 50px rgba(244,63,94,0.8);}
.all-in-multiplier.winning{color:#fbbf24;text-shadow:0 0 50px rgba(251,191,36,0.8);}
.all-in-subtext{font-size:20px;font-weight:800;color:#cbd5e1;margin-top:20px;z-index:5;text-align:center;}
.all-in-bg-text-new{position:absolute;font-size:200px;font-weight:900;color:rgba(255,255,255,0.02);text-transform:uppercase;letter-spacing:20px;pointer-events:none;user-select:none;z-index:1;white-space:nowrap}

.multi-opening-stage{background:rgba(15,23,42,0.9);border:1px solid var(--border-strong);border-radius:24px;padding:32px;text-align:center;margin:0 auto;max-width:1200px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.multi-result-title{font-size:36px;font-weight:900;color:#fff;margin-bottom:24px;letter-spacing:-0.02em}
.multi-result-total{margin-bottom:32px;display:inline-flex;flex-direction:column;align-items:center;background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.3);border-radius:16px;padding:16px 40px}
.multi-result-total .lbl{font-size:14px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-bottom:6px;letter-spacing:0.05em}
.multi-result-total .val{font-size:32px;font-weight:900;color:var(--gold);display:flex;align-items:center;justify-content:center;gap:10px}
.multi-result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-bottom:32px;max-height:55vh;overflow-y:auto;padding-right:8px}
.multi-result-item{background:linear-gradient(180deg,rgba(15,23,42,.95) 0%,rgba(10,14,23,.95) 100%);border:1px solid var(--border);border-radius:16px;padding:20px 12px;position:relative;overflow:hidden;transition:all .25s;display:flex;flex-direction:column;align-items:center;justify-content:center}
.multi-result-item .strip{position:absolute;top:0;left:0;right:0;height:4px}
.multi-result-item .nm{font-size:14px;font-weight:700;margin:12px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.multi-result-item .pr{font-size:16px;font-weight:800;color:var(--gold);display:flex;justify-content:center;align-items:center;gap:6px}
.multi-result-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.multi-result-actions .btn{font-size:16px;padding:14px 32px;border-radius:14px}

.upg-layout{display:flex;flex-direction:column;gap:20px}
.upg-top-row{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:20px;align-items:stretch}
@media(max-width:1100px){.upg-top-row{grid-template-columns:1fr}}
.upg-panel{background:rgba(15,23,42,.9);border:1px solid rgba(255,255,255,.05);border-radius:12px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:inset 0 0 20px rgba(0,0,0,.5)}
.upg-panel-header{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px;font-weight:700;color:#cbd5e1;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.2)}
.upg-left-body{flex:1;display:flex;flex-wrap:wrap;gap:10px;padding:16px;align-content:flex-start;overflow-y:auto;min-height:200px}
.upg-right-body{flex:1;display:flex;justify-content:center;align-items:center;padding:20px;position:relative;min-height:200px}
.upg-target-glow{position:absolute;inset:0;background:radial-gradient(circle at center,rgba(251,191,36,0.15) 0%,transparent 60%);z-index:0;pointer-events:none}
.upg-center-panel{display:flex;flex-direction:column;align-items:center;position:relative;justify-content:center}
.upg-logo-top{font-size:14px;font-weight:900;letter-spacing:2px;color:#cbd5e1;display:flex;align-items:center;gap:8px;margin-bottom:10px;z-index:5;text-transform:uppercase}
.upg-dial-wrapper{position:relative;width:280px;height:280px;margin-bottom:20px;display:flex;justify-content:center;align-items:center}
.upg-dial-svg{width:100%;height:100%}
.upg-dial-bg{fill:none;stroke:#1e293b;stroke-width:20}
.upg-dial-progress{fill:none;stroke:var(--accent);stroke-width:20;stroke-linecap:butt;transition:stroke-dasharray 0.3s ease}
.upg-dial-inner{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:2}
.upg-pct-text{font-size:42px;font-weight:900;color:#fff;text-shadow:0 0 20px rgba(255,255,255,0.2);line-height:1}
.upg-status-text{font-size:14px;font-weight:700;color:var(--accent);margin-top:4px;text-transform:uppercase}
.upg-marker-rotator{position:absolute;inset:0;transform-origin:center center;will-change:transform;pointer-events:none;z-index:20}

/* --- анимация крутки и экран результата апгрейда --- */
@keyframes kzspin{to{transform:rotate(360deg)}}
@keyframes kzpulse{0%,100%{opacity:.25}50%{opacity:.65}}
@keyframes kzblink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes kzpop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.kz-scan{position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 50%,rgba(16,185,129,.38) 0%,rgba(4,30,22,.96) 68%)}
.kz-scan::before{content:'';position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 50%,transparent 0 16px,rgba(52,211,153,.07) 16px 17px)}
.kz-ring{position:absolute;left:50%;top:50%;border:3px solid #34d399;border-radius:50%;box-shadow:0 0 20px rgba(52,211,153,.55),inset 0 0 20px rgba(52,211,153,.25);animation:kzspin 6s linear infinite}
.kz-ring i{position:absolute;top:-8px;left:50%;margin-left:-6px;width:12px;height:12px;border-radius:50%;background:#a7f3d0;box-shadow:0 0 12px #34d399}
.kz-ring.r1{width:300px;height:300px;margin:-150px 0 0 -150px;animation-duration:7s}
.kz-ring.r2{width:216px;height:216px;margin:-108px 0 0 -108px;animation-duration:5s;animation-direction:reverse}
.kz-ring.r3{width:132px;height:132px;margin:-66px 0 0 -66px;animation-duration:3.4s}
.kz-ghost{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);animation:kzpulse 1.3s ease-in-out infinite;filter:blur(1px) drop-shadow(0 0 18px rgba(52,211,153,.7))}
.kz-res{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 50%,#6ee7b7 0%,#10b981 24%,#065f46 62%,#022c22 100%)}
.kz-res::before{content:'';position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.2) 0 3deg,transparent 3deg 13deg);animation:kzspin 50s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 0%,transparent 60%);mask-image:radial-gradient(circle,#000 0%,transparent 60%)}
.kz-res.lose{background:radial-gradient(circle at 50% 50%,#7f1d1d 0%,#450a0a 55%,#1c0606 100%)}
.kz-res.lose::before{background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.07) 0 3deg,transparent 3deg 13deg)}
.kz-item{position:relative;z-index:2;animation:kzpop .5s ease-out both;filter:drop-shadow(0 8px 24px rgba(0,0,0,.55))}
.kz-res.lose .kz-item{filter:grayscale(.85) brightness(.7) drop-shadow(0 8px 24px rgba(0,0,0,.6))}
.kz-price{position:absolute;right:14px;top:12px;z-index:3;font-weight:900;font-size:18px;color:#fff;display:flex;gap:6px;align-items:center;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.kz-tag{position:absolute;left:14px;top:12px;z-index:3;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.08em;padding:4px 10px;border-radius:6px;background:rgba(0,0,0,.45)}
.kz-name{position:absolute;left:14px;bottom:12px;right:14px;z-index:3;text-shadow:0 2px 6px rgba(0,0,0,.7)}
.kz-name b{display:block;font-size:20px;font-weight:900;color:#fff}
.kz-name span{display:block;font-size:13px;font-weight:700;color:rgba(255,255,255,.7);margin-top:2px}
.kz-bar{width:100%;max-width:300px;height:50px;border-radius:8px;border:2px solid #10b981;background:linear-gradient(135deg,#065f46,#10b981);display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 0 24px rgba(16,185,129,.4)}
.kz-bar b{width:11px;height:11px;background:#d1fae5;animation:kzblink 1s infinite}
.kz-bar b:nth-child(2){animation-delay:.2s}.kz-bar b:nth-child(3){animation-delay:.4s}
.upg-dial-wrapper.kz-spin .upg-marker-rotator{opacity:0}
.upg-dial-wrapper.kz-spin .upg-dial-progress{stroke-dasharray:none!important;stroke:#34d399!important}
.upg-dial-wrapper.kz-spin .upg-dial-bg{stroke:#0b3b2c}
.kz-q{position:absolute;top:26px;left:0;right:0;text-align:center;font-size:26px;font-weight:900;color:#34d399;z-index:3}
.kz-big{font-size:30px;font-weight:900;letter-spacing:.05em;text-shadow:0 0 24px currentColor;animation:kzpop .45s ease-out both}
.btn-upg-main{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;border:none;padding:15px 40px;font-size:16px;font-weight:800;border-radius:8px;width:100%;max-width:300px;cursor:pointer;transition:all .2s;text-transform:uppercase;letter-spacing:1px;box-shadow:0 4px 20px rgba(14,165,233,.3)}
.btn-upg-main:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(14,165,233,.5)}
.btn-upg-main:disabled{opacity:0.5;cursor:not-allowed;box-shadow:none;background:#334155}
.upg-ctrl-row{display:flex;justify-content:space-between;align-items:center;background:rgba(15,23,42,.9);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:10px 16px;flex-wrap:wrap;gap:12px}
.upg-ctrl-left{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.upg-ctrl-right{display:flex;gap:10px;align-items:center}
.btn-ctrl{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#cbd5e1;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-ctrl:hover{background:rgba(255,255,255,.1);color:#fff}
.btn-ctrl:disabled{opacity:.4;cursor:not-allowed}
.upg-bot-row{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.upg-bot-row{grid-template-columns:1fr}}
.upg-inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;padding:16px;max-height:400px;overflow-y:auto;align-content:start}
.upg-item-card{background:linear-gradient(145deg,#1e293b,#0f172a);border:1px solid #334155;border-radius:10px;padding:12px;position:relative;cursor:pointer;transition:all 0.2s ease;display:flex;flex-direction:column;align-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05),0 4px 6px rgba(0,0,0,0.3)}

.settings-modal-content{background:var(--surface-solid);color:#fff;padding:32px;border-radius:28px;max-width:600px;width:100%;border:1px solid var(--border-strong);box-shadow:var(--shadow-lg),var(--glow-blue);overflow-x:hidden}

.btn-save-settings{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;border:none;border-radius:14px;padding:18px;font-size:17px;font-weight:900;width:100%;cursor:pointer;margin-top:16px;transition:all .2s;box-shadow:0 4px 22px rgba(14,165,233,.4)}

.overlay{position:fixed;inset:0;z-index:200;background:rgba(5,6,12,.85);display:none;align-items:center;justify-content:center;padding:20px;animation:overlayIn .2s ease}

.modal{background:var(--surface-solid);border:1px solid rgba(255,255,255,.1);border-radius:28px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;padding:32px;box-shadow:var(--shadow-lg);animation:modalIn .3s var(--spring);position:relative}

.modal-title{font-size:24px;font-weight:900;color:#fff}

.toast{ display: none; position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0; background:rgba(15,23,42,.95); border:1px solid rgba(255,255,255,.1); color:#fff; padding:16px 28px; border-radius:16px; font-size:15px; font-weight:700; z-index:99999; box-shadow:0 20px 40px rgba(0,0,0,.6); transition:all .3s ease; max-width:90vw; text-align:center; }

/* ===== Brain-Battle-style layout ===== */
:root{--bg:#050810;--panel:#0a1020;--panel2:#0d1527;--line:rgba(88,166,255,.14)}
body{background:radial-gradient(1200px 600px at 60% -10%,rgba(30,64,120,.25),transparent 60%),#050810}
.sidebar,.header,.mobile-nav{display:none!important}
.app{flex-direction:row}
.live-strip{width:210px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;padding:8px 10px;background:#070c18;border-right:1px solid rgba(255,255,255,.04);scrollbar-width:none;display:flex;flex-direction:column;gap:8px}
.live-strip::-webkit-scrollbar{display:none}
.ls-item{position:relative;border-radius:8px;padding:10px 6px 8px;text-align:center;cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,.02),color-mix(in srgb,var(--rc) 14%,transparent));border:1px solid rgba(255,255,255,.04);transition:transform .2s}
.ls-item:hover{transform:translateY(-2px)}
.ls-item.first{border-color:rgba(255,201,74,.45);animation:lsIn .5s var(--ease)}
@keyframes lsIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.ls-ico{height:62px;display:flex;align-items:center;justify-content:center}
.ls-name{font-size:12px;font-weight:700;color:#e5edf8;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ls-empty{color:var(--muted);font-size:13px;text-align:center;padding:20px 6px}
.main{padding:0 16px}
.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:14px;padding:0 18px;background:linear-gradient(180deg,#0a1122,#080d1a);border:1px solid var(--line);border-bottom:0}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;font-family:Impact,'Bebas Neue','Arial Narrow',sans-serif;font-size:34px;letter-spacing:.02em;color:#3fb4ff;text-shadow:0 0 18px rgba(63,180,255,.35);user-select:none}
.brand img{height:44px;width:auto;display:block}
.brand i{font-style:normal;font-size:30px;filter:drop-shadow(0 0 8px rgba(63,180,255,.5))}
.top-right{display:flex;align-items:center;gap:10px}
.tb-icon{width:38px;height:38px;border-radius:6px;border:0;background:#0b1328;color:#fff;font-size:17px;cursor:pointer}
.tb-icon:hover{background:#13203d}
.balance{padding:7px 14px;border-radius:6px;font-size:15px;background:#070c18;border:1px solid rgba(255,255,255,.06)}
.btn-gold,.btn-blue,.btn-dark{border:0;cursor:pointer;font-weight:800;font-size:14px;padding:10px 20px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,filter .15s;font-family:inherit}
.btn-gold{background:linear-gradient(180deg,#ffd35c,#f2a915);color:#2a1b04;box-shadow:0 3px 0 #a86f0a}
.btn-blue{background:linear-gradient(180deg,#4f90f2,#2f6fd8);color:#fff;box-shadow:0 4px 0 #1f4fa3}
.btn-dark{background:#0b1730;color:#cfe0ff;border:1px solid rgba(88,166,255,.25)}
.btn-gold:hover,.btn-blue:hover,.btn-dark:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-blue:disabled{filter:grayscale(.7) brightness(.7);cursor:not-allowed;transform:none}
.topnav{display:flex;justify-content:center;gap:4px;overflow-x:auto;padding:0 10px;background:linear-gradient(180deg,#080d1a,#070b16);border:1px solid var(--line);border-top:1px solid rgba(255,255,255,.04);scrollbar-width:none}
.topnav::-webkit-scrollbar{display:none}
.topnav .nav-item{margin:0;padding:15px 16px;border-radius:0;background:none;box-shadow:none;font-size:14px;font-weight:700;color:#9db4d6;gap:8px;white-space:nowrap;text-shadow:none;transform:none!important;border-bottom:2px solid transparent}
.topnav .nav-item:hover{color:#fff;background:rgba(88,166,255,.06)}
.topnav .nav-item.active{color:#fff;border-bottom-color:#58a6ff;background:linear-gradient(180deg,transparent,rgba(88,166,255,.10))}
.topnav .nav-item .ico{width:auto;font-size:17px}
.content{padding:16px 0 60px;max-width:none}
.pbn{position:relative;container-type:inline-size;width:100%;max-width:380px;margin-left:auto;margin-right:auto;aspect-ratio:2170/725;background:#04122b var(--pbnimg) center/cover no-repeat;border-radius:14px;overflow:hidden;margin-bottom:12px;user-select:none;-webkit-user-select:none}
.pbn>*{position:absolute;display:flex;align-items:center;font-family:inherit}
.pbn-timer{left:30%;top:25.2%;width:13%;height:11.3%;justify-content:center;font-weight:900;font-size:3.7cqw;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(80,180,255,.8)}
.pbn-code{left:2.9%;top:39.3%;width:37%;height:17.2%;padding:0 1.6cqw 0 2.4cqw;justify-content:space-between;font-weight:900;font-size:3.7cqw;letter-spacing:.08em;color:#fff;text-shadow:0 0 14px rgba(80,180,255,.8)}
.pbn-code b{font-size:2.6cqw;letter-spacing:0;color:#4ade80;text-shadow:0 0 10px rgba(74,222,128,.6)}
.pbn.off .pbn-code span{opacity:.4;text-decoration:line-through}.pbn.off .pbn-code b{color:#f87171}
.pbn button{background:transparent;border:0;cursor:pointer;padding:0;border-radius:2cqw;-webkit-tap-highlight-color:transparent}
.pbn button:active{background:rgba(255,255,255,.18)}
.pbn-copy{left:40.6%;top:39.7%;width:6.4%;height:16.5%}
.pbn-apply{left:5.2%;top:59%;width:27.9%;height:16.6%}
.pbn-note{left:5.2%;top:78.5%;width:50%;font-weight:700;font-size:max(10px,2cqw);color:#cfe8ff;text-shadow:0 1px 6px #000;white-space:nowrap}
/* ===== v4 ===== */
html{scrollbar-gutter:stable}
html,body{max-width:100%;overflow-x:hidden}
.upg-top-row{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr)}
.upg-bot-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.upg-top-row>*,.upg-bot-row>*{min-width:0}
@media(max-width:1100px){.upg-top-row{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){.upg-bot-row{grid-template-columns:minmax(0,1fr)}}
.page-title,.sec-title,.modal-title,.profile-card-title,.top-drop-title{font-family:'Unbounded','Manrope',sans-serif!important;letter-spacing:0!important}
.page-title{font-size:26px;font-weight:800}
.sec-title{font-size:16px;font-weight:700;margin:0 0 14px;text-align:left;display:flex;align-items:center;gap:10px}
.profile-card-title{font-size:13px;font-weight:700}
/* меню */
.topnav{gap:6px!important;align-items:center}
.topnav .nav-item{padding:11px 20px!important;border-radius:12px!important;border:1px solid transparent!important;border-bottom:1px solid transparent!important;font-size:15px!important;font-weight:700;gap:9px!important;margin:10px 0;transition:background .2s,border-color .2s,transform .15s}
.topnav .nav-item .ico{font-size:19px!important}
.topnav .nav-item:hover{background:rgba(88,166,255,.12)!important;transform:translateY(-1px)!important}
.topnav .nav-item.active{background:linear-gradient(135deg,rgba(88,166,255,.30),rgba(34,211,238,.14))!important;border-color:rgba(88,166,255,.55)!important;box-shadow:0 0 18px rgba(88,166,255,.18)}
@media(max-width:1100px){.topnav .nav-item{padding:10px 16px!important;margin:6px 0}}
/* секции кейсов */
.case-category{position:relative;border:1px solid rgba(var(--ccr),.45);border-radius:20px;padding:20px 20px 24px;margin:0 0 22px;background:linear-gradient(180deg,rgba(var(--ccr),.10),rgba(7,12,24,.6) 45%);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 14px 40px rgba(0,0,0,.35),0 0 30px rgba(var(--ccr),.10);overflow:hidden}
.case-category::before{content:'';position:absolute;inset:0;background:radial-gradient(520px 150px at 12% 0,rgba(var(--ccr),.22),transparent 70%),repeating-linear-gradient(135deg,rgba(255,255,255,.015) 0 2px,transparent 2px 14px);pointer-events:none}
.case-category>*{position:relative}
.case-category .sec-title{color:#fff;text-shadow:0 0 18px rgba(var(--ccr),.7)}
.case-category .sec-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(var(--ccr),.6),transparent)}
.cat-newyear{background-image:radial-gradient(circle at 18px 22px,rgba(255,255,255,.35) 1.5px,transparent 2.2px),radial-gradient(circle at 62px 58px,rgba(255,255,255,.22) 1px,transparent 1.6px),linear-gradient(180deg,rgba(var(--ccr),.12),rgba(7,12,24,.6) 45%);background-size:84px 84px,84px 84px,auto}
.fair-note{text-align:center;color:var(--muted);font-size:12px;margin:6px 0 18px}
/* фон: снег */
body::before,body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0}
body::before{background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.6px 1.6px at 90px 40px,rgba(255,255,255,.9),transparent),radial-gradient(2px 2px at 150px 110px,rgba(255,255,255,.8),transparent),radial-gradient(1.4px 1.4px at 60px 150px,#fff,transparent);background-size:190px 190px;opacity:.30;animation:snowA 22s linear infinite}
body::after{background-image:radial-gradient(2.6px 2.6px at 40px 60px,rgba(255,255,255,.9),transparent),radial-gradient(2px 2px at 130px 20px,#fff,transparent),radial-gradient(2.2px 2.2px at 100px 140px,rgba(255,255,255,.8),transparent);background-size:290px 290px;opacity:.22;animation:snowB 34s linear infinite}
@keyframes snowA{to{background-position:60px 380px}}
@keyframes snowB{to{background-position:-90px 580px}}
@media(prefers-reduced-motion:reduce){body::before,body::after{animation:none}}
/* дропы */
.ls-item{border-radius:12px!important;border:1px solid color-mix(in srgb,var(--rc) 40%,transparent)!important;background:radial-gradient(circle at 50% 28%,color-mix(in srgb,var(--rc) 26%,transparent),rgba(10,16,30,.92) 74%)!important;box-shadow:0 0 14px color-mix(in srgb,var(--rc) 16%,transparent),inset 0 1px 0 rgba(255,255,255,.07)}
.ls-item:hover{transform:translateY(-3px) scale(1.03)!important;box-shadow:0 10px 26px color-mix(in srgb,var(--rc) 45%,transparent)}
.ls-item.top{border-color:rgba(255,201,74,.85)!important;background:radial-gradient(circle at 50% 30%,rgba(255,201,74,.32),rgba(10,16,30,.94) 74%)!important;animation:topGlow 2.6s ease-in-out infinite}
@keyframes topGlow{0%,100%{box-shadow:0 0 18px rgba(255,201,74,.25)}50%{box-shadow:0 0 34px rgba(255,201,74,.55)}}
.ls-name{font-weight:800}
.top-drop-banner{margin:0 0 14px;padding:12px 20px;border-radius:16px;border:1px solid rgba(255,201,74,.55);background:linear-gradient(110deg,rgba(255,201,74,.16),rgba(8,14,28,.8) 55%),radial-gradient(400px 120px at 0 50%,rgba(255,201,74,.18),transparent);box-shadow:0 0 28px rgba(255,201,74,.12)}
.top-drop-name{font-size:17px}.top-drop-price{font-size:22px}.top-drop-user{font-size:12px}
.top-drop-note{font-size:11px;color:var(--muted);margin-top:2px}

.wk-box b{display:block;font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}

.pf-section{margin-top:28px}
.promo{display:flex;align-items:center;justify-content:space-between;min-height:260px;padding:28px 40px;border-radius:4px;margin-bottom:12px;background:radial-gradient(600px 260px at 85% 50%,rgba(40,120,200,.45),transparent 70%),linear-gradient(90deg,#070c18,#0a1830 70%,#0b2a4a);border:1px solid var(--line);overflow:hidden}
.promo-tag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#cfe0ff;margin-bottom:10px}

.bc-price{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 0;background:#070b14;border:1px solid rgba(255,255,255,.05);font-weight:800;color:#ffc94a;font-size:15px}
.case-back{color:#9db4d6;font-size:14px;margin-bottom:6px}
.cd-hero{text-align:center;padding:10px 0 0;background:radial-gradient(500px 240px at 50% 40%,rgba(40,100,160,.25),transparent 70%)}
.cd-img{height:280px;display:flex;align-items:center;justify-content:center;font-size:140px}
.cd-img img{max-height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 18px 28px rgba(0,0,0,.8))}
.cd-title{font-size:30px;font-weight:900;color:#fff;margin:4px 0 22px}
.cd-vip{display:flex;justify-content:center;gap:8px;margin-bottom:16px}
.cd-vip button{padding:8px 16px;background:#0b1730;border:1px solid rgba(255,255,255,.1);color:#cfe0ff;border-radius:4px;cursor:pointer;font-weight:700;font-family:inherit}
.cd-vip button.on{background:#2f6fd8;color:#fff}
.cd-controls{display:flex;justify-content:center;align-items:stretch;gap:20px;flex-wrap:wrap;margin-bottom:30px}
.cd-tabs{display:flex;background:#080d1a}
.cd-tabs button{min-width:100px;padding:8px 10px;background:none;border:0;border-bottom:2px solid transparent;color:#8ea3c4;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
.cd-tabs button b{font-size:15px;color:#cfe0ff}
.cd-tabs button span{font-size:12px;display:flex;align-items:center;gap:4px;font-weight:700}
.cd-tabs button.on{border-bottom-color:#58a6ff;color:#fff}
.cd-tabs button.on b{color:#fff}
.cd-open{min-width:290px;font-size:16px;padding:14px 24px}
.cd-fast{width:60px;background:#0b1730;border:1px solid rgba(255,255,255,.08);color:#9db4d6;border-radius:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;font-family:inherit}
.cd-fast span{font-size:10px}
.cd-fast.on{border-color:#58a6ff;color:#fff;box-shadow:0 0 14px rgba(88,166,255,.35)}
.cd-sub{font-size:12px;font-weight:800;letter-spacing:.1em;color:#8ea3c4;margin:6px 0 12px}
.cd-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.cd-card{position:relative;height:200px;display:flex;flex-direction:column;align-items:center;padding:12px 6px 0;border-radius:3px;background:linear-gradient(180deg,#0c1426,color-mix(in srgb,var(--rc) 22%,#0a1020));border:1px solid rgba(255,255,255,.05);overflow:hidden;border-bottom:3px solid var(--rc)}
.cd-ico{height:104px;display:flex;align-items:center;justify-content:center}
.cd-nm{font-size:12px;font-weight:700;color:#e5edf8;margin-top:8px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-pr{margin-top:auto;margin-bottom:10px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:#fff}
.cd-dot{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:2px;background:var(--rc);box-shadow:0 0 8px var(--rc)}
.cd-pct{position:absolute;top:6px;left:7px;font-size:10px;font-weight:800;color:#8ea3c4}
.roulette-wrap{background:transparent!important;border:0!important;border-top:1px solid rgba(88,166,255,.45)!important;border-bottom:1px solid rgba(88,166,255,.45)!important;border-radius:0!important;box-shadow:none!important;max-width:none!important;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.roulette-marker{background:#58a6ff;box-shadow:0 0 14px #58a6ff;width:2px}
.roulette-item{background:rgba(255,255,255,.03);border-radius:4px}
.roulette-item-name{color:#e5edf8}
.ri-price{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;color:#fff}
.multi-opening-stage,.case-drop-card{background:transparent!important;border:0!important;box-shadow:none!important}
.res-btn{min-width:200px;padding:14px 24px;font-size:15px}
.multi-result-actions{gap:14px}
@media(max-width:1500px){.cd-grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media(max-width:1250px){.cd-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}

.stage{padding:4px 0 10px}
.stage-head{text-align:center;font-weight:800;font-size:15px;color:#cfe0ff;margin:4px 0 12px}
.res-bar{display:none;justify-content:center;gap:14px;flex-wrap:wrap;margin:6px 0 4px}
.res-bar.show{display:flex;animation:lsIn .35s var(--ease)}
.ls-top{position:absolute;top:6px;right:6px;z-index:2;font-size:10px;font-weight:800;padding:2px 6px;border-radius:3px;background:linear-gradient(180deg,#ffd35c,#f2a915);color:#2a1b04}
.ls-item.top{border-color:rgba(255,201,74,.6);background:radial-gradient(circle at 50% 30%,rgba(255,201,74,.18),rgba(255,255,255,.02) 70%);box-shadow:0 0 18px rgba(255,201,74,.12)}
.ls-item.first{animation:none;border-color:rgba(255,255,255,.04)}
#lsTip{position:fixed;display:none;z-index:9999;min-width:190px;padding:10px 12px;background:#0b1428;border:1px solid rgba(88,166,255,.4);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.6);pointer-events:none;font-size:12px;color:#cfe0ff}
#lsTip .t-name{font-weight:800;font-size:14px;color:#fff;margin-bottom:6px}
#lsTip .t-row{margin-top:3px}#lsTip b{color:#fff}#lsTip .t-dim{color:#7f93b5}

/* один ряд: логотип | вкладки | баланс */
.topbar{height:80px;gap:12px;border-bottom:1px solid var(--line)}
.brand img{height:58px!important;width:auto}
.topnav{flex:1;min-width:0;justify-content:center;background:none!important;border:0!important;padding:0}
.topnav{justify-content:safe center}
.topnav .nav-item{padding:30px 9px;font-size:13px;gap:6px}
.brand img{height:50px!important}
.login-logo img{object-fit:contain}
.fx-win{position:fixed;inset:0;z-index:9000;pointer-events:none;display:grid;place-items:center;overflow:hidden}
.fx-flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--c) 55%,transparent),transparent 60%);animation:fxFlash 1.6s ease-out forwards}
.fx-ring{position:absolute;width:80px;height:80px;border-radius:50%;border:4px solid var(--c);box-shadow:0 0 40px var(--c);animation:fxRing 1.3s ease-out forwards}
.fx-win i{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);background:var(--c);border-radius:2px;box-shadow:0 0 10px var(--c);animation:fxPart var(--d) cubic-bezier(.1,.7,.3,1) forwards}
.fx-text{position:relative;text-align:center;animation:fxText 2.4s var(--spring) forwards}
.fx-text b{display:block;font-size:84px;font-weight:900;color:#fff;text-shadow:0 0 30px var(--c),0 0 70px var(--c);letter-spacing:-.02em}
.fx-text span{display:block;font-size:20px;font-weight:800;color:var(--c);text-transform:uppercase;letter-spacing:.12em;margin-top:4px}
@keyframes fxFlash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
@keyframes fxRing{from{transform:scale(.3);opacity:1}to{transform:scale(16);opacity:0}}
@keyframes fxPart{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
@keyframes fxText{0%{transform:scale(.3);opacity:0}18%{transform:scale(1.15);opacity:1}30%{transform:scale(1)}80%{opacity:1}100%{transform:scale(1.05);opacity:0}}
@media(max-width:1100px){
  .topbar{height:auto;flex-wrap:wrap;padding:8px 10px}
  .topnav{order:3;flex:0 0 100%;justify-content:flex-start;overflow-x:auto}
  .topnav .nav-item{padding:12px 12px}
  .brand img{height:44px!important}
  .fx-text b{font-size:52px}
}

.upg-jp-legend{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:12px;color:#9db4d6;margin:0 0 8px}
.upg-jp-legend i{width:12px;height:12px;border-radius:3px;background:#ffc94a;box-shadow:0 0 8px #ffc94a;flex-shrink:0}
.upg-jp-legend b{color:#ffc94a}

.cd-fast.on{border-color:#22c55e!important;color:#4ade80!important;background:rgba(34,197,94,.16)!important;box-shadow:0 0 16px rgba(34,197,94,.45)!important}
.btn-ctrl.spd{font-size:16px;min-width:40px}
.btn-ctrl.spd.on{background:rgba(34,197,94,.2)!important;border-color:#22c55e!important;color:#4ade80!important;box-shadow:0 0 14px rgba(34,197,94,.45)}
.upg-jp-arc{animation:jpPulse 1.6s ease-in-out infinite}
@keyframes jpPulse{0%,100%{filter:drop-shadow(0 0 4px #ffc94a)}50%{filter:drop-shadow(0 0 14px #fff2a8)}}
.jp-fx{position:fixed;inset:0;z-index:9500;background:radial-gradient(circle at 50% 50%,rgba(60,40,0,.78),rgba(0,0,0,.9));display:grid;place-items:center;overflow:hidden;cursor:pointer;animation:jpIn .4s ease-out}
.jp-rays{position:absolute;width:160vmax;height:160vmax;left:50%;top:50%;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(from 0deg,rgba(255,201,74,.22) 0 6deg,transparent 6deg 18deg);animation:kzspin 18s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 0,transparent 60%);mask-image:radial-gradient(circle,#000 0,transparent 60%)}
.jp-fx u{position:absolute;top:-60px;font-size:var(--sz);text-decoration:none;animation:jpFall var(--du) linear var(--dl) infinite;filter:drop-shadow(0 0 8px rgba(255,201,74,.8))}
@keyframes jpFall{to{transform:translateY(115vh) rotate(540deg)}}
@keyframes jpIn{from{opacity:0}to{opacity:1}}
.jp-card{position:relative;text-align:center;animation:jpPop .9s var(--spring) both}
@keyframes jpPop{0%{transform:scale(.2) rotate(-8deg);opacity:0}60%{transform:scale(1.12) rotate(2deg);opacity:1}100%{transform:scale(1)}}
.jp-cup{font-size:96px;line-height:1;filter:drop-shadow(0 0 30px #ffc94a)}
.jp-title{font-size:clamp(44px,9vw,110px);font-weight:900;letter-spacing:.04em;line-height:1;background:linear-gradient(100deg,#fff2a8 20%,#ffc94a 40%,#fff 50%,#ffc94a 60%,#b8860b 80%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:jpShine 2s linear infinite;filter:drop-shadow(0 0 26px rgba(255,201,74,.7))}
@keyframes jpShine{to{background-position:-200% 0}}
.jp-x{font-size:clamp(30px,5vw,60px);font-weight:900;color:#fff;text-shadow:0 0 24px #ffc94a;margin-top:2px}
.jp-bonus{margin-top:12px;font-size:clamp(24px,4vw,44px);font-weight:900;color:#ffd35c;text-shadow:0 0 20px rgba(255,201,74,.8)}
.jp-item{display:inline-flex;align-items:center;gap:12px;margin-top:16px;padding:10px 20px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,201,74,.5);font-weight:800;font-size:20px;color:#fff}
.jp-hint{margin-top:18px;font-size:12px;color:rgba(255,255,255,.5)}
body.jp-shake{animation:jpShake .9s}
@keyframes jpShake{0%,100%{transform:none}10%{transform:translate(-8px,4px)}20%{transform:translate(8px,-5px)}30%{transform:translate(-6px,-4px)}40%{transform:translate(6px,5px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}

.jp-sub{font-size:18px;font-weight:800;color:#ffd35c;margin:8px 0 14px;min-height:22px;letter-spacing:.05em}
.jp-reel{position:relative;width:min(900px,92vw);margin:0 auto;overflow:hidden;padding:14px 0;border-top:2px solid rgba(255,201,74,.6);border-bottom:2px solid rgba(255,201,74,.6);background:rgba(0,0,0,.45);-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.jp-mark{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 16px #ffc94a,0 0 30px #ffc94a;z-index:3}
.jp-track{display:flex;gap:10px;width:max-content;padding:0 10px;will-change:transform}
.jp-c{width:130px;flex-shrink:0;padding:8px 6px 10px;text-align:center;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,.04),color-mix(in srgb,var(--c) 30%,transparent));border:1px solid color-mix(in srgb,var(--c) 55%,transparent)}
.jp-ci{height:76px;display:flex;align-items:center;justify-content:center}
.jp-c b{display:block;font-size:26px;font-weight:900;color:var(--c);text-shadow:0 0 14px var(--c)}
.jp-c.hit{transform:scale(1.12);box-shadow:0 0 34px var(--c);border-color:#fff;transition:all .4s var(--spring)}
.jp-res{display:none}.jp-res.show{display:block;animation:jpPop .8s var(--spring) both}
.jp-fx:not(.done){cursor:default}

.pbn-wrap::before{content:'';position:absolute;inset:-30px;background:var(--pbnimg) center/cover;filter:blur(20px) brightness(.62) saturate(1.2);transform:scale(1.15)}
.pbn-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#04070f 0,rgba(4,7,15,.35) 18%,rgba(4,7,15,.05) 50%,rgba(4,7,15,.35) 82%,#04070f 100%),radial-gradient(900px 140px at 50% 100%,rgba(4,7,15,.55),transparent)}
.pbn-wrap .pbn{position:relative;z-index:2;max-width:430px;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.65),0 0 0 1px rgba(120,190,255,.18)}

.topbar{border-radius:18px!important;border:1px solid var(--line)!important;background:linear-gradient(180deg,#0a1122,#060a14)!important}
.bc-card{border-radius:16px!important}.bc-bar{border-radius:0 0 6px 6px!important;height:4px!important}.searchbar{border-radius:14px!important}
.top-drop-banner{position:relative;overflow:hidden;background:linear-gradient(110deg,rgba(255,201,74,.10),#05080f 55%),#05080f!important;border:1px solid rgba(255,201,74,.5)!important;border-radius:18px!important;animation:tdGlow 3.2s ease-in-out infinite}
.top-drop-banner::before{content:'';position:absolute;top:-60%;bottom:-60%;width:90px;left:-160px;background:linear-gradient(90deg,transparent,rgba(255,226,140,.28),transparent);transform:rotate(18deg);animation:tdShine 4.2s ease-in-out infinite;pointer-events:none}
.top-drop-banner::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(2px 2px at 12% 30%,#ffe9a8,transparent),radial-gradient(2px 2px at 38% 72%,#ffd36b,transparent),radial-gradient(1.5px 1.5px at 63% 24%,#fff,transparent),radial-gradient(2px 2px at 82% 66%,#ffd36b,transparent),radial-gradient(1.5px 1.5px at 92% 20%,#fff,transparent);animation:tdSpark 2.6s ease-in-out infinite alternate}
.top-drop-banner .top-drop-content>div:first-child{animation:tdFloat 3s ease-in-out infinite}
.top-drop-title::before{content:'🏆';font-size:14px;animation:tdPop 2s ease-in-out infinite}
.top-drop-price{animation:tdPulse 2.4s ease-in-out infinite}
@keyframes tdGlow{0%,100%{box-shadow:0 0 0 rgba(255,201,74,0),inset 0 0 24px rgba(255,201,74,.04)}50%{box-shadow:0 0 28px rgba(255,201,74,.28),inset 0 0 34px rgba(255,201,74,.10)}}
@keyframes tdShine{0%{left:-160px}55%,100%{left:112%}}
@keyframes tdSpark{from{opacity:.25}to{opacity:1}}
@keyframes tdFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes tdPop{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.25) rotate(-10deg)}}
@keyframes tdPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media(prefers-reduced-motion:reduce){.top-drop-banner,.top-drop-banner::before,.top-drop-banner::after,.top-drop-banner *{animation:none!important}}
.chance-tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:8px;background:rgba(88,166,255,.16);color:#8cc4ff;margin-left:6px;white-space:nowrap}
.chance-tag.low{background:rgba(255,201,74,.16);color:#ffc94a}.chance-tag.rare{background:rgba(255,92,92,.16);color:#ff7b7b}
</style>

function getSaveKey() {
  return state.isDemo ? 'brainrot-demo-state-v2' : 'brainrot-prefs-v2-' + (state.user ? state.user.id : 'anon');
}

function preserveScroll(renderFn) {
  const scrollY = window.scrollY;
  const modal = document.querySelector('.modal');
  const modalScroll = modal ? modal.scrollTop : 0;
  renderFn();
  window.scrollTo(0, scrollY);
  const newModal = document.querySelector('.modal');
  if (newModal) newModal.scrollTop = modalScroll;
}

async function api(path, body, method){
  if(state.isDemo) return demoApi(path, body);
  const opts = {method: method || (body ? 'POST' : 'GET')};
  if(body){ opts.headers = {'Content-Type':'application/json'}; opts.body = JSON.stringify(body); }
  const res = await secureFetch(SERVER_URL + path, opts);
  const data = await res.json().catch(() => ({}));
  if(!res.ok || data.success === false) throw new Error(data.error || ('Ошибка сервера ' + res.status));
  return data;
}
/* ===== демо-режим: локальный эмулятор сервера (результаты случайные, проверка честности недоступна) ===== */
async function demoApi(path, body) {
  body = body || {};
  const money = x => Math.round(x * 100) / 100;
  const ok = extra => Object.assign({ success: true, balance: state.balance, inventory: state.inventory }, extra);
  const isCoin = id => id.indexOf('coin_') === 0;
  const give = itemId => { const e = { uid: uuid(), itemId, date: Date.now() }; state.inventory.push(e); return e; };
  const owned = (uids, allowCoins) => {
    if (!Array.isArray(uids) || !uids.length) throw new Error('Выберите предметы');
    if (new Set(uids).size !== uids.length) throw new Error('Повторяющиеся предметы');
    return uids.map(u => {
      const inv = state.inventory.find(i => i.uid === u); if (!inv) throw new Error('Предмет не найден');
      const it = itemById(inv.itemId); if (!it) throw new Error('Неизвестный предмет');
      if (!allowCoins && isCoin(it.id)) throw new Error('Монеты нельзя использовать');
      return it;
    });
  };
  const drop = uids => { const s = new Set(uids); state.inventory = state.inventory.filter(i => !s.has(i.uid)); };
  const rnd = Math.random;

  if (path === '/api/case/open') {
    const c = CASES.find(x => x.id === body.caseId); if (!c) throw new Error('Кейс не найден');
    const results = [], hist = []; let charged = 0;
    if (c.isAllIn) {
      const bet = Math.floor(state.balance);
      if (bet < F.ALLIN_MIN) throw new Error('ALL IN доступен от ' + F.ALLIN_MIN + ' монет');
      if (bet > F.ALLIN_MAX) throw new Error('ALL IN доступен до ' + F.ALLIN_MAX + ' монет');
      state.balance = money(state.balance - bet); charged = bet;
      const pick = F.pickItemForTarget(PRICE_LIST, bet * F.allInMultiplier(rnd(), rnd()), rnd(), rnd());
      const it = itemById(pick.id), e = give(it.id);
      results.push({ id: it.id, uid: e.uid, date: e.date, price: it.price, rarity: it.rarity });
      hist.push({ type: 'case', caseId: c.id, caseName: c.name, itemId: it.id, uid: e.uid, date: e.date, paid: bet, itemPrice: it.price, rarity: it.rarity });
    } else {
      const count = Math.floor(Number(body.count) || 1);
      if (count < 1 || count > 10) throw new Error('От 1 до 10 кейсов за раз');
      const vip = !!(c.isVip && body.vipMode);
      const unit = c.isVip && vip ? c.vipPrice : c.price;
      const total = money(unit * count);
      if (state.balance < total) throw new Error('Недостаточно монет');
      state.balance = money(state.balance - total); charged = total;
      const pool = c.isVip ? (vip ? c.vipItems : c.normalItems) : c.items;
      for (let k = 0; k < count; k++) {
        const it = itemById(F.pickWeighted(pool, rnd()).id), e = give(it.id);
        results.push({ id: it.id, uid: e.uid, date: e.date, price: it.price, rarity: it.rarity });
        hist.push({ type: 'case', caseId: c.id, caseName: c.name, itemId: it.id, uid: e.uid, date: e.date, paid: unit, itemPrice: it.price, rarity: it.rarity });
      }
    }
    return ok({ results, charged, allIn: !!c.isAllIn, hist });
  }
  if (path === '/api/sell') {
    const items = owned(body.uids, true);
    const total = money(items.reduce((s, i) => s + i.price, 0));
    drop(body.uids); state.balance = money(state.balance + total);
    const now = Date.now();
    return ok({ added: total, hist: items.map(i => ({ type: 'sell', itemId: i.id, price: i.price, date: now })) });
  }
  if (path === '/api/upgrade') {
    const uids = body.uids || [];
    const items = uids.length ? owned(uids) : [];
    const bal = Math.floor(Number(body.balanceAmount) || 0);
    if (bal < 0 || bal > state.balance) throw new Error('Недостаточно монет');
    const target = itemById(body.targetId);

    state.balance = money(state.balance + payout);
    const out = { finished: true, exploded: !won, positions: g.positions.slice(), payout, multiplier: won ? mult : 0,
      hist: [won ? { type: 'mines_win', bet: g.bet, mult, win: payout, date: Date.now() } : { type: 'mines_lose', bet: g.bet, date: Date.now() }] };

function hmacSha256(key,message){
  const blockSize=64;
  const hexToBin=h=>{let o='';for(let i=0;i<h.length;i+=2)o+=String.fromCharCode(parseInt(h.substr(i,2),16));return o;};
  if(key.length>blockSize)key=hexToBin(sha256(key));
  while(key.length<blockSize)key+='\x00';

  for(let i=0;i<blockSize;i++){const c=key.charCodeAt(i);o+=String.fromCharCode(c^0x5c);n+=String.fromCharCode(c^0x36);}
  return sha256(o+hexToBin(sha256(n+message)));

function updateBalance(newVal){
  __balanceTarget = newVal;
  if(__balanceAnimId) return;
  const step = () => {
    const diff = __balanceTarget - __displayedBalance;
    if(Math.abs(diff) < 0.5){
      __displayedBalance = __balanceTarget;
      const el = $('#balanceEl');
      if(el) el.textContent = fmt(Math.round(__displayedBalance));
      __balanceAnimId = null;
      return;
    }
    __displayedBalance += diff * 0.15;
    const el = $('#balanceEl');
    if(el) el.textContent = fmt(Math.round(__displayedBalance));
    __balanceAnimId = requestAnimationFrame(step);
  };
  __balanceAnimId = requestAnimationFrame(step);
}

async function settlePendingCase(){
  const pending=__pendingCase;
  if(!pending||pending.settled)return[];
  pending.settled=true;
  const added=[];
  for(const r of pending.results){
    const it=itemById(r.id);if(!it)continue;
    added.push({uid:r.uid,itemId:it.id,date:r.date||Date.now()});
  }
  __pendingCase=null;
  saveLocalState();

}

async function initTelegramLogin(){
  const tg = window.Telegram?.WebApp;
  
  if (!tg || !tg.initData) {
    enterDemoMode();
    return;
  }
  
  tg.expand();
  
  let attempts = 0;
  const maxAttempts = 10; 
  
  const checkInterval = setInterval(async () => {
    attempts++;
    const initData = tg.initData || '';
    
    if (initData.length > 0) {
      clearInterval(checkInterval);
      document.getElementById('loginLoading').style.display = 'block';
      
      try {
        const response = await fetch(`${SERVER_URL}/api/auth/telegram`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: initData })
        });
        
        if (response.status === 403) { try { const j = await response.clone().json(); if (j && j.banned) { showBan(j.reason); return; } } catch (e) {} }
        if (!response.ok) throw new Error('Сервер отклонил авторизацию');
        
        const data = await response.json();
        
        if (data.success && data.user) {
          sessionToken = data.token;
          onTelegramAuth({
            id: data.user.id,
            first_name: data.user.first_name || '',
            last_name: data.user.last_name || '',
            username: data.user.username || ('user' + data.user.id),
            photo_url: data.user.photo_url || null
          });
        } else {
          showLoginError('Ошибка сервера: неверный ответ.');
        }
      } catch (error) {
        console.error(error);
        showLoginError('Ошибка авторизации. Сервер отклонил запрос или недоступен.');
      }
    } 
    
    if (attempts >= maxAttempts) {
      clearInterval(checkInterval);
      showLoginError('Telegram не передал данные. Убедитесь, что вы настроили Web App URL в @BotFather.');
    }
  }, 500);
}

async function updateLiveDrops() {

let PROMO=null; // {code,percent,end,activeUntil,off}
async function loadPromo(){
  try{
    const r=await fetch(SERVER_URL+'/api/promo',{cache:'no-store'}); if(!r.ok) throw 0;
    const d=await r.json(); PROMO={code:d.code,percent:d.percent,end:d.end,activeUntil:d.activeUntil,off:d.now-Date.now()};
  }catch(e){ if(!PROMO) PROMO=null; }
  promoPaint();
}
function promoLeft(t){return Math.max(0,Math.ceil((t-(Date.now()+PROMO.off))/1000));}
const promoFmt=sec=>String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
function promoActive(){return !!PROMO&&Date.now()+PROMO.off<PROMO.activeUntil;}
function promoPaint(){
  const b=document.getElementById('promoBanner'); if(!b) return;
  const T=document.getElementById('pbnTimer'),C=document.getElementById('pbnCode'),P=document.getElementById('pbnPct'),N=document.getElementById('pbnNote');
  if(!PROMO){T.textContent='--:--';C.textContent='······';P.textContent='';N.textContent='Нет связи с сервером';b.classList.remove('off');return;}
  const act=promoActive();
  b.classList.toggle('off',!act);
  T.textContent=promoFmt(promoLeft(PROMO.end));
  C.textContent=PROMO.code; P.textContent='+'+PROMO.percent+'%';
  N.textContent=act?('Ещё '+promoFmt(promoLeft(PROMO.activeUntil))+' · +'+PROMO.percent+'% к пополнению'):'Код истёк — ждите новый';
}
setInterval(()=>{ if(PROMO&&Date.now()+PROMO.off>=PROMO.end+1500){ PROMO.end=Infinity; loadPromo(); } promoPaint(); },1000);
setInterval(loadPromo,5*60*1000);
function promoCopy(){
  if(!PROMO){toast('Нет связи с сервером','warning');return;}
  const done=()=>toast('Код '+PROMO.code+' скопирован','ok');
  try{navigator.clipboard.writeText(PROMO.code).then(done,()=>{promoCopyOld();});}catch(e){promoCopyOld();}
}
function promoCopyOld(){try{const t=document.createElement('textarea');t.value=PROMO.code;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('Код '+PROMO.code+' скопирован','ok');}catch(e){toast('Код: '+PROMO.code);}}
function promoApply(){
  if(!PROMO){toast('Нет связи с сервером','warning');return;}
  if(!promoActive()){toast('Код истёк — дождитесь нового','warning');return;}
  state.pendingPromo=PROMO.code;
  openDepositModal();
  if(state.deposit&&state.deposit.promo===PROMO.code) toast('Промокод '+PROMO.code+' применён: +'+PROMO.percent+'%','ok');
}
function depPromoCalc(base){
  const d=state.deposit,code=(d.promo||'').trim().toUpperCase();
  if(!code) return {bonus:0,msg:''};
  if(!PROMO) return {bonus:0,msg:'<span style="color:var(--muted)">Проверим код при отправке заявки</span>'};
  if(code!==PROMO.code||!promoActive()) return {bonus:0,msg:'<span style="color:#f87171">Код недействителен или истёк</span>'};
  const bonus=Math.floor(base*PROMO.percent/100);
  return {bonus,msg:'<span style="color:#4ade80">✅ +'+PROMO.percent+'% к пополнению: +'+fmt(bonus)+' монет</span>'};
}
function depBaseTotal(){let t=0;state.deposit.selected.forEach((c,id)=>{const it=itemById(id);if(it)t+=Math.floor(it.price*DEPOSIT_RATE)*c;});return t;}
function updateDepositPromo(val){

function setHistoryFilter(f) {
  state.historyFilter = f;
  preserveScroll(() => render(false));
}

function renderHistory() {
  const filter = state.historyFilter || 'all';
  let list = [...state.history].reverse();
  
  if (filter !== 'all') {
    list = list.filter(h => {
      if (filter === 'deposit') return h.type === 'deposit';
      if (filter === 'withdraw') return h.type === 'sell' || h.type === 'withdraw';
      if (filter === 'case') return h.type === 'case';
      if (filter === 'upgrade') return h.type === 'upgrade_win' || h.type === 'upgrade_lose' || h.type === 'mystery';
      if (filter === 'fuse') return h.type === 'fuse';
      return true;
    });
  }

  const grouped = {};
  list.forEach(h => {
    const d = new Date(h.date).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
    if (!grouped[d]) grouped[d] = { items: [], profit: 0 };
    grouped[d].items.push(h);
    
    // «Результат игр»: только выигрыш минус ставка. Продажи и пополнения — это обмен, не прибыль.
    if (h.type === 'case') {
      const c = CASES.find(x => x.id === h.caseId);
      const paid = Number.isFinite(Number(h.paid)) ? Number(h.paid) : (c ? c.price : 0);
      const itemPrice = Number.isFinite(Number(h.itemPrice)) ? Number(h.itemPrice) : ((itemById(h.itemId) || {}).price || 0);
      grouped[d].profit += itemPrice - paid;
    } else if (h.type === 'upgrade_win') {
      const it = itemById(h.toId);
      if (it) grouped[d].profit += it.price - (h.stake || 0);
    } else if (h.type === 'upgrade_lose') {
      grouped[d].profit -= (h.stake || 0);
    } else if (h.type === 'mystery') {
      grouped[d].profit += (h.itemPrice || 0) + (h.coins || 0) - (h.stake || 0);
    } else if (h.type === 'fuse') {
      const it = itemById(h.itemId);
      if (it) grouped[d].profit += it.price - (h.totalValue || 0);
    } else if (h.type === 'mines_win') {
      grouped[d].profit += (h.win || 0) - (h.bet || 0);
    } else if (h.type === 'mines_lose') {
      grouped[d].profit -= (h.bet || 0);
    }
  });

  const tabs = [
    { id: 'all', label: 'Все' },
    { id: 'case', label: 'Кейсы' },
    { id: 'upgrade', label: 'Апгрейды' },
    { id: 'fuse', label: 'Фьюз' },
    { id: 'deposit', label: 'Пополнения' },
    { id: 'withdraw', label: 'Выводы' }
  ];

  let html = `<div class="page-title">📜 История</div><div class="page-sub">Все твои действия в одном месте</div>`;
  
  html += `<div class="history-tabs">
    ${tabs.map(t => `<div class="history-tab ${filter === t.id ? 'active' : ''}" onclick="setHistoryFilter('${t.id}')">${t.label}</div>`).join('')}
  </div>`;

  if (Object.keys(grouped).length === 0) {
    html += `<div class="empty-state">📭 История пуста</div>`;
  } else {
    for (const [date, data] of Object.entries(grouped)) {
      const profitClass = data.profit >= 0 ? 'pos' : 'neg';
      const profitSign = data.profit > 0 ? '+' : '';
      html += `<div class="history-day-group">
        <div class="history-day-header">
          <div class="history-day-title">${date === new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) ? 'СЕГОДНЯ' : date}</div>
          <div class="history-day-profit ${profitClass}" title="Выигрыш минус ставки; продажи и пополнения не считаются">Результат игр: ${profitSign}${fmt(data.profit)} 🪙</div>
        </div>`;
      
      data.items.forEach(h => {
        let icon = '❓', title = '', sub = '', amountStr = '', amtClass = 'pos';
        
        if (h.type === 'case') {
          const it = itemById(h.itemId);
          const c = CASES.find(x => x.id === h.caseId);
          icon = '📦';
          title = `Открытие кейса «${h.caseName || (c ? c.name : 'Неизвестно')}»`;
          const paid = Number.isFinite(Number(h.paid)) ? Number(h.paid) : (c ? c.price : 0);
          sub = it ? `${it.name} · выплата ${fmt(it.price)} · цена кейса ${fmt(paid)} 🪙 · ${(RARITY[it.rarity]||RARITY.common).label}` : '';
          const net = it ? it.price - paid : 0;
          amountStr = it ? `${net>0?'+':''}${fmt(net)}` : '';
          amtClass = net >= 0 ? 'pos' : 'neg';
        } else if (h.type === 'sell') {
          const it = itemById(h.itemId);
          icon = '💰';
          title = `Продажа предмета`;
          sub = it ? it.name : '';
          amountStr = `+${fmt(h.price)}`;
          amtClass = 'pos';
        } else if (h.type === 'upgrade_win') {
          const toIt = itemById(h.toId);
          icon = '📈';
          title = `Успешный апгрейд`;
          sub = `Выигрыш: ${toIt ? toIt.name : '?'}` + (h.chance>0?` · шанс ${h.chance}%`:'');
          amountStr = toIt ? `+${fmt(toIt.price)}` : '';
          amtClass = 'pos';
        } else if (h.type === 'upgrade_lose') {
          const fromIt = itemById(h.fromId);
          icon = '📉';
          title = `Проваленный апгрейд`;
          sub = `Потерян: ${fromIt ? fromIt.name : '?'}` + (h.chance>0?` · шанс ${h.chance}%`:'');
          amountStr = fromIt ? `-${fmt(fromIt.price)}` : '';
          amtClass = 'neg';
        } else if (h.type === 'mystery') {
          const it = itemById(h.itemId);
          const zn = F.MYSTERY_ZONES.find(z => z.id === h.zoneId);
          icon = '🎲';
          title = `Mystery Upgrade · ${zn ? zn.name : '?'} ×${Number(h.multiplier).toFixed(2)}`;
          sub = `${it ? it.name : 'только монеты'}${h.coins ? ' + ' + fmt(h.coins) + ' 🪙' : ''} · ставка ${fmt(h.stake)}`;
          const net = (h.itemPrice || 0) + (h.coins || 0) - (h.stake || 0);
          amountStr = `${net > 0 ? '+' : ''}${fmt(net)}`;
          amtClass = net >= 0 ? 'pos' : 'neg';
        } else if (h.type === 'fuse') {
          const it = itemById(h.itemId);
          icon = '✨';
          title = `Фьюз предметов`;
          sub = `Получен: ${it ? it.name : '?'}`;
          amountStr = '';
        } else if (h.type === 'withdraw') {
          icon = '📤';
          title = 'Заявка на вывод';
          sub = Array.isArray(h.items) ? h.items.join(', ') : 'Предметы переданы в обработку';
          amountStr = '';
        } else if (h.type === 'deposit') {
          icon = '📥';
          title = `Пополнение баланса`;
          sub = `Зачислено`;
          amountStr = `+${fmt(h.amount)}`;
          amtClass = 'pos';
        } else if (h.type === 'mines_win') {
          icon = '💎';
          title = `Победа в Минах`;
          sub = `Множитель x${h.mult.toFixed(2)}`;
          amountStr = `+${fmt(h.win)}`;
          amtClass = 'pos';
        } else if (h.type === 'mines_lose') {
          icon = '💣';
          title = `Проигрыш в Минах`;
          sub = `Взрыв`;
          amountStr = `-${fmt(h.bet)}`;
          amtClass = 'neg';
        }

        html += `<div class="history-item">
          <div class="history-item-left">
            <div class="history-item-icon">${icon}</div>
            <div class="history-item-info">
              <div class="history-item-title">${esc(title)}</div>
              <div class="history-item-sub">${esc(sub)}</div>
            </div>
          </div>
          ${amountStr ? `<div class="history-item-amount ${amtClass}">${amountStr} 🪙</div>` : ''}
        </div>`;
      });
      html += `</div>`;
    }
  }

  return html;
}

function render(fresh){
  state.tab=normTab(state.tab);
  updateBalance(state.balance);
  renderLiveStrip();
  const el=$('#content');
  if(!el) return;
  el.classList.remove('page-enter');
  if(fresh){void el.offsetWidth;el.classList.add('page-enter');}
  if(!state.openingView)el.dataset.live='';
  if(state.openingView){
    if(el.dataset.live==='1'&&!fresh)return;
    const cc=state.currentCase?CASES.find(x=>x.id===state.currentCase):null;
    el.innerHTML=(cc&&!cc.isAllIn)?renderCaseDetail(cc.id,state.openingView):state.openingView;
    el.dataset.live='1';saveLocalState();return;
  }
  if(state.currentCase){el.innerHTML=renderCaseDetail(state.currentCase);saveLocalState();return;}
  try {
    if(state.tab==='cases')el.innerHTML=renderCases();
    else if(state.tab==='weekly')el.innerHTML=renderWeekly();
    else if(state.tab==='fuse')el.innerHTML=renderFuse();
    else if(state.tab==='upgrade')el.innerHTML=renderUpgrade();
    else if(state.tab==='profile')el.innerHTML=renderProfile();
    else if(state.tab==='admin'){el.innerHTML=isAdmin()?renderAdmin():'<div class="empty-state">Доступ только для админов</div>';if(isAdmin()&&!state.admin.stats&&!state.admin.loading){state.admin.loading=true;adminLoadStats().finally(()=>{state.admin.loading=false;});}}
    saveLocalState();
  } catch(e) {
    console.error('Render error:', e);
    el.innerHTML = `<div style="padding:60px;text-align:center;color:var(--red);">
      <div style="font-size:40px;margin-bottom:20px;">⚠️</div>
      <h2 style="font-size:24px;font-weight:900;margin-bottom:10px;">Ошибка отрисовки</h2>

}

}
