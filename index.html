  if(!code) return {bonus:0,msg:''};
  if(!PROMO) return {bonus:0,msg:'<span style="color:var(--muted)">Проверим код при отправке заявки</span>'};
  if(code!==PROMO.code||!promoActive()) return {bonus:0,msg:'<span style="color:#f87171">Код недействителен или истёк</span>'};
  const bonus=Math.floor(base*PROMO.percent/100);
  return {bonus,msg:'<span style="color:#4ade80">✅ +'+PROMO.percent+'% к пополнению: +'+fmt(bonus)+' монет</span>'};
}
function depBaseTotal(){let t=0;state.deposit.selected.forEach((c,id)=>{const it=itemById(id);if(it)t+=Math.floor(it.price*DEPOSIT_RATE)*c;});return t;}
function updateDepositPromo(val){
  state.deposit.promo=val;
  const base=depBaseTotal(),r=depPromoCalc(base);
  const pv=document.getElementById('depPromoPrev'),tv=document.getElementById('depTotalVal');
  if(pv) pv.innerHTML=r.msg;
  if(tv) tv.innerHTML=coin(20)+' '+fmt(base+r.bonus);
}

async function adminLoadStats(){

async function adminLoadAudit(){

async function adminSearch(){

function adminAfterUser(d){

function adminToggleBan(userId){
  const u=state.admin.user;if(!u)return;
  showConfirm(`Вы уверены, что хотите ${u.banned?'разбанить':'забанить'} пользователя ${userId}?`,async()=>{
    try{
      const d=await api('/api/admin/ban',{userId,banned:!u.banned});
      toast(`Пользователь ${userId} ${d.user.banned?'забанен':'разбанен'}`,'ok');
      adminAfterUser(d);
    }catch(e){toast(esc(e.message),'err');}

async function adminCoins(sign){
  const u=state.admin.user;if(!u)return;
  const inp=document.getElementById('adminCoinsInput');const a=Math.floor(Number(inp.value));
  if(!a||a<=0){toast('Введите сумму','err');return;}
  try{
    const d=await api('/api/admin/coins',{userId:u.id,delta:sign*a});
    toast(`${sign>0?'Выдано':'Списано'} ${fmt(a)} монет`,'ok');
    inp.value='';adminAfterUser(d);
  }catch(e){toast(esc(e.message),'err');}
}

function adminTakeCoins(){return adminCoins(-1);}

function setHistoryFilter(f) {
  state.historyFilter = f;
  preserveScroll(() => render(false));
}

function renderHistory() {
  const filter = state.historyFilter || 'all';
  let list = [...state.history].reverse();
  
  if (filter !== 'all') {
    list = list.filter(h => {
      if (filter === 'deposit') return h.type === 'deposit';
      if (filter === 'withdraw') return h.type === 'sell' || h.type === 'withdraw';
      if (filter === 'case') return h.type === 'case';
      if (filter === 'upgrade') return h.type === 'upgrade_win' || h.type === 'upgrade_lose' || h.type === 'mystery';
      if (filter === 'fuse') return h.type === 'fuse';
      return true;
    });
  }

  const grouped = {};
  list.forEach(h => {
    const d = new Date(h.date).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
    if (!grouped[d]) grouped[d] = { items: [], profit: 0 };
    grouped[d].items.push(h);
    
    // «Результат игр»: только выигрыш минус ставка. Продажи и пополнения — это обмен, не прибыль.
    if (h.type === 'case') {
      const c = CASES.find(x => x.id === h.caseId);
      const paid = Number.isFinite(Number(h.paid)) ? Number(h.paid) : (c ? c.price : 0);
      const itemPrice = Number.isFinite(Number(h.itemPrice)) ? Number(h.itemPrice) : ((itemById(h.itemId) || {}).price || 0);
      grouped[d].profit += itemPrice - paid;
    } else if (h.type === 'upgrade_win') {
      const it = itemById(h.toId);
      if (it) grouped[d].profit += it.price - (h.stake || 0);
    } else if (h.type === 'upgrade_lose') {
      grouped[d].profit -= (h.stake || 0);
    } else if (h.type === 'mystery') {
      grouped[d].profit += (h.itemPrice || 0) + (h.coins || 0) - (h.stake || 0);
    } else if (h.type === 'fuse') {
      const it = itemById(h.itemId);
      if (it) grouped[d].profit += it.price - (h.totalValue || 0);
    } else if (h.type === 'mines_win') {
      grouped[d].profit += (h.win || 0) - (h.bet || 0);
    } else if (h.type === 'mines_lose') {
      grouped[d].profit -= (h.bet || 0);
    }
  });

  const tabs = [
    { id: 'all', label: 'Все' },
    { id: 'case', label: 'Кейсы' },
    { id: 'upgrade', label: 'Апгрейды' },
    { id: 'fuse', label: 'Фьюз' },
    { id: 'deposit', label: 'Пополнения' },
    { id: 'withdraw', label: 'Выводы' }
  ];

  let html = `<div class="page-title">📜 История</div><div class="page-sub">Все твои действия в одном месте</div>`;
  
  html += `<div class="history-tabs">
    ${tabs.map(t => `<div class="history-tab ${filter === t.id ? 'active' : ''}" onclick="setHistoryFilter('${t.id}')">${t.label}</div>`).join('')}
  </div>`;

  if (Object.keys(grouped).length === 0) {
    html += `<div class="empty-state">📭 История пуста</div>`;
  } else {
    for (const [date, data] of Object.entries(grouped)) {
      const profitClass = data.profit >= 0 ? 'pos' : 'neg';
      const profitSign = data.profit > 0 ? '+' : '';
      html += `<div class="history-day-group">
        <div class="history-day-header">
          <div class="history-day-title">${date === new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) ? 'СЕГОДНЯ' : date}</div>
          <div class="history-day-profit ${profitClass}" title="Выигрыш минус ставки; продажи и пополнения не считаются">Результат игр: ${profitSign}${fmt(data.profit)} 🪙</div>
        </div>`;
      
      data.items.forEach(h => {
        let icon = '❓', title = '', sub = '', amountStr = '', amtClass = 'pos';
        
        if (h.type === 'case') {
          const it = itemById(h.itemId);
          const c = CASES.find(x => x.id === h.caseId);
          icon = '📦';
          title = `Открытие кейса «${h.caseName || (c ? c.name : 'Неизвестно')}»`;
          const paid = Number.isFinite(Number(h.paid)) ? Number(h.paid) : (c ? c.price : 0);
          sub = it ? `${it.name} · выплата ${fmt(it.price)} · цена кейса ${fmt(paid)} 🪙 · ${(RARITY[it.rarity]||RARITY.common).label}` : '';
          const net = it ? it.price - paid : 0;
          amountStr = it ? `${net>0?'+':''}${fmt(net)}` : '';
          amtClass = net >= 0 ? 'pos' : 'neg';
        } else if (h.type === 'sell') {
          const it = itemById(h.itemId);
          icon = '💰';
          title = `Продажа предмета`;
          sub = it ? it.name : '';
          amountStr = `+${fmt(h.price)}`;
          amtClass = 'pos';
        } else if (h.type === 'upgrade_win') {
          const toIt = itemById(h.toId);
          icon = '📈';
          title = `Успешный апгрейд`;
          sub = `Выигрыш: ${toIt ? toIt.name : '?'}`;
          amountStr = toIt ? `+${fmt(toIt.price)}` : '';
          amtClass = 'pos';
        } else if (h.type === 'upgrade_lose') {
          const fromIt = itemById(h.fromId);
          icon = '📉';
          title = `Проваленный апгрейд`;
          sub = `Потерян: ${fromIt ? fromIt.name : '?'}`;
          amountStr = fromIt ? `-${fmt(fromIt.price)}` : '';
          amtClass = 'neg';
        } else if (h.type === 'mystery') {
          const it = itemById(h.itemId);
          const zn = F.MYSTERY_ZONES.find(z => z.id === h.zoneId);
          icon = '🎲';
          title = `Mystery Upgrade · ${zn ? zn.name : '?'} ×${Number(h.multiplier).toFixed(2)}`;
          sub = `${it ? it.name : 'только монеты'}${h.coins ? ' + ' + fmt(h.coins) + ' 🪙' : ''} · ставка ${fmt(h.stake)}`;
          const net = (h.itemPrice || 0) + (h.coins || 0) - (h.stake || 0);
          amountStr = `${net > 0 ? '+' : ''}${fmt(net)}`;
          amtClass = net >= 0 ? 'pos' : 'neg';
        } else if (h.type === 'fuse') {
          const it = itemById(h.itemId);
          icon = '✨';
          title = `Фьюз предметов`;
          sub = `Получен: ${it ? it.name : '?'}`;
          amountStr = '';
        } else if (h.type === 'withdraw') {
          icon = '📤';
          title = 'Заявка на вывод';
          sub = Array.isArray(h.items) ? h.items.join(', ') : 'Предметы переданы в обработку';
          amountStr = '';
        } else if (h.type === 'deposit') {
          icon = '📥';
          title = `Пополнение баланса`;
          sub = `Зачислено`;
          amountStr = `+${fmt(h.amount)}`;
          amtClass = 'pos';
        } else if (h.type === 'mines_win') {
          icon = '💎';
          title = `Победа в Минах`;
          sub = `Множитель x${h.mult.toFixed(2)}`;
          amountStr = `+${fmt(h.win)}`;
          amtClass = 'pos';
        } else if (h.type === 'mines_lose') {
          icon = '💣';
          title = `Проигрыш в Минах`;
          sub = `Взрыв`;
          amountStr = `-${fmt(h.bet)}`;
          amtClass = 'neg';
        }

        html += `<div class="history-item">
          <div class="history-item-left">
            <div class="history-item-icon">${icon}</div>
            <div class="history-item-info">
              <div class="history-item-title">${esc(title)}</div>
              <div class="history-item-sub">${esc(sub)}</div>
            </div>
          </div>
          ${amountStr ? `<div class="history-item-amount ${amtClass}">${amountStr} 🪙</div>` : ''}
        </div>`;
      });
      html += `</div>`;
    }
  }

  return html;
}

function render(fresh){
  updateBalance(state.balance);
  renderLiveStrip();
  const el=$('#content');
  if(!el) return;
  el.classList.remove('page-enter');
  if(fresh){void el.offsetWidth;el.classList.add('page-enter');}
  if(!state.openingView)el.dataset.live='';
  if(state.openingView){
    if(el.dataset.live==='1'&&!fresh)return;
    const cc=state.currentCase?CASES.find(x=>x.id===state.currentCase):null;
    el.innerHTML=(cc&&!cc.isAllIn)?renderCaseDetail(cc.id,state.openingView):state.openingView;
    el.dataset.live='1';saveLocalState();return;
  }
  if(state.currentCase){el.innerHTML=renderCaseDetail(state.currentCase);saveLocalState();return;}
  try {
    if(state.tab==='cases')el.innerHTML=renderCases();
    else if(state.tab==='mines')el.innerHTML=renderMines();
    else if(state.tab==='fuse')el.innerHTML=renderFuse();
    else if(state.tab==='upgrade')el.innerHTML=renderUpgrade();
    else if(state.tab==='inventory')el.innerHTML=renderInventory();
    else if(state.tab==='history')el.innerHTML=renderHistory();
    else if(state.tab==='profile')el.innerHTML=renderProfile();
    else if(state.tab==='admin'){el.innerHTML=isAdmin()?renderAdmin():'<div class="empty-state">Доступ только для админов</div>';if(isAdmin()&&!state.admin.stats&&!state.admin.loading){state.admin.loading=true;adminLoadStats().finally(()=>{state.admin.loading=false;});}}
    saveLocalState();
  } catch(e) {
    console.error('Render error:', e);
    el.innerHTML = `<div style="padding:60px;text-align:center;color:var(--red);">
      <div style="font-size:40px;margin-bottom:20px;">⚠️</div>
      <h2 style="font-size:24px;font-weight:900;margin-bottom:10px;">Ошибка отрисовки</h2>
      <p style="color:var(--muted);margin-bottom:20px;">Попробуйте обновить страницу или очистить кэш (F5)</p>
      <button class="btn btn-primary" onclick="localStorage.clear(); location.reload();">Сбросить игру</button>
    </div>`;
  }
}

async function fetchGlobalDrops() {

  try {

    if (res.ok) {
      state.globalDrops = await res.json();
    }
  } catch (e) {
    console.log('Не удалось загрузить дропы', e);
  }
}

function getTopDropOfTheDay(){
  const today = new Date().toDateString();
  let best = null;
  state.globalDrops.forEach(d => {
    if (new Date(d.date).toDateString() === today) {
      if (!best || d.price > best.price) best = d;
    }
  });
  if (best) {
    return { item: itemById(best.itemId) || {name: best.itemName, price: best.price, icon:'🎁'}, user: best.username };
  }
  return null; 
}

}

function leaveStage(){if(__pendingCase&&!__pendingCase.settled)return false;state.openingView=null;return true;}
function setCaseOpens(n){if(!leaveStage())return;state.caseOpens=n;render(false);}


let __openingCase=false;
async function openCaseNow(){
  if(__pendingCase||__openingCase)return;
  const c=CASES.find(x=>x.id===state.currentCase);if(!c)return;
  const count=c.isAllIn?1:state.caseOpens;
  const unitPrice=c.isVip&&state.vipMode?c.vipPrice:c.price;
  const total=c.isAllIn?Math.floor(state.balance):unitPrice*count;
  if(!(total>0)){toast('У вас нет монет для открытия','err');haptic('error');return;}
  if(c.isAllIn&&(total<F.ALLIN_MIN||total>F.ALLIN_MAX)){toast(`ALL IN доступен при балансе от ${fmt(F.ALLIN_MIN)} до ${fmt(F.ALLIN_MAX)}`,'err');return;}
  if(!c.isAllIn&&state.balance<total){toast('Недостаточно монет','err');haptic('error');return;}

  const executeOpen=async()=>{
    if(__openingCase)return;
    __openingCase=true;
    try{
      const data=await api('/api/case/open',{caseId:c.id,count,vipMode:!!state.vipMode});
      applyServerState(data);
      const results=(data.results||[]).filter(r=>itemById(r.id)).map(r=>({id:r.id,uid:r.uid,date:r.date,price:r.price,rarity:r.rarity}));
      if(!results.length)throw new Error('Сервер не вернул результат');
      addHist(data.hist);
      const paid=Number(data.charged)||total;
      __pendingCase={case:c,opens:results.length,results,total:paid,unitPrice:paid/results.length,settled:false};
      saveLocalState();renderHeader();startRoulette(c,results,!!data.allIn);
    }catch(e){
      toast(esc(e.message||'Ошибка открытия кейса'),'err');haptic('error');
      try{await apiSync();}catch(_){}
    }finally{__openingCase=false;}
  };
  if(c.isAllIn){showConfirm(`Вы уверены?\nСтавка: ${fmt(total)} монет.\nСредний возврат ${RTP_ALLIN_PCT}%: чаще вы получите меньше ставки.`,executeOpen);return;}
  await executeOpen();
}
function reelFiller(c,isAllIn,bet){
  if(isAllIn)return F.pickItemForTarget(PRICE_LIST,bet*F.allInMultiplier(Math.random(),Math.random()),Math.random(),Math.random()).id;
  const raw=c.isVip?(state.vipMode?c.vipItems:c.normalItems):c.items;
  return F.pickWeighted(raw,Math.random()).id;
}

function startRoulette(c,results, isAllIn){
  const opens=results.length;
  // каждая крутка уникальна: длина ленты, время, манера остановки и точка внутри предмета
  const fastSpin=state.settings.spinType==='fast';
  const MODES=['smooth'];
  const spinCfg=results.map(()=>{const winIdx=30+Math.floor(Math.random()*10);return{winIdx,len:winIdx+14,time:fastSpin?300:7500+Math.floor(Math.random()*3500),mode:fastSpin?'smooth':MODES[Math.floor(Math.random()*MODES.length)],jitter:(Math.random()-.5)*0.7};});
  
  let html=(isAllIn?`<button class="case-back" onclick="goBackToCase('${c.id}')">← Назад к кейсу</button>`:'')+`<div class="stage"><div class="stage-head">${esc(c.name)}</div><div style="display:flex;flex-direction:column;gap:24px;margin-bottom:18px;">`;
  
  results.forEach((win,idx)=>{
    const ids=[];
    for(let i=0;i<spinCfg[idx].len;i++)ids.push(i===spinCfg[idx].winIdx?win.id:reelFiller(c,isAllIn,__pendingCase?__pendingCase.total:0));
    
    const trackHtml=ids.map(id=>{
      const it=itemById(id);
      
      const iconSize = isAllIn ? 100 : (opens>1 ? 60 : 100);
      const itemStyle = isAllIn 
        ? 'min-width:130px;width:130px;height:130px;padding:10px;gap:8px;' 
        : (opens>1?'min-width:140px;width:140px;height:140px;padding:10px;gap:8px;':'min-width:170px;width:170px;height:210px;padding:10px;gap:6px;');
      
      const nameStyle = isAllIn 
        ? 'font-size:14px;white-space:normal;line-height:1.2;-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;font-weight:900;' 
        : (opens>1?'font-size:14px;white-space:normal;line-height:1.2;-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;':'font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;');
        
      const rarityClass = `rarity-${it?.rarity || 'common'}`;
      const rarityColor = (RARITY[it?.rarity] || RARITY.common).color;
      return `<div class="roulette-item ${rarityClass}" style="${itemStyle}border-color:${rarityColor}66;"><div style="display:flex;align-items:center;justify-content:center;flex:1;width:100%;overflow:hidden;">${itemIcon(it,iconSize)}</div><div class="roulette-item-name" style="${nameStyle}">${esc(it.name)}</div>${opens>1?'':`<div class="ri-price">${coin(14)} ${fmt(it.price)}</div>`}</div>`;
    }).join('');
    
    const wrapHeight = isAllIn ? '250px' : (opens>1?'170px':'250px');
    const wrapBorder = isAllIn ? 'border:3px solid var(--red); box-shadow: inset 0 0 50px rgba(244,63,94,0.3);' : '';
    
    html+=`<div class="roulette-wrap" id="rouletteWrap_${idx}" style="height:${wrapHeight};max-width:${isAllIn?'800px':'1000px'};margin:0 auto;width:100%;${wrapBorder}"><div class="roulette-marker" style="${isAllIn?'background:var(--red);width:4px;box-shadow:0 0 20px var(--red);':''}"></div><div class="roulette-particles" id="rouletteParticles_${idx}"></div><div class="roulette-track" id="track_${idx}" style="padding:${opens>1?'15px':'20px'}">${trackHtml}</div></div>`;
  });
  
  html+=`</div><div id="spinHint"><div style="text-align:center;color:${isAllIn?'var(--red)':'var(--muted)'};font-size:${isAllIn?'24px':'16px'};font-weight:900;margin-bottom:12px">${state.settings.spinType==='fast'?'':'Крутим...'}</div><div style="text-align:center"><button class="btn-dark" onclick="skipCaseAnim()">⏩ Пропустить</button></div></div><div id="resBar" class="res-bar"></div></div>`;
  const stageHtml=html;
  const paidTotal=__pendingCase?__pendingCase.total:0;
  state.openingView=html;
  { const ce=document.getElementById('content'); if(ce) ce.dataset.live=''; }
  render(false);
  
  const animTime = Math.max(...spinCfg.map(x=>x.time));
  const rows=[];
  let finished=false;
  requestAnimationFrame(() => {
    setTimeout(() => {
      results.forEach((win,idx)=>{
        const wrap=document.getElementById(`rouletteWrap_${idx}`);
        const track=document.getElementById(`track_${idx}`);
        if(!wrap||!track)return;
        const items=track.querySelectorAll('.roulette-item');
        const cfg=spinCfg[idx];
        const winEl=items[cfg.winIdx];
        if(!winEl)return;
        const step=items[1].offsetLeft-items[0].offsetLeft;
        const wc=winEl.offsetLeft+winEl.offsetWidth/2+cfg.jitter*winEl.offsetWidth;
        const offset=wrap.offsetWidth/2-wc;
        const T=x=>`translate3d(${x}px,0,0)`;
        const main='cubic-bezier(0.1,0.55,0.08,1)';
        let kf;
        if(cfg.mode==='over'){
          const over=offset-step*(0.55+Math.random()*0.9);
          kf=[{transform:T(0),easing:main},{transform:T(over),offset:0.86,easing:'ease-in-out'},{transform:T(offset)}];
        }else if(cfg.mode==='stall'){
          const short=offset+step*(0.6+Math.random()*0.8);
          kf=[{transform:T(0),easing:main},{transform:T(short),offset:0.87},{transform:T(short),offset:0.93,easing:'ease-in-out'},{transform:T(offset)}];
        }else{
          kf=[{transform:T(0),easing:['cubic-bezier(0.12,0.6,0.06,1)','cubic-bezier(0.08,0.7,0.04,1)','cubic-bezier(0.2,0.5,0.05,1)','cubic-bezier(0.05,0.55,0.1,1)'][Math.floor(Math.random()*4)]},{transform:T(offset)}];
        }
        track.style.willChange='transform';
        const anim=track.animate(kf,{duration:cfg.time,fill:'forwards'});
        anim.onfinish=()=>{track.style.transform=T(offset);winEl.classList.add('landed');};
        rows.push({anim,track,wrap,step});
      });
      // тики на каждом пересечении предмета маркером (быстро в начале, редко в конце)
      if(!fastSpin&&rows.length){
        let last=-1,lastT=0;
        const loop=()=>{
          if(finished||!rows.length)return;
          const r=rows[0];
          const tx=new DOMMatrix(getComputedStyle(r.track).transform).m41;
          const i=Math.floor((r.wrap.offsetWidth/2-tx)/r.step);
          const now=performance.now();
          if(i!==last){last=i;if(now-lastT>45&&!isMuted){sndTick();lastT=now;}}
          __caseRaf=requestAnimationFrame(loop);
        };
        __caseRaf=requestAnimationFrame(loop);
      }
    }, 50);
  });
  
  let done=false;
  const finish=async()=>{ 
    if(done)return;done=true;finished=true;
    if(__caseRaf){cancelAnimationFrame(__caseRaf);__caseRaf=0;}
    rows.forEach(r=>{try{r.anim.finish();}catch(_){}});
    if(__caseTickInt)clearInterval(__caseTickInt);
    __caseTimers.forEach(t=>clearTimeout(t));__caseTimers=[];__caseFinish=null;
    const addedItems = await settlePendingCase(); 
    const itemsWon=addedItems.map(invItem=>itemById(invItem.itemId)).filter(Boolean);
    const totalVal=itemsWon.reduce((s,i)=>s+i.price,0);
    const bestItem = itemsWon.length ? itemsWon.reduce((a,b)=>a.price>b.price?a:b) : null;
    
    if(bestItem && (isAllIn || totalVal>=(c.isVip&&state.vipMode?c.vipPrice:c.price)*opens)) sndWinRarity(bestItem.rarity);
    else sndLose();
    haptic(totalVal >= (c.isVip&&state.vipMode?c.vipPrice:c.price)*opens ? 'success' : 'light');
    if(!addedItems.length){state.openingView=null;render(true);renderHeader();return;}
    let bar;
    if(opens===1){
      const inv1=addedItems[0],it1=itemById(inv1.itemId);
      bar=`<button class="btn-blue res-btn" onclick="sellResult('${inv1.uid}','${c.id}')">Продать за ${coin(18)} ${fmt(it1?it1.price:0)}</button><button class="btn-dark res-btn" onclick="goBackToCase('${c.id}')">Оставить</button>`;
    }else{
      const uidsStr=addedItems.map(i=>i.uid).join(',');
      bar=`<button class="btn-blue res-btn" onclick="sellMultiResult('${uidsStr}','${c.id}')">Продать всё за ${coin(18)} ${fmt(totalVal)}</button><button class="btn-dark res-btn" onclick="goBackToCase('${c.id}')">Оставить</button>`;
    }
    state.openingView=stageHtml.replace(/<div id="spinHint">[\s\S]*?<\/div><\/div><div id="resBar"/,'<div id="resBar"').replace('<div id="resBar" class="res-bar"></div>','<div id="resBar" class="res-bar show">'+bar+'</div>');
    const sh=document.getElementById('spinHint');if(sh)sh.remove();
    const rb=document.getElementById('resBar');
    if(rb){rb.innerHTML=bar;rb.classList.add('show');}
    renderHeader();
    renderLiveStrip(true);updateLiveDrops();
    const unitP=isAllIn?paidTotal:(c.isVip&&state.vipMode?c.vipPrice:c.price);
    if(bestItem&&unitP>0&&bestItem.price>=2*unitP)bigWinFx({color:(RARITY[bestItem.rarity]||RARITY.common).color,title:'×'+(bestItem.price/unitP).toFixed(bestItem.price/unitP>=10?0:1),sub:bestItem.name});
  };
  __caseFinish=finish;
  __caseTimers.push(setTimeout(finish,animTime+400));
}


function goBackToCases(){cancelAnimations();state.currentCase=null;state.openingView=null;render(true);window.scrollTo({top:0,behavior:'smooth'});}

function sellResult(uid,caseId){
  const inv=state.inventory.find(i=>i.uid===uid);if(!inv)return;
  const it=itemById(inv.itemId);if(!it)return;
  
  apiSellItems([{ uid: uid, price: it.price }], (data) => {
      addHist(data.hist);
      sndCash();toast(`Продан ${esc(it.name)} за ${coin(16)} ${fmt(it.price)}`,'ok');
      haptic('success');
      if(caseId==='all_in')goBackToCases();else goBackToCase(caseId);
  });
}

function sellMultiResult(uidsStr,caseId){
  const uids=uidsStr.split(',');
  const toSell=state.inventory.filter(i=>uids.includes(i.uid)).map(inv => {
      const it = itemById(inv.itemId);
      return it ? { uid: inv.uid, price: it.price, itemId: it.id } : null;
  }).filter(Boolean);

  if (toSell.length === 0) return;

  apiSellItems(toSell, (data) => {
      addHist(data.hist);
      sndCash();toast(`Продано за ${coin(16)} ${fmt(data.added)}`,'ok');
      haptic('success');
      goBackToCase(caseId);
  });
}

function calcMM(rv,mn){return F.minesMultiplier(rv,mn);}
function minesApply(g){
  const m=state.mines;
  if(!g){m.active=false;return;}
  m.active=true;m.bet=g.bet;m.mines=g.mines;m.revealed=new Set(g.revealed);m.positions=new Set();
  m.multiplier=g.multiplier;m.nextMultiplier=g.nextMultiplier;m.cashout=g.cashout;m.exploded=false;
}
async function minesLoad(){
  try{
    const d=await api('/api/mines/state');
    applyServerState(d);
    if(d.game)minesApply(d.game);
    if(state.tab==='mines')render(false);
  }catch(e){}
}
function minesEnd(d,exploded,lastIdx){
  const m=state.mines;
  m.active=false;m.exploded=exploded;m.positions=new Set(d.positions||[]);
  if(lastIdx!=null)m.revealed.add(lastIdx);
  m.multiplier=1;m.cashout=0;
  addHist(d.hist);applyServerState(d);saveLocalState();
}
function setMines(n){if(state.mines.active)return;state.mines.mines=n;preserveScroll(() => render(false));}
async function minesStart(){
  const m=state.mines;if(m.busy||m.active)return;
  const bet=Math.floor(+$('#minesBet').value||0);
  if(bet<100){toast('Минимальная ставка 100','err');return;}
  if(bet>state.balance){toast('Мало монет','err');return;}
  m.busy=true;
  try{
    const d=await api('/api/mines/start',{bet,mines:m.mines});
    applyServerState(d);minesApply(d.game);m.positions=new Set();m.exploded=false;
    saveLocalState();render(false);
  }catch(e){toast(esc(e.message),'err');haptic('error');}
  finally{m.busy=false;}
}
async function minesClick(i){
  const m=state.mines;
  if(!m.active||m.busy||m.revealed.has(i))return;
  m.busy=true;
  try{
    const d=await api('/api/mines/reveal',{index:i});
    if(d.finished){
      minesEnd(d,!!d.exploded,i);
      if(d.exploded){toast('💥 Мина!','err');sndLose();haptic('error');}
      else{toast(`Все безопасные клетки открыты! +${fmt(d.payout)}`,'ok');sndCash();haptic('success');}
    }else{
      applyServerState(d);minesApply(d.game);
    }
    saveLocalState();render(false);
  }catch(e){toast(esc(e.message),'err');}
  finally{m.busy=false;}
}
async function minesCashout(){

  m.busy=true;
  try{
    const d=await api('/api/mines/cashout',{});

    render(false);
  }catch(e){toast(esc(e.message),'err');}

}

function upgTV(){return state.upgrade.froms.reduce((s,u)=>{const i=state.inventory.find(x=>x.uid===u);return i?s+itemById(i.itemId).price:s;},0);}

function updateUpgBalance(val){
  if(state.upgrade.animating)return;
  state.upgrade.lastResult = null;
  state.upgrade.balanceAmount=Number(val);
  const totalVal=upgTV()+state.upgrade.balanceAmount;
  const targetItem=state.upgrade.target?itemById(state.upgrade.target):null;
  if(targetItem&&targetItem.price<=totalVal){state.upgrade.target=null;preserveScroll(() => render(false));return;}
  const ch=targetItem?calcUC(totalVal,targetItem.price):0;
  const balText=document.getElementById('upgSliderBalanceText');
  if(balText)balText.innerHTML=`${coin(14)} ${fmt(state.upgrade.balanceAmount)}`;
  const totalText=document.getElementById('upgTotalText');
  if(totalText)totalText.innerHTML=`Итого: ${coin(16)} ${fmt(totalVal)}`;
  if(state.upgrade.mystery){const sl=document.getElementById('upgSlider');if(sl){const pc=state.balance>0?(state.upgrade.balanceAmount/state.balance)*100:0;sl.style.background=`linear-gradient(to right,var(--accent) ${pc}%,#1e293b ${pc}%)`;}const mb=document.getElementById('upgDoBtn');if(mb)mb.disabled=totalVal<F.MYSTERY_MIN_VALUE;return;}
  const pctEl=document.getElementById('upgPctBig');
  if(pctEl)pctEl.textContent=`${ch.toFixed(2)}%`;
  const R=140,C=2*Math.PI*R;
  const winLen=(ch/100)*C;
  const circleEl=document.getElementById('upgDialCircle');
  if(circleEl)circleEl.setAttribute('stroke-dasharray',`${winLen.toFixed(2)} ${C.toFixed(2)}`);
  const jpEl=document.getElementById('upgJackpotArc');

async function mysteryDo(){
  if(state.upgrade.animating||state.upgrade.busy)return;
  const froms=state.upgrade.froms.slice();
  const bal=Math.floor(state.upgrade.balanceAmount||0);
  if(upgTV()+bal<F.MYSTERY_MIN_VALUE){toast('Минимальная ставка '+F.MYSTERY_MIN_VALUE,'err');return;}
  if(!document.getElementById('upgNeedleRotator'))return;
  state.upgrade.busy=true;
  let d;
  try{d=await api('/api/mystery',{uids:froms,balanceAmount:bal});}
  catch(e){state.upgrade.busy=false;toast(esc(e.message||'Ошибка'),'err');haptic('error');return;}
  state.upgrade.busy=false;
  const needleEl=document.getElementById('upgNeedleRotator');if(!needleEl){applyServerState(d);addHist(d.hist);render(false);return;}
  // зона определена сервером; стрелка встаёт ровно в точку броска (дуги зон пропорциональны шансам)
  const finalDeg=d.roll*360;
  let currentAngle=0;
  const matrix=window.getComputedStyle(needleEl).transform;
  if(matrix&&matrix!=='none'){const m=matrix.match(/matrix\(([^)]+)\)/);if(m){const p=m[1].split(',').map(parseFloat);currentAngle=((Math.atan2(p[1],p[0])*(180/Math.PI))%360+360)%360;}}
  let delta=finalDeg-(currentAngle%360);if(delta<0)delta+=360;
  const spins=5+Math.floor(Math.random()*8);
  const totalRotation=currentAngle+spins*360+delta;
  const duration=(state.settings.upgSpin==='fast'?2000:4000)+Math.random()*1500;
  state.upgrade.animating=true;state.upgrade.lastResult=null;state.upgrade.lastAngle=totalRotation;
  state.balance-=bal;__upgTargetRot=totalRotation;renderHeader();
  const payload={mystery:true,totalRotation,data:d};
  const btn=document.getElementById('upgDoBtn');if(btn){btn.disabled=true;btn.textContent='Крутим...';}
  document.querySelectorAll('.upg-item-card').forEach(el=>el.classList.add('disabled'));
  document.querySelectorAll('.btn-ctrl').forEach(el=>el.disabled=true);
  const slider=document.getElementById('upgSlider');if(slider)slider.disabled=true;
  const labelEl=document.getElementById('upgChanceLabel');if(labelEl){labelEl.textContent='Крутим...';labelEl.style.color='#a855f7';}
  if(__upgTickTimer){clearTimeout(__upgTickTimer);__upgTickTimer=null;}
  if(state.settings.upgradeSound&&!isMuted){
    const t0=performance.now();let last=0;
    const tick=()=>{if(!state.upgrade.animating)return;const el=performance.now()-t0;if(el>duration)return;const n=performance.now();
      if(n-last>25){playTone(1100+Math.random()*80,'triangle',0.015,0.025);last=n;}
      __upgTickTimer=setTimeout(tick,35+Math.pow(Math.min(1,el/duration),2)*950);};
    tick();
  }
  requestAnimationFrame(()=>{void needleEl.offsetWidth;needleEl.style.transition='transform '+duration+'ms cubic-bezier(0.15, 0.9, 0.1, 1)';needleEl.style.transform='rotate('+totalRotation+'deg)';});
  // живое табло: зона под маркером меняется во время вращения
  (function liveZone(){
    const pe=document.getElementById('upgPctBig'),le=document.getElementById('upgChanceLabel');
    let lastId=null;
    const zoneAt=deg=>{const f=(((deg%360)+360)%360)/360;let a=0;for(const z of F.MYSTERY_ZONES){if(f<a+z.p)return z;a+=z.p;}return F.MYSTERY_ZONES[F.MYSTERY_ZONES.length-1];};
    const step=()=>{
      if(!state.upgrade.animating)return;
      const mt=window.getComputedStyle(needleEl).transform;
      if(mt&&mt!=='none'){
        const m=mt.match(/matrix\(([^)]+)\)/);
        if(m){const p=m[1].split(',').map(parseFloat);const z=zoneAt(Math.atan2(p[1],p[0])*180/Math.PI);
          if(z.id!==lastId){lastId=z.id;const col=MYSTERY_COLORS[z.id];
            if(pe)pe.innerHTML='<span class="kz-big" style="color:'+col+';font-size:24px;animation:none;">'+esc(z.name)+'</span>';
            if(le){le.textContent='×'+z.lo.toFixed(2)+'–'+z.hi.toFixed(2);le.style.color=col;}}}
      }
      requestAnimationFrame(step);
    };
    step();
  })();
  if(__upgTimer)clearTimeout(__upgTimer);
  __upgTimer=setTimeout(()=>finishUpgradeSpin(payload),duration+100);
  if(__upgSkipTimeout)clearTimeout(__upgSkipTimeout);
  __upgSkipTimeout=setTimeout(()=>{
    if(!state.upgrade.animating||document.getElementById('skipUpgBtn'))return;
    const cp=document.querySelector('.upg-center-panel');
    if(cp){const sb=document.createElement('button');sb.id='skipUpgBtn';sb.className='btn-ctrl';sb.style.marginTop='12px';sb.innerHTML='⏩ Пропустить';sb.onclick=()=>finishUpgradeSpin(payload);cp.appendChild(sb);}
  },100);
  __upgFinish=()=>finishUpgradeSpin(payload);
}
function finishMystery(payload){

function upgMult(m){
  if(state.upgrade.animating)return;

function verifyBet(bet,seed){
  const out={hashOk:sha256(seed)===bet.seedHash,ok:false,lines:[]};
  const prevRtp=F.getRtp(),prevUp=F.getUpgrade();F.setRtp(bet.rtp||0.9); // RTP на момент ставки
  if(bet.game==='upgrade')F.setUpgrade(bet.upRtp!==undefined?bet.upRtp:null,bet.upRtp!==undefined?bet.jpOn:true); // старые ставки: как раньше
  try{
    const r=(c)=>F.roll(seed,bet.clientSeed,bet.nonce,c);
    if(bet.game==='upgrade'){
      const t=itemById(bet.targetId);const UPv=F.upgradeParams(bet.value,t.price);const ch=UPv.chance;const roll=r(0);
      out.lines.push(['Бросок',roll.toFixed(8)],['Шанс',(ch*100).toFixed(4)+'%'],['Результат',roll<ch?'выигрыш':'проигрыш']);
      const isJp=F.isJackpot(roll,ch,UPv.jp);const jm=isJp?F.jackpotMultiplier(r(1)):0;
      out.lines.push(['Джекпот',UPv.jp>0?(isJp?'да, ×'+jm:'нет'):'недоступен (шанс слишком мал)']);
      out.ok=Math.abs(roll-bet.roll)<1e-12&&(roll<ch)===bet.win&&isJp===!!bet.jackpot&&(!isJp||Math.abs(jm-(bet.jpMult||0))<1e-9);
    }else if(bet.game==='case'){
      if(bet.allIn){
        const m=F.allInMultiplier(r(0),r(1),bet.allInRtp||0.9);const p=F.pickItemForTarget(PRICE_LIST,bet.bet*m,r(2),r(3));
        out.lines.push(['Множитель ставки',m.toFixed(4)+'×'],['Предмет',(itemById(p.id)||{}).name]);
        out.ok=p.id===bet.itemId&&Math.abs(m-bet.multiplier)<1e-9;
      }else{
        const c=CASES.find(x=>x.id===bet.caseId);const pool=bet.pool||(c.isVip?(bet.vip?c.vipItems:c.normalItems):c.items); // bet.pool — шансы на момент ставки
        const roll=r(0);const p=F.pickWeighted(pool,roll);
        out.lines.push(['Бросок',roll.toFixed(8)],['Предмет',(itemById(p.id)||{}).name]);
        out.ok=p.id===bet.itemId;
      }
    }else if(bet.game==='mystery'){
      const z=F.mysteryZone(r(0));const m=F.mysteryMultiplier(z,r(1));const tg=Math.round(bet.value*m*100)/100;const p=F.pickItemAtMost(PRICE_LIST,tg);
      out.lines.push(['Зона',z.name],['Множитель',m.toFixed(4)+'×'],['Приз',String(tg)],['Предмет',p?(itemById(p.id)||{}).name:'нет, только монеты']);
      out.ok=z.id===bet.zone&&(p?p.id:null)===bet.itemId;
    }else if(bet.game==='fuse'){
      const m=F.fuseMultiplier(r(0));const p=F.pickItemForTarget(PRICE_LIST,bet.total*m,r(1),r(2));
      out.lines.push(['Множитель',m.toFixed(4)+'×'],['Предмет',(itemById(p.id)||{}).name]);
      out.ok=p.id===bet.itemId;
    }else if(bet.game==='mines'){
      const pos=F.minePositions(seed,bet.clientSeed,bet.nonce,bet.mines);
      out.lines.push(['Мины',pos.join(', ')]);
      out.ok=JSON.stringify(pos)===JSON.stringify(bet.positions);
    }
  }catch(e){out.lines.push(['Ошибка',String(e.message||e)]);}
  finally{F.setRtp(prevRtp);F.setUpgrade(prevUp.upRtp,prevUp.jpOn);}
  return out;
}

  if(b.game==='mines')return '💣 Мины ('+b.mines+')';

async function upgDo(){
  if(state.upgrade.animating || state.upgrade.busy) return;
  const froms = state.upgrade.froms;
  const balToSpend = Math.floor(state.upgrade.balanceAmount || 0);
  if(!froms.length && balToSpend === 0) return;
  const fromItems = froms.map(u => {
    const i = state.inventory.find(x => x.uid === u);
    return i ? itemById(i.itemId) : null;
  }).filter(Boolean);
  const toItem = itemById(state.upgrade.target);
  if(!toItem || (!fromItems.length && balToSpend === 0)) return;
  if(toItem.id.startsWith('coin_') || fromItems.some(i => i.id.startsWith('coin_'))){toast('Монеты нельзя использовать','err');return;}
  if (!document.getElementById('upgNeedleRotator')) return;

  // результат определяет сервер; анимация только показывает уже готовый бросок
  state.upgrade.busy = true;
  let data;
  try{ data = await api('/api/upgrade', {uids: froms, balanceAmount: balToSpend, targetId: toItem.id}); }
  catch(e){ state.upgrade.busy = false; toast(esc(e.message || 'Ошибка апгрейда'), 'err'); haptic('error'); return; }
  state.upgrade.busy = false;
  const needleEl = document.getElementById('upgNeedleRotator');
  if (!needleEl) { render(false); return; }

  const cp = data.chance * 100;
  const roll = data.roll;
  const win = !!data.win;
  // сектор победы занимает [0, cp×3.6°]; стрелка встаёт ровно в точку броска
  const finalDeg = roll * 360;

  let currentAngle = 0;
  const matrix = window.getComputedStyle(needleEl).transform;
  if (matrix && matrix !== 'none') {
    const m = matrix.match(/matrix\(([^)]+)\)/);
    if (m) {
      const parts = m[1].split(',').map(parseFloat);
      currentAngle = Math.atan2(parts[1], parts[0]) * (180/Math.PI);
      currentAngle = ((currentAngle % 360) + 360) % 360;
    }
  }
  const spins = 5 + Math.floor(Math.random()*10);
  let delta = finalDeg - (currentAngle % 360);
  if (delta < 0) delta += 360;
  const totalRotation = currentAngle + spins * 360 + delta;
  const duration = (state.settings.upgSpin === 'fast' ? 2000 : 4000) + Math.random()*2000;
  const chosenEasing = 'cubic-bezier(0.15, 0.9, 0.1, 1)';

  state.upgrade.animating = true;
  state.upgrade.lastResult = null;
  state.upgrade.lastChance = cp;
  state.upgrade.lastJp = data.jp || 0;
  state.upgrade.lastAngle = totalRotation;
  state.balance -= balToSpend;
  __upgTargetRot = totalRotation;
  renderHeader();
  const payload = {win, cp, roll, totalRotation, toItem, data};
  const btn = document.getElementById('upgDoBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = 'Крутим...'; }
  document.querySelectorAll('.upg-item-card').forEach(el => el.classList.add('disabled'));
  document.querySelectorAll('.btn-ctrl').forEach(el => el.disabled = true);
  const slider = document.getElementById('upgSlider');
  if (slider) slider.disabled = true;
  const pctEl = document.getElementById('upgPctBig');
  if (pctEl) pctEl.textContent = `${cp.toFixed(2)}%`;
  const labelEl = document.getElementById('upgChanceLabel');
  if (labelEl) { labelEl.textContent = 'Крутим...'; labelEl.style.color = 'var(--accent)'; }
  
  if (__upgTickTimer) { clearTimeout(__upgTickTimer); __upgTickTimer = null; }
  if (state.settings.upgradeSound && !isMuted) {
    const startTime = performance.now();
    let lastTickAt = 0;
    const playNextTick = () => {
      if (!state.upgrade.animating) return;
      const elapsed = performance.now() - startTime;
      if (elapsed > duration) return;
      const now = performance.now();
      if (now - lastTickAt > 25) {
        playTone(1100 + Math.random()*80, 'triangle', 0.015, 0.025);
        lastTickAt = now;
      }
      const progress = Math.min(1, elapsed / duration);
      const interval = 35 + Math.pow(progress, 2) * 950;
      __upgTickTimer = setTimeout(playNextTick, interval);
    };
    playNextTick();
  }
  requestAnimationFrame(() => {
    void needleEl.offsetWidth;
    needleEl.style.transition = `transform ${duration}ms ${chosenEasing}`;
    needleEl.style.transform = `rotate(${totalRotation}deg)`;
  });
  if (__upgTimer) clearTimeout(__upgTimer);
  __upgTimer = setTimeout(() => {
    finishUpgradeSpin(payload);
  }, duration + 100);
  if (__upgSkipTimeout) clearTimeout(__upgSkipTimeout);
  __upgSkipTimeout = setTimeout(() => {
    if (!state.upgrade.animating) return;
    if (document.getElementById('skipUpgBtn')) return;
    const centerPanel = document.querySelector('.upg-center-panel');
    if (centerPanel) {
      const skipBtn = document.createElement('button');
      skipBtn.id = 'skipUpgBtn';
      skipBtn.className = 'btn-ctrl';
      skipBtn.style.marginTop = '12px';
      skipBtn.innerHTML = '⏩ Пропустить';
      skipBtn.onclick = () => { finishUpgradeSpin(payload); };
      centerPanel.appendChild(skipBtn);
    }
  }, 100);
  __upgFinish = () => finishUpgradeSpin(payload);
}

function getTotalSelectedCount() {
  let total = 0;
  state.deposit.selected.forEach(count => total += count);
  return total;
}

function updateDepositQuantity(id, delta) {
  const current = state.deposit.selected.get(id) || 0;
  const available = 10; 
  
  if (delta > 0) {
    if (getTotalSelectedCount() >= 10) {
      return toast('Максимум 10 предметов за раз', 'err');
    }
    if (current >= available) {
      return toast('Максимум 10 таких предметов', 'err');
    }
  }
  
  const newCount = current + delta;
  if (newCount <= 0) {
    state.deposit.selected.delete(id);
  } else {
    state.deposit.selected.set(id, newCount);
  }
  preserveScroll(() => renderDepositModal());
}

async function submitDeposit() {
  const d = state.deposit;
  const btn = document.getElementById('depSubmitBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'СОЗДАНИЕ...'; }

  let totalAmount = 0;
  const itemsPayload = [];
  
  d.selected.forEach((count, id) => {
    const item = itemById(id);
    if (item) {
      const finalPrice = Math.floor(item.price * DEPOSIT_RATE);
      totalAmount += finalPrice * count;
      itemsPayload.push({ itemId: id, name: item.name, price: finalPrice, count: count });
    }
  });

  try {
    const response = await secureFetch(`${SERVER_URL}/api/deposit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        tgId: state.user.id,
        username: state.user.username,
        robloxName: d.robloxUsername,
        items: itemsPayload,
        promo: (d.promo||'').trim(),
        totalAmount: totalAmount
      })
    });

    if (!response.ok) {
        const errData = await response.json().catch(() => ({}));
        throw new Error(errData.error || 'Сервер вернул ошибку ' + response.status);
    }
    
    const data = await response.json();

    if (state.user) state.user.robloxName = d.robloxUsername;

    d.step = 3;
    renderDepositModal();
    startDepositTimer();
    startStatusPolling(data.requestId, data.totalAmount||totalAmount); 
    
    haptic('success');

  } catch (error) {
    console.error(error);
    toast(`Ошибка: ${error.message}`, 'err');
    haptic('error');
    if (btn) { btn.disabled = false; btn.textContent = 'СОЗДАТЬ ЗАЯВКУ'; }
  }
}

function startStatusPolling(requestId, finalAmount) {
  if (__depositPollingInterval) clearInterval(__depositPollingInterval);
  
  __depositPollingInterval = setInterval(async () => {
    try {
      const res = await secureFetch(`${SERVER_URL}/api/deposit-status/${requestId}`);
      const data = await res.json();

      if (data.status === 'approved') {
        clearInterval(__depositPollingInterval);
        if (__depositTimerInt) clearInterval(__depositTimerInt);
        
        if (Number.isFinite(Number(data.balance))) state.balance = Number(data.balance);
        else await apiSync();
        await apiSync();
        saveLocalState(); renderHeader();
        
        sndCash(); haptic('success');
        $('#modal').innerHTML = `
          <div style="text-align:center; padding:40px 20px;">
            <div style="font-size:80px; margin-bottom:20px;">✅</div>
            <h2 style="font-size:28px; font-weight:900; color:#fff; margin-bottom:10px;">Депозит подтвержден!</h2>
            <p style="color:var(--muted); margin-bottom:24px;">Вам начислено ${fmt(finalAmount)} монет.</p>
            <button class="btn btn-primary" style="width:100%;" onclick="closeModal()">Отлично</button>
          </div>
        `;
      } 
      else if (data.status === 'rejected') {
        clearInterval(__depositPollingInterval);
        if (__depositTimerInt) clearInterval(__depositTimerInt);
        
        haptic('error'); sndLose();
        $('#modal').innerHTML = `
          <div style="text-align:center; padding:40px 20px;">
            <div style="font-size:80px; margin-bottom:20px;">❌</div>
            <h2 style="font-size:28px; font-weight:900; color:#fff; margin-bottom:10px;">Заявка отклонена</h2>
            <p style="color:var(--muted); margin-bottom:24px;">Администратор отклонил ваш депозит.</p>
            <button class="btn btn-ghost" style="width:100%;" onclick="closeModal()">Закрыть</button>
          </div>
        `;
      }
    } catch (e) { console.log('Ожидание ответа...'); }
  }, 2000);
}

function startDepositTimer() {
  if (__depositTimerInt) clearInterval(__depositTimerInt);
  const update = () => {
    const el = document.getElementById('depTimer');
    if (!el) return;
    const m = Math.floor(state.deposit.timerLeft / 60);
    const s = state.deposit.timerLeft % 60;
    el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    
    if (state.deposit.timerLeft <= 0) {
      clearInterval(__depositTimerInt);
      el.textContent = '00:00';
      if(__depositPollingInterval) clearInterval(__depositPollingInterval);
      toast('Время на отправку трейда истекло', 'err');
      closeModal();
      return;
    }
    state.deposit.timerLeft--;
  };
  update();
  __depositTimerInt = setInterval(update, 1000);
}

                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tgId: state.user.id,
                        username: state.user.username,
                        robloxName: robloxName,
                        robloxId: state.user?.robloxId || 'Не указан',
                        items: [{ uid: invItem.uid, name: item.name, price: item.price }]
                    })
                });

                if (!response.ok) throw new Error('Ошибка сервера');

                state.inventory = state.inventory.filter(i => i.uid !== uid);
                await apiSync();
                saveLocalState();
                preserveScroll(() => render(false));
                toast(`Заявка на вывод ${item.name} создана! Ожидайте выдачи в игре.`, 'ok');
                haptic('success');

            } catch (error) {
                console.error(error);
                toast('Ошибка связи с сервером. Проверьте заявку в Discord.', 'err');
            }
        });
    });
}

</script>
