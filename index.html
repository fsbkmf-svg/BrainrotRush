<title>Brainrot Rush</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Montserrat',sans-serif!important;-webkit-tap-highlight-color:transparent}
:root{--bg:#070a12;--surface:#111827;--text:#f8fafc;--muted:#94a3b8;--accent:#38bdf8;--gold:#fbbf24;--green:#34d399;--red:#f87171;--border:rgba(56,189,248,.2)}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;background-image:radial-gradient(circle at 50% 0%,rgba(56,189,248,.15) 0%,transparent 50%)}
input,button{font-family:inherit!important}
#loginScreen{position:fixed;inset:0;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#loginScreen.show{display:flex}
.login-card{background:rgba(15,23,42,.85);border:1px solid var(--border);border-radius:28px;padding:40px 30px;max-width:400px;width:100%;box-shadow:0 25px 80px rgba(0,0,0,.55);backdrop-filter:blur(10px)}
.login-logo{width:100px;height:100px;background:linear-gradient(135deg,#0ea5e9,#06b6d4);border-radius:28px;margin:0 auto 20px;display:grid;place-items:center;font-size:50px;box-shadow:0 0 50px rgba(14,165,233,.45)}
.login-title{font-size:32px;font-weight:900;margin-bottom:8px;background:linear-gradient(90deg,#fff,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.spinner{width:30px;height:30px;border:3px solid rgba(56,189,248,.3);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.app{display:none;min-height:100vh}
.app.logged-in{display:flex}
.sidebar{width:260px;background:rgba(10,14,23,.5);border-right:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30}
.logo{height:80px;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid rgba(255,255,255,.05)}
.logo-text{font-weight:900;font-size:20px;color:#fff}
.nav{flex:1;overflow-y:auto;padding:20px 16px}
.nav-section-title{font-size:11px;font-weight:800;text-transform:uppercase;color:#64748b;margin-bottom:12px;padding-left:12px}
.nav-item{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;font-size:15px;font-weight:600;color:#cbd5e1;cursor:pointer;transition:all .3s;margin-bottom:4px}
.nav-item:hover,.nav-item.active{color:#fff;background:rgba(255,255,255,.08)}
.nav-item.active{box-shadow:inset 2px 0 0 var(--accent)}
.sidebar-profile{padding:20px;border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:14px;cursor:pointer}
.profile-avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:18px;font-weight:800;overflow:hidden;color:#000}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.main{flex:1;display:flex;flex-direction:column}
.header{height:72px;position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;padding:0 32px;background:rgba(10,14,23,.8);border-bottom:1px solid rgba(255,255,255,.05);backdrop-filter:blur(20px)}
.balance{display:flex;align-items:center;gap:12px;padding:10px 20px;border-radius:16px;background:rgba(0,0,0,.5);border:1px solid rgba(251,191,36,.2);font-weight:800;font-size:18px;color:#fff;margin-left:auto}
.btn{border:none;cursor:pointer;font-weight:700;font-size:14px;padding:10px 20px;border-radius:14px;transition:all .3s;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:linear-gradient(135deg,#0ea5e9,#0284c7)}
.btn-accent{background:linear-gradient(135deg,#22d3ee,#06b6d4);color:#042f2e}
.btn-ghost{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.btn-danger{background:linear-gradient(135deg,#f43f5e,#e11d48)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.content{flex:1;padding:32px;max-width:1600px;width:100%;margin:0 auto}
.page-title{font-size:32px;font-weight:900;margin-bottom:8px;color:#fff}
.page-sub{color:var(--muted);font-size:15px;margin-bottom:32px}
.hero{background:linear-gradient(135deg,rgba(56,189,248,.15),rgba(14,165,233,.05));border:1px solid var(--border);border-radius:28px;padding:48px;margin-bottom:32px;position:relative;overflow:hidden}
.hero h1{font-size:42px;font-weight:900;margin-bottom:12px;color:#fff;line-height:1.15;max-width:700px}
.hero p{color:#cbd5e1;font-size:16px;max-width:500px;margin-bottom:24px}
.cases-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
.case-card{background:linear-gradient(180deg,rgba(30,41,59,.7),rgba(15,23,42,.9));border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:28px;cursor:pointer;transition:all .4s;display:flex;flex-direction:column}
.case-card:hover{transform:translateY(-8px);border-color:var(--accent)}
.case-img{height:200px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(56,189,248,.1),transparent 70%);border-radius:20px;margin-bottom:24px;font-size:80px}
.case-img img{width:100%;height:100%;object-fit:contain}
.case-name{font-size:20px;font-weight:800;margin-bottom:24px;text-align:center;color:#fff}
.case-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:20px;border-top:1px solid rgba(255,255,255,.05)}
.case-price{font-size:18px;font-weight:900;color:var(--gold)}
.top-drop-banner{background:linear-gradient(135deg,rgba(251,191,36,.1),rgba(0,0,0,.4));border:1px solid rgba(251,191,36,.3);border-radius:24px;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;cursor:pointer}
.top-drop-title{font-size:12px;font-weight:800;color:var(--gold);margin-bottom:6px}
.top-drop-name{font-size:22px;font-weight:900;color:#fff}
.top-drop-price{font-size:28px;font-weight:900;color:var(--gold)}
.live-bar{background:rgba(15,23,42,.6);border:1px solid rgba(255,255,255,.05);border-radius:20px;padding:16px 20px;margin-bottom:32px;display:flex;align-items:center;gap:20px;overflow:hidden}
.live-list{display:flex;gap:16px;overflow-x:auto}
.live-item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);padding:8px 16px;border-radius:14px}
.li-name{font-size:13px;font-weight:700;color:#fff}
.li-user{font-size:11px;color:var(--muted)}
.case-detail{display:grid;grid-template-columns:380px 1fr;gap:40px}
.case-detail-img{background:radial-gradient(circle,#0f172a,rgba(56,189,248,.1));border:1px solid var(--border);border-radius:32px;height:340px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;font-size:140px}
.roulette-wrap{position:relative;overflow:hidden;background:#0a0e17;border:3px solid var(--border);border-radius:20px;height:250px}
.roulette-marker{position:absolute;top:0;bottom:0;left:50%;width:4px;background:var(--red);transform:translateX(-50%);z-index:10}
.roulette-track{display:flex;align-items:center;gap:12px;height:100%;padding:20px;will-change:transform}
.roulette-item{display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(56,189,248,.05);border:1px solid var(--border);border-radius:16px;flex-shrink:0}
.all-in-multiplier{font-size:120px;font-weight:900;color:#fff;text-align:center;text-shadow:0 0 50px rgba(244,63,94,.8)}
.all-in-stage-new{background:radial-gradient(circle,rgba(244,63,94,.15) 0%,#000 80%);border-radius:24px;min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid rgba(244,63,94,.4)}
.modal{background:var(--surface);border:1px solid rgba(255,255,255,.1);border-radius:28px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;padding:32px;position:relative}
.overlay{position:fixed;inset:0;z-index:200;background:rgba(5,6,12,.85);display:none;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.toast{display:none;position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.95);border:1px solid var(--border);color:#fff;padding:16px 28px;border-radius:16px;font-weight:700;z-index:99999}
.toast.show{display:block}
@media(max-width:1024px){
  .sidebar{display:none}
  .mobile-nav{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:100;gap:6px;padding:8px;background:rgba(10,14,23,.95);border-radius:22px;overflow-x:auto}
  .mobile-nav .nav-item{flex-direction:column;padding:10px;font-size:10px}
  .content{padding:20px 16px 120px}
  .header{padding:0 16px;height:64px}
  .case-detail{grid-template-columns:1fr}
  .all-in-multiplier{font-size:80px}
  .hero h1{font-size:32px}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo"><img src="logo-badge.png" style="width:80px" onerror="this.parentElement.textContent='🧠'"></div>
    <div class="login-title">Brainrot Rush</div>
    <div class="login-sub">Загрузка...</div>
    <div id="loginLoading" style="display:block;"><div class="spinner"></div></div>
    <div id="tgErrorBox" style="display:none; background:rgba(248,113,113,0.1); border:1px solid var(--red); border-radius:16px; padding:20px; margin-top:16px; text-align:left;">

      <div id="tgErrorMessage" style="color:#cbd5e1; font-size:14px;"></div>
      <button class="btn btn-primary" style="margin-top:16px; width:100%;" onclick="location.reload()">Повторить</button>
    </div>
  </div>
</div>

<div class="app" id="app">
  <aside class="sidebar">
    <div class="logo">
      <img src="logo-badge.png" style="width:44px" onerror="this.style.display='none'">

    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-profile" onclick="setTab('profile')">
      <div class="profile-avatar" id="profileAvatar">?</div>
      <div class="profile-info">
        <div class="profile-name" id="profileName">Гость</div>
        <div class="profile-status">Онлайн</div>
      </div>
    </div>
  </aside>
  <div class="main">
    <header class="header">
      <button class="btn btn-ghost" onclick="toggleSound()" style="padding:10px;font-size:18px;">🔊</button>
      <div class="balance"><span id="balanceEl">0</span> <span style="font-size:16px;">🪙</span></div>
      <button class="btn btn-primary" onclick="openDepositModal()">+ Пополнить</button>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

    items:[{id:'garama',c:50},{id:'jolly',c:50},{id:'cerberus',c:50},{id:'celestial',c:50},{id:'reinito',c:50},{id:'los_admins',c:50},{id:'guest666',c:50},{id:'los_amigos',c:50},{id:'los_chillis',c:50},{id:'fortunu',c:50},{id:'rubrikiko',c:50},{id:'los_sekolahs',c:50},{id:'rico',c:50},{id:'la_breakfast',c:50},{id:'examen',c:50},{id:'foxini',c:50},{id:'los_hackers',c:50},{id:'rosy',c:50},{id:'dugdug',c:20},{id:'venuspino',c:20},{id:'duggy',c:20},{id:'lacasaboo',c:20},{id:'ketupat',c:20},{id:'bumbatron',c:20},{id:'los_secret',c:20},{id:'bunny_eggy',c:15},{id:'grabatron',c:20},{id:'sammyni_cak',c:20},{id:'dragonc',c:20},{id:'tirilikalika',c:20},{id:'jelly_moby',c:15}]},
  {id:'gold',name:'Золотой кейс',icon:'👑',img:'cases/gold.png',desc:'Эпические дропы',price:2000,badge:{text:'HOT'},
    items:[{id:'bumbatron',c:1000},{id:'los_secret',c:1000},{id:'bunny_eggy',c:1000},{id:'grabatron',c:1000},{id:'sammyni_cak',c:1000},{id:'dragonc',c:1000},{id:'tirilikalika',c:1000},{id:'jelly_moby',c:400},{id:'pancake',c:400},{id:'ginger',c:400},{id:'hydra',c:400},{id:'hydra_bunny',c:400},{id:'moby_bros',c:400},{id:'kalika',c:400},{id:'digi_narwhal',c:100},{id:'lasupreme',c:100},{id:'fishino',c:100},{id:'kraken',c:100},{id:'dragon_aquanini',c:100},{id:'griffin',c:20},{id:'los_dragons',c:20},{id:'antonio',c:20},{id:'lovebear',c:20},{id:'arcadragon',c:20},{id:'elefanto',c:20},{id:'skibidi',c:2}]},
  {id:'diamond',name:'Алмазный кейс',icon:'💎',img:'cases/diamond.png',desc:'Только лучшие дропы',price:8000,
    items:[{id:'dragon_aquanini',c:50},{id:'antonio',c:50},{id:'lovebear',c:100},{id:'arcadragon',c:100},{id:'elefanto',c:100},{id:'skibidi',c:20},{id:'johnpork',c:10},{id:'meowl',c:10},{id:'signore',c:5},{id:'strawb',c:2},{id:'headless',c:0.5}]},
  {id:'all_in',name:'ВСЁ ИЛИ НИЧЕГО',icon:'🎰',img:'cases/allin.png',desc:'Ставка всем балансом',price:0,badge:{text:'ALL IN'},isAllIn:true,description:'Забирает ВЕСЬ ваш баланс.'}
];

const state={balance:0,tab:'cases',inventory:[],history:[],currentCase:null,caseOpens:1,openingView:null,user:null,globalDrops:[]};
const $=s=>document.querySelector(s);
const itemById=id=>ITEMS.find(i=>i.id===id);
const fmt=n=>Math.round(n).toLocaleString('ru-RU');

function itemIcon(it,size=48){
  if(!it)return '';
  if(it.img)return`<img src="${it.img}" style="width:${size}px;height:${size}px;object-fit:contain;display:block;margin:0 auto" onerror="this.outerHTML='<span style=\\'font-size:${size}px;line-height:1\\'>${it.icon}</span>'">`;
  return`<span style="font-size:${size}px;line-height:1">${it.icon}</span>`;
}

function loadSavedState(){
  try{
    const raw=localStorage.getItem('brainrot-state');if(!raw)return false;
    const s=JSON.parse(raw);
    if(s.user) { state.user = s.user; state.balance = Number(s.balance)||0; state.inventory = s.inventory||[]; }
    return true;
  }catch(e){return false;}
}
function saveState(){
  try{ localStorage.setItem('brainrot-state',JSON.stringify({user:state.user, balance:state.balance, inventory:state.inventory})); }catch(e){}
}

function updateBalance(newVal){
  const el = $('#balanceEl');
  if(el) el.textContent = fmt(Math.round(newVal));
}

function initTelegramLogin(){
  const tg = window.Telegram?.WebApp;
  
  // ЖЕЛЕЗОБЕТОННЫЙ ВХОД (Даже если сервер мертв)
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
    onTelegramAuth({
      id: tg.initDataUnsafe.user.id,
      first_name: tg.initDataUnsafe.user.first_name || '',
      username: tg.initDataUnsafe.user.username || ('user' + tg.initDataUnsafe.user.id),
      photo_url: tg.initDataUnsafe.user.photo_url || null
    });
    return;
  }
  
  // Если мы не в телеге
  document.getElementById('loginLoading').style.display = 'none';
  document.getElementById('tgErrorBox').style.display = 'block';
  document.getElementById('tgErrorMessage').innerText = 'Откройте игру через Telegram-бота (Mini App).';
}

function onTelegramAuth(user){
  state.user = {
    id: user.id,
    name: user.first_name || 'Игрок',
    username: user.username || '',
    avatar: user.photo_url || null
  };
  
  if(state.balance === 0 && state.inventory.length === 0) state.balance = 5000; // Стартовый бонус для теста
  
  document.getElementById('loginScreen').classList.remove('show');
  document.getElementById('app').classList.add('logged-in');
  
  const nameEl=document.getElementById('profileName');
  const avatarEl=document.getElementById('profileAvatar');
  
  if(nameEl) nameEl.textContent = state.user.name;
  if(avatarEl) {
    if(state.user.avatar) avatarEl.innerHTML = `<img src="${state.user.avatar}">`;
    else avatarEl.textContent = state.user.name[0].toUpperCase();
  }
  
  updateBalance(state.balance);
  renderNav();
  render(true);
  saveState();
}

function renderNav(){
  const groups=[
    {s:'Игры',items:[{id:'cases',l:'Кейсы',i:'📦'},{id:'mines',l:'Мины',i:'💣'}]},
    {s:'Прогресс',items:[{id:'inventory',l:'Инвентарь',i:'🎒'},{id:'profile',l:'Профиль',i:'👤'}]}
  ];
  const navEl = $('#nav');
  if(navEl) navEl.innerHTML = groups.map(g=>`<div><div class="nav-section-title">${g.s}</div>${g.items.map(it=>`<div class="nav-item ${state.tab===it.id?'active':''}" onclick="setTab('${it.id}')"><span>${it.i}</span><span>${it.l}</span></div>`).join('')}</div>`).join('');
  
  const mobile=$('#mobileNav');
  if(mobile) mobile.innerHTML = groups.flatMap(g=>g.items).map(it=>`<div class="nav-item ${state.tab===it.id?'active':''}" onclick="setTab('${it.id}')"><span style="font-size:20px">${it.i}</span><span>${it.l}</span></div>`).join('');
}

function setTab(t){
  state.tab=t; state.currentCase=null; state.openingView=null;
  renderNav(); render(true);
}

function render(fresh){
  updateBalance(state.balance);
  const el=$('#content');
  if(!el) return;
  
  if(state.openingView){el.innerHTML=state.openingView;return;}
  if(state.currentCase){el.innerHTML=renderCaseDetail(state.currentCase);return;}
  
  if(state.tab==='cases') el.innerHTML=renderCases();
  else if(state.tab==='inventory') el.innerHTML=renderInventory();
  else if(state.tab==='profile') el.innerHTML=renderProfile();
  else if(state.tab==='mines') el.innerHTML='<div class="empty-state">В разработке...</div>';
}

function renderCases(){
  const live = state.globalDrops.map(d=>`<div class="live-item">${itemIcon(itemById(d.itemId),30)}<div><div class="li-name">${d.itemName}</div><div class="li-user">${d.username}</div></div></div>`).join('') || '<div style="color:var(--muted);font-size:14px;">Пока нет дропов</div>';
  
  const cards = CASES.map(c=>{
    const priceStr = c.isAllIn ? `Баланс: ${fmt(state.balance)}` : `${fmt(c.price)} 🪙`;
    const imgHtml = c.img ? `<img src="${c.img}" onerror="this.style.display='none';this.parentElement.textContent='${c.icon}'">` : `<span>${c.icon}</span>`;
    return `<div class="case-card" onclick="openCase('${c.id}')"><div class="case-img">${imgHtml}</div><div class="case-name">${c.name}</div><div class="case-footer"><div class="case-price">${priceStr}</div><button class="btn btn-primary">Открыть</button></div></div>`;
  }).join('');

  return `<div class="hero"><h1>Открывай кейсы. Собирай брейнротов.</h1><button class="btn btn-danger" onclick="openCase('all_in')">ALL IN 🎰</button></div>
  <div class="live-bar"><div style="font-weight:900;color:var(--red)">🔴 LIVE</div><div class="live-list">${live}</div></div>
  <div class="page-title">Кейсы</div><div class="cases-grid">${cards}</div>`;
}

function renderCaseDetail(id){
  const c=CASES.find(x=>x.id===id);
  const imgHtml = c.img ? `<img src="${c.img}" onerror="this.style.display='none';this.parentElement.textContent='${c.icon}'">` : `<span>${c.icon}</span>`;
  return `<button class="btn btn-ghost" onclick="state.currentCase=null;render()">← Назад</button>
  <div class="case-detail">
    <div><div class="case-detail-img">${imgHtml}</div></div>
    <div>
      <div class="page-title">${c.name}</div><div class="page-sub">${c.desc}</div>
      <button class="btn btn-primary" style="width:100%;padding:20px;font-size:20px;" onclick="openCaseNow()">ОТКРЫТЬ ЗА ${c.isAllIn ? 'ВСЁ' : fmt(c.price)+' 🪙'}</button>
    </div>
  </div>`;
}

function openCase(id){ state.currentCase=id; render(); }

function openCaseNow(){
  const c=CASES.find(x=>x.id===state.currentCase);
  if(c.isAllIn){
    if(state.balance<=0) return alert('Нет монет!');
    state.balance=0; updateBalance(0);
    startAllInSequence(); return;
  }
  if(state.balance < c.price) return alert('Недостаточно монет!');
  
  state.balance -= c.price; updateBalance(state.balance);
  
  // Выбор предмета
  const pool = c.items;
  const total = pool.reduce((s,i)=>s+i.c,0);
  let r = Math.random()*total;
  let res = pool[pool.length-1];
  for(const it of pool){ r-=it.c; if(r<=0){res=it;break;} }
  
  const winItem = itemById(res.id);
  
  // Сохраняем в инвентарь
  state.inventory.push({uid:Date.now(), itemId:winItem.id, date:Date.now()});
  state.globalDrops.unshift({itemName:winItem.name, username:state.user.username, itemId:winItem.id});
  saveState();
  
  state.openingView = `<div style="text-align:center;padding:50px;">
    <div style="font-size:120px;margin-bottom:20px;">${itemIcon(winItem,120)}</div>
    <div class="page-title">${winItem.name}</div>
    <button class="btn btn-primary" onclick="state.openingView=null;state.currentCase=null;render()">Забрать</button>
  </div>`;
  render();
}

function startAllInSequence(){
  state.openingView = `<div class="all-in-stage-new">
    <div class="all-in-multiplier" id="allInMult">x1.0</div>
    <div style="margin-top:20px;"><button class="btn btn-primary" onclick="state.openingView=null;render()">Забрать</button></div>
  </div>`;
  render();
  
  let el = document.getElementById('allInMult');
  let count = 0;
  let int = setInterval(()=>{
    if(!document.getElementById('allInMult')){clearInterval(int);return;}
    count += 0.5;
    el.innerText = 'x' + count.toFixed(1);
    if(count > 5){
      clearInterval(int);
      el.style.color = '#fbbf24';
      state.balance += 5000; // Заглушка для теста
      saveState();
    }
  }, 100);
}

function renderInventory(){
  if(state.inventory.length === 0) return '<div class="page-title">Инвентарь пуст</div>';
  return `<div class="page-title">Инвентарь</div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;">
    ${state.inventory.map(inv => {
      const it = itemById(inv.itemId);
      return `<div style="background:#111827;padding:16px;border-radius:16px;text-align:center;border:1px solid #334155;">
        ${itemIcon(it,60)}
        <div style="font-size:14px;font-weight:700;margin:10px 0;">${it.name}</div>
        <div style="color:#fbbf24;font-weight:900;">${fmt(it.price)} 🪙</div>
      </div>`;
    }).join('')}
  </div>`;
}

function renderProfile(){
  return `<div class="page-title">Профиль</div>
  <div style="background:#111827;border:1px solid #334155;border-radius:24px;padding:30px;">
    <div style="font-size:24px;font-weight:900;margin-bottom:10px;">${state.user.name}</div>
    <div style="color:var(--muted);">Telegram ID: <b style="color:#fff;">${state.user.id}</b></div>
  </div>`;
}

document.addEventListener('DOMContentLoaded', () => {
  loadSavedState();
  document.getElementById('loginScreen').classList.add('show');
  // Даем телеге 1 секунду на инициализацию
  setTimeout(initTelegramLogin, 500);
});
</script>
