<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', system-ui, sans-serif !important; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #070a12; --surface: rgba(15,23,42,.85); --surface-solid: #111827;
  --border: rgba(56,189,248,.12); --border-strong: rgba(56,189,248,.3);
  --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8;
  --gold: #fbbf24; --green: #34d399; --red: #f87171;
  --ease: cubic-bezier(.22,1,.36,1);
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
html { background-color: var(--bg); }
body { color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; overflow-x: hidden;
  background-image: radial-gradient(ellipse 80% 50% at 20% -10%,rgba(56,189,248,.15),transparent 55%),
    radial-gradient(ellipse 60% 40% at 85% 10%,rgba(34,211,238,.1),transparent 50%),
    linear-gradient(to bottom,rgba(7,10,18,.3) 0%,rgba(7,10,18,.9) 100%); }

/* LOGIN */
#loginScreen { position: fixed; inset: 0; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; background: var(--bg); }
#loginScreen.show { display: flex; }
.login-card { background: rgba(15,23,42,.85); border: 1px solid var(--border-strong); border-radius: 28px; padding: 40px 30px; max-width: 400px; width: 100%; }
.login-title { font-size: 32px; font-weight: 900; margin-bottom: 8px; color: #fff; }
.spinner { width: 30px; height: 30px; border: 3px solid rgba(56,189,248,.3); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
@keyframes spin { to { transform: rotate(360deg); } }

/* LAYOUT */
.app { display: none; min-height: 100vh; position: relative; z-index: 2; }
.app.logged-in { display: flex; }
.sidebar { width: 260px; flex-shrink: 0; background: rgba(10,14,23,.5); border-right: 1px solid rgba(255,255,255,.05); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; z-index: 30; }
.logo { height: 80px; display: flex; align-items: center; gap: 14px; padding: 0 24px; border-bottom: 1px solid rgba(255,255,255,.05); }
.logo-text { font-weight: 900; font-size: 20px; color: #fff; }
.nav { flex: 1; overflow-y: auto; padding: 20px 16px; }
.nav-section-title { font-size: 11px; font-weight: 800; text-transform: uppercase; color: #64748b; margin-bottom: 12px; padding-left: 12px; }
.nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 14px; font-size: 15px; font-weight: 600; color: #cbd5e1; cursor: pointer; transition: all .3s var(--ease); margin-bottom: 4px; }
.nav-item:hover { color: #fff; background: rgba(255,255,255,.08); }
.nav-item.active { color: #fff; background: linear-gradient(90deg,rgba(56,189,248,.2),transparent); box-shadow: inset 2px 0 0 var(--accent); }
.sidebar-profile { padding: 20px; border-top: 1px solid rgba(255,255,255,.05); display: flex; align-items: center; gap: 14px; cursor: pointer; }
.profile-avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg,#0ea5e9,#22d3ee); display: grid; place-items: center; font-size: 18px; font-weight: 800; overflow: hidden; color: #fff; }
.profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.header { height: 72px; position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 16px; padding: 0 32px; background: rgba(10,14,23,.8); border-bottom: 1px solid rgba(255,255,255,.05); backdrop-filter: blur(20px); }
.balance { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-radius: 16px; background: rgba(0,0,0,.5); border: 1px solid rgba(251,191,36,.2); font-weight: 800; font-size: 18px; color: #fff; margin-left: auto; }
.btn { border: none; cursor: pointer; font-weight: 700; font-size: 14px; padding: 10px 20px; border-radius: 14px; transition: all .3s; color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn-primary { background: linear-gradient(135deg,#0ea5e9,#0284c7); }
.btn-primary:hover { transform: translateY(-2px); }
.btn-ghost { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.1); }
.btn-danger { background: linear-gradient(135deg,#f43f5e,#e11d48); }
.btn-sm { padding: 8px 16px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.content { flex: 1; padding: 32px; max-width: 1600px; width: 100%; margin: 0 auto; }
.page-title { font-size: 32px; font-weight: 900; margin-bottom: 8px; color: #fff; }
.page-sub { color: var(--muted); font-size: 15px; margin-bottom: 32px; }

/* CASES */
.hero { background: linear-gradient(135deg,rgba(56,189,248,.15),rgba(14,165,233,.05)); border: 1px solid var(--border); border-radius: 28px; padding: 48px; margin-bottom: 32px; }
.hero h1 { font-size: 42px; font-weight: 900; margin-bottom: 12px; color: #fff; line-height: 1.15; max-width: 700px; }
.hero p { color: #cbd5e1; font-size: 16px; max-width: 500px; margin-bottom: 24px; }
.live-bar { background: rgba(15,23,42,.6); border: 1px solid rgba(255,255,255,.05); border-radius: 20px; padding: 16px 20px; margin-bottom: 32px; display: flex; align-items: center; gap: 20px; overflow: hidden; }
.live-list { display: flex; gap: 16px; overflow-x: auto; }
.live-list::-webkit-scrollbar { display: none; }
.live-item { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.05); padding: 8px 16px; border-radius: 14px; min-width: max-content; }
.li-name { font-size: 13px; font-weight: 700; color: #fff; }
.li-user { font-size: 11px; color: var(--muted); }
.cases-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
.case-card { background: linear-gradient(180deg,rgba(30,41,59,.7),rgba(15,23,42,.9)); border: 1px solid rgba(255,255,255,.08); border-radius: 28px; padding: 28px; cursor: pointer; transition: all .4s var(--ease); display: flex; flex-direction: column; }
.case-card:hover { transform: translateY(-8px); border-color: var(--accent); }
.case-img { height: 200px; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle,rgba(56,189,248,.1),transparent 70%); border-radius: 20px; margin-bottom: 24px; font-size: 80px; }
.case-img img { width: 100%; height: 100%; object-fit: contain; }
.case-name { font-size: 20px; font-weight: 800; margin-bottom: 24px; text-align: center; color: #fff; }
.case-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.05); }
.case-price { font-size: 18px; font-weight: 900; color: var(--gold); }
.all-in-card { border: 1px solid rgba(244,63,94,.4); background: linear-gradient(180deg,rgba(244,63,94,.1),rgba(15,23,42,.95)); }
.all-in-card .case-price { color: var(--red); }

/* CASE DETAIL + ROULETTE */
.case-back { background: transparent; border: none; color: var(--muted); font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 24px; display: inline-flex; align-items: center; gap: 10px; }
.case-back:hover { color: #fff; }
.case-detail { display: grid; grid-template-columns: 380px 1fr; gap: 40px; align-items: start; }
.case-detail-img { background: radial-gradient(circle at 50% 50%,rgba(56,189,248,.15) 0%,#0f172a 75%); border: 2px solid var(--border); border-radius: 32px; height: 340px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; font-size: 140px; padding: 20px; }
.case-detail-img img { width: 100%; height: 100%; object-fit: contain; }
.case-title { font-size: 42px; font-weight: 900; margin-bottom: 12px; color: #fff; }
.case-open-panel { background: rgba(15,23,42,.8); border: 1px solid rgba(255,255,255,.08); border-radius: 28px; padding: 36px; }
.roulette-wrap { position: relative; overflow: hidden; background: #0a0e17; border: 3px solid var(--border-strong); border-radius: 20px; height: 250px; }
.roulette-marker { position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; background: var(--red); transform: translateX(-50%); z-index: 10; box-shadow: 0 0 20px var(--red); }
.roulette-track { display: flex; align-items: center; gap: 12px; height: 100%; padding: 20px; will-change: transform; }
.roulette-item { display: flex; align-items: center; justify-content: center; background: rgba(56,189,248,.05); border: 1px solid var(--border); border-radius: 16px; flex-shrink: 0; width: 130px; height: 130px; }

/* ALL IN */
.all-in-stage-new { position: relative; width: 100%; min-height: 80vh; background: radial-gradient(circle at center,rgba(244,63,94,.15) 0%,#000 80%); border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid rgba(244,63,94,.4); overflow: hidden; }
.all-in-multiplier { font-size: 130px; font-weight: 900; color: #fff; text-shadow: 0 0 50px rgba(244,63,94,0.8); z-index: 5; }

/* INVENTORY */
.inv-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(180px,1fr)); gap: 16px; }
.inv-card { background: linear-gradient(180deg,rgba(30,41,59,.7),rgba(15,23,42,.9)); padding: 16px; border-radius: 20px; text-align: center; border: 1px solid #334155; }
.inv-card button { margin-top: 10px; width: 100%; }

/* MODAL */
.overlay { position: fixed; inset: 0; z-index: 200; background: rgba(5,6,12,.85); display: none; align-items: center; justify-content: center; padding: 20px; }
.overlay.open { display: flex; }
.modal { background: var(--surface-solid); border: 1px solid rgba(255,255,255,.1); border-radius: 28px; max-width: 640px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 32px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.modal-title { font-size: 24px; font-weight: 900; color: #fff; }
.modal-close { background: rgba(255,255,255,.05); border: none; color: var(--muted); width: 36px; height: 36px; border-radius: 12px; cursor: pointer; font-size: 18px; }
.form-input { width: 100%; padding: 12px 16px; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; color: #fff; font-size: 15px; margin-bottom: 16px; }
.form-input:focus { outline: none; border-color: var(--accent); }
.item-selector { max-height: 300px; overflow-y: auto; border: 1px solid rgba(255,255,255,.05); border-radius: 16px; padding: 8px; margin-bottom: 16px; }
.item-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; cursor: pointer; transition: background .2s; }
.item-row:hover { background: rgba(56,189,248,.08); }
.item-row.selected { background: rgba(56,189,248,.15); border: 1px solid var(--accent); }
.item-row input[type="checkbox"] { accent-color: var(--accent); width: 18px; height: 18px; }
.item-row-info { flex: 1; }
.item-row-name { font-size: 13px; font-weight: 700; color: #fff; }
.item-row-price { font-size: 12px; color: var(--gold); }

/* RESPONSIVE */
@media(max-width: 1024px) {
  .sidebar { display: none; }
  .mobile-nav { display: flex; position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 100; gap: 6px; padding: 8px; background: rgba(10,14,23,.95); border: 1px solid rgba(255,255,255,.08); border-radius: 22px; overflow-x: auto; }
  .mobile-nav .nav-item { flex-direction: column; padding: 10px 8px; font-size: 10px; }
  .content { padding: 20px 16px 120px; }
  .header { padding: 0 16px; height: 64px; gap: 10px; }
  .hero { padding: 32px 24px; }
  .hero h1 { font-size: 32px; }
  .case-detail { grid-template-columns: 1fr; }
  .case-title { font-size: 28px; }
  .all-in-multiplier { font-size: 80px; }
}
.mobile-nav { display: none; }
</style>
</head>

</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

const state = {
  balance: 0,
  tab: 'cases',
  inventory: [],
  currentCase: null,
  openingView: null,
  user: null,
  globalDrops: [],
  online: true
};

const $ = s => document.querySelector(s);
const itemById = id => ITEMS.find(i => i.id === id);
const fmt = n => Math.round(n).toLocaleString('ru-RU');

// ==================== API ====================
async function api(path, opts = {}) {
  try {
    const r = await fetch(SERVER_URL + path, {
      headers: { 'Content-Type': 'application/json' },
      ...opts
    });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) {
    state.online = false;
    return null;
  }
}

async function syncFromServer() {
  if (!state.user) return;
  const data = await api(`api/state/${state.user.id}`);
  if (data) {
    state.online = true;
    state.balance = data.balance;
    state.inventory = data.inventory || [];
    if (!state.user.username && data.username) state.user.username = data.username;
    updateBalanceUI();
    saveLocal();
  }
}

async function pushBalance(delta, reason) {
  if (!state.user) return;
  const data = await api('api/balance', {
    method: 'POST',
    body: JSON.stringify({ tgId: state.user.id, delta, reason })
  });
  if (data) {
    state.balance = data.balance;
    updateBalanceUI();
  }
  saveLocal();
}

async function pushInventoryAdd(itemId) {
  if (!state.user) return null;
  const data = await api('api/inventory/add', {
    method: 'POST',
    body: JSON.stringify({ tgId: state.user.id, itemId })
  });
  if (data && data.entry) {
    state.inventory.push(data.entry);
    saveLocal();
    return data.entry;
  }
  return null;
}

async function pushInventoryRemove(uids) {
  if (!state.user) return;
  await api('api/inventory/remove', {
    method: 'POST',
    body: JSON.stringify({ tgId: state.user.id, uids })
  });
  saveLocal();
}

async function pushDrop(item) {
  if (!state.user || !item) return;
  await api('api/drops', {
    method: 'POST',
    body: JSON.stringify({
      username: state.user.username,
      itemName: item.name,
      price: item.price,
      rarity: item.rarity,
      itemId: item.id
    })
  });
}

async function fetchDrops() {
  const drops = await api('api/drops');
  if (Array.isArray(drops)) {
    state.globalDrops = drops;
    if (state.tab === 'cases' && !state.currentCase && !state.openingView) render();
  }
}

// ==================== LOCAL SAVE (fallback) ====================
function saveLocal() {
  try {
    localStorage.setItem('brainrot-state', JSON.stringify({
      user: state.user,
      balance: state.balance,
      inventory: state.inventory,
      globalDrops: state.globalDrops
    }));
  } catch (e) {}
}

function loadLocal() {
  try {
    const raw = localStorage.getItem('brainrot-state');
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (s.user) {
      state.user = s.user;
      state.balance = Number(s.balance) || 0;
      state.inventory = s.inventory || [];
      state.globalDrops = s.globalDrops || [];
    }
    return true;
  } catch (e) { return false; }
}

function updateBalanceUI() {
  const el = $('#balanceEl');
  if (el) el.textContent = fmt(Math.round(state.balance));
}

function initTelegramLogin() {
  const tg = window.Telegram?.WebApp;
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
    onTelegramAuth({
      id: tg.initDataUnsafe.user.id,
      first_name: tg.initDataUnsafe.user.first_name || '',
      username: tg.initDataUnsafe.user.username || ('user' + tg.initDataUnsafe.user.id),
      photo_url: tg.initDataUnsafe.user.photo_url || null
    });
    return;
  }
  document.getElementById('loginLoading').style.display = 'none';
  document.getElementById('tgErrorBox').style.display = 'block';
  document.getElementById('tgErrorMessage').innerText = 'Откройте игру через Telegram-бота.';
}

async function onTelegramAuth(user) {
  state.user = {
    id: user.id,
    name: user.first_name || 'Игрок',
    username: user.username || '',
    avatar: user.photo_url || null
  };
  document.getElementById('loginScreen').classList.remove('show');
  document.getElementById('app').classList.add('logged-in');
  const nameEl = document.getElementById('profileName');
  const avEl = document.getElementById('profileAvatar');
  if (nameEl) nameEl.textContent = state.user.name;
  if (avEl) {
    if (state.user.avatar) avEl.innerHTML = `<img src="${state.user.avatar}">`;
    else avEl.textContent = state.user.name[0].toUpperCase();
  }
  // Sync from server
  await syncFromServer();
  updateBalanceUI();
  renderNav();
  render(true);
  fetchDrops();
  setInterval(fetchDrops, 15000);
  saveLocal();
}

function renderNav() {

    { s: 'Игры', items: [{ id: 'cases', l: 'Кейсы', i: '📦' }, { id: 'mines', l: 'Мины', i: '💣' }] },

    { s: 'Прогресс', items: [{ id: 'profile', l: 'Профиль', i: '👤' }] }
  ];
  const navEl = $('#nav');
  if (navEl) navEl.innerHTML = groups.map(g => `
    <div>

    </div>

}

function setTab(t) {
  state.tab = t;
  state.currentCase = null;
  state.openingView = null;
  renderNav();
  render(true);
}

// ==================== RENDER ====================
function render() {
  updateBalanceUI();
  const el = $('#content');
  if (!el) return;
  if (state.openingView) { el.innerHTML = state.openingView; return; }
  if (state.currentCase) { el.innerHTML = renderCaseDetail(state.currentCase); return; }
  if (state.tab === 'cases') el.innerHTML = renderCases();
  else if (state.tab === 'inventory') el.innerHTML = renderInventory();
  else if (state.tab === 'profile') el.innerHTML = renderProfile();
  else if (state.tab === 'upgrade') el.innerHTML = '<div class="page-title">📈 Апгрейд</div><div style="color:var(--muted)">В разработке...</div>';
  else if (state.tab === 'mines') el.innerHTML = '<div class="page-title">💣 Мины</div><div style="color:var(--muted)">В разработке...</div>';
}

  return `<span style="font-size:${size}px;line-height:1">${it.icon}</span>`;
}

function openCase(id) { state.currentCase = id; render(); }

// ==================== OPEN CASE ====================
async function openCaseNow() {
  const c = CASES.find(x => x.id === state.currentCase);
  if (!c) return;
  if (c.isAllIn) {
    if (state.balance <= 0) return alert('Нет монет для ALL IN!');
    const cost = state.balance;
    state.balance = 0;
    updateBalanceUI();
    await pushBalance(-cost, 'all_in');
    startAllInSequence(cost);
    return;
  }
  if (state.balance < c.price) return alert('Недостаточно монет!');
  state.balance -= c.price;
  updateBalanceUI();
  await pushBalance(-c.price, 'case_' + c.id);
  const total = c.items.reduce((s, i) => s + i.c, 0);
  let r = Math.random() * total;
  let res = c.items[c.items.length - 1];
  for (const it of c.items) { r -= it.c; if (r <= 0) { res = it; break; } }
  const winItem = itemById(res.id);
  startRoulette(winItem, c);
}

function startRoulette(winItem, c) {
  const trackItems = [];
  for (let i = 0; i < 60; i++) {
    if (i === 48) trackItems.push(winItem);
    else trackItems.push(itemById(c.items[Math.floor(Math.random() * c.items.length)].id));
  }
  let html = `<button class="case-back" onclick="state.currentCase=null;render()">← Назад</button>`;
  html += `<div class="roulette-wrap"><div class="roulette-marker"></div><div class="roulette-track" id="track">`;
  html += trackItems.map(it => `<div class="roulette-item">${itemIcon(it, 70)}</div>`).join('');
  html += `</div></div><div style="text-align:center;margin-top:24px;color:var(--muted);font-weight:700;">Крутим...</div>`;
  state.openingView = html;
  render();
  setTimeout(async () => {
    const track = document.getElementById('track');
    if (!track) return;
    const items = track.querySelectorAll('.roulette-item');
    const winEl = items[48];
    const wrap = track.parentElement;
    const wrapW = wrap.offsetWidth;
    const winElLeft = winEl.offsetLeft;
    const winElWidth = winEl.offsetWidth;
    const offset = (wrapW / 2) - winElLeft - (winElWidth / 2);
    track.style.transition = 'transform 4000ms cubic-bezier(0.12, 0.8, 0.15, 1)';
    track.style.transform = `translateX(${offset}px)`;
    setTimeout(async () => {
      // Persist
      await pushInventoryAdd(winItem.id);
      await pushDrop(winItem);
      state.openingView = `
        <div style="text-align:center;padding:50px;">
          <div style="font-size:120px;margin-bottom:20px;">${itemIcon(winItem, 120)}</div>
          <div class="page-title">${winItem.name}</div>
          <div style="color:var(--gold);font-size:24px;font-weight:900;margin-bottom:20px;">${fmt(winItem.price)} 🪙</div>
          <button class="btn btn-primary" onclick="state.openingView=null;state.currentCase=null;render()">Забрать в инвентарь</button>
        </div>`;
      render();
    }, 4200);
  }, 50);
}

// ==================== ALL IN ====================
function startAllInSequence(cost) {
  state.openingView = `
    <div class="all-in-stage-new">
      <div class="all-in-multiplier" id="allInMult">x0.0</div>
      <div style="margin-top:20px;"><button class="btn btn-primary" id="allInBtn" style="display:none;" onclick="state.openingView=null;render()">Забрать</button></div>
    </div>`;
  render();
  let count = 0;
  let mult = 0.5 + Math.random() * 5.0;
  const int = setInterval(async () => {
    const el = document.getElementById('allInMult');
    const btn = document.getElementById('allInBtn');
    if (!el) { clearInterval(int); return; }
    count += 0.3;
    el.innerText = 'x' + count.toFixed(1);
    if (count > mult) {
      clearInterval(int);
      el.innerText = 'x' + mult.toFixed(2);
      el.style.color = mult > 1 ? 'var(--gold)' : 'var(--red)';
      btn.style.display = 'inline-flex';
      const reward = Math.floor(cost * mult);
      state.balance = reward;
      updateBalanceUI();
      await pushBalance(reward, 'all_in_reward');
    }
  }, 50);
}

// ==================== INVENTORY ====================
function renderInventory() {
  if (state.inventory.length === 0) return '<div class="page-title">Инвентарь пуст</div><div class="page-sub">Открой первый кейс!</div>';
  const total = state.inventory.reduce((s, i) => s + (itemById(i.itemId)?.price || 0), 0);
  return `
    <div class="page-title">Инвентарь</div>
    <div class="page-sub">Стоимость: ${fmt(total)} 🪙</div>
    <div class="inv-grid">
      ${state.inventory.map(inv => {
        const it = itemById(inv.itemId);
        if (!it) return '';
        return `<div class="inv-card">
          ${itemIcon(it, 60)}
          <div style="font-size:13px;font-weight:700;margin:10px 0;color:#fff;">${it.name}</div>
          <div style="color:var(--gold);font-weight:900;font-size:14px;">${fmt(it.price)} 🪙</div>
          <button class="btn btn-ghost btn-sm" onclick="sellItem('${inv.uid}')">Продать</button>
        </div>`;
      }).join('')}
    </div>`;
}

async function sellItem(uid) {
  const idx = state.inventory.findIndex(i => String(i.uid) === String(uid));
  if (idx < 0) return;
  const inv = state.inventory[idx];
  const it = itemById(inv.itemId);
  if (!it) return;
  if (!confirm(`Продать "${it.name}" за ${fmt(it.price)} 🪙?`)) return;
  state.inventory.splice(idx, 1);
  state.balance += it.price;
  updateBalanceUI();
  render();
  await pushInventoryRemove([inv.uid]);
  await pushBalance(it.price, 'sell_' + it.id);
}

      <div>
        <div style="font-size:28px;font-weight:900;color:#fff;">${state.user.name}</div>
        <div style="color:var(--muted);">@${state.user.username || 'anon'} · ID: ${state.user.id}</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;">
      <button class="btn btn-primary" style="padding:20px;" onclick="openDepositModal()">💳 Пополнить</button>
      <button class="btn btn-ghost" style="padding:20px;" onclick="openWithdrawModal()">📤 Вывести</button>
      <button class="btn btn-ghost" style="padding:20px;" onclick="syncFromServer()">🔄 Синхронизация</button>
    </div>`;
}

// ==================== MODALS ====================
function openModal(html) {
  $('#modal').innerHTML = html;
  $('#overlay').classList.add('open');
}
function closeModal() { $('#overlay').classList.remove('open'); }

function openDepositModal() {
  const inv = state.inventory.filter(i => itemById(i.itemId));
  if (!inv.length) {
    openModal(`<div class="modal-head"><div class="modal-title">Пополнение</div><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div style="text-align:center;padding:40px;"><div style="font-size:64px;margin-bottom:16px;">📦</div><p style="color:var(--muted);">Инвентарь пуст. Открой кейс, чтобы было что депонировать.</p></div>`);
    return;
  }
  const rows = inv.map(i => {
    const it = itemById(i.itemId);
    return `<label class="item-row" data-uid="${i.uid}">
      <input type="checkbox" value="${i.uid}" data-price="${it.price}" data-name="${it.name}" onchange="onItemToggle(this)">
      ${itemIcon(it, 40)}
      <div class="item-row-info"><div class="item-row-name">${it.name}</div><div class="item-row-price">${fmt(it.price)} 🪙</div></div>
    </label>`;
  }).join('');
  openModal(`
    <div class="modal-head"><div class="modal-title">💳 Депозит (пополнение)</div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <p style="color:var(--muted);margin-bottom:16px;font-size:14px;">Выбери предметы для обмена на монеты и укажи Roblox-ник.</p>
    <input class="form-input" id="robloxNameDep" placeholder="Твой Roblox ник" required>
    <div class="item-selector" id="depositItems">${rows}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <span style="color:var(--muted);">Сумма:</span>
      <span style="color:var(--gold);font-weight:900;font-size:20px;" id="depositSum">0 🪙</span>
    </div>
    <button class="btn btn-primary" style="width:100%;padding:16px;" onclick="submitDeposit()">Отправить заявку</button>
  `);
}

function onItemToggle(cb) {
  const row = cb.closest('.item-row');
  if (cb.checked) row.classList.add('selected'); else row.classList.remove('selected');
  updateSum('depositItems', 'depositSum');
}

function updateSum(containerId, sumId) {
  const cont = document.getElementById(containerId);
  if (!cont) return;
  let sum = 0;
  cont.querySelectorAll('input:checked').forEach(cb => sum += parseFloat(cb.dataset.price) || 0);
  document.getElementById(sumId).textContent = fmt(sum) + ' 🪙';
}

async function submitDeposit() {
  const robloxName = document.getElementById('robloxNameDep').value.trim();
  if (!robloxName) return alert('Укажи Roblox ник');
  const selected = [...document.querySelectorAll('#depositItems input:checked')];
  if (!selected.length) return alert('Выбери хотя бы один предмет');
  const items = selected.map(cb => {
    const inv = state.inventory.find(i => String(i.uid) === cb.value);
    const it = itemById(inv.itemId);
    return { uid: inv.uid, name: it.name, price: it.price };
  });
  const totalAmount = items.reduce((s, i) => s + i.price, 0);
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Отправка...';
  const res = await api('api/deposit', {
    method: 'POST',
    body: JSON.stringify({
      tgId: state.user.id,
      username: state.user.username,
      robloxName,
      items,
      totalAmount
    })
  });
  btn.disabled = false;
  btn.textContent = 'Отправить заявку';
  if (res && res.success) {
    openModal(`
      <div class="modal-head"><div class="modal-title">✅ Заявка отправлена</div><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div style="text-align:center;padding:20px;">
        <p style="color:var(--muted);margin-bottom:16px;">ID: <b style="color:var(--accent)">${res.requestId}</b></p>
        <p style="color:var(--muted);">Админ проверит заявку в Discord и начислит монеты.</p>
      </div>
    `);
  } else {
    alert('Ошибка отправки. Сервер недоступен.');
  }
}

function openWithdrawModal() {
  const inv = state.inventory.filter(i => itemById(i.itemId));
  if (!inv.length) {
    openModal(`<div class="modal-head"><div class="modal-title">Вывод</div><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div style="text-align:center;padding:40px;"><p style="color:var(--muted);">Нечего выводить.</p></div>`);
    return;
  }
  const rows = inv.map(i => {
    const it = itemById(i.itemId);
    return `<label class="item-row" data-uid="${i.uid}">
      <input type="checkbox" value="${i.uid}" data-price="${it.price}" onchange="onItemToggle(this)">
      ${itemIcon(it, 40)}
      <div class="item-row-info"><div class="item-row-name">${it.name}</div><div class="item-row-price">${fmt(it.price)} 🪙</div></div>
    </label>`;
  }).join('');
  openModal(`
    <div class="modal-head"><div class="modal-title">📤 Вывод (в игру)</div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <p style="color:var(--muted);margin-bottom:16px;font-size:14px;">Выбери предметы и укажи Roblox-ник — админ выдаст их в игре.</p>
    <input class="form-input" id="robloxNameWd" placeholder="Твой Roblox ник" required>
    <div class="item-selector" id="withdrawItems">${rows}</div>
    <button class="btn btn-primary" style="width:100%;padding:16px;" onclick="submitWithdraw()">Отправить заявку</button>
  `);
}

async function submitWithdraw() {
  const robloxName = document.getElementById('robloxNameWd').value.trim();
  if (!robloxName) return alert('Укажи Roblox ник');
  const selected = [...document.querySelectorAll('#withdrawItems input:checked')];
  if (!selected.length) return alert('Выбери хотя бы один предмет');
  const items = selected.map(cb => {
    const inv = state.inventory.find(i => String(i.uid) === cb.value);
    const it = itemById(inv.itemId);
    return { uid: inv.uid, name: it.name, price: it.price };
  });
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Отправка...';
  const res = await api('api/withdraw', {
    method: 'POST',
    body: JSON.stringify({ tgId: state.user.id, username: state.user.username, robloxName, items })
  });
  btn.disabled = false;
  btn.textContent = 'Отправить заявку';
  if (res && res.success) {
    openModal(`
      <div class="modal-head"><div class="modal-title">✅ Заявка отправлена</div><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div style="text-align:center;padding:20px;">
        <p style="color:var(--muted);margin-bottom:16px;">ID: <b style="color:var(--accent)">${res.requestId}</b></p>
        <p style="color:var(--muted);">Админ выдаст предметы в игре.</p>
      </div>
    `);
  } else {
    alert('Ошибка отправки.');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  loadLocal();
  document.getElementById('loginScreen').classList.add('show');
  setTimeout(initTelegramLogin, 500);
});
</script>
