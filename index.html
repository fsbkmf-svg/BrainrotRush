function leaveStage(){if(__pendingCase&&!__pendingCase.settled)return false;state.openingView=null;return true;}
function setCaseOpens(n){if(!leaveStage())return;state.caseOpens=n;render(false);}


let __openingCase=false;
async function openCaseNow(){
  if(__pendingCase||__openingCase)return;
  const c=CASES.find(x=>x.id===state.currentCase);if(!c)return;
  const count=c.isAllIn?1:state.caseOpens;
  const unitPrice=c.isVip&&state.vipMode?c.vipPrice:c.price;
  const total=c.isAllIn?Math.floor(state.balance):unitPrice*count;
  if(!(total>0)){toast('У вас нет монет для открытия','err');haptic('error');return;}
  if(c.isAllIn&&(total<F.ALLIN_MIN||total>F.ALLIN_MAX)){toast(`ALL IN доступен при балансе от ${fmt(F.ALLIN_MIN)} до ${fmt(F.ALLIN_MAX)}`,'err');return;}
  if(!c.isAllIn&&state.balance<total){toast('Недостаточно монет','err');haptic('error');return;}

  const executeOpen=async()=>{
    if(__openingCase)return;
    __openingCase=true;
    try{
      const data=await api('/api/case/open',{caseId:c.id,count,vipMode:!!state.vipMode});
      applyServerState(data);
      const results=(data.results||[]).filter(r=>itemById(r.id)).map(r=>({id:r.id,uid:r.uid,date:r.date,price:r.price,rarity:r.rarity}));
      if(!results.length)throw new Error('Сервер не вернул результат');
      addHist(data.hist);
      const paid=Number(data.charged)||total;
      __pendingCase={case:c,opens:results.length,results,total:paid,unitPrice:paid/results.length,settled:false};
      saveLocalState();renderHeader();startRoulette(c,results,!!data.allIn);
    }catch(e){
      toast(esc(e.message||'Ошибка открытия кейса'),'err');haptic('error');
      try{await apiSync();}catch(_){}
    }finally{__openingCase=false;}
  };
  if(c.isAllIn){showConfirm(`Вы уверены?\nСтавка: ${fmt(total)} монет.\nСредний возврат ${RTP_ALLIN_PCT}%: чаще вы получите меньше ставки.`,executeOpen);return;}
  await executeOpen();
}
function reelFiller(c,isAllIn,bet){
  if(isAllIn)return F.pickItemForTarget(PRICE_LIST,bet*F.allInMultiplier(Math.random(),Math.random()),Math.random(),Math.random()).id;
  const raw=c.isVip?(state.vipMode?c.vipItems:c.normalItems):c.items;
  return F.pickWeighted(raw,Math.random()).id;
}

function startRoulette(c,results, isAllIn){
  const opens=results.length;
  // каждая крутка уникальна: длина ленты, время, манера остановки и точка внутри предмета
  const fastSpin=state.settings.spinType==='fast';
  const MODES=['smooth'];
  const spinCfg=results.map(()=>{const winIdx=30+Math.floor(Math.random()*10);return{winIdx,len:winIdx+14,time:fastSpin?300:7500+Math.floor(Math.random()*3500),mode:fastSpin?'smooth':MODES[Math.floor(Math.random()*MODES.length)],jitter:(Math.random()-.5)*0.7};});
  
  let html=(isAllIn?`<button class="case-back" onclick="goBackToCase('${c.id}')">← Назад к кейсу</button>`:'')+`<div class="stage"><div class="stage-head">${esc(c.name)}</div><div style="display:flex;flex-direction:column;gap:24px;margin-bottom:18px;">`;
  
  results.forEach((win,idx)=>{
    const ids=[];
    for(let i=0;i<spinCfg[idx].len;i++)ids.push(i===spinCfg[idx].winIdx?win.id:reelFiller(c,isAllIn,__pendingCase?__pendingCase.total:0));
    
    const trackHtml=ids.map(id=>{
      const it=itemById(id);
      
      const iconSize = isAllIn ? 100 : (opens>1 ? 60 : 100);
      const itemStyle = isAllIn 
        ? 'min-width:130px;width:130px;height:130px;padding:10px;gap:8px;' 
        : (opens>1?'min-width:140px;width:140px;height:140px;padding:10px;gap:8px;':'min-width:170px;width:170px;height:210px;padding:10px;gap:6px;');
      
      const nameStyle = isAllIn 
        ? 'font-size:14px;white-space:normal;line-height:1.2;-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;font-weight:900;' 
        : (opens>1?'font-size:14px;white-space:normal;line-height:1.2;-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;':'font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;');
        
      const rarityClass = `rarity-${it?.rarity || 'common'}`;
      const rarityColor = (RARITY[it?.rarity] || RARITY.common).color;
      return `<div class="roulette-item ${rarityClass}" style="${itemStyle}border-color:${rarityColor}66;"><div style="display:flex;align-items:center;justify-content:center;flex:1;width:100%;overflow:hidden;">${itemIcon(it,iconSize)}</div><div class="roulette-item-name" style="${nameStyle}">${esc(it.name)}</div>${opens>1?'':`<div class="ri-price">${coin(14)} ${fmt(it.price)}</div>`}</div>`;
    }).join('');
    
    const wrapHeight = isAllIn ? '250px' : (opens>1?'170px':'250px');
    const wrapBorder = isAllIn ? 'border:3px solid var(--red); box-shadow: inset 0 0 50px rgba(244,63,94,0.3);' : '';
    
    html+=`<div class="roulette-wrap" id="rouletteWrap_${idx}" style="height:${wrapHeight};max-width:${isAllIn?'800px':'1000px'};margin:0 auto;width:100%;${wrapBorder}"><div class="roulette-marker" style="${isAllIn?'background:var(--red);width:4px;box-shadow:0 0 20px var(--red);':''}"></div><div class="roulette-particles" id="rouletteParticles_${idx}"></div><div class="roulette-track" id="track_${idx}" style="padding:${opens>1?'15px':'20px'}">${trackHtml}</div></div>`;
  });
  
  html+=`</div><div id="spinHint"><div style="text-align:center;color:${isAllIn?'var(--red)':'var(--muted)'};font-size:${isAllIn?'24px':'16px'};font-weight:900;margin-bottom:12px">${state.settings.spinType==='fast'?'':'Крутим...'}</div><div style="text-align:center"><button class="btn-dark" onclick="skipCaseAnim()">⏩ Пропустить</button></div></div><div id="resBar" class="res-bar"></div></div>`;
  const stageHtml=html;
  const paidTotal=__pendingCase?__pendingCase.total:0;
  state.openingView=html;
  { const ce=document.getElementById('content'); if(ce) ce.dataset.live=''; }
  render(false);
  
  const animTime = Math.max(...spinCfg.map(x=>x.time));
  const rows=[];
  let finished=false;
  requestAnimationFrame(() => {
    setTimeout(() => {
      results.forEach((win,idx)=>{
        const wrap=document.getElementById(`rouletteWrap_${idx}`);
        const track=document.getElementById(`track_${idx}`);
        if(!wrap||!track)return;
        const items=track.querySelectorAll('.roulette-item');
        const cfg=spinCfg[idx];
        const winEl=items[cfg.winIdx];
        if(!winEl)return;
        const step=items[1].offsetLeft-items[0].offsetLeft;
        const wc=winEl.offsetLeft+winEl.offsetWidth/2+cfg.jitter*winEl.offsetWidth;
        const offset=wrap.offsetWidth/2-wc;
        const T=x=>`translate3d(${x}px,0,0)`;
        const main='cubic-bezier(0.1,0.55,0.08,1)';
        let kf;
        if(cfg.mode==='over'){
          const over=offset-step*(0.55+Math.random()*0.9);
          kf=[{transform:T(0),easing:main},{transform:T(over),offset:0.86,easing:'ease-in-out'},{transform:T(offset)}];
        }else if(cfg.mode==='stall'){
          const short=offset+step*(0.6+Math.random()*0.8);
          kf=[{transform:T(0),easing:main},{transform:T(short),offset:0.87},{transform:T(short),offset:0.93,easing:'ease-in-out'},{transform:T(offset)}];
        }else{
          kf=[{transform:T(0),easing:['cubic-bezier(0.12,0.6,0.06,1)','cubic-bezier(0.08,0.7,0.04,1)','cubic-bezier(0.2,0.5,0.05,1)','cubic-bezier(0.05,0.55,0.1,1)'][Math.floor(Math.random()*4)]},{transform:T(offset)}];
        }
        track.style.willChange='transform';
        const anim=track.animate(kf,{duration:cfg.time,fill:'forwards'});
        anim.onfinish=()=>{track.style.transform=T(offset);winEl.classList.add('landed');};
        rows.push({anim,track,wrap,step});
      });
      // тики на каждом пересечении предмета маркером (быстро в начале, редко в конце)
      if(!fastSpin&&rows.length){
        let last=-1,lastT=0;
        const loop=()=>{
          if(finished||!rows.length)return;
          const r=rows[0];
          const tx=new DOMMatrix(getComputedStyle(r.track).transform).m41;
          const i=Math.floor((r.wrap.offsetWidth/2-tx)/r.step);
          const now=performance.now();
          if(i!==last){last=i;if(now-lastT>45&&!isMuted){sndTick();lastT=now;}}
          __caseRaf=requestAnimationFrame(loop);
        };
        __caseRaf=requestAnimationFrame(loop);
      }
    }, 50);
  });
  
  let done=false;
  const finish=async()=>{ 
    if(done)return;done=true;finished=true;
    if(__caseRaf){cancelAnimationFrame(__caseRaf);__caseRaf=0;}
    rows.forEach(r=>{try{r.anim.finish();}catch(_){}});
    if(__caseTickInt)clearInterval(__caseTickInt);
    __caseTimers.forEach(t=>clearTimeout(t));__caseTimers=[];__caseFinish=null;
    const addedItems = await settlePendingCase(); 
    const itemsWon=addedItems.map(invItem=>itemById(invItem.itemId)).filter(Boolean);
    const totalVal=itemsWon.reduce((s,i)=>s+i.price,0);
    const bestItem = itemsWon.length ? itemsWon.reduce((a,b)=>a.price>b.price?a:b) : null;
    
    if(bestItem && (isAllIn || totalVal>=(c.isVip&&state.vipMode?c.vipPrice:c.price)*opens)) sndWinRarity(bestItem.rarity);
    else sndLose();
    haptic(totalVal >= (c.isVip&&state.vipMode?c.vipPrice:c.price)*opens ? 'success' : 'light');
    if(!addedItems.length){state.openingView=null;render(true);renderHeader();return;}
    let bar;
    if(opens===1){
      const inv1=addedItems[0],it1=itemById(inv1.itemId);
      bar=`<button class="btn-blue res-btn" onclick="sellResult('${inv1.uid}','${c.id}')">Продать за ${coin(18)} ${fmt(it1?it1.price:0)}</button><button class="btn-dark res-btn" onclick="goBackToCase('${c.id}')">Оставить</button>`;
    }else{
      const uidsStr=addedItems.map(i=>i.uid).join(',');
      bar=`<button class="btn-blue res-btn" onclick="sellMultiResult('${uidsStr}','${c.id}')">Продать всё за ${coin(18)} ${fmt(totalVal)}</button><button class="btn-dark res-btn" onclick="goBackToCase('${c.id}')">Оставить</button>`;
    }
    state.openingView=stageHtml.replace(/<div id="spinHint">[\s\S]*?<\/div><\/div><div id="resBar"/,'<div id="resBar"').replace('<div id="resBar" class="res-bar"></div>','<div id="resBar" class="res-bar show">'+bar+'</div>');
    const sh=document.getElementById('spinHint');if(sh)sh.remove();
    const rb=document.getElementById('resBar');
    if(rb){rb.innerHTML=bar;rb.classList.add('show');}
    renderHeader();
    renderLiveStrip(true);updateLiveDrops();
    const unitP=isAllIn?paidTotal:(c.isVip&&state.vipMode?c.vipPrice:c.price);
    if(bestItem&&unitP>0&&bestItem.price>=2*unitP)bigWinFx({color:(RARITY[bestItem.rarity]||RARITY.common).color,title:'×'+(bestItem.price/unitP).toFixed(bestItem.price/unitP>=10?0:1),sub:bestItem.name});
  };
  __caseFinish=finish;
  __caseTimers.push(setTimeout(finish,animTime+400));
}

function mysteryInfo(){
  const rows=F.MYSTERY_ZONES.map(z=>`<tr><td><b style="color:${MYSTERY_COLORS[z.id]}">${esc(z.name)}</b></td><td>${(z.p*100).toFixed(1)}%</td><td>×${z.lo.toFixed(2)} – ×${z.hi.toFixed(2)}</td></tr>`).join('');
  const ev=F.MYSTERY_ZONES.reduce((s,z)=>s+z.p*(z.lo+z.hi)/2,0);
  $('#modal').innerHTML=`<div class="modal-head"><div class="modal-title">🎲 Mystery Upgrade</div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div style="color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:16px;">Вы ставите предметы и/или монеты (от ${F.MYSTERY_MIN_VALUE}). Сервер сначала бросает зону, затем множитель внутри зоны. Приз = ставка × множитель: вы получаете самый дорогой предмет не дороже приза, а остаток зачисляется монетами. Если подходящего предмета нет, весь приз приходит монетами.</div>
    <div style="overflow-x:auto;"><table class="admin-table"><thead><tr><th>Зона</th><th>Шанс</th><th>Множитель</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div style="margin-top:14px;font-size:14px;color:#fff;">Средний множитель: <b>×${ev.toFixed(2)}</b> (возврат ${(ev*100).toFixed(0)}%). Каждый бросок проверяется в окне «Fair».</div>`;
  $('#overlay').classList.add('open');
}
async function mysteryDo(){
  if(state.upgrade.animating||state.upgrade.busy)return;
  const froms=state.upgrade.froms.slice();
  const bal=Math.floor(state.upgrade.balanceAmount||0);
  if(upgTV()+bal<F.MYSTERY_MIN_VALUE){toast('Минимальная ставка '+F.MYSTERY_MIN_VALUE,'err');return;}
  if(!document.getElementById('upgNeedleRotator'))return;
  state.upgrade.busy=true;
  let d;
  try{d=await api('/api/mystery',{uids:froms,balanceAmount:bal});}
  catch(e){state.upgrade.busy=false;toast(esc(e.message||'Ошибка'),'err');haptic('error');return;}
  state.upgrade.busy=false;
  const needleEl=document.getElementById('upgNeedleRotator');if(!needleEl){applyServerState(d);addHist(d.hist);render(false);return;}
  // зона определена сервером; стрелка встаёт ровно в точку броска (дуги зон пропорциональны шансам)
  const finalDeg=d.roll*360;
  let currentAngle=0;
  const matrix=window.getComputedStyle(needleEl).transform;
  if(matrix&&matrix!=='none'){const m=matrix.match(/matrix\(([^)]+)\)/);if(m){const p=m[1].split(',').map(parseFloat);currentAngle=((Math.atan2(p[1],p[0])*(180/Math.PI))%360+360)%360;}}
  let delta=finalDeg-(currentAngle%360);if(delta<0)delta+=360;
  const spins=5+Math.floor(Math.random()*8);
  const totalRotation=currentAngle+spins*360+delta;
  const duration=(state.settings.upgSpin==='fast'?2000:4000)+Math.random()*1500;
  state.upgrade.animating=true;state.upgrade.lastResult=null;state.upgrade.lastAngle=totalRotation;
  state.balance-=bal;__upgTargetRot=totalRotation;renderHeader();
  const payload={mystery:true,totalRotation,data:d};
  const btn=document.getElementById('upgDoBtn');if(btn){btn.disabled=true;btn.textContent='Крутим...';}
  document.querySelectorAll('.upg-item-card').forEach(el=>el.classList.add('disabled'));
  document.querySelectorAll('.btn-ctrl').forEach(el=>el.disabled=true);
  const slider=document.getElementById('upgSlider');if(slider)slider.disabled=true;
  const labelEl=document.getElementById('upgChanceLabel');if(labelEl){labelEl.textContent='Крутим...';labelEl.style.color='#a855f7';}
  if(__upgTickTimer){clearTimeout(__upgTickTimer);__upgTickTimer=null;}
  if(state.settings.upgradeSound&&!isMuted){
    const t0=performance.now();let last=0;
    const tick=()=>{if(!state.upgrade.animating)return;const el=performance.now()-t0;if(el>duration)return;const n=performance.now();
      if(n-last>25){playTone(1100+Math.random()*80,'triangle',0.015,0.025);last=n;}
      __upgTickTimer=setTimeout(tick,35+Math.pow(Math.min(1,el/duration),2)*950);};
    tick();
  }
  requestAnimationFrame(()=>{void needleEl.offsetWidth;needleEl.style.transition='transform '+duration+'ms cubic-bezier(0.15, 0.9, 0.1, 1)';needleEl.style.transform='rotate('+totalRotation+'deg)';});
  // живое табло: зона под маркером меняется во время вращения
  (function liveZone(){
    const pe=document.getElementById('upgPctBig'),le=document.getElementById('upgChanceLabel');
    let lastId=null;
    const zoneAt=deg=>{const f=(((deg%360)+360)%360)/360;let a=0;for(const z of F.MYSTERY_ZONES){if(f<a+z.p)return z;a+=z.p;}return F.MYSTERY_ZONES[F.MYSTERY_ZONES.length-1];};
    const step=()=>{
      if(!state.upgrade.animating)return;
      const mt=window.getComputedStyle(needleEl).transform;
      if(mt&&mt!=='none'){
        const m=mt.match(/matrix\(([^)]+)\)/);
        if(m){const p=m[1].split(',').map(parseFloat);const z=zoneAt(Math.atan2(p[1],p[0])*180/Math.PI);
          if(z.id!==lastId){lastId=z.id;const col=MYSTERY_COLORS[z.id];
            if(pe)pe.innerHTML='<span class="kz-big" style="color:'+col+';font-size:24px;animation:none;">'+esc(z.name)+'</span>';
            if(le){le.textContent='×'+z.lo.toFixed(2)+'–'+z.hi.toFixed(2);le.style.color=col;}}}
      }
      requestAnimationFrame(step);
    };
    step();
  })();
  if(__upgTimer)clearTimeout(__upgTimer);
  __upgTimer=setTimeout(()=>finishUpgradeSpin(payload),duration+100);
  if(__upgSkipTimeout)clearTimeout(__upgSkipTimeout);
  __upgSkipTimeout=setTimeout(()=>{
    if(!state.upgrade.animating||document.getElementById('skipUpgBtn'))return;
    const cp=document.querySelector('.upg-center-panel');
    if(cp){const sb=document.createElement('button');sb.id='skipUpgBtn';sb.className='btn-ctrl';sb.style.marginTop='12px';sb.innerHTML='⏩ Пропустить';sb.onclick=()=>finishUpgradeSpin(payload);cp.appendChild(sb);}
  },100);
  __upgFinish=()=>finishUpgradeSpin(payload);
}
function finishMystery(payload){
  const d=payload.data;
  applyServerState(d);addHist(d.hist);
  state.upgrade.lastAngle=payload.totalRotation;state.upgrade.lastResult=null;
  state.upgrade.froms=[];state.upgrade.target=null;state.upgrade.balanceAmount=0;
  const it=d.result;
  state.upgrade.lastResult='mystery';
  state.upgrade.lastMystery={zone:d.zone,multiplier:d.multiplier,itemId:it?it.id:null,coins:d.coins,target:d.target,stake:d.stake};
  render(false);renderHeader();saveLocalState();
  if(it){if(state.settings.upgradeSound)sndWinRarity(it.rarity);}else if(state.settings.upgradeSound)sndCash();
  haptic('success');
  renderLiveStrip(true);updateLiveDrops();
  if(d.multiplier>=2)bigWinFx({color:(MYSTERY_COLORS[(d.zone||{}).id])||'#ffc94a',title:'×'+Number(d.multiplier).toFixed(2),sub:(d.zone&&d.zone.name)||'Mystery'});
}

function jackpotLegend(jp,hasTarget){
  if(!F.getUpgrade().jpOn)return '';
  const th=((F.JACKPOT_SHARE*(1+F.JACKPOT_MEAN_EXTRA))*100).toFixed(0);
  if(jp>0)return '<i></i><span><b>Джекпот</b>: стрелка в золотой зоне (5% круга) — гарантированно <b>×1.5</b>, может выпасть до <b>×3</b></span>';
  if(hasTarget)return '<i style="opacity:.35"></i><span>Джекпот включается при шансе без него от '+th+'% (сейчас ниже)</span>';
  return '<i></i><span><b>Джекпот ×1.5–×3</b>: золотая зона — 5% круга, работает при шансе от '+th+'%</span>';
}
function calcUC(fromVal,toPrice){
  return Math.min(100,F.upgradeChance(fromVal,toPrice)*100);
}

function renderUpgrade(){
  cleanUpgradeSelection(); 
  
  const inv=state.inventory.map(i=>({...i,item:itemById(i.itemId)})).filter(x=>x.item&&!x.item.id.startsWith('coin_')).sort((a,b)=>a.item.price-b.item.price);
  const tv=upgTV();
  const balAmount=state.upgrade.balanceAmount||0;
  const totalVal=tv+balAmount;
  const ti=state.upgrade.target?itemById(state.upgrade.target):null;
  const targets=totalVal>0?ITEMS.filter(i=>i.price>totalVal&&!i.id.startsWith('coin_')&&calcUC(totalVal,i.price)>=0.01).sort((a,b)=>a.price-b.price):[];
  let ch = 0;
  let pctText = '0.00%';
  let statusText = 'Победа';
  let statusColor = 'var(--accent)';
  let needleTransform = 'rotate(0deg)';
  let needleTransition = 'none';
  if (state.upgrade.animating) {
    needleTransform = 'rotate(0deg)';
    needleTransition = 'none';
    ch = state.upgrade.lastChance || 0;
    pctText = `${ch.toFixed(2)}%`;
    statusText = 'Крутим...';
    statusColor = 'var(--accent)';
  } else if (state.upgrade.lastResult) {
    ch = state.upgrade.lastChance || 0;
    if (state.upgrade.lastResult === 'win') {
      pctText = '<span style="color:#4ade80;font-size:28px;font-weight:900;text-shadow:0 0 20px rgba(74,222,128,0.5);">УСПЕХ</span>';
      statusText = 'ВЫИГРЫШ';
      statusColor = '#4ade80';
    } else if (state.upgrade.lastResult === 'mystery') {
      const lm=state.upgrade.lastMystery||{};const mc=MYSTERY_COLORS[(lm.zone||{}).id]||'#fff';
      pctText='<span class="kz-big" style="color:'+mc+';font-size:22px;">'+esc((lm.zone||{}).name||'')+'</span>';
      statusText='×'+Number(lm.multiplier||0).toFixed(2);statusColor=mc;
    } else {
      pctText = '<span style="color:#ef4444;font-size:28px;font-weight:900;text-shadow:0 0 20px rgba(239,68,68,0.5);">ПРОВАЛ</span>';
      statusText = 'ПРОИГРЫШ';
      statusColor = '#ef4444';
    }
    needleTransform = `rotate(${state.upgrade.lastAngle % 360}deg)`;
  } else {
    ch = (ti && totalVal > 0) ? calcUC(totalVal, ti.price) : 0;
    pctText = `${ch.toFixed(2)}%`;
    statusText = ch > 0 ? (ch>=40?'Победа':'Риск') : 'Победа';
    needleTransform = `rotate(${(state.upgrade.lastAngle || 0) % 360}deg)`;
  }
  const my=!!state.upgrade.mystery;
  if(my&&!state.upgrade.animating&&!state.upgrade.lastResult){pctText='<span style="font-size:48px;">🎲</span>';statusText='MYSTERY';statusColor='#a855f7';}
  let jp=0;
  if(state.upgrade.animating||state.upgrade.lastResult)jp=state.upgrade.lastJp||0;
  else if(ti&&totalVal>0)jp=F.upgradeParams(totalVal,ti.price).jp;
  const R=140,C=2*Math.PI*R;
  const lrr=state.upgrade.lastResult;
  const showRes=!state.upgrade.animating&&lrr==='mystery';
  const winLen=(ch/100)*C;
  let zAcc=0;
  const zoneArcs=F.MYSTERY_ZONES.map(z=>{const len=z.p*C;const off=-zAcc;zAcc+=len;
    return `<circle cx="160" cy="160" r="${R}" class="upg-dial-progress" stroke-dasharray="${Math.max(0,len-1.5).toFixed(2)} ${(C-len+1.5).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 160 160)" style="stroke:${MYSTERY_COLORS[z.id]};transition:none"/>`;}).join('');
  const legendHtml='<div style="width:100%;padding:8px 4px;">'+F.MYSTERY_ZONES.map(z=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:13px;"><span style="width:10px;height:10px;border-radius:50%;background:${MYSTERY_COLORS[z.id]};flex:none;"></span><b style="color:#fff;flex:1;">${esc(z.name)}</b><span style="color:var(--muted);">${(z.p*100).toFixed(1)}%</span><span style="color:${MYSTERY_COLORS[z.id]};font-weight:800;min-width:92px;text-align:right;">×${z.lo.toFixed(2)}–${z.hi.toFixed(2)}</span></div>`).join('')+'<div style="color:var(--muted);font-size:11px;padding:8px;line-height:1.5;">Приз = ставка × множитель: предмет + остаток монетами. Среднее ×0.90. Чтобы вернуться к обычному апгрейду, выберите цель, x2/x5/x10 или %.</div></div>';
  const selItems=state.upgrade.froms.map(u=>{const inv=state.inventory.find(x=>x.uid===u);return inv?{uid:u,item:itemById(inv.itemId)}:null;}).filter(Boolean);
  const selLeftHtml=selItems.map(it=>`<div class="upg-item-card" style="cursor:default;--rc:${rc(it.item)}"><div class="upg-item-img">${itemIcon(it.item,70)}</div><div class="upg-item-name">${esc(it.item.name)}</div><div class="upg-item-price">${coin(12)} ${fmt(it.item.price)}</div></div>`).join('');
  const selRightHtml=ti?`<div class="upg-target-glow"></div><div class="upg-item-card" style="cursor:default;background:transparent;border:none;z-index:2;width:100%;"><div class="upg-item-img" style="height:160px;margin-bottom:20px;filter:drop-shadow(0 0 30px rgba(251,191,36,0.3));">${itemIcon(ti,150)}</div><div style="font-size:18px;font-weight:900;color:#fff;text-shadow:0 2px 5px #000;">${esc(ti.name)}</div><div style="font-size:16px;font-weight:900;color:var(--gold);margin-top:8px;display:flex;justify-content:center;align-items:center;gap:6px;">${coin(16)} ${fmt(ti.price)}</div></div>`:'';
  const canM=totalVal>0&&!state.upgrade.animating;
  const multBtnsHtml=state.settings.multipliers.map(m=>`<button class="btn-ctrl" ${!canM?'disabled':''} onclick="upgMult(${m})">x${m}</button>`).join('');
  const pctBtnsHtml=state.settings.percentages.map(p=>`<button class="btn-ctrl" ${!canM?'disabled':''} onclick="upgMultPct(${p})">${p}%</button>`).join('');
  let ticks='';
  for(let i=0;i<72;i++){
    const a=(i/72)*Math.PI*2-Math.PI/2;
    const big=i%6===0;
    const r1=big?128:132,r2=140;
    const x1=160+Math.cos(a)*r1,y1=160+Math.sin(a)*r1;
    const x2=160+Math.cos(a)*r2,y2=160+Math.sin(a)*r2;
    ticks+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${big?'#64748b':'#334155'}" stroke-width="${big?2:1}"/>`;
  }
  const myItemsHtml=inv.map(i=>{
    const sel=state.upgrade.froms.includes(i.uid);
    const idx=sel?state.upgrade.froms.indexOf(i.uid)+1:0;
    const dis=state.upgrade.animating?'disabled':'';
    return `<div class="upg-item-card ${sel?'selected':''} ${dis}" style="--rc:${rc(i.item)}" ${state.upgrade.animating?'':`onclick="event.stopPropagation(); upgToggle('${i.uid}')"`}>
      ${sel?`<div style="position:absolute;top:6px;right:6px;background:var(--accent);color:#fff;font-size:11px;font-weight:900;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;z-index:2;box-shadow:0 0 10px var(--accent);">${idx}</div>`:''}
      <div class="upg-item-img">${itemIcon(i.item,60)}</div>
      <div class="upg-item-name">${esc(i.item.name)}</div>
      <div class="upg-item-price">${coin(12)} ${fmt(i.item.price)}</div>
    </div>`;
  }).join('')||'<div class="empty-state" style="grid-column:1/-1"><div class="es-ico">📦</div>Нет предметов</div>';
  const targetsHtml=targets.map(i=>{
    const sel=state.upgrade.target===i.id;
    const c=calcUC(totalVal,i.price);
    const cColor=c>60?'var(--green)':c>30?'var(--gold)':'var(--red)';
    const dis=state.upgrade.animating?'disabled':'';
    return `<div class="upg-item-card ${sel?'selected':''} ${dis}" data-id="${i.id}" style="--rc:${rc(i)}" ${state.upgrade.animating?'':`onclick="event.stopPropagation(); upgPick('${i.id}')"`}>
      <div class="upg-item-img">${itemIcon(i,60)}</div>
      <div class="upg-item-name">${esc(i.name)}</div>
      <div class="upg-item-price">${coin(12)} ${fmt(i.price)}</div>
      <div class="upg-item-chance" style="color:${cColor}">${c<1?c.toFixed(2):c.toFixed(1)}%</div>
    </div>`;
  }).join('')||'<div class="empty-state" style="grid-column:1/-1"><div class="es-ico">🎯</div>Выбери предметы слева</div>';
  const sliderPercent=state.balance>0?(balAmount/state.balance)*100:0;
  return `<div style="display:flex;align-items:center;gap:15px;margin-bottom:20px;flex-wrap:wrap;">
    <div class="page-title" style="margin-bottom:0;">📈 Апгрейд</div>
    <div style="font-size:14px;color:var(--muted);font-weight:600;margin-top:6px;">Выбери предметы → выбери цель → жми Апгрейд</div>

    <div class="upg-top-row">
      <div class="upg-panel">
        <div class="upg-panel-header">Предметы и/или баланс</div>
        <div class="upg-left-body">${selLeftHtml||'<div style="color:#555;font-size:13px;width:100%;text-align:center;margin-top:40px;">Предметы не выбраны</div>'}</div>
        <div class="slider-container">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px;">

            <div id="upgTotalText" style="font-size:14px;font-weight:900;color:#fff;">Итого: ${coin(14)} ${fmt(totalVal)}</div>

        </div>

      <div class="upg-center-panel">

        <div class="upg-dial-wrapper">

            ${ticks}
            <circle cx="160" cy="160" r="110" fill="#0a0e17" stroke="#1e293b" stroke-width="1"/>
          </svg>
          <div class="upg-marker-rotator" id="upgNeedleRotator" style="transform:${needleTransform};transition:${needleTransition};"><div class="upg-arrow-marker"></div></div>
          <div class="upg-dial-inner">
            <div class="upg-pct-text" id="upgPctBig">${pctText}</div>
            <div class="upg-status-text" id="upgChanceLabel" style="color:${statusColor}">${statusText}</div>
          </div>
        </div>
        <button class="btn-upg-main" id="upgDoBtn" style="${my?'background:linear-gradient(135deg,#7c3aed,#a855f7);':''}" ${my?(totalVal<F.MYSTERY_MIN_VALUE||state.upgrade.animating||state.upgrade.busy?'disabled':''):(!totalVal||!ti||state.upgrade.animating?'disabled':'')} onclick="${my?'mysteryDo()':'upgDo()'}">${state.upgrade.animating?'Крутим...':(my?'🎲 MYSTERY UPGRADE':'АПГРЕЙД')}</button>
      </div>
      <div class="upg-panel">
        <div class="upg-panel-header" style="justify-content:space-between;">

      </div>
    </div>
    <div class="upg-ctrl-row">
      <div class="upg-ctrl-left">
        <button class="btn-ctrl spd${state.settings.upgSpin==='fast'?' on':''}" ${state.upgrade.animating?'disabled':''} onclick="toggleUpgSpin()" title="${state.settings.upgSpin==='fast'?'Быстрая крутка: включена':'Быстрая крутка: выключена'}">⚡</button>
        <button class="btn-ctrl" style="${my?'background:rgba(168,85,247,.28);border-color:#a855f7;color:#fff;':''}" ${state.upgrade.animating?'disabled':''} onclick="toggleMystery()" title="Режим Mystery Upgrade">🎲 Mystery</button><button class="btn-ctrl" style="padding:0 10px;" onclick="mysteryInfo()" title="Шансы зон">ℹ️</button>
        <div style="width:1px;height:24px;background:rgba(255,255,255,.1);margin:0 8px;"></div>
        ${multBtnsHtml}${pctBtnsHtml}

function verifyBet(bet,seed){
  const out={hashOk:sha256(seed)===bet.seedHash,ok:false,lines:[]};
  const prevRtp=F.getRtp(),prevUp=F.getUpgrade();F.setRtp(bet.rtp||0.9); // RTP на момент ставки
  if(bet.game==='upgrade')F.setUpgrade(bet.upRtp!==undefined?bet.upRtp:null,bet.upRtp!==undefined?bet.jpOn:true); // старые ставки: как раньше
  try{
    const r=(c)=>F.roll(seed,bet.clientSeed,bet.nonce,c);
    if(bet.game==='upgrade'){
      const t=itemById(bet.targetId);const UPv=F.upgradeParams(bet.value,t.price);const ch=UPv.chance;const roll=r(0);
      out.lines.push(['Бросок',roll.toFixed(8)],['Шанс',(ch*100).toFixed(4)+'%'],['Результат',roll<ch?'выигрыш':'проигрыш']);
      const isJp=F.isJackpot(roll,ch,UPv.jp);const jm=isJp?F.jackpotMultiplier(r(1)):0;
      out.lines.push(['Джекпот',UPv.jp>0?(isJp?'да, ×'+jm:'нет'):'недоступен (шанс слишком мал)']);
      out.ok=Math.abs(roll-bet.roll)<1e-12&&(roll<ch)===bet.win&&isJp===!!bet.jackpot&&(!isJp||Math.abs(jm-(bet.jpMult||0))<1e-9);
    }else if(bet.game==='case'){
      if(bet.allIn){
        const m=F.allInMultiplier(r(0),r(1),bet.allInRtp||0.9);const p=F.pickItemForTarget(PRICE_LIST,bet.bet*m,r(2),r(3));
        out.lines.push(['Множитель ставки',m.toFixed(4)+'×'],['Предмет',(itemById(p.id)||{}).name]);
        out.ok=p.id===bet.itemId&&Math.abs(m-bet.multiplier)<1e-9;
      }else{
        const c=CASES.find(x=>x.id===bet.caseId);const pool=bet.pool||(c.isVip?(bet.vip?c.vipItems:c.normalItems):c.items); // bet.pool — шансы на момент ставки
        const roll=r(0);const p=F.pickWeighted(pool,roll);
        out.lines.push(['Бросок',roll.toFixed(8)],['Предмет',(itemById(p.id)||{}).name]);
        out.ok=p.id===bet.itemId;
      }
    }else if(bet.game==='mystery'){
      const z=F.mysteryZone(r(0));const m=F.mysteryMultiplier(z,r(1));const tg=Math.round(bet.value*m*100)/100;const p=F.pickItemAtMost(PRICE_LIST,tg);
      out.lines.push(['Зона',z.name],['Множитель',m.toFixed(4)+'×'],['Приз',String(tg)],['Предмет',p?(itemById(p.id)||{}).name:'нет, только монеты']);
      out.ok=z.id===bet.zone&&(p?p.id:null)===bet.itemId;
    }else if(bet.game==='fuse'){
      const m=F.fuseMultiplier(r(0));const p=F.pickItemForTarget(PRICE_LIST,bet.total*m,r(1),r(2));
      out.lines.push(['Множитель',m.toFixed(4)+'×'],['Предмет',(itemById(p.id)||{}).name]);
      out.ok=p.id===bet.itemId;
    }else if(bet.game==='mines'){
      const pos=F.minePositions(seed,bet.clientSeed,bet.nonce,bet.mines);
      out.lines.push(['Мины',pos.join(', ')]);
      out.ok=JSON.stringify(pos)===JSON.stringify(bet.positions);
    }
  }catch(e){out.lines.push(['Ошибка',String(e.message||e)]);}
  finally{F.setRtp(prevRtp);F.setUpgrade(prevUp.upRtp,prevUp.jpOn);}
  return out;
}

async function upgDo(){
  if(state.upgrade.animating || state.upgrade.busy) return;
  const froms = state.upgrade.froms;
  const balToSpend = Math.floor(state.upgrade.balanceAmount || 0);
  if(!froms.length && balToSpend === 0) return;
  const fromItems = froms.map(u => {
    const i = state.inventory.find(x => x.uid === u);
    return i ? itemById(i.itemId) : null;
  }).filter(Boolean);
  const toItem = itemById(state.upgrade.target);
  if(!toItem || (!fromItems.length && balToSpend === 0)) return;
  if(toItem.id.startsWith('coin_') || fromItems.some(i => i.id.startsWith('coin_'))){toast('Монеты нельзя использовать','err');return;}
  if (!document.getElementById('upgNeedleRotator')) return;

  // результат определяет сервер; анимация только показывает уже готовый бросок
  state.upgrade.busy = true;
  let data;
  try{ data = await api('/api/upgrade', {uids: froms, balanceAmount: balToSpend, targetId: toItem.id}); }
  catch(e){ state.upgrade.busy = false; toast(esc(e.message || 'Ошибка апгрейда'), 'err'); haptic('error'); return; }
  state.upgrade.busy = false;
  const needleEl = document.getElementById('upgNeedleRotator');
  if (!needleEl) { render(false); return; }

  const cp = data.chance * 100;
  const roll = data.roll;
  const win = !!data.win;
  // сектор победы занимает [0, cp×3.6°]; стрелка встаёт ровно в точку броска
  const finalDeg = roll * 360;

  let currentAngle = 0;
  const matrix = window.getComputedStyle(needleEl).transform;
  if (matrix && matrix !== 'none') {
    const m = matrix.match(/matrix\(([^)]+)\)/);
    if (m) {
      const parts = m[1].split(',').map(parseFloat);
      currentAngle = Math.atan2(parts[1], parts[0]) * (180/Math.PI);
      currentAngle = ((currentAngle % 360) + 360) % 360;
    }
  }
  const spins = 5 + Math.floor(Math.random()*10);
  let delta = finalDeg - (currentAngle % 360);
  if (delta < 0) delta += 360;
  const totalRotation = currentAngle + spins * 360 + delta;
  const duration = (state.settings.upgSpin === 'fast' ? 2000 : 4000) + Math.random()*2000;
  const chosenEasing = 'cubic-bezier(0.15, 0.9, 0.1, 1)';

  state.upgrade.animating = true;
  state.upgrade.lastResult = null;
  state.upgrade.lastChance = cp;
  state.upgrade.lastJp = data.jp || 0;
  state.upgrade.lastAngle = totalRotation;
  state.balance -= balToSpend;
  __upgTargetRot = totalRotation;
  renderHeader();
  const payload = {win, cp, roll, totalRotation, toItem, data};
  const btn = document.getElementById('upgDoBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = 'Крутим...'; }
  document.querySelectorAll('.upg-item-card').forEach(el => el.classList.add('disabled'));
  document.querySelectorAll('.btn-ctrl').forEach(el => el.disabled = true);
  const slider = document.getElementById('upgSlider');
  if (slider) slider.disabled = true;
  const pctEl = document.getElementById('upgPctBig');
  if (pctEl) pctEl.textContent = `${cp.toFixed(2)}%`;
  const labelEl = document.getElementById('upgChanceLabel');
  if (labelEl) { labelEl.textContent = 'Крутим...'; labelEl.style.color = 'var(--accent)'; }
  
  if (__upgTickTimer) { clearTimeout(__upgTickTimer); __upgTickTimer = null; }
  if (state.settings.upgradeSound && !isMuted) {
    const startTime = performance.now();
    let lastTickAt = 0;
    const playNextTick = () => {
      if (!state.upgrade.animating) return;
      const elapsed = performance.now() - startTime;
      if (elapsed > duration) return;
      const now = performance.now();
      if (now - lastTickAt > 25) {
        playTone(1100 + Math.random()*80, 'triangle', 0.015, 0.025);
        lastTickAt = now;
      }
      const progress = Math.min(1, elapsed / duration);
      const interval = 35 + Math.pow(progress, 2) * 950;
      __upgTickTimer = setTimeout(playNextTick, interval);
    };
    playNextTick();
  }
  requestAnimationFrame(() => {
    void needleEl.offsetWidth;
    needleEl.style.transition = `transform ${duration}ms ${chosenEasing}`;
    needleEl.style.transform = `rotate(${totalRotation}deg)`;
  });
  if (__upgTimer) clearTimeout(__upgTimer);
  __upgTimer = setTimeout(() => {
    finishUpgradeSpin(payload);
  }, duration + 100);
  if (__upgSkipTimeout) clearTimeout(__upgSkipTimeout);
  __upgSkipTimeout = setTimeout(() => {
    if (!state.upgrade.animating) return;
    if (document.getElementById('skipUpgBtn')) return;
    const centerPanel = document.querySelector('.upg-center-panel');
    if (centerPanel) {
      const skipBtn = document.createElement('button');
      skipBtn.id = 'skipUpgBtn';
      skipBtn.className = 'btn-ctrl';
      skipBtn.style.marginTop = '12px';
      skipBtn.innerHTML = '⏩ Пропустить';
      skipBtn.onclick = () => { finishUpgradeSpin(payload); };
      centerPanel.appendChild(skipBtn);
    }
  }, 100);
  __upgFinish = () => finishUpgradeSpin(payload);
}

    <button class="inv-sort-btn ${sort==='price_desc'?'active':''}" onclick="setInventorySort('price_desc')">↓ Цена</button>
    <button class="inv-sort-btn ${sort==='price_asc'?'active':''}" onclick="setInventorySort('price_asc')">↑ Цена</button>
    <button class="inv-sort-btn ${sort==='date_desc'?'active':''}" onclick="setInventorySort('date_desc')">↓ Новые</button>
    <button class="inv-sort-btn ${sort==='date_asc'?'active':''}" onclick="setInventorySort('date_asc')">↑ Старые</button>
    <span class="inv-label" style="margin-left:16px;">Фильтр:</span>
    <button class="inv-sort-btn ${state.inventoryFilter==='all'?'active':''}" onclick="setInventoryFilter('all')">Все</button>
    ${['common','rare','epic','legendary','mythic','god'].map(r=>`<button class="inv-sort-btn ${state.inventoryFilter===r?'active':''}" onclick="setInventoryFilter('${r}')" style="${state.inventoryFilter===r?'border-color:'+RARITY[r].color+';color:'+RARITY[r].color:''}">${RARITY[r].label}</button>`).join('')}
  </div>
  <div style="margin-bottom:32px;display:flex;gap:16px;flex-wrap:wrap;">
    <button class="btn btn-danger" onclick="sellAll()" ${!items.length?'disabled':''}>Продать всё за ${coin(16)} ${fmt(t)}</button>
  </div>
  <div class="inv-grid">${cards}</div>`;
}
function sellOne(uid){
  const inv = state.inventory.find(i=>i.uid===uid);
  if(!inv) return;
  const it = itemById(inv.itemId);
  if(!it) return;
  showConfirm(`Продать «${it.name}» за ${fmt(it.price)}?`, () => {
    apiSellItems([{ uid: uid, price: it.price }], (data) => {
        addHist(data.hist);
        sndCash(); haptic('success');
        toast(`Продан ${esc(it.name)} за ${coin(16)} ${fmt(it.price)}`, 'ok');
        preserveScroll(() => render(false));
    });
  });
}
function sellAll(){
  const itemsToSell = state.inventory.map(i => {
      const it = itemById(i.itemId);
      return it ? { uid: i.uid, price: it.price, itemId: it.id } : null;
  }).filter(Boolean);

  const total = itemsToSell.reduce((s, i) => s + i.price, 0);
  if(total<=0) return;

  showConfirm(`Продать все предметы за ${fmt(total)} монет?`, () => {
    apiSellItems(itemsToSell, (data) => {
        addHist(data.hist);
        sndCash(); haptic('success');
        toast(`Продано всё за ${coin(16)} ${fmt(total)}`, 'ok');
        preserveScroll(() => render(false));
    });
  });
}
function quickUpg(uid){
  state.upgrade.froms = [uid];
  state.upgrade.target = null;
  state.upgrade.balanceAmount = 0;
  state.upgrade.lastResult = null;
  setTab('upgrade');
}

function openDepositModal(preselectId) {
  if (state.isDemo) { toast('💡 Депозит доступен только через Telegram-бота', 'warning'); return; }
  state.deposit.step = 1;
  state.deposit.selected = new Map();
  state.deposit.searchQuery = '';
  state.deposit.sort = 'asc';
  state.deposit.minPrice = '';
  state.deposit.maxPrice = '';
  state.deposit.robloxUsername = state.user?.robloxName || '';
  state.deposit.promo = state.pendingPromo || ''; state.pendingPromo = '';
  state.deposit.timerLeft = 300;
  
  if (preselectId) {
    state.deposit.selected.set(preselectId, 1);
    state.deposit.step = 2;
  }
  
  renderDepositModal();
  $('#overlay').classList.add('open');
}

function getTotalSelectedCount() {
  let total = 0;
  state.deposit.selected.forEach(count => total += count);
  return total;
}

function updateDepositQuantity(id, delta) {
  const current = state.deposit.selected.get(id) || 0;
  const available = 10; 
  
  if (delta > 0) {
    if (getTotalSelectedCount() >= 10) {
      return toast('Максимум 10 предметов за раз', 'err');
    }
    if (current >= available) {
      return toast('Максимум 10 таких предметов', 'err');
    }
  }
  
  const newCount = current + delta;
  if (newCount <= 0) {
    state.deposit.selected.delete(id);
  } else {
    state.deposit.selected.set(id, newCount);
  }
  preserveScroll(() => renderDepositModal());
}

function renderDepositModal() {
  const d = state.deposit;
  let content = '';
  
  const headerHtml = `
    <div class="modal-head">
      <div class="modal-title">Депозит</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
  `;

  if (d.step === 1) {
    let pool = ITEMS.filter(item => 
      !item.id.startsWith('coin_') && 
      item.price >= 45 
    ).map(item => ({
      item: item,
      available: 10 
    }));
    
    if (d.searchQuery) pool = pool.filter(x => x.item.name.toLowerCase().includes(d.searchQuery.toLowerCase()));
    
    if (d.sort === 'asc') pool.sort((a,b) => a.item.price - b.item.price);
    else pool.sort((a,b) => b.item.price - a.item.price);

    const cards = pool.map(data => {
      const item = data.item;
      const selCount = d.selected.get(item.id) || 0;
      const finalPrice = Math.floor(item.price * DEPOSIT_RATE);
      return `<div class="dep-card ${selCount > 0 ? 'selected' : ''}">
        <div class="dep-img">${itemIcon(item, 60)}</div>
        <div class="dep-name">${esc(item.name)}</div>
        <div class="dep-price">${coin(12)} ${fmt(finalPrice)}</div>
        
        <div class="dep-qty-ctrl">
          <button class="dep-qty-btn" onclick="updateDepositQuantity('${item.id}', -1)" ${selCount === 0 ? 'disabled' : ''}>-</button>
          <span class="dep-qty-val">${selCount} шт</span>
          <button class="dep-qty-btn" onclick="updateDepositQuantity('${item.id}', 1)" ${selCount >= data.available ? 'disabled' : ''}>+</button>
        </div>
      </div>`;
    }).join('') || '<div class="empty-state" style="grid-column:1/-1;padding:20px;">Нет подходящих предметов</div>';

    content = `
      <div class="dep-header">
        <div style="font-size:12px; font-weight:800; color:#a78bfa; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;">ШАГ 1 ИЗ 2</div>
        <div class="dep-title">Выбери брейнротов</div>
        <div class="dep-subtitle">
          Выбери предметы, которые будешь кидать в трейд.<br>
          Стоимость зачисления: 100% от цены предмета (как при продаже).
        </div>
      </div>
      
      <input class="dep-search" type="text" placeholder="Найти брейнрота" value="${esc(d.searchQuery)}" oninput="updateDepositSearch(this.value)">
      
      <div class="dep-grid">${cards}</div>
      
      <div class="dep-total-bar">
        <div class="dep-total-info">
          <div>
            <div class="dep-total-lbl">Получишь на баланс</div>
            <div style="font-size:12px; color:#94a3b8; margin-top:2px;">За выбранные предметы</div>
          </div>
          <div class="dep-total-val">
            ${coin(24)} ${fmt(Array.from(d.selected.entries()).reduce((s, [id, count]) => s + (itemById(id).price * 1.3 * count), 0))}
          </div>
        </div>
        <button class="btn-purple" ${d.selected.size === 0 ? 'disabled' : ''} onclick="depositNextStep()">
          Продолжить - ${getTotalSelectedCount()} шт. →
        </button>
      </div>
    `;
  } 
  else if (d.step === 2) {
    let total = 0;
    let itemsHtml = '';
    
    d.selected.forEach((count, id) => {
      const item = itemById(id);
      if (!item) return;
      const finalPrice = Math.floor(item.price * DEPOSIT_RATE);
      total += finalPrice * count;
      
      itemsHtml += `
        <div class="dep-sum-item">
          <div class="dep-sum-left">
            <div style="width:40px; height:40px; flex-shrink:0; display:flex; align-items:center; justify-content:center;">
               ${itemIcon(item, 36)}
            </div>
            <div style="display:flex; flex-direction:column; gap:2px; min-width:0;">
              <span style="font-weight:700;font-size:14px;color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(item.name)}</span>
              <span style="color:var(--accent); font-weight:900; font-size:12px;">x${count}</span>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:12px; flex-shrink:0;">
            <span style="font-weight:800; font-size:14px; color:var(--gold); display:flex; align-items:center; gap:4px;">
              ${coin(14)} ${fmt(finalPrice * count)}
            </span>
            <button class="dep-sum-remove" onclick="updateDepositQuantity('${id}', -${count})">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>
        </div>
      `;
    });

    content = `
      <span class="dep-back" onclick="depositBackStep()">‹ Назад</span>
      <div style="font-size:12px;color:var(--muted);margin-bottom:12px;">Депозит (${getTotalSelectedCount()} предм.)</div>
      
      <div style="margin-bottom:16px;max-height:200px;overflow-y:auto;">
        ${itemsHtml}
      </div>
      
      <div class="dep-input-group">
        <label>ПРОМОКОД (необязательно)</label>
        <input type="text" class="dep-input" id="depPromo" placeholder="Код с баннера" maxlength="20" autocomplete="off" value="${esc(d.promo)}" oninput="updateDepositPromo(this.value.toUpperCase())">
        <div id="depPromoPrev" style="font-size:12px;font-weight:700;margin-top:6px;min-height:16px;">${depPromoCalc(total).msg}</div>
      </div>

      <div class="dep-total-box">
        <span style="font-weight:800;color:#fff;">Всего получишь</span>
        <span id="depTotalVal" style="font-weight:900;color:var(--gold);font-size:20px;display:flex;align-items:center;gap:8px;">${coin(20)} ${fmt(total+depPromoCalc(total).bonus)}</span>
      </div>
      
      <div class="dep-input-group">
        <label>ROBLOX-ЮЗЕРНЕЙМ</label>
        <input type="text" class="dep-input" id="depRobloxName" placeholder="Например: daveminioniscool" value="${esc(d.robloxUsername)}" oninput="updateDepositRoblox(this.value)">
      </div>
      
      <button class="btn-purple" id="depSubmitBtn" onclick="submitDeposit()" ${!d.robloxUsername.trim() ? 'disabled' : ''}>СОЗДАТЬ ЗАЯВКУ</button>
    `;
  }
  else if (d.step === 3) {
    let totalItems = 0;
    d.selected.forEach(count => totalItems += count);
    let itemsList = [];
    d.selected.forEach((count, id) => {
      const item = itemById(id);
      if(item) itemsList.push(`${item.name} (x${count})`);
    });

    content = `
      <div class="dep-queue-box">
        <div class="dep-queue-badge">ОЖИДАНИЕ ПОДТВЕРЖДЕНИЯ</div>
        <div class="dep-timer" id="depTimer">05:00</div>
        <div class="dep-instructions">
          Отправь трейд аккаунту ниже в игре <b>Steal a Brainrot</b>.<br>
          Баланс зачислится только после того, как админ подтвердит получение предметов в Discord.
        </div>
        
        <div class="dep-target-box">
          <div class="lbl">КОМУ ОТПРАВИТЬ ТРЕЙД</div>
          <div class="dep-target-name">${BOT_ROBLOX_NAME}</div>
          <button class="dep-copy-btn" onclick="copyTradeName()">Скопировать ник</button>
        </div>
        
        <div class="dep-pets-list">Предметы (${totalItems} шт): ${esc(itemsList.join(', '))}</div>
        
        <button class="dep-cancel-btn" onclick="cancelDeposit()">ОТМЕНИТЬ ЗАЯВКУ</button>
      </div>
    `;
  }

  $('#modal').innerHTML = headerHtml + content;
}

function updateDepositSearch(val) {
  state.deposit.searchQuery = val;
  preserveScroll(() => renderDepositModal());
  const input = document.querySelector('.dep-search');
  if(input) {
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }
}

function updateDepositRoblox(val) {
  state.deposit.robloxUsername = val;
  const btn = document.getElementById('depSubmitBtn');
  if (btn) btn.disabled = !val.trim();
}

function depositNextStep() {
  if (state.deposit.selected.size === 0) return;
  state.deposit.step = 2;
  renderDepositModal();
}

function depositBackStep() {
  state.deposit.step = 1;
  renderDepositModal();
}

async function submitDeposit() {
  const d = state.deposit;
  const btn = document.getElementById('depSubmitBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'СОЗДАНИЕ...'; }

  let totalAmount = 0;
  const itemsPayload = [];
  
  d.selected.forEach((count, id) => {
    const item = itemById(id);
    if (item) {
      const finalPrice = Math.floor(item.price * DEPOSIT_RATE);
      totalAmount += finalPrice * count;
      itemsPayload.push({ itemId: id, name: item.name, price: finalPrice, count: count });
    }
  });

  try {
    const response = await secureFetch(`${SERVER_URL}/api/deposit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        tgId: state.user.id,
        username: state.user.username,
        robloxName: d.robloxUsername,
        items: itemsPayload,
        promo: (d.promo||'').trim(),
        totalAmount: totalAmount
      })
    });

    if (!response.ok) {
        const errData = await response.json().catch(() => ({}));
        throw new Error(errData.error || 'Сервер вернул ошибку ' + response.status);
    }
    
    const data = await response.json();

    if (state.user) state.user.robloxName = d.robloxUsername;

    d.step = 3;
    renderDepositModal();
    startDepositTimer();
    startStatusPolling(data.requestId, data.totalAmount||totalAmount); 
    
    haptic('success');

  } catch (error) {
    console.error(error);
    toast(`Ошибка: ${error.message}`, 'err');
    haptic('error');
    if (btn) { btn.disabled = false; btn.textContent = 'СОЗДАТЬ ЗАЯВКУ'; }
  }
}

function startStatusPolling(requestId, finalAmount) {
  if (__depositPollingInterval) clearInterval(__depositPollingInterval);
  
  __depositPollingInterval = setInterval(async () => {
    try {
      const res = await secureFetch(`${SERVER_URL}/api/deposit-status/${requestId}`);
      const data = await res.json();

      if (data.status === 'approved') {
        clearInterval(__depositPollingInterval);
        if (__depositTimerInt) clearInterval(__depositTimerInt);
        
        if (Number.isFinite(Number(data.balance))) state.balance = Number(data.balance);
        else await apiSync();
        await apiSync();
        saveLocalState(); renderHeader();
        
        sndCash(); haptic('success');
        $('#modal').innerHTML = `
          <div style="text-align:center; padding:40px 20px;">
            <div style="font-size:80px; margin-bottom:20px;">✅</div>
            <h2 style="font-size:28px; font-weight:900; color:#fff; margin-bottom:10px;">Депозит подтвержден!</h2>
            <p style="color:var(--muted); margin-bottom:24px;">Вам начислено ${fmt(finalAmount)} монет.</p>
            <button class="btn btn-primary" style="width:100%;" onclick="closeModal()">Отлично</button>
          </div>
        `;
      } 
      else if (data.status === 'rejected') {
        clearInterval(__depositPollingInterval);
        if (__depositTimerInt) clearInterval(__depositTimerInt);
        
        haptic('error'); sndLose();
        $('#modal').innerHTML = `
          <div style="text-align:center; padding:40px 20px;">
            <div style="font-size:80px; margin-bottom:20px;">❌</div>
            <h2 style="font-size:28px; font-weight:900; color:#fff; margin-bottom:10px;">Заявка отклонена</h2>
            <p style="color:var(--muted); margin-bottom:24px;">Администратор отклонил ваш депозит.</p>
            <button class="btn btn-ghost" style="width:100%;" onclick="closeModal()">Закрыть</button>
          </div>
        `;
      }
    } catch (e) { console.log('Ожидание ответа...'); }
  }, 2000);
}

function startDepositTimer() {
  if (__depositTimerInt) clearInterval(__depositTimerInt);
  const update = () => {
    const el = document.getElementById('depTimer');
    if (!el) return;
    const m = Math.floor(state.deposit.timerLeft / 60);
    const s = state.deposit.timerLeft % 60;
    el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    
    if (state.deposit.timerLeft <= 0) {
      clearInterval(__depositTimerInt);
      el.textContent = '00:00';
      if(__depositPollingInterval) clearInterval(__depositPollingInterval);
      toast('Время на отправку трейда истекло', 'err');
      closeModal();
      return;
    }
    state.deposit.timerLeft--;
  };
  update();
  __depositTimerInt = setInterval(update, 1000);
}

function copyTradeName() {
  navigator.clipboard.writeText(BOT_ROBLOX_NAME).then(() => {
    toast('Ник скопирован!', 'ok');
    haptic('success');
  });
}

function cancelDeposit() {
  if (__depositTimerInt) clearInterval(__depositTimerInt);
  if (__depositPollingInterval) clearInterval(__depositPollingInterval);
  toast('Окно закрыто. Если вы уже отправили трейд, заявка всё равно будет обработана и монеты придут на баланс.', 'warning');
  closeModal();
}

async function withdrawItem(uid) {
    if (state.isDemo) { toast('💡 Вывод доступен только через Telegram-бота', 'warning'); return; }
    const invItem = state.inventory.find(i => i.uid === uid);
    if (!invItem) return;
    const item = itemById(invItem.itemId);
    if (!item) return;

    showPrompt('Введите ваш ник в Roblox для вывода:', state.user?.robloxName || '', async (robloxName) => {
        showConfirm(`Вывести «${item.name}» в игру Roblox?\nУчтите, что вывод происходит вручную по расписанию.`, async () => {
            try {
                const response = await secureFetch(`${SERVER_URL}/api/withdraw`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tgId: state.user.id,
                        username: state.user.username,
                        robloxName: robloxName,
                        robloxId: state.user?.robloxId || 'Не указан',
                        items: [{ uid: invItem.uid, name: item.name, price: item.price }]
                    })
                });

                if (!response.ok) throw new Error('Ошибка сервера');

                state.inventory = state.inventory.filter(i => i.uid !== uid);
                await apiSync();
                saveLocalState();
                preserveScroll(() => render(false));
                toast(`Заявка на вывод ${item.name} создана! Ожидайте выдачи в игре.`, 'ok');
                haptic('success');

            } catch (error) {
                console.error(error);
                toast('Ошибка связи с сервером. Проверьте заявку в Discord.', 'err');
            }
        });
    });
}
