<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Brainrot Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', system-ui, -apple-system, sans-serif !important; -webkit-tap-highlight-color: transparent; }
input, button, select, textarea, optgroup, option { font-family: inherit !important; }

:root{
  --bg:#070a12; --bg2:#0f172a; --surface:rgba(15,23,42,.85); --surface-solid:#111827;
  --border:rgba(56,189,248,.12); --border-strong:rgba(56,189,248,.3);
  --text:#f8fafc; --muted:#94a3b8; --accent:#38bdf8; --accent-deep:#0ea5e9;
  --accent2:#06b6d4; --accent2-deep:#0891b2; --gold:#fbbf24; --gold-dim:#f59e0b;
  --green:#34d399; --red:#f87171; --pink:#f472b6; --purple:#a78bfa;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --radius:20px; --radius-sm:12px; --glow-blue:0 0 40px rgba(56,189,248,.25); --glow-cyan:0 0 40px rgba(34,211,238,.2);
  --shadow-lg:0 20px 40px -10px rgba(0,0,0,.6);
}
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
html{scroll-behavior:smooth;background-color:var(--bg)}
body{background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::-webkit-scrollbar{width:6px;height:6px} ::-webkit-scrollbar-track{background:transparent} ::-webkit-scrollbar-thumb{background:#334155;border-radius:10px} ::-webkit-scrollbar-thumb:hover{background:#475569}

.live-item.new-drop{border-color:rgba(56,189,248,.5)!important;background:rgba(56,189,248,.1)!important}

#loginScreen{position:fixed;inset:0;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;background:var(--bg)}
#loginScreen.show{display:flex}
#loginScreen::before{content:'';position:absolute;inset:0;pointer-events:none}
.login-card{position:relative;background:rgba(15,23,42,.85);border:1px solid var(--border-strong);border-radius:28px;padding:40px 30px;max-width:400px;width:100%;box-shadow:0 25px 80px rgba(0,0,0,.55),var(--glow-blue)}
.login-logo{width:100px;height:100px;background:linear-gradient(135deg,#0ea5e9,#06b6d4);border-radius:28px;margin:0 auto 20px;display:grid;place-items:center;font-size:50px;position:relative}
.login-logo img{width:80px;height:80px}
.login-title{font-size:32px;font-weight:900;margin-bottom:8px;color:#fff;letter-spacing:-.02em}
.login-sub{color:var(--muted);font-size:15px;margin-bottom:20px;line-height:1.5}
.spinner{width:30px;height:30px;border:3px solid rgba(56,189,248,0.3);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:20px auto 0;}
@keyframes spin{to{transform:rotate(360deg)}}

.app{display:none;min-height:100vh;position:relative;z-index:2}
.app.logged-in{display:flex}
.mobile-nav{display:none}
.sidebar{width:260px;flex-shrink:0;background:rgba(10,14,23,.5);border-right:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30}
.logo{height:80px;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid rgba(255,255,255,.05)}
.logo img{width:44px !important;height:44px !important;border-radius:12px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(56,189,248,.4))}
.logo-text{font-weight:900;font-size:20px;color:#fff;letter-spacing:-.02em}
.nav{flex:1;overflow-y:auto;padding:20px 16px}
.nav-section{margin-bottom:32px}
.nav-section-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.15em;color:#64748b;padding:0 12px;margin-bottom:12px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.nav-item{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;font-size:15px;font-weight:600;color:#cbd5e1;cursor:pointer;transition:all .3s var(--ease);margin-bottom:4px;position:relative}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.08);transform:translateX(4px)}
.nav-item.active{color:#fff;background:linear-gradient(90deg,rgba(56,189,248,.2),transparent);box-shadow:inset 2px 0 0 var(--accent);text-shadow:0 0 10px rgba(255,255,255,.3)}
.nav-item .ico{width:24px;display:grid;place-items:center;font-size:18px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.5))}
.sidebar-profile{padding:20px;border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:14px;cursor:pointer;transition:background .3s;background:rgba(0,0,0,.1)}
.sidebar-profile:hover{background:rgba(56,189,248,.15)}
.profile-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#0ea5e9,#22d3ee);display:grid;place-items:center;font-size:18px;font-weight:800;overflow:hidden;box-shadow:0 0 20px rgba(14,165,233,.4)}
.profile-avatar img{width:100%;height:100%;object-fit:cover;}
.profile-info{flex:1;min-width:0}
.profile-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.profile-status{font-size:12px;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:4px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.header{height:72px;position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;padding:0 32px;background:rgba(10,14,23,.8);border-bottom:1px solid rgba(255,255,255,.05);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.balance{display:flex;align-items:center;gap:12px;padding:10px 20px;border-radius:16px;background:rgba(0,0,0,.5);border:1px solid rgba(251,191,36,.2);font-weight:800;font-size:18px;box-shadow:0 4px 20px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.05);color:#fff;font-variant-numeric:tabular-nums}
.balance .coin{display:grid;place-items:center}
.btn{border:none;cursor:pointer;font-weight:700;font-size:14px;padding:10px 20px;border-radius:14px;transition:all .3s var(--ease);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.15),transparent 60%);opacity:.6;pointer-events:none}
.btn-primary{background:linear-gradient(135deg,#0ea5e9,#0284c7);box-shadow:0 4px 20px rgba(14,165,233,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(14,165,233,.5)}
.btn-accent{background:linear-gradient(135deg,#22d3ee,#06b6d4);color:#042f2e;box-shadow:0 4px 20px rgba(34,211,238,.3)}
.btn-accent:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(34,211,238,.5)}
.btn-ghost{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);color:var(--text)}
.btn-ghost:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
.btn-danger{background:linear-gradient(135deg,#f43f5e,#e11d48);box-shadow:0 4px 20px rgba(244,63,94,.3)}
.btn-danger:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(244,63,94,.5)}
.btn-sm{padding:8px 16px;font-size:13px;border-radius:10px}
.btn-lg{padding:16px 36px;font-size:16px;border-radius:16px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.content{flex:1;padding:32px;max-width:1600px;width:100%;margin:0 auto}
.content.page-enter{animation:pi .5s var(--ease) both}
@keyframes pi{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.page-title{font-size:32px;font-weight:900;margin-bottom:8px;color:#fff;letter-spacing:-.02em}
.page-sub{color:var(--muted);font-size:15px;margin-bottom:32px}
.hero{background:linear-gradient(135deg,rgba(56,189,248,.15),rgba(14,165,233,.05));border:1px solid rgba(56,189,248,.2);border-radius:28px;padding:48px;margin-bottom:32px;position:relative;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.3)}
.hero h1{font-size:42px;font-weight:900;margin-bottom:12px;letter-spacing:-.03em;line-height:1.15;max-width:700px;color:#fff;text-shadow:0 4px 15px rgba(0,0,0,.5)}
.hero p{color:#cbd5e1;font-size:16px;max-width:500px;line-height:1.6;margin-bottom:24px;text-shadow:0 2px 5px rgba(0,0,0,.5)}

.top-drop-banner{background:linear-gradient(135deg,rgba(251,191,36,.1),rgba(0,0,0,.4));border:1px solid rgba(251,191,36,.3);border-radius:24px;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 0 20px rgba(251,191,36,.05);position:relative;overflow:hidden;cursor:pointer;transition:all .3s}
.top-drop-banner:hover{border-color:rgba(251,191,36,.6);transform:translateY(-3px);box-shadow:0 15px 40px rgba(0,0,0,.5),inset 0 0 30px rgba(251,191,36,.1)}
.top-drop-content{display:flex;align-items:center;gap:20px;z-index:1}
.top-drop-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.15em;color:var(--gold);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.top-drop-info{display:flex;flex-direction:column}
.top-drop-name{font-size:22px;font-weight:900;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.5)}
.top-drop-user{font-size:14px;color:var(--muted);margin-top:2px}
.top-drop-price{font-size:28px;font-weight:900;color:var(--gold);text-shadow:0 0 20px rgba(251,191,36,.5);display:flex;align-items:center;gap:12px;z-index:1}
.live-bar{background:rgba(15,23,42,.6);border:1px solid rgba(255,255,255,.05);border-radius:20px;padding:16px 20px;margin-bottom:32px;display:flex;align-items:center;gap:20px;overflow:hidden}
.live-head{display:flex;align-items:center;gap:10px;flex-shrink:0;border-right:1px solid rgba(255,255,255,.1);padding-right:20px}
.dot{width:8px;height:8px;background:var(--red);border-radius:50%;box-shadow:0 0 12px var(--red);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.5)}}
.live-list{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px; align-items:center;}
.live-list::-webkit-scrollbar{display:none}
.live-item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);padding:8px 16px;border-radius:14px;min-width:max-content;transition:all .2s;cursor:pointer; position:relative;}
.live-item:hover{background:rgba(255,255,255,.08);transform:translateY(-2px)}
.li-name{font-size:13px;font-weight:700;color:#fff;line-height:1.2}
.li-user{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px;}
.li-case-badge{font-size:9px;background:rgba(56,189,248,.15);color:var(--accent);padding:2px 6px;border-radius:4px;font-weight:800;text-transform:uppercase;}
.cases-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
.case-card{background:linear-gradient(180deg,rgba(30,41,59,.7),rgba(15,23,42,.9));border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:28px;cursor:pointer;transition:all .4s var(--ease);position:relative;overflow:hidden;display:flex;flex-direction:column}
.case-card:hover{border-color:rgba(56,189,248,.5);box-shadow:var(--shadow-lg),0 0 40px rgba(56,189,248,.15)}
.case-img{height:200px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,rgba(56,189,248,.15),transparent 70%);border-radius:20px;margin-bottom:24px;position:relative;font-size:80px;padding:10px;overflow:hidden}
.case-img img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 20px 30px rgba(0,0,0,.8));transition:transform .4s var(--spring)}
.case-card:hover .case-img img{transform:scale(1.05) rotate(2deg)}
.case-body{display:flex;flex-direction:column;flex:1}
.case-name{font-size:20px;font-weight:800;margin-bottom:24px;text-align:center;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.5)}
.case-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:20px;border-top:1px solid rgba(255,255,255,.05)}
.case-price{font-size:18px;font-weight:900;color:var(--gold);display:flex;align-items:center;gap:8px;text-shadow:0 0 10px rgba(251,191,36,.3)}
.case-footer .btn{padding:12px 24px;font-size:15px;border-radius:12px;background:linear-gradient(135deg,#0ea5e9,#0284c7);box-shadow:0 4px 15px rgba(14,165,233,.3)}
.all-in-card{border:1px solid rgba(244,63,94,.4);background:linear-gradient(180deg,rgba(244,63,94,.1),rgba(15,23,42,.95))}
.all-in-card:hover{border-color:rgba(244,63,94,.8);box-shadow:var(--shadow-lg),0 0 50px rgba(244,63,94,.25)}
.all-in-card .case-price{color:var(--red);text-shadow:0 0 15px rgba(244,63,94,.5)}
.all-in-card .case-img{background:radial-gradient(circle at center,rgba(244,63,94,.2),transparent 70%)}
.case-badge{position:absolute;top:20px;right:20px;z-index:2;font-size:12px;font-weight:900;padding:8px 16px;border-radius:24px;text-transform:uppercase;letter-spacing:.08em;box-shadow:0 4px 15px rgba(0,0,0,.4)}
.badge-hot{background:rgba(244,63,94,.2);color:#f43f5e;border:1px solid rgba(244,63,94,.5)}
.case-back{background:transparent;border:none;color:var(--muted);font-size:15px;font-weight:700;cursor:pointer;margin-bottom:24px;display:inline-flex;align-items:center;gap:10px;transition:color .2s}
.case-back:hover{color:#fff}
.case-detail{display:grid;grid-template-columns:380px 1fr;gap:40px;align-items:start}
@media(max-width:950px){.case-detail{grid-template-columns:1fr}}
.case-detail-img{background:radial-gradient(circle at 50% 50%,rgba(56,189,248,.15) 0%,#0f172a 75%);border:2px solid rgba(56,189,248,.2);border-radius:32px;height:340px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;box-shadow:inset 0 0 60px rgba(0,0,0,.6);font-size:140px;padding:20px;overflow:hidden}
.case-detail-img img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 20px 40px rgba(0,0,0,.8))}
.case-stat-grid{display:flex;flex-direction:column;gap:12px}
.case-stat{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:20px;display:flex;justify-content:space-between;align-items:center}
.case-stat .lbl{font-size:14px;color:var(--muted);font-weight:700}
.case-stat .val{font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px;color:#fff}
.case-title{font-size:42px;font-weight:900;margin-bottom:12px;line-height:1.1;color:#fff}
.case-title-sub{color:var(--muted);font-size:16px;margin-bottom:24px}
.case-desc-long{background:rgba(56,189,248,.05);border:1px solid rgba(56,189,248,.15);border-left:4px solid var(--accent);border-radius:16px;padding:24px;font-size:16px;color:#cbd5e1;line-height:1.6;margin-bottom:32px}
.case-open-panel{background:rgba(15,23,42,.8);border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:36px;box-shadow:0 20px 50px rgba(0,0,0,.4)}

.roulette-wrap{position:relative;overflow:hidden;background:#0a0e17;border:3px solid var(--border-strong);border-radius:20px;box-shadow:inset 0 0 50px rgba(0,0,0,.8);width:100%;box-sizing:border-box}
.roulette-marker{position:absolute;top:0;bottom:0;left:50%;width:4px;background:var(--red);transform:translateX(-50%);z-index:10;box-shadow:0 0 20px var(--red);border-radius:2px}
.roulette-track{display:flex;flex-direction:row;align-items:center;gap:12px;height:100%;will-change:transform;transform:translate3d(0,0,0);}
.roulette-item{display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(56,189,248,.05);border:1px solid var(--border);border-radius:16px;flex-shrink:0;transition:border-color .2s,transform .2s}
.roulette-item.near-marker{transform:scale(1.05)}
.roulette-item.landed{border-color:var(--gold);box-shadow:0 0 30px rgba(251,191,36,.6);background:rgba(251,191,36,.1)}
.roulette-item.rarity-common{border-color:rgba(148,163,184,.35)}
.roulette-item.rarity-rare{border-color:rgba(56,189,248,.55);box-shadow:inset 0 0 12px rgba(56,189,248,.06)}
.roulette-item.rarity-epic{border-color:rgba(167,139,250,.62);box-shadow:inset 0 0 14px rgba(167,139,250,.08)}
.roulette-item.rarity-legendary{border-color:rgba(251,191,36,.7);box-shadow:inset 0 0 16px rgba(251,191,36,.09)}
.roulette-item.rarity-mythic{border-color:rgba(244,63,94,.72);box-shadow:inset 0 0 18px rgba(244,63,94,.1)}
.roulette-item.rarity-god{border-color:rgba(45,212,191,.82);box-shadow:inset 0 0 20px rgba(45,212,191,.12)}
.case-drop-card{animation:dropCardIn .32s ease both}
@keyframes dropCardIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

.roulette-item-name{font-size:13px;font-weight:700;text-align:center;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}

.all-in-stage-new{position:relative;width:100%;min-height:80vh;background:radial-gradient(circle at center,rgba(244,63,94,.15) 0%,#000 80%);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;border:1px solid rgba(244,63,94,.4);box-shadow:inset 0 0 100px rgba(244,63,94,.2);padding:20px;box-sizing:border-box}
.all-in-multiplier{font-size:120px;font-weight:900;color:#fff;text-shadow:0 0 50px rgba(244,63,94,0.8), 0 0 100px rgba(244,63,94,0.4);transition:all 0.1s linear;position:relative;z-index:5;font-variant-numeric:tabular-nums; line-height:1;}
.all-in-multiplier.losing{color:#f43f5e;text-shadow:0 0 50px rgba(244,63,94,0.8);}
.all-in-multiplier.winning{color:#fbbf24;text-shadow:0 0 50px rgba(251,191,36,0.8);}
.all-in-subtext{font-size:20px;font-weight:800;color:#cbd5e1;margin-top:20px;z-index:5;text-align:center;}
.all-in-bg-text-new{position:absolute;font-size:200px;font-weight:900;color:rgba(255,255,255,0.02);text-transform:uppercase;letter-spacing:20px;pointer-events:none;user-select:none;z-index:1;white-space:nowrap}

.multi-opening-stage{background:rgba(15,23,42,0.9);border:1px solid var(--border-strong);border-radius:24px;padding:32px;text-align:center;margin:0 auto;max-width:1200px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.multi-result-title{font-size:36px;font-weight:900;color:#fff;margin-bottom:24px;letter-spacing:-0.02em}
.multi-result-total{margin-bottom:32px;display:inline-flex;flex-direction:column;align-items:center;background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.3);border-radius:16px;padding:16px 40px}
.multi-result-total .lbl{font-size:14px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-bottom:6px;letter-spacing:0.05em}
.multi-result-total .val{font-size:32px;font-weight:900;color:var(--gold);display:flex;align-items:center;justify-content:center;gap:10px}
.multi-result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-bottom:32px;max-height:55vh;overflow-y:auto;padding-right:8px}
.multi-result-item{background:linear-gradient(180deg,rgba(15,23,42,.95) 0%,rgba(10,14,23,.95) 100%);border:1px solid var(--border);border-radius:16px;padding:20px 12px;position:relative;overflow:hidden;transition:all .25s;display:flex;flex-direction:column;align-items:center;justify-content:center}
.multi-result-item .strip{position:absolute;top:0;left:0;right:0;height:4px}
.multi-result-item .nm{font-size:14px;font-weight:700;margin:12px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.multi-result-item .pr{font-size:16px;font-weight:800;color:var(--gold);display:flex;justify-content:center;align-items:center;gap:6px}
.multi-result-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.multi-result-actions .btn{font-size:16px;padding:14px 32px;border-radius:14px}

.upg-layout{display:flex;flex-direction:column;gap:20px}
.upg-top-row{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:20px;align-items:stretch}
@media(max-width:1100px){.upg-top-row{grid-template-columns:1fr}}
.upg-panel{background:rgba(15,23,42,.9);border:1px solid rgba(255,255,255,.05);border-radius:12px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:inset 0 0 20px rgba(0,0,0,.5)}

/* --- анимация крутки и экран результата апгрейда --- */
@keyframes kzspin{to{transform:rotate(360deg)}}
@keyframes kzpulse{0%,100%{opacity:.25}50%{opacity:.65}}
@keyframes kzblink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes kzpop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.kz-scan{position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 50%,rgba(16,185,129,.38) 0%,rgba(4,30,22,.96) 68%)}
.kz-scan::before{content:'';position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 50%,transparent 0 16px,rgba(52,211,153,.07) 16px 17px)}
.kz-ring{position:absolute;left:50%;top:50%;border:3px solid #34d399;border-radius:50%;box-shadow:0 0 20px rgba(52,211,153,.55),inset 0 0 20px rgba(52,211,153,.25);animation:kzspin 6s linear infinite}
.kz-ring i{position:absolute;top:-8px;left:50%;margin-left:-6px;width:12px;height:12px;border-radius:50%;background:#a7f3d0;box-shadow:0 0 12px #34d399}
.kz-ring.r1{width:300px;height:300px;margin:-150px 0 0 -150px;animation-duration:7s}
.kz-ring.r2{width:216px;height:216px;margin:-108px 0 0 -108px;animation-duration:5s;animation-direction:reverse}
.kz-ring.r3{width:132px;height:132px;margin:-66px 0 0 -66px;animation-duration:3.4s}
.kz-ghost{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);animation:kzpulse 1.3s ease-in-out infinite;filter:blur(1px) drop-shadow(0 0 18px rgba(52,211,153,.7))}
.kz-res{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 50%,#6ee7b7 0%,#10b981 24%,#065f46 62%,#022c22 100%)}
.kz-res::before{content:'';position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.2) 0 3deg,transparent 3deg 13deg);animation:kzspin 50s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 0%,transparent 60%);mask-image:radial-gradient(circle,#000 0%,transparent 60%)}
.kz-res.lose{background:radial-gradient(circle at 50% 50%,#7f1d1d 0%,#450a0a 55%,#1c0606 100%)}
.kz-res.lose::before{background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.07) 0 3deg,transparent 3deg 13deg)}
.kz-item{position:relative;z-index:2;animation:kzpop .5s ease-out both;filter:drop-shadow(0 8px 24px rgba(0,0,0,.55))}
.kz-res.lose .kz-item{filter:grayscale(.85) brightness(.7) drop-shadow(0 8px 24px rgba(0,0,0,.6))}
.kz-price{position:absolute;right:14px;top:12px;z-index:3;font-weight:900;font-size:18px;color:#fff;display:flex;gap:6px;align-items:center;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.kz-tag{position:absolute;left:14px;top:12px;z-index:3;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.08em;padding:4px 10px;border-radius:6px;background:rgba(0,0,0,.45)}
.kz-name{position:absolute;left:14px;bottom:12px;right:14px;z-index:3;text-shadow:0 2px 6px rgba(0,0,0,.7)}
.kz-name b{display:block;font-size:20px;font-weight:900;color:#fff}
.kz-name span{display:block;font-size:13px;font-weight:700;color:rgba(255,255,255,.7);margin-top:2px}
.kz-bar{width:100%;max-width:300px;height:50px;border-radius:8px;border:2px solid #10b981;background:linear-gradient(135deg,#065f46,#10b981);display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 0 24px rgba(16,185,129,.4)}
.kz-bar b{width:11px;height:11px;background:#d1fae5;animation:kzblink 1s infinite}
.kz-bar b:nth-child(2){animation-delay:.2s}.kz-bar b:nth-child(3){animation-delay:.4s}
.upg-dial-wrapper.kz-spin .upg-marker-rotator{opacity:0}
.upg-dial-wrapper.kz-spin .upg-dial-progress{stroke-dasharray:none!important;stroke:#34d399!important}
.upg-dial-wrapper.kz-spin .upg-dial-bg{stroke:#0b3b2c}
.kz-q{position:absolute;top:26px;left:0;right:0;text-align:center;font-size:26px;font-weight:900;color:#34d399;z-index:3}

let sessionToken = null;
let pendingRequests = 0;

async function secureFetch(url, options = {}) {
    pendingRequests++;
    if (sessionToken) {
        if (!options.headers) options.headers = {};
        options.headers['Authorization'] = sessionToken;
    }
    try {
        const res = await fetch(url, options);
        return res;
    } finally {
        pendingRequests--;
    }
}


(function(){

  if(tg){try{tg.ready();tg.expand();if(tg.setHeaderColor)tg.setHeaderColor('#070a12');if(tg.setBackgroundColor)tg.setBackgroundColor('#070a12');}catch(e){}}
})();

function haptic(type){
  try{
    const tg=window.Telegram?.WebApp;
    if(!tg?.HapticFeedback)return;
    if(type==='light')tg.HapticFeedback.impactOccurred('light');
    else if(type==='medium')tg.HapticFeedback.impactOccurred('medium');
    else if(type==='heavy')tg.HapticFeedback.impactOccurred('heavy');
    else if(type==='success')tg.HapticFeedback.notificationOccurred('success');
    else if(type==='error')tg.HapticFeedback.notificationOccurred('error');
    else if(type==='warning')tg.HapticFeedback.notificationOccurred('warning');
  }catch(e){}
}

let audioCtx,isMuted=false,masterGain;
function initAudio(){if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();masterGain=audioCtx.createGain();masterGain.gain.value=0.2;masterGain.connect(audioCtx.destination);}if(audioCtx.state==='suspended')audioCtx.resume();}
function toggleSound(){isMuted=!isMuted;document.getElementById('soundToggle').textContent=isMuted?'🔇':'🔊';haptic('light');}
function playTone(freq,type,duration,vol=0.1,slideTo=null){if(!audioCtx||isMuted)return;try{const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();const filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=2000;osc.type=type;osc.frequency.setValueAtTime(freq,audioCtx.currentTime);if(slideTo)osc.frequency.exponentialRampToValueAtTime(slideTo,audioCtx.currentTime+duration);gain.gain.setValueAtTime(0,audioCtx.currentTime);gain.gain.linearRampToValueAtTime(vol,audioCtx.currentTime+0.03);gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+duration);osc.connect(filter);filter.connect(gain);gain.connect(masterGain);osc.start();osc.stop(audioCtx.currentTime+duration);}catch(e){}}
function sndClick(){playTone(800,'sine',0.08,0.05,600);}
function sndTick(){playTone(1200,'triangle',0.03,0.06);}

  const tones={
    common:[523.25,659.25], rare:[523.25,659.25,783.99], epic:[523.25,659.25,783.99,1046.50],

  };
  const freqs=tones[rarity]||tones.common;
  freqs.forEach((f,i)=>setTimeout(()=>playTone(f,'sine',0.6,0.1),i*80));

async function api(path, body, method){
  if(state.isDemo) return demoApi(path, body);
  const opts = {method: method || (body ? 'POST' : 'GET')};
  if(body){ opts.headers = {'Content-Type':'application/json'}; opts.body = JSON.stringify(body); }
  const res = await secureFetch(SERVER_URL + path, opts);
  const data = await res.json().catch(() => ({}));
  if(!res.ok || data.success === false) throw new Error(data.error || ('Ошибка сервера ' + res.status));
  return data;
}
/* ===== демо-режим: локальный эмулятор сервера (результаты случайные, проверка честности недоступна) ===== */
async function demoApi(path, body) {
  body = body || {};
  const money = x => Math.round(x * 100) / 100;
  const ok = extra => Object.assign({ success: true, balance: state.balance, inventory: state.inventory }, extra);
  const isCoin = id => id.indexOf('coin_') === 0;
  const give = itemId => { const e = { uid: uuid(), itemId, date: Date.now() }; state.inventory.push(e); return e; };
  const owned = (uids, allowCoins) => {
    if (!Array.isArray(uids) || !uids.length) throw new Error('Выберите предметы');
    if (new Set(uids).size !== uids.length) throw new Error('Повторяющиеся предметы');
    return uids.map(u => {
      const inv = state.inventory.find(i => i.uid === u); if (!inv) throw new Error('Предмет не найден');
      const it = itemById(inv.itemId); if (!it) throw new Error('Неизвестный предмет');
      if (!allowCoins && isCoin(it.id)) throw new Error('Монеты нельзя использовать');
      return it;
    });
  };
  const drop = uids => { const s = new Set(uids); state.inventory = state.inventory.filter(i => !s.has(i.uid)); };
  const rnd = Math.random;

  if (path === '/api/case/open') {
    const c = CASES.find(x => x.id === body.caseId); if (!c) throw new Error('Кейс не найден');
    const results = [], hist = []; let charged = 0;
    if (c.isAllIn) {
      const bet = Math.floor(state.balance);
      if (bet < F.ALLIN_MIN) throw new Error('ALL IN доступен от ' + F.ALLIN_MIN + ' монет');
      if (bet > F.ALLIN_MAX) throw new Error('ALL IN доступен до ' + F.ALLIN_MAX + ' монет');
      state.balance = money(state.balance - bet); charged = bet;
      const pick = F.pickItemForTarget(PRICE_LIST, bet * F.allInMultiplier(rnd(), rnd()), rnd(), rnd());
      const it = itemById(pick.id), e = give(it.id);
      results.push({ id: it.id, uid: e.uid, date: e.date, price: it.price, rarity: it.rarity });
      hist.push({ type: 'case', caseId: c.id, caseName: c.name, itemId: it.id, uid: e.uid, date: e.date, paid: bet, itemPrice: it.price, rarity: it.rarity });
    } else {
      const count = Math.floor(Number(body.count) || 1);
      if (count < 1 || count > 10) throw new Error('От 1 до 10 кейсов за раз');
      const vip = !!(c.isVip && body.vipMode);
      const unit = c.isVip && vip ? c.vipPrice : c.price;
      const total = money(unit * count);
      if (state.balance < total) throw new Error('Недостаточно монет');
      state.balance = money(state.balance - total); charged = total;
      const pool = c.isVip ? (vip ? c.vipItems : c.normalItems) : c.items;
      for (let k = 0; k < count; k++) {
        const it = itemById(F.pickWeighted(pool, rnd()).id), e = give(it.id);
        results.push({ id: it.id, uid: e.uid, date: e.date, price: it.price, rarity: it.rarity });
        hist.push({ type: 'case', caseId: c.id, caseName: c.name, itemId: it.id, uid: e.uid, date: e.date, paid: unit, itemPrice: it.price, rarity: it.rarity });
      }
    }
    return ok({ results, charged, allIn: !!c.isAllIn, hist });
  }
  if (path === '/api/sell') {
    const items = owned(body.uids, true);
    const total = money(items.reduce((s, i) => s + i.price, 0));
    drop(body.uids); state.balance = money(state.balance + total);
    const now = Date.now();
    return ok({ added: total, hist: items.map(i => ({ type: 'sell', itemId: i.id, price: i.price, date: now })) });
  }
  if (path === '/api/upgrade') {
    const uids = body.uids || [];
    const items = uids.length ? owned(uids) : [];
    const bal = Math.floor(Number(body.balanceAmount) || 0);
    if (bal < 0 || bal > state.balance) throw new Error('Недостаточно монет');
    const target = itemById(body.targetId);
    if (!target || isCoin(target.id)) throw new Error('Неверная цель апгрейда');
    const value = money(items.reduce((s, i) => s + i.price, 0) + bal);
    if (value < 10) throw new Error('Минимальная ставка апгрейда 10');
    if (target.price <= value) throw new Error('Цель должна стоить дороже ставки');
    const chance = F.upgradeChance(value, target.price);
    if (chance < 0.0001) throw new Error('Шанс меньше 0.01% — выберите цель дешевле');
    const roll = rnd(), win = roll < chance;
    state.balance = money(state.balance - bal); drop(uids);
    const item = win ? give(target.id) : null;
    const h = { type: win ? 'upgrade_win' : 'upgrade_lose', id: uuid(), fromId: items.length ? items[0].id : 'coins', toId: target.id, stake: value, date: Date.now() };
    return ok({ win, roll, chance, item, hist: [h] });
  }
  if (path === '/api/mystery') {
    const uids = body.uids || [];
    const items = uids.length ? owned(uids) : [];
    const bal = Math.floor(Number(body.balanceAmount) || 0);
    if (bal < 0 || bal > state.balance) throw new Error('Недостаточно монет');
    const value = money(items.reduce((s, i) => s + i.price, 0) + bal);
    if (value < F.MYSTERY_MIN_VALUE) throw new Error('Минимальная ставка ' + F.MYSTERY_MIN_VALUE);
    const zone = F.mysteryZone(rnd());
    const multiplier = F.mysteryMultiplier(zone, rnd());
    const target = money(value * multiplier);
    const pick = F.pickItemAtMost(PRICE_LIST, target);
    const result = pick ? itemById(pick.id) : null;
    const coins = money(target - (result ? result.price : 0));
    state.balance = money(state.balance - bal + coins); drop(uids);
    const item = result ? give(result.id) : null;
    return ok({ zone: { id: zone.id, name: zone.name }, multiplier, target, item, result, coins, stake: value,
      hist: [{ type: 'mystery', id: uuid(), zoneId: zone.id, multiplier, stake: value, itemId: result ? result.id : null, itemPrice: result ? result.price : 0, coins, date: Date.now() }] });
  }
  if (path === '/api/fuse') {
    const uids = body.uids || [];
    if (uids.length < 2) throw new Error('Выберите минимум 2 предмета');
    const items = owned(uids);
    const total = money(items.reduce((s, i) => s + i.price, 0));
    if (total < F.FUSE_MIN_VALUE) throw new Error('Минимальная сумма фьюза ' + F.FUSE_MIN_VALUE);
    const multiplier = F.fuseMultiplier(rnd());
    const pick = F.pickItemForTarget(PRICE_LIST, total * multiplier, rnd(), rnd());
    const res = itemById(pick.id); drop(uids);
    const item = give(res.id);
    return ok({ item, result: res, total, multiplier, hist: [{ type: 'fuse', itemId: res.id, totalValue: total, date: Date.now() }] });
  }
  const g = state.demoMines;
  const pub = () => {
    if (!g) return null;
    const mult = g.revealed.length ? F.minesMultiplier(g.revealed.length, g.mines) : 1;
    return { active: true, bet: g.bet, mines: g.mines, revealed: g.revealed.slice(), multiplier: mult,
      nextMultiplier: F.minesMultiplier(g.revealed.length + 1, g.mines), cashout: Math.min(1000000, Math.floor(g.bet * mult)) };
  };
  if (path === '/api/mines/state') return ok({ game: pub() });
  if (path === '/api/mines/start') {
    if (g) throw new Error('Игра уже идёт');
    const bet = Math.floor(Number(body.bet)), mines = Math.floor(Number(body.mines));
    if (!(bet >= 100)) throw new Error('Минимальная ставка 100');
    if (!(mines >= 1 && mines <= 24)) throw new Error('Мин должно быть от 1 до 24');
    if (bet > state.balance) throw new Error('Недостаточно монет');
    state.balance = money(state.balance - bet);
    const s = new Set(); while (s.size < mines) s.add(Math.floor(rnd() * 25));
    state.demoMines = { bet, mines, positions: Array.from(s), revealed: [] };
    return ok({ game: (() => { const x = state.demoMines; return { active: true, bet, mines, revealed: [], multiplier: 1, nextMultiplier: F.minesMultiplier(1, mines), cashout: 0 }; })() });
  }
  const finish = won => {
    const mult = g.revealed.length ? F.minesMultiplier(g.revealed.length, g.mines) : 1;
    const payout = won ? Math.min(1000000, Math.floor(g.bet * mult)) : 0;
    state.balance = money(state.balance + payout);
    const out = { finished: true, exploded: !won, positions: g.positions.slice(), payout, multiplier: won ? mult : 0,
      hist: [won ? { type: 'mines_win', bet: g.bet, mult, win: payout, date: Date.now() } : { type: 'mines_lose', bet: g.bet, date: Date.now() }] };
    state.demoMines = null;
    return ok(out);
  };
  if (path === '/api/mines/reveal') {
    if (!g) throw new Error('Нет активной игры');
    const i = Math.floor(Number(body.index));
    if (!(i >= 0 && i <= 24) || g.revealed.includes(i)) throw new Error('Нельзя открыть эту клетку');
    g.revealed.push(i);
    if (g.positions.includes(i)) return finish(false);
    if (g.revealed.length >= 25 - g.mines) return finish(true);
    return ok({ finished: false, exploded: false, game: pub() });
  }
  if (path === '/api/mines/cashout') {
    if (!g) throw new Error('Нет активной игры');
    if (!g.revealed.length) throw new Error('Откройте хотя бы одну клетку');
    return finish(true);
  }
  throw new Error('В демо-режиме это недоступно: ' + path);
}

function applyServerState(d){
  if(d && d.balance != null) state.balance = Number(d.balance);
  if(d && Array.isArray(d.inventory)) state.inventory = d.inventory;
  updateBalance(state.balance);
}

async function apiSync() {
  if (!state.user || state.isDemo) return;
  if (pendingRequests > 0 || state.upgrade.animating || __pendingCase || __openingCase) return;
  try {
    const res = await secureFetch(`${SERVER_URL}/api/state/${state.user.id}`);
    if (!res.ok) return;
    const data = await res.json();
    if (data.banned) { showLoginError('Аккаунт заблокирован.'); document.getElementById('loginScreen').classList.add('show'); return; }
    state.balance = data.balance || 0;
    state.inventory = data.inventory || [];
    try {
      const hres = await secureFetch(`${SERVER_URL}/api/history`);
      if (hres.ok) {
        const sh = await hres.json();
        if (Array.isArray(sh)) state.history = sh.slice().reverse().slice(-500);
      }
    } catch (_) {}
    saveLocalState();
    updateBalance(state.balance);
    renderHeader();
  } catch(e) { console.log('Ошибка синхронизации', e); }
}

async function apiSellItems(itemsToSell, onSuccess) {
  if (!state.user) return;
  try {
    const data = await api('/api/sell', { uids: itemsToSell.map(x => x.uid) });
    applyServerState(data);
    saveLocalState();
    renderHeader();
    if (onSuccess) onSuccess(data);
  } catch(e) { toast(esc(e.message || 'Ошибка при продаже'), 'err'); }
}

    return list[list.length - 1];
  }

  /* ---------- апгрейд ---------- */
  // шанс = RTP * стоимость ставки / цена цели. Без нижних и верхних «подкруток».
  function upgradeChance(value, targetPrice) {
    if (!(value > 0) || !(targetPrice > 0)) return 0;
    return (RTP * value) / targetPrice;
  }

  /* ---------- мины ---------- */
  function minePositions(serverSeed, clientSeed, nonce, mines) {
    const arr = [];
    for (let i = 0; i < 25; i++) arr.push(i);
    for (let i = 24; i >= 1; i--) {
      const j = Math.floor(roll(serverSeed, clientSeed, nonce, 24 - i) * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr.slice(0, mines).sort((a, b) => a - b);
  }
  function minesMultiplier(revealed, mines) {
    let m = 1;
    for (let i = 0; i < revealed; i++) m *= (25 - i) / (25 - mines - i);
    return m * RTP;
  }

  /* ---------- «денежные» результаты (ALL IN, фьюз) ----------
   * Нужный предмет подбирается так, чтобы МАТОЖИДАНИЕ цены было ровно равно цели:
   * берём ближайшие предметы снизу (L) и сверху (U) от цели и выбираем U с вероятностью
   * (цель - L) / (U - L). Это убирает перекос из-за того, что цены предметов дискретны.
   */
  function pickItemForTarget(prices, target, r1, r2) {
    // prices: массив {id, price}, отсортированный по цене по возрастанию, без монет
    const first = prices[0], last = prices[prices.length - 1];
    if (target <= first.price) return first;
    if (target >= last.price) return last;
    let lo = 0, hi = prices.length - 1;
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      if (prices[mid].price <= target) lo = mid; else hi = mid;
    }
    const L = prices[lo].price;
    let U = prices[hi].price;
    if (L === target) return pickAmongPrice(prices, L, r2);
    const pU = (target - L) / (U - L);
    return r1 < pU ? pickAmongPrice(prices, U, r2) : pickAmongPrice(prices, L, r2);
  }
  function pickAmongPrice(prices, price, r) {
    const same = prices.filter(p => p.price === price);
    return same[Math.min(same.length - 1, Math.floor(r * same.length))];
  }

  // ALL IN: множитель ставки. Среднее ровно 0.90.
  const ALLIN_SEGMENTS = [
    { p: 0.45, lo: 0.10, hi: 0.60 },
    { p: 0.30, lo: 0.60, hi: 1.00 },
    { p: 0.15, lo: 1.00, hi: 1.60 },
    { p: 0.08, lo: 1.60, hi: 3.00 },
    { p: 0.02, lo: 3.00, hi: 9.35 }
  ];
  const ALLIN_MIN = 500, ALLIN_MAX = 20000;
  function allInMultiplier(r1, r2) {
    let x = r1;
    for (const s of ALLIN_SEGMENTS) {
      if (x < s.p) return s.lo + (s.hi - s.lo) * r2;
      x -= s.p;
    }
    const s = ALLIN_SEGMENTS[ALLIN_SEGMENTS.length - 1];
    return s.lo + (s.hi - s.lo) * r2;
  }

  // фьюз: множитель равномерно 0.5…1.3, среднее 0.90
  const FUSE_MIN_VALUE = 100;
  function fuseMultiplier(r) { return 0.5 + 0.8 * r; }

  /* ---------- Mystery Upgrade ----------
   * Шесть фиксированных зон. Сначала бросок зоны, потом множитель внутри зоны.
   * Приз = ставка × множитель: самый дорогой предмет не дороже приза + остаток монетами.
   * Матожидание множителя ровно 0.90 (40%·0.275 + 30%·0.975 + 21.5%·1.3 + 6%·2.0 + 1.5%·3.2 + 1%·5.0).
   */
  const MYSTERY_ZONES = [
    { id: 'consolation', name: 'Утешительный', p: 0.40,  lo: 0.20, hi: 0.35 },
    { id: 'breakeven',   name: 'В ноль',       p: 0.30,  lo: 0.90, hi: 1.05 },
    { id: 'small_plus',  name: 'Лёгкий плюс',  p: 0.215, lo: 1.20, hi: 1.40 },
    { id: 'big_plus',    name: 'Крупный плюс', p: 0.06,  lo: 1.50, hi: 2.50 },
    { id: 'jackpot',     name: 'Джекпот',      p: 0.015, lo: 2.50, hi: 3.90 },
    { id: 'ultra',       name: 'Ультра-дроп',  p: 0.01,  lo: 4.00, hi: 6.00 }
  ];
  const MYSTERY_MIN_VALUE = 10;
  function mysteryZone(r) {
    let x = r;
    for (const z of MYSTERY_ZONES) { if (x < z.p) return z; x -= z.p; }
    return MYSTERY_ZONES[MYSTERY_ZONES.length - 1];
  }
  function mysteryMultiplier(zone, r) { return zone.lo + (zone.hi - zone.lo) * r; }
  // самый дорогой предмет с ценой <= target (prices отсортирован по возрастанию); null, если все дороже
  function pickItemAtMost(prices, target) {
    let best = null;
    for (const p of prices) { if (p.price <= target) best = p; else break; }
    return best;
  }

  return {
    RTP, roll, pickWeighted, upgradeChance, minePositions, minesMultiplier,
    pickItemForTarget, allInMultiplier, ALLIN_SEGMENTS, ALLIN_MIN, ALLIN_MAX,
    fuseMultiplier, FUSE_MIN_VALUE,
    MYSTERY_ZONES, MYSTERY_MIN_VALUE, mysteryZone, mysteryMultiplier, pickItemAtMost
  };
});

const F=makeFair((k,m)=>hmacSha256(k,m));
function hmacSha256(key,message){
  const blockSize=64;
  const hexToBin=h=>{let o='';for(let i=0;i<h.length;i+=2)o+=String.fromCharCode(parseInt(h.substr(i,2),16));return o;};
  if(key.length>blockSize)key=hexToBin(sha256(key));
  while(key.length<blockSize)key+='\x00';
  let o='',n='';
  for(let i=0;i<blockSize;i++){const c=key.charCodeAt(i);o+=String.fromCharCode(c^0x5c);n+=String.fromCharCode(c^0x36);}
  return sha256(o+hexToBin(sha256(n+message)));
}

let __displayedBalance = 0;
let __balanceTarget = 0;
let __balanceAnimId = null;
function updateBalance(newVal){
  __balanceTarget = newVal;
  if(__balanceAnimId) return;
  const step = () => {
    const diff = __balanceTarget - __displayedBalance;
    if(Math.abs(diff) < 0.5){
      __displayedBalance = __balanceTarget;
      const el = $('#balanceEl');
      if(el) el.textContent = fmt(Math.round(__displayedBalance));
      __balanceAnimId = null;
      return;
    }
    __displayedBalance += diff * 0.15;
    const el = $('#balanceEl');
    if(el) el.textContent = fmt(Math.round(__displayedBalance));
    __balanceAnimId = requestAnimationFrame(step);
  };
  __balanceAnimId = requestAnimationFrame(step);
}

function processToastQueue(){
  if(__toastRunning || !__toastQueue.length) return;
  __toastRunning = true;
  const {m, t} = __toastQueue.shift();
  const e = $('#toast');
  if(!e){ __toastRunning = false; return; }

async function settlePendingCase(){
  const pending=__pendingCase;
  if(!pending||pending.settled)return[];
  pending.settled=true;
  const added=[];
  for(const r of pending.results){
    const it=itemById(r.id);if(!it)continue;
    added.push({uid:r.uid,itemId:it.id,date:r.date||Date.now()});
  }
  __pendingCase=null;
  saveLocalState();
  return added;
}

function cancelAnimations(){
  if(__pendingCase)settlePendingCase();
  if(typeof __upgFinish==='function')__upgFinish();
  __caseTimers.forEach(t=>clearTimeout(t));__caseTimers=[];
  __upgTimers.forEach(t=>clearTimeout(t));__upgTimers=[];
  if(__upgTimer)clearTimeout(__upgTimer);
  if(__upgSkipTimeout)clearTimeout(__upgSkipTimeout);
  if(__upgTickTimer)clearTimeout(__upgTickTimer);
  if(__allInTimerInt)clearTimeout(__allInTimerInt);
  if(__allInSoundInt)clearInterval(__allInSoundInt);

  if(__depositTimerInt)clearInterval(__depositTimerInt);
  __caseFinish=null;__upgFinish=null;__upgTimer=null;
}

          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: initData })
        });
        
        if (!response.ok) throw new Error('Сервер отклонил авторизацию');
        
        const data = await response.json();
        
        if (data.success && data.user) {
          sessionToken = data.token;
          onTelegramAuth({
            id: data.user.id,
            first_name: data.user.first_name || '',
            last_name: data.user.last_name || '',
            username: data.user.username || ('user' + data.user.id),
            photo_url: data.user.photo_url || null
          });
        } else {
          showLoginError('Ошибка сервера: неверный ответ.');
        }
      } catch (error) {
        console.error(error);
        showLoginError('Ошибка авторизации. Сервер отклонил запрос или недоступен.');
      }
    } 
    
    if (attempts >= maxAttempts) {
      clearInterval(checkInterval);
      showLoginError('Telegram не передал данные. Убедитесь, что вы настроили Web App URL в @BotFather.');
    }
  }, 500);
}

function getDemoDrops() {
  const drops = [];
  state.history.forEach(h => {
    if (h.type === 'case') {
      const it = itemById(h.itemId);
      if (it) drops.push({
        username: state.user?.username || 'demo',
        itemId: it.id, itemName: it.name, price: it.price,
        caseName: h.caseName, date: h.date
      });
    } else if (h.type === 'upgrade_win') {
      const it = itemById(h.toId);
      if (it) drops.push({
        username: state.user?.username || 'demo',
        itemId: it.id, itemName: it.name, price: it.price,
        caseName: 'Апгрейд', type: 'upgrade', date: h.date
      });
    }
  });
  return drops.slice(-30).reverse();
}

  const userData = {

    joined: new Date().toLocaleDateString('ru-RU')

  if(nameEl)nameEl.textContent=state.user.name;
  if(avatarEl) {

function liveListHtml(drops, hasNew) {
  return drops.length ? drops.map((d, i) => liveItemHtml(d, hasNew && i === 0)).join('') : '<div style="color:var(--muted);font-size:14px;padding:10px 16px">Пока нет дропов сегодня</div>';
}
let __liveSig = '';
const dropSig = list => list.map(d => d.date + ':' + d.itemId + ':' + d.username).join('|');
async function updateLiveDrops() {
  let drops;
  if (state.isDemo) drops = getDemoDrops();
  else {
    try {
      const res = await secureFetch(SERVER_URL + '/api/drops');
      if (!res.ok) return;
      drops = await res.json();
    } catch (e) { return; }
  }
  if (!Array.isArray(drops)) return;
  const sig = dropSig(drops);
  if (sig === __liveSig) return;
  const hasNew = __liveSig !== '';
  __liveSig = sig;
  state.globalDrops = drops;
  const el = document.getElementById('live-drops-list');
  if (el) { const sl = el.scrollLeft; el.innerHTML = liveListHtml(drops, hasNew); el.scrollLeft = sl; }
  const top = document.getElementById('top-drop-container');
  if (top) top.innerHTML = getTopDropHtml();
}

function setHistoryFilter(f) {
  state.historyFilter = f;
  preserveScroll(() => render(false));
}

function renderHistory() {
  const filter = state.historyFilter || 'all';
  let list = [...state.history].reverse();
  
  if (filter !== 'all') {
    list = list.filter(h => {
      if (filter === 'deposit') return h.type === 'deposit';
      if (filter === 'withdraw') return h.type === 'sell' || h.type === 'withdraw';
      if (filter === 'case') return h.type === 'case';
      if (filter === 'upgrade') return h.type === 'upgrade_win' || h.type === 'upgrade_lose' || h.type === 'mystery';
      if (filter === 'fuse') return h.type === 'fuse';
      return true;
    });
  }

  const grouped = {};
  list.forEach(h => {
    const d = new Date(h.date).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
    if (!grouped[d]) grouped[d] = { items: [], profit: 0 };
    grouped[d].items.push(h);
    
    // «Результат игр»: только выигрыш минус ставка. Продажи и пополнения — это обмен, не прибыль.
    if (h.type === 'case') {
      const c = CASES.find(x => x.id === h.caseId);
      const paid = Number.isFinite(Number(h.paid)) ? Number(h.paid) : (c ? c.price : 0);
      const itemPrice = Number.isFinite(Number(h.itemPrice)) ? Number(h.itemPrice) : ((itemById(h.itemId) || {}).price || 0);
      grouped[d].profit += itemPrice - paid;
    } else if (h.type === 'upgrade_win') {
      const it = itemById(h.toId);
      if (it) grouped[d].profit += it.price - (h.stake || 0);
    } else if (h.type === 'upgrade_lose') {
      grouped[d].profit -= (h.stake || 0);
    } else if (h.type === 'mystery') {
      grouped[d].profit += (h.itemPrice || 0) + (h.coins || 0) - (h.stake || 0);
    } else if (h.type === 'fuse') {
      const it = itemById(h.itemId);
      if (it) grouped[d].profit += it.price - (h.totalValue || 0);
    } else if (h.type === 'mines_win') {
      grouped[d].profit += (h.win || 0) - (h.bet || 0);
    } else if (h.type === 'mines_lose') {
      grouped[d].profit -= (h.bet || 0);
    }
  });

  const tabs = [
    { id: 'all', label: 'Все' },
    { id: 'case', label: 'Кейсы' },
    { id: 'upgrade', label: 'Апгрейды' },
    { id: 'fuse', label: 'Фьюз' },
    { id: 'deposit', label: 'Пополнения' },
    { id: 'withdraw', label: 'Выводы' }
  ];

  let html = `<div class="page-title">📜 История</div><div class="page-sub">Все твои действия в одном месте</div>`;
  
  html += `<div class="history-tabs">
    ${tabs.map(t => `<div class="history-tab ${filter === t.id ? 'active' : ''}" onclick="setHistoryFilter('${t.id}')">${t.label}</div>`).join('')}
  </div>`;

  if (Object.keys(grouped).length === 0) {
    html += `<div class="empty-state">📭 История пуста</div>`;
  } else {
    for (const [date, data] of Object.entries(grouped)) {
      const profitClass = data.profit >= 0 ? 'pos' : 'neg';
      const profitSign = data.profit > 0 ? '+' : '';
      html += `<div class="history-day-group">
        <div class="history-day-header">
          <div class="history-day-title">${date === new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) ? 'СЕГОДНЯ' : date}</div>
          <div class="history-day-profit ${profitClass}" title="Выигрыш минус ставки; продажи и пополнения не считаются">Результат игр: ${profitSign}${fmt(data.profit)} 🪙</div>
        </div>`;
      
      data.items.forEach(h => {
        let icon = '❓', title = '', sub = '', amountStr = '', amtClass = 'pos';
        
        if (h.type === 'case') {
          const it = itemById(h.itemId);
          const c = CASES.find(x => x.id === h.caseId);
          icon = '📦';
          title = `Открытие кейса «${h.caseName || (c ? c.name : 'Неизвестно')}»`;
          const paid = Number.isFinite(Number(h.paid)) ? Number(h.paid) : (c ? c.price : 0);
          sub = it ? `${it.name} · выплата ${fmt(it.price)} · цена кейса ${fmt(paid)} 🪙 · ${(RARITY[it.rarity]||RARITY.common).label}` : '';
          const net = it ? it.price - paid : 0;
          amountStr = it ? `${net>0?'+':''}${fmt(net)}` : '';
          amtClass = net >= 0 ? 'pos' : 'neg';
        } else if (h.type === 'sell') {
          const it = itemById(h.itemId);
          icon = '💰';
          title = `Продажа предмета`;
          sub = it ? it.name : '';
          amountStr = `+${fmt(h.price)}`;
          amtClass = 'pos';
        } else if (h.type === 'upgrade_win') {
          const toIt = itemById(h.toId);
          icon = '📈';
          title = `Успешный апгрейд`;
          sub = `Выигрыш: ${toIt ? toIt.name : '?'}`;
          amountStr = toIt ? `+${fmt(toIt.price)}` : '';
          amtClass = 'pos';
        } else if (h.type === 'upgrade_lose') {
          const fromIt = itemById(h.fromId);
          icon = '📉';
          title = `Проваленный апгрейд`;
          sub = `Потерян: ${fromIt ? fromIt.name : '?'}`;
          amountStr = fromIt ? `-${fmt(fromIt.price)}` : '';
          amtClass = 'neg';
        } else if (h.type === 'mystery') {
          const it = itemById(h.itemId);
          const zn = F.MYSTERY_ZONES.find(z => z.id === h.zoneId);
          icon = '🎲';
          title = `Mystery Upgrade · ${zn ? zn.name : '?'} ×${Number(h.multiplier).toFixed(2)}`;
          sub = `${it ? it.name : 'только монеты'}${h.coins ? ' + ' + fmt(h.coins) + ' 🪙' : ''} · ставка ${fmt(h.stake)}`;
          const net = (h.itemPrice || 0) + (h.coins || 0) - (h.stake || 0);
          amountStr = `${net > 0 ? '+' : ''}${fmt(net)}`;
          amtClass = net >= 0 ? 'pos' : 'neg';
        } else if (h.type === 'fuse') {
          const it = itemById(h.itemId);
          icon = '✨';
          title = `Фьюз предметов`;
          sub = `Получен: ${it ? it.name : '?'}`;
          amountStr = '';
        } else if (h.type === 'withdraw') {
          icon = '📤';
          title = 'Заявка на вывод';
          sub = Array.isArray(h.items) ? h.items.join(', ') : 'Предметы переданы в обработку';
          amountStr = '';
        } else if (h.type === 'deposit') {
          icon = '📥';
          title = `Пополнение баланса`;
          sub = `Зачислено`;
          amountStr = `+${fmt(h.amount)}`;
          amtClass = 'pos';
        } else if (h.type === 'mines_win') {
          icon = '💎';
          title = `Победа в Минах`;
          sub = `Множитель x${h.mult.toFixed(2)}`;
          amountStr = `+${fmt(h.win)}`;
          amtClass = 'pos';
        } else if (h.type === 'mines_lose') {
          icon = '💣';
          title = `Проигрыш в Минах`;
          sub = `Взрыв`;
          amountStr = `-${fmt(h.bet)}`;
          amtClass = 'neg';
        }

        html += `<div class="history-item">
          <div class="history-item-left">
            <div class="history-item-icon">${icon}</div>
            <div class="history-item-info">
              <div class="history-item-title">${esc(title)}</div>
              <div class="history-item-sub">${esc(sub)}</div>
            </div>
          </div>
          ${amountStr ? `<div class="history-item-amount ${amtClass}">${amountStr} 🪙</div>` : ''}
        </div>`;
      });
      html += `</div>`;
    }
  }

  return html;
}

function render(fresh){
  updateBalance(state.balance);
  const el=$('#content');
  if(!el) return;
  el.classList.remove('page-enter');
  if(fresh){void el.offsetWidth;el.classList.add('page-enter');}
  if(state.openingView){el.innerHTML=state.openingView;saveLocalState();return;}
  if(state.currentCase){el.innerHTML=renderCaseDetail(state.currentCase);saveLocalState();return;}
  try {
    if(state.tab==='cases')el.innerHTML=renderCases();
    else if(state.tab==='mines')el.innerHTML=renderMines();
    else if(state.tab==='fuse')el.innerHTML=renderFuse();
    else if(state.tab==='upgrade')el.innerHTML=renderUpgrade();
    else if(state.tab==='inventory')el.innerHTML=renderInventory();
    else if(state.tab==='history')el.innerHTML=renderHistory();
    else if(state.tab==='profile')el.innerHTML=renderProfile();
    else if(state.tab==='admin'){el.innerHTML=isAdmin()?renderAdmin():'<div class="empty-state">Доступ только для админов</div>';if(isAdmin()&&!state.admin.stats&&!state.admin.loading){state.admin.loading=true;adminLoadStats().finally(()=>{state.admin.loading=false;});}}
    saveLocalState();
  } catch(e) {
    console.error('Render error:', e);
    el.innerHTML = `<div style="padding:60px;text-align:center;color:var(--red);">
      <div style="font-size:40px;margin-bottom:20px;">⚠️</div>
      <h2 style="font-size:24px;font-weight:900;margin-bottom:10px;">Ошибка отрисовки</h2>
      <p style="color:var(--muted);margin-bottom:20px;">Попробуйте обновить страницу или очистить кэш (F5)</p>
      <button class="btn btn-primary" onclick="localStorage.clear(); location.reload();">Сбросить игру</button>
    </div>`;
  }
}

async function fetchGlobalDrops() {
  if (state.isDemo) {
    state.globalDrops = getDemoDrops();
    return;
  }
  try {
    const res = await secureFetch(`${SERVER_URL}/api/drops`);
    if (res.ok) {
      state.globalDrops = await res.json();
    }
  } catch (e) {
    console.log('Не удалось загрузить дропы', e);
  }
}

function getTopDropOfTheDay(){
  const today = new Date().toDateString();
  let best = null;
  state.globalDrops.forEach(d => {
    if (new Date(d.date).toDateString() === today) {
      if (!best || d.price > best.price) best = d;
    }
  });
  if (best) {
    return { item: itemById(best.itemId) || {name: best.itemName, price: best.price, icon:'🎁'}, user: best.username };
  }
  return null; 
}

function getTopDropHtml() {
  const topDrop = getTopDropOfTheDay();
  if (!topDrop) return '';
  return '<div class="top-drop-banner" onclick="showProfile(' + jq(topDrop.user) + ',' + jq(topDrop.item.id || topDrop.item.itemId) + ')">' +
    '<div><div class="top-drop-title">Топ дроп дня</div><div class="top-drop-content">' +
    '<div style="filter:drop-shadow(0 10px 20px rgba(0,0,0,0.6));">' + itemIcon(topDrop.item, 72) + '</div>' +
    '<div class="top-drop-info"><div class="top-drop-name">' + esc(topDrop.item.name) + '</div><div class="top-drop-user">Владелец: ' + esc(topDrop.user) + '</div></div></div></div>' +
    '<div class="top-drop-price">' + coin(36) + ' ' + fmt(topDrop.item.price) + '</div></div>';
}

  if (state.isDemo) state.globalDrops = getDemoDrops();
  const categories={standard:'📦 Премиум кейсы',special:'🔥 Особые',mutagen:'🧬 Мутагенные кейсы'};
  const grouped=CASES.reduce((acc,c)=>{(acc[c.category]=acc[c.category]||[]).push(c);return acc;},{});
  const cards=Object.entries(grouped).map(([cat,catCases])=>{
    const caseCards=catCases.map(c=>{
      const b=c.badge?`<div class="case-badge ${c.badge.cls}">${c.badge.text}</div>`:'';
      const isAllIn=c.isAllIn?'all-in-card':'';
      const priceStr=c.isAllIn?`Баланс: ${fmt(state.balance)} ${coin(18)}`:`${fmt(c.price)} ${coin(18)}`;
      const imgHtml=c.img?`<img src="${c.img}" alt="${esc(c.name)}" onerror="this.style.display='none';this.parentElement.textContent='${c.icon}'">`:`<span>${c.icon}</span>`;

  return `<div class="hero">
    <h1>Открывай кейсы. Собирай брейнротов.</h1>
    <p>Средний возврат во всех играх — 90%. Результат считает сервер, и каждый бросок можно проверить.</p>
    <button class="btn btn-danger btn-lg" onclick="openCase('all_in')">ALL IN 🎰</button>

  ${cards}`;
}

            ${state.balance<=0?`<button class="btn btn-ghost btn-lg" disabled style="width:100%;max-width:400px;margin-top:20px;">Нет средств для ставки</button>`:`<button class="btn btn-danger btn-lg" style="width:100%;max-width:400px;font-size:20px;padding:24px;text-transform:uppercase;letter-spacing:1px;margin-top:20px;" onclick="openCaseNow()">ПОСТАВИТЬ ВСЁ (${fmt(totalCost)} ${coin(18)})</button>`}
          </div>
        </div>
      </div>
    </div>`;
  }
  const imgHtml=c.img?`<img src="${c.img}" alt="${esc(c.name)}" onerror="this.style.display='none';this.parentElement.textContent='${c.icon}'">`:`<span style="font-size:120px;line-height:1">${c.icon}</span>`;
  
  const rawItems = c.isVip ? (state.vipMode ? c.vipItems : c.normalItems) : c.items;
  const activePrice = c.isVip && state.vipMode ? c.vipPrice : c.price;
  
  const total=activePrice*state.caseOpens;
  const canAfford=state.balance>=total;
  
  let itemsPreview = '';
  const totalW = rawItems.reduce((s,i)=>s+i.c,0);
  const sortedItems = [...rawItems].sort((a, b) => {
    const priceA = itemById(a.id)?.price || 0;
    const priceB = itemById(b.id)?.price || 0;
    return priceB - priceA;
  });
  
  itemsPreview = sortedItems.map(ci => {
    const it = itemById(ci.id); if(!it) return '';
    const pct = (ci.c/totalW*100).toFixed(2);
    const rarity = RARITY[it.rarity] || RARITY.common;
    const borderStyle = `border:1px solid ${rarity.color}66;box-shadow:inset 0 0 12px ${rarity.color}12;`;
    return `<div class="case-drop-card rarity-${esc(it.rarity||'common')}" style="position:relative;background:rgba(255,255,255,.02);${borderStyle}border-radius:16px;padding:16px 10px;text-align:center;transition:all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,.05)'" onmouseout="this.style.background='rgba(255,255,255,.02)'">
      <div class="drop-chance-badge" style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.5);padding:2px 6px;border-radius:6px;font-size:10px;font-weight:900;color:var(--accent);">${pct}%</div>
      <div style="height:60px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;">${itemIcon(it,60)}</div>
      <div style="font-size:12px;font-weight:800;color:#fff;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(it.name)}</div>
      <div style="font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:${rarity.color};margin-bottom:5px;">${esc(rarity.label)}</div>
      <div style="font-size:13px;color:var(--gold);font-weight:900;">${fmt(it.price)}</div>
    </div>`;
  }).join('');

  return `<button class="case-back" onclick="backToCases()">← Все кейсы</button>
  <div class="case-detail">
    <div>
      <div class="case-detail-img">${imgHtml}</div>
      <div class="case-stat-grid">
        <div class="case-stat"><div class="lbl">Цена</div><div class="val">${coin(18)} ${fmt(activePrice)}</div></div>
        <div class="case-stat"><div class="lbl">Дропов</div><div class="val">${rawItems.length}</div></div>
      </div>
    </div>
    <div>
      <div><div class="case-title">${esc(c.name)}</div><div class="case-title-sub">${esc(c.desc)}</div></div>
      
      ${c.isVip ? `
      <div style="background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);border-radius:16px;padding:16px;margin-bottom:24px;text-align:center;">
          <div style="font-size:14px;color:var(--muted);margin-bottom:16px;">Выберите пул дропа для открытия.</div>
          <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
              <button class="btn ${!state.vipMode?'btn-accent':'btn-ghost'}" onclick="state.vipMode=false;render(false);" style="flex:1;">Обычный (${fmt(c.price)})</button>
              <button class="btn ${state.vipMode?'btn-accent':'btn-ghost'}" onclick="state.vipMode=true;render(false);" style="flex:1;">VIP (${fmt(c.vipPrice)})</button>
          </div>
      </div>
      ` : ''}
      
      <div style="margin-bottom:24px;">
        <div style="font-size:13px;color:var(--muted);text-transform:uppercase;font-weight:800;margin-bottom:6px;letter-spacing:.05em;">Возможные призы (шанс дропа)</div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:12px;">Обычные предметы выпадают чаще; легендарные и выше — значительно реже. Шансы показаны для выбранного режима.</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;max-height:380px;overflow-y:auto;padding-right:8px;">
          ${itemsPreview}
        </div>
      </div>
      
      <div class="case-open-panel">
        <div style="margin-bottom:20px;">
          <div style="font-size:13px;color:var(--muted);text-transform:uppercase;font-weight:800;margin-bottom:12px;letter-spacing:.05em;">Сколько открыть?</div>
          <div style="display:flex;gap:12px;flex-wrap:wrap;">
            ${[1,3,5,10].map(n=>`<button class="btn ${state.caseOpens===n?'btn-accent':'btn-ghost'}" onclick="setCaseOpens(${n})">x${n}</button>`).join('')}
          </div>
        </div>
        <div style="text-align:center;padding:20px 0;border-top:1px solid rgba(255,255,255,.05);">
          <div style="font-size:14px;color:var(--muted);margin-bottom:8px;">Итого:</div>
          <div style="font-size:42px;font-weight:900;color:${canAfford?'var(--gold)':'var(--red)'};display:flex;justify-content:center;align-items:center;gap:12px;">${coin(36)} ${fmt(total)}</div>
        </div>
        <button class="btn btn-primary btn-lg" style="width:100%;margin-top:16px;" ${!canAfford?'disabled':''} onclick="openCaseNow()">
          ${canAfford?`Открыть ${state.caseOpens} кейс${state.caseOpens>1?'(а)':''}`:'Недостаточно средств'}
        </button>
      </div>
    </div>
  </div>`;
}

function setCaseOpens(n){state.caseOpens=n;render(false);}


let __openingCase=false;
async function openCaseNow(){
  if(__pendingCase||__openingCase)return;
  const c=CASES.find(x=>x.id===state.currentCase);if(!c)return;
  const count=c.isAllIn?1:state.caseOpens;
  const unitPrice=c.isVip&&state.vipMode?c.vipPrice:c.price;
  const total=c.isAllIn?Math.floor(state.balance):unitPrice*count;
  if(!(total>0)){toast('У вас нет монет для открытия','err');haptic('error');return;}
  if(c.isAllIn&&(total<F.ALLIN_MIN||total>F.ALLIN_MAX)){toast(`ALL IN доступен при балансе от ${fmt(F.ALLIN_MIN)} до ${fmt(F.ALLIN_MAX)}`,'err');return;}
  if(!c.isAllIn&&state.balance<total){toast('Недостаточно монет','err');haptic('error');return;}

  const executeOpen=async()=>{
    if(__openingCase)return;
    __openingCase=true;
    try{
      const data=await api('/api/case/open',{caseId:c.id,count,vipMode:!!state.vipMode});
      applyServerState(data);
      const results=(data.results||[]).filter(r=>itemById(r.id)).map(r=>({id:r.id,uid:r.uid,date:r.date,price:r.price,rarity:r.rarity}));
      if(!results.length)throw new Error('Сервер не вернул результат');
      addHist(data.hist);
      const paid=Number(data.charged)||total;
      __pendingCase={case:c,opens:results.length,results,total:paid,unitPrice:paid/results.length,settled:false};
      saveLocalState();renderHeader();startRoulette(c,results,!!data.allIn);
    }catch(e){
      toast(esc(e.message||'Ошибка открытия кейса'),'err');haptic('error');
      try{await apiSync();}catch(_){}
    }finally{__openingCase=false;}
  };
  if(c.isAllIn){showConfirm(`Вы уверены?\nСтавка: ${fmt(total)} монет.\nСредний возврат 90%: чаще вы получите меньше ставки.`,executeOpen);return;}
  await executeOpen();
}
function reelFiller(c,isAllIn,bet){
  if(isAllIn)return F.pickItemForTarget(PRICE_LIST,bet*F.allInMultiplier(Math.random(),Math.random()),Math.random(),Math.random()).id;
  const raw=c.isVip?(state.vipMode?c.vipItems:c.normalItems):c.items;
  return F.pickWeighted(raw,Math.random()).id;
}

function startRoulette(c,results, isAllIn){
  const opens=results.length;
  const TRACK_LEN=34;
  // каждая крутка разная: длина пути, время, кривая и точка остановки внутри выпавшего предмета
  const fastSpin=state.settings.spinType==='fast';
  const EASES=['cubic-bezier(0.08,0.85,0.18,1)','cubic-bezier(0.12,0.7,0.1,1)','cubic-bezier(0.2,0.9,0.25,1)','cubic-bezier(0.05,0.6,0.15,1)','cubic-bezier(0.16,0.8,0.12,1)'];
  const spinCfg=results.map(()=>({winIdx:20+Math.floor(Math.random()*12),time:fastSpin?300:3000+Math.floor(Math.random()*3200),ease:EASES[Math.floor(Math.random()*EASES.length)],jitter:(Math.random()-.5)*0.7}));
  
  let html=`<button class="case-back" onclick="goBackToCase('${c.id}')">← Назад к кейсу</button><div style="display:flex;flex-direction:column;gap:24px;margin-bottom:24px;">`;
  
  results.forEach((win,idx)=>{
    const ids=[];
    for(let i=0;i<TRACK_LEN;i++)ids.push(i===spinCfg[idx].winIdx?win.id:reelFiller(c,isAllIn,__pendingCase?__pendingCase.total:0));
    
    const trackHtml=ids.map(id=>{
      const it=itemById(id);
      
      const iconSize = isAllIn ? 100 : (opens>1 ? 60 : 100);
      const itemStyle = isAllIn 
        ? 'min-width:130px;width:130px;height:130px;padding:10px;gap:8px;' 
        : (opens>1?'min-width:140px;width:140px;height:140px;padding:10px;gap:8px;':'min-width:130px;width:130px;height:130px;padding:10px;gap:8px;');
      
      const nameStyle = isAllIn 
        ? 'font-size:14px;white-space:normal;line-height:1.2;-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;font-weight:900;' 
        : (opens>1?'font-size:14px;white-space:normal;line-height:1.2;-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;':'font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;');
        
      const rarityClass = `rarity-${it?.rarity || 'common'}`;
      const rarityColor = (RARITY[it?.rarity] || RARITY.common).color;
      return `<div class="roulette-item ${rarityClass}" style="${itemStyle}border-color:${rarityColor}66;"><div style="display:flex;align-items:center;justify-content:center;flex:1;width:100%;overflow:hidden;">${itemIcon(it,iconSize)}</div><div class="roulette-item-name" style="${nameStyle}">${esc(it.name)}</div></div>`;
    }).join('');
    
    const wrapHeight = isAllIn ? '250px' : (opens>1?'170px':'250px');
    const wrapBorder = isAllIn ? 'border:3px solid var(--red); box-shadow: inset 0 0 50px rgba(244,63,94,0.3);' : '';
    
    html+=`<div class="roulette-wrap" id="rouletteWrap_${idx}" style="height:${wrapHeight};max-width:${isAllIn?'800px':'1000px'};margin:0 auto;width:100%;${wrapBorder}"><div class="roulette-marker" style="${isAllIn?'background:var(--red);width:4px;box-shadow:0 0 20px var(--red);':''}"></div><div class="roulette-particles" id="rouletteParticles_${idx}"></div><div class="roulette-track" id="track_${idx}" style="padding:${opens>1?'15px':'20px'}">${trackHtml}</div></div>`;
  });
  
  html+=`</div><div style="text-align:center;color:${isAllIn?'var(--red)':'var(--muted)'};font-size:${isAllIn?'24px':'16px'};font-weight:900;margin-bottom:16px">${state.settings.spinType==='fast'?'':'Крутим...'}</div><div style="text-align:center"><button class="btn btn-ghost" onclick="skipCaseAnim()">⏩ Пропустить</button></div>`;
  state.openingView=html;
  render(false);
  
  const animTime = Math.max(...spinCfg.map(x=>x.time));
  
  requestAnimationFrame(() => {
    setTimeout(() => {
      results.forEach((win,idx)=>{
        const wrap=document.getElementById(`rouletteWrap_${idx}`);
        const track=document.getElementById(`track_${idx}`);
        if(!wrap||!track)return;
        const items=track.querySelectorAll('.roulette-item');
        const cfg=spinCfg[idx];
        const winEl=items[cfg.winIdx];
        if(!winEl)return;
        const wc=winEl.offsetLeft+winEl.offsetWidth/2+cfg.jitter*winEl.offsetWidth;
        const wrapW=wrap.offsetWidth;
        const offset=wrapW/2-wc;
        void track.offsetWidth;
        
        track.style.willChange = 'transform';
        track.style.transition=`transform ${cfg.time}ms ${cfg.ease}`;
        track.style.transform=`translate3d(${offset}px, 0, 0)`;
        
        setTimeout(() => {
            if(winEl && document.contains(winEl)){
                winEl.classList.add('landed');
            }
        }, cfg.time);
      });
    }, 50);
  });

  if(state.settings.spinType==='normal'&&!isMuted){
    let t=0;
    if(__caseTickInt) clearInterval(__caseTickInt);
    __caseTickInt=setInterval(()=>{
        sndTick();t++;
        if(t>=Math.min(25, animTime/150)) clearInterval(__caseTickInt);
    },150);
  }
  
  let done=false;
  const finish=async()=>{ 
    if(done)return;done=true;
    if(__caseTickInt)clearInterval(__caseTickInt);
    __caseTimers.forEach(t=>clearTimeout(t));__caseTimers=[];__caseFinish=null;
    const addedItems = await settlePendingCase(); 
    const itemsWon=addedItems.map(invItem=>itemById(invItem.itemId)).filter(Boolean);
    const totalVal=itemsWon.reduce((s,i)=>s+i.price,0);
    const bestItem = itemsWon.length ? itemsWon.reduce((a,b)=>a.price>b.price?a:b) : null;
    
    if(bestItem && (isAllIn || totalVal>=(c.isVip&&state.vipMode?c.vipPrice:c.price)*opens)) sndWinRarity(bestItem.rarity);
    else sndLose();
    haptic(totalVal >= (c.isVip&&state.vipMode?c.vipPrice:c.price)*opens ? 'success' : 'light');
    if(opens===1){
      const invItem=addedItems[0];
      if(!invItem){state.openingView=null;render(true);return;}
      const it=itemById(invItem.itemId);
      if(!it){state.openingView=null;render(true);return;}
      const rarity = RARITY[it.rarity] || RARITY.common;
      state.openingView=`<button class="case-back" onclick="goBackToCase('${c.id}')">← Назад к кейсу</button><div class="case-drop-card" style="max-width:600px;margin:0 auto;background:rgba(15,23,42,.8);border:1px solid ${rarity.color}88;box-shadow:0 0 28px ${rarity.color}22,inset 0 0 30px ${rarity.color}0c;border-radius:24px;padding:40px;text-align:center;"><div style="margin-bottom:20px;">${itemIcon(it,120)}</div><div style="font-size:24px;font-weight:900;color:#fff;margin-bottom:8px;">${esc(it.name)}</div><div style="font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:${rarity.color};margin-bottom:12px;">${esc(rarity.label)}</div><div style="font-size:22px;font-weight:900;color:var(--gold);display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:20px;">${coin(24)} ${fmt(it.price)}</div><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;"><button class="btn btn-danger" onclick="sellResult('${invItem.uid}','${c.id}')">Продать всё</button><button class="btn btn-accent" onclick="goBackToCase('${c.id}')">Ещё раз</button><button class="btn btn-ghost" onclick="goBackInventory()">В инвентарь</button></div></div>`;
    }else{
      const uidsStr=addedItems.map(i=>i.uid).join(',');
      const cardsHtml=addedItems.map(invItem=>{const it=itemById(invItem.itemId);const rarity=it?(RARITY[it.rarity]||RARITY.common):RARITY.common;return it?`<div class="multi-result-item" style="border:1px solid ${rarity.color}66;box-shadow:inset 0 0 14px ${rarity.color}12;"><div class="strip" style="background:${rarity.color}"></div>${itemIcon(it,80)}<div class="nm">${esc(it.name)}</div><div style="font-size:10px;color:${rarity.color};font-weight:900;text-transform:uppercase;margin:4px 0;">${esc(rarity.label)}</div><div class="pr">${coin(14)} ${fmt(it.price)}</div></div>`:'';}).join('');
      state.openingView=`<button class="case-back" onclick="goBackToCase('${c.id}')">← Назад к кейсу</button><div class="multi-opening-stage"><div class="multi-result-title">Результаты</div><div class="multi-result-total"><div class="lbl">Итого</div><div class="val">${coin(24)} ${fmt(totalVal)}</div></div><div class="multi-result-grid">${cardsHtml}</div><div class="multi-result-actions"><button class="btn btn-danger" onclick="sellMultiResult('${uidsStr}','${c.id}')">Продать всё</button><button class="btn btn-accent" onclick="goBackToCase('${c.id}')">Ещё раз</button><button class="btn btn-ghost" onclick="goBackInventory()">В инвентарь</button></div></div>`;
    }
    render(false);renderHeader();
  };
  __caseFinish=finish;
  __caseTimers.push(setTimeout(finish,animTime+500));
}


function goBackToCases(){cancelAnimations();state.currentCase=null;state.openingView=null;render(true);window.scrollTo({top:0,behavior:'smooth'});}

function sellResult(uid,caseId){
  const inv=state.inventory.find(i=>i.uid===uid);if(!inv)return;
  const it=itemById(inv.itemId);if(!it)return;
  
  apiSellItems([{ uid: uid, price: it.price }], (data) => {
      addHist(data.hist);
      sndCash();toast(`Продан ${esc(it.name)} за ${coin(16)} ${fmt(it.price)}`,'ok');
      haptic('success');
      if(caseId==='all_in')goBackToCases();else goBackToCase(caseId);
  });
}

function sellMultiResult(uidsStr,caseId){
  const uids=uidsStr.split(',');
  const toSell=state.inventory.filter(i=>uids.includes(i.uid)).map(inv => {
      const it = itemById(inv.itemId);
      return it ? { uid: inv.uid, price: it.price, itemId: it.id } : null;
  }).filter(Boolean);

  if (toSell.length === 0) return;

  apiSellItems(toSell, (data) => {
      addHist(data.hist);
      sndCash();toast(`Продано за ${coin(16)} ${fmt(data.added)}`,'ok');
      haptic('success');
      goBackToCase(caseId);
  });
}

function renderHeader(){updateBalance(state.balance);}

  const m=state.mines;
  if(!m.loaded&&!m.busy){m.loaded=true;minesLoad();}
  const cells=[];

    const rv=m.revealed.has(i),mi=m.positions.has(i);

    </div>

      <div style="display:flex;gap:10px;margin-bottom:24px;margin-top:16px;">
        <div class="btn btn-ghost btn-sm" style="flex:1;" onclick="setBet('minesBet',100)">100</div>
        <div class="btn btn-ghost btn-sm" style="flex:1;" onclick="setBet('minesBet',500)">500</div>
        <div class="btn btn-ghost btn-sm" style="flex:1;" onclick="setBet('minesBet',1000)">1K</div>
        <div class="btn btn-ghost btn-sm" style="flex:1;" onclick="setBet('minesBet',${Math.floor(state.balance)})">MAX</div>
      </div>
      <div style="font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:16px;">Кол-во мин</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;">
        ${[1,3,5,10,20].map(n=>`<div class="btn ${m.mines===n?'btn-primary':'btn-ghost'}" style="flex:1;padding:10px;" onclick="setMines(${n})">${n}</div>`).join('')}
      </div>
      <div style="margin-top:16px;padding:20px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.05);border-radius:16px;font-size:15px;color:var(--muted);line-height:1.8;font-weight:600;">
        Открыто: <b style="color:#fff;float:right;">${Math.max(0,safe)}</b><br>

      </div>
      ${m.active?`<button class="btn btn-accent btn-lg" style="width:100%;margin-top:24px;" ${m.revealed.size?'':'disabled'} onclick="minesCashout()">Забрать ${coin(18)} ${fmt(cash)}</button>`:`<button class="btn btn-primary btn-lg" style="width:100%;margin-top:24px;" onclick="minesStart()">Начать игру</button>`}

async function mysteryDo(){

      if(n-last>25){playTone(1100+Math.random()*80,'triangle',0.015,0.025);last=n;}
      __upgTickTimer=setTimeout(tick,35+Math.pow(Math.min(1,el/duration),2)*950);};

  // живое табло: зона под маркером меняется во время вращения
  (function liveZone(){
    const pe=document.getElementById('upgPctBig'),le=document.getElementById('upgChanceLabel');
    let lastId=null;
    const zoneAt=deg=>{const f=(((deg%360)+360)%360)/360;let a=0;for(const z of F.MYSTERY_ZONES){if(f<a+z.p)return z;a+=z.p;}return F.MYSTERY_ZONES[F.MYSTERY_ZONES.length-1];};

  const winLen=(ch/100)*C;
